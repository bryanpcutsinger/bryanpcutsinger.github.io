<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: market supply as the horizontal sum of firms' marginal cost</title>
<!--
  Interactive figure for the t07a "The Competitive Firm" blog post.
  Recreates UE Fig 16.3 (p.241) — Determination of Total Output and Market Price
  in a Price-Taker's Market. Family F2 (before/after shift, corrected from the
  ledger's F7 at the 2026-07-06 audit): the honest lever is the demand shift
  D_low -> D_high; the equalized-marginal-cost / horizontal-summation
  construction is shown as a readout at each price. Self-contained: no
  libraries, no network. The static FAU figure (figures/t07a-market-supply.svg)
  is the SLIDE version and is untouched; it is also this widget's <noscript>
  fallback.

  ARCHITECTURE: the base figure is REAL SVG markup. A no-JS reader sees the
  FULL construction at once — both price levels ($20 and $30), all three firm
  MC curves, both demand curves, the market-supply curve with its two entry
  kinks, every dot/dropline/label the UE source teaches. The script only
  ATTACHES behavior (the Lower/Higher demand toggle dims the inactive price's
  construction, swaps the ghost/solid demand curve, updates the two-line
  readout); it never builds figure DOM.

  GEOMETRY (single-panel rich, family F2): viewBox 440 x 540, aspect-ratio 4/5,
  max-width 480-560px. Pixel frame: y-axis at x = 70, baseline y = 380.
  qx(q) = 70 + 6.6*q (q = 0..~55 in view); py(P) = 380 - 6.2*P ($0 -> 380,
  ~$52 -> 52 top). Three firm MC curves fit exactly through every anchor in
  the brief's corrected inventory as one family of quadratics P = a + b*q^2:
    MC_A: P = -0.25 + 0.0625 q^2      (passes (18,20) and (22,30) exactly)
    MC_B: P = 10.069 + 0.06897 q^2    (passes (12,20) and (17,30); floor $18 at q=10.72)
    MC_C: P = 26.875 + 0.125 q^2      (passes (5,30); floor $28 at q=3)
  Market supply = the horizontal sum q_A(P)+q_B(P)+q_C(P) (B active once
  P>=18, C once P>=28) — solving these gives EXACT matches to every spec
  anchor: (30,$20) = q_A(20)+q_B(20) = 18+12; (44,$30) = q_A(30)+q_B(30)+q_C(30)
  = 22+17+5. The curve is drawn as three polyline segments joined by two short
  dashed vertical "entry jumps" at P=$18 (B enters, q 17.09->27.81) and P=$28
  (C enters, q 37.39->40.39) — a firm's own supply curve is discontinuous at
  its shut-down price (zero output below min AVC, positive output at it), so
  the horizontal sum inherits that jump; this is the standard construction,
  not an artifact. Demand curves are simple P = A/(q+8) hyperbolas calibrated
  to clear at (30,$20) and (44,$30) respectively — decorative context for the
  clearing price, not separately anchored in the source.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* market-supply curve + headings */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* firm MC curves / captions   */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass — active price/handles */
    --accent-tint: #efe4d2;/* active-price wash           */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 520px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* mode toggle (above the figure) */
  .modebar { display: flex; align-items: center; gap: 8px;
             margin: 0 0 8px; flex-wrap: wrap; }
  .modelabel { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg { font-family: inherit; font-size: 13px; font-weight: 600;
         color: var(--ink); background: var(--surface);
         border: 1.5px solid var(--hairline); border-radius: 6px;
         padding: 5px 14px; cursor: pointer; }
  .seg + .seg { margin-left: -1px; }
  .seg.on { background: var(--accent); color: var(--surface);
            border-color: var(--accent); }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* structural strokes */
  .axis  { stroke: var(--muted); stroke-width: 1.4; }
  .mc    { stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; }
  .mktsup{ stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; }
  .jump  { stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 3 3; }
  .curve { stroke: var(--ink); stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .curve-ghost { stroke: var(--muted); stroke-width: 1.8; fill: none;
               stroke-dasharray: 6 5; opacity: 0.65; }
  .priceline { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
  .drop  { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .shift { stroke: var(--accent); stroke-width: 2.2; transition: opacity 0.15s ease; }

  /* dots */
  .endot   { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
  .ctxdot  { fill: var(--muted); stroke: var(--surface); stroke-width: 1; }
  .cdot    { fill: var(--muted); stroke: var(--surface); stroke-width: 1; }
  .pt      { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }

  /* generous transparent hit targets + keyboard proxies */
  .hit     { fill: transparent; stroke: transparent; touch-action: none; cursor: pointer; }
  .focus:focus-visible { outline: none; }
  .focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* toggle groups (JS dims the inactive price's construction) */
  .constr { transition: opacity 0.15s ease; }
  .constr.dim { opacity: 0.28; }

  /* text */
  .axlabel   { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .clab      { fill: var(--muted); font-size: 12px; font-weight: 700; }
  .suplab    { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .curvelabel{ fill: var(--muted); font-size: 11px; font-style: italic; }
  .qlabel    { fill: var(--ink); font-size: 11.5px; font-weight: 700; }
  .annot     { fill: var(--muted); font-size: 10.5px; font-style: italic; }
  .entrylab  { fill: var(--text); font-size: 10px; font-weight: 600; }
  .idlelab   { fill: var(--muted); font-size: 10px; font-style: italic; }
  .sub       { font-size: 8.5px; }
  .sep       { stroke: var(--hairline); stroke-width: 1; }
  .r-hint    { fill: var(--muted); font-size: 12px; }
  .r-trade   { fill: var(--accent); font-size: 12.5px; font-weight: 700; }
  .fallback  { margin: 8px 0 0; color: var(--muted); font-size: 13px;
               line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <div class="modebar" role="group" aria-label="Choose the demand level">
    <span class="modelabel">Demand:</span>
    <button id="btnLow" class="seg on" type="button" aria-pressed="true">Lower demand</button>
    <button id="btnHigh" class="seg" type="button" aria-pressed="false">Higher demand</button>
  </div>

  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="Three firms' marginal cost curves, MC-A, MC-B, and MC-C, sum horizontally into a bold market-supply curve that kinks upward each time a firm enters — firm B at eighteen dollars, firm C at twenty-eight dollars. Two demand curves show the clearing price rising from twenty dollars, where only A and B produce, to thirty dollars, where all three produce. Dotted horizontal lines at each price mark dots where it crosses each active firm's MC curve, with dashed droplines down to the summed quantities. Toggle between the lower and higher demand curve to see the price, the firms producing, and the equalized-marginal-cost construction change.">
    <title>Market supply: firms sum their marginal costs at the equalized price</title>
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="acc" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- axes (drawn before the curves); extended past the data max -->
    <line class="axis" x1="70" y1="380" x2="420" y2="380" marker-end="url(#arw)" />
    <line class="axis" x1="70" y1="380" x2="70"  y2="52"  marker-end="url(#arw)" />
    <text class="axlabel" x="245" y="418" text-anchor="middle">Units of X per Day</text>
    <text class="axlabel" x="26" y="216" text-anchor="middle"
          transform="rotate(-90 26 216)">Price and Costs ($)</text>

    <!-- top annotation (off every curve) -->
    <text class="annot" x="245" y="22" text-anchor="middle">Each point on the market supply curve = firms</text>
    <text class="annot" x="245" y="35" text-anchor="middle">producing at equalized marginal cost.</text>

    <!-- ===== three firm MC curves ===== -->
    <path class="mc" d="M83.2,380.0 L96.4,375.4 L109.6,367.6 L122.8,356.8 L136.0,342.8 L149.2,325.8 L162.4,305.6 L175.6,282.4 L188.8,256.0 L202.0,226.6 L215.2,194.0 L228.4,158.4 L241.6,119.6 L254.8,77.8" />
    <path class="mc" d="M140.8,268.4 L149.2,256.0 L162.4,233.8 L175.6,208.1 L182.2,194.0 L188.8,179.0 L202.0,146.5 L215.2,110.0 L228.4,71.3" />
    <path class="mc" d="M89.8,206.4 L96.4,200.7 L103.0,194.0 L109.6,185.5 L116.2,175.4 L122.8,163.6 L129.4,150.4 L136.0,135.4 L142.6,119.6 L149.2,101.2 L155.8,82.4 L159.8,70.0" />
    <text class="clab" x="140" y="58" text-anchor="middle">MC<tspan class="sub" dy="3">C</tspan></text>
    <text class="clab" x="222" y="50" text-anchor="middle">MC<tspan class="sub" dy="3">B</tspan></text>
    <text class="clab" x="273" y="66" text-anchor="start">MC<tspan class="sub" dy="3">A</tspan></text>

    <!-- MC-B and MC-C cost floors (entry-jump lower/upper endpoints, drawn below) -->
    <text class="idlelab" x="74" y="248" text-anchor="start">(idle at $20)</text>

    <!-- ===== two demand curves (the "before" is the ghost; JS swaps which) ===== -->
    <path id="demLow" class="curve"
          d="M136.0,118.4 L169.0,175.4 L202.0,211.7 L235.0,237.2 L268.0,256.0 L301.0,270.4 L334.0,281.9 L367.0,291.1 L400.0,298.8" />
    <path id="demHigh" class="curve-ghost"
          d="M228.4,77.8 L254.8,111.4 L281.2,138.2 L307.6,160.2 L334.0,178.5 L360.4,194.0 L386.8,207.3 L400.0,213.2" />
    <text class="curvelabel" x="406" y="303" text-anchor="start">D<tspan class="sub" dy="3">low</tspan></text>
    <text class="curvelabel" x="406" y="211" text-anchor="start">D<tspan class="sub" dy="3">high</tspan></text>

    <!-- shift arrow + label (JS brightens on the Higher-demand toggle) -->
    <line id="shiftArrow" class="shift" marker-end="url(#acc)" x1="395" y1="278" x2="395" y2="220" />
    <text id="shiftLabel" class="curvelabel" x="390" y="252" text-anchor="end" fill="#b07a2c">demand rises</text>

    <!-- ===== market supply: three segments + two dashed entry jumps ===== -->
    <path class="mktsup" d="M83.2,380.0 L130.5,349.0 L154.5,318.0 L173.1,287.0 L182.8,268.4" />
    <line class="jump" x1="182.8" y1="268.4" x2="253.6" y2="268.4" />
    <path class="mktsup" d="M253.6,268.4 L268.0,256.0 L281.3,243.6 L293.8,231.2 L305.6,218.8 L316.7,206.4" />
    <line class="jump" x1="316.7" y1="206.4" x2="336.5" y2="206.4" />
    <path class="mktsup" d="M336.5,206.4 L360.4,194.0 L379.9,181.6 L397.3,169.2 L413.3,156.8" />
    <text class="suplab" x="335" y="138" text-anchor="start">Market Supply</text>

    <!-- entry-jump end dots + labels -->
    <circle class="ctxdot" cx="182.8" cy="268.4" r="3.5" />
    <circle class="endot"  cx="253.6" cy="268.4" r="3.5" />
    <text class="entrylab" x="218" y="284" text-anchor="middle">B enters $18</text>
    <circle class="ctxdot" cx="316.7" cy="206.4" r="3.5" />
    <circle class="endot"  cx="336.5" cy="206.4" r="3.5" />
    <text class="entrylab" x="326.6" y="222" text-anchor="middle">C enters $28</text>

    <!-- ===== $20 construction (Lower demand): dotted line + dots + droplines ===== -->
    <g id="lowConstr" class="constr">
      <line class="priceline" x1="70" y1="256.0" x2="268.0" y2="256.0" />
      <circle class="cdot" cx="149.2" cy="256.0" r="3.5" />
      <circle class="cdot" cx="188.8" cy="256.0" r="3.5" />
      <line class="drop" x1="149.2" y1="380" x2="149.2" y2="256.0" />
      <line class="drop" x1="188.8" y1="380" x2="188.8" y2="256.0" />
      <text class="qlabel" x="149.2" y="396" text-anchor="middle">X<tspan class="sub" dy="3">B</tspan> 12</text>
      <text class="qlabel" x="188.8" y="396" text-anchor="middle">X<tspan class="sub" dy="3">A</tspan> 18</text>
    </g>

    <!-- ===== $30 construction (Higher demand): dotted line + dots + one dropline ===== -->
    <g id="highConstr" class="constr dim">
      <line class="priceline" x1="70" y1="194.0" x2="360.4" y2="194.0" />
      <circle class="cdot" cx="103.0" cy="194.0" r="3.5" />
      <circle class="cdot" cx="182.2" cy="194.0" r="3.5" />
      <circle class="cdot" cx="215.2" cy="194.0" r="3.5" />
      <line class="drop" x1="360.4" y1="380" x2="360.4" y2="194.0" />
      <text class="qlabel" x="360.4" y="396" text-anchor="middle">X<tspan class="sub" dy="3">A+B+C</tspan> 44</text>
    </g>

    <!-- ===== the two clearing points (interactive) ===== -->
    <line class="drop" x1="268.0" y1="380" x2="268.0" y2="256.0" />
    <text class="qlabel" x="268.0" y="396" text-anchor="middle">X<tspan class="sub" dy="3">A+B</tspan> 30</text>
    <circle id="dotLow" class="pt" cx="268.0" cy="256.0" r="6.5" />
    <circle id="dotHigh" class="pt" cx="360.4" cy="194.0" r="6.5" style="opacity:0.35" />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line -->
    <line class="sep" x1="44" y1="426" x2="396" y2="426" />
    <text class="r-hint" x="220" y="448" text-anchor="middle">
      <tspan id="rState1" x="220" dy="0">Price $20. Firms A and B produce;</tspan>
      <tspan id="rState2" x="220" dy="16">C sits idle &#8212; its cost floor is $28.</tspan>
    </text>
    <text class="r-trade" x="220" y="486" text-anchor="middle">
      <tspan id="rTake1" x="220" dy="0">Add the firms&#8217; quantities at $20 &#8594;</tspan>
      <tspan id="rTake2" x="220" dy="16">market supply of 30 units.</tspan>
    </text>

    <!-- ===== hit targets + keyboard proxies (drawn last, on top) ===== -->
    <circle id="lowHit" class="hit" cx="268.0" cy="256.0" r="22" />
    <circle id="lowFocus" class="hit focus" cx="268.0" cy="256.0" r="22"
            tabindex="0" role="slider" aria-label="Demand level"
            aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"
            aria-valuetext="Lower demand. Price $20. Firms A and B produce; C sits idle, its cost floor is $28. Add the firms' quantities at $20: market supply of 30 units." />
    <circle id="highHit" class="hit" cx="360.4" cy="194.0" r="22" />
    <circle id="highFocus" class="hit focus" cx="360.4" cy="194.0" r="22"
            tabindex="-1" role="slider" aria-label="Demand level"
            aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"
            aria-valuetext="Higher demand. Price $30. Now A, B, and C all produce, each at marginal cost $30. Output rises to 44 units, all at equalized marginal cost." />
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: three
      firms' marginal cost curves sum horizontally into the bold market-supply
      curve, which kinks up as B enters at $18 and C enters at $28; dotted
      lines at $20 and $30 show the equalized-marginal-cost construction at
      each clearing price. You can also
      <a href="t07a-market-supply.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var byId = function (id) { return document.getElementById(id); };

  var lowConstr = byId('lowConstr'), highConstr = byId('highConstr');
  var demLow = byId('demLow'), demHigh = byId('demHigh');
  var dotLow = byId('dotLow'), dotHigh = byId('dotHigh');
  var lowHit = byId('lowHit'), lowFocus = byId('lowFocus');
  var highHit = byId('highHit'), highFocus = byId('highFocus');
  var shiftArrow = byId('shiftArrow'), shiftLabel = byId('shiftLabel');
  var rState1 = byId('rState1'), rState2 = byId('rState2');
  var rTake1 = byId('rTake1'), rTake2 = byId('rTake2');
  var btnLow = byId('btnLow'), btnHigh = byId('btnHigh');

  // dstate: 0 = Lower demand (price $20, A+B produce); 1 = Higher demand
  // (price $30, A+B+C produce, C having just entered).
  var dstate = 0;

  function render() {
    var low = (dstate === 0);

    lowConstr.classList.toggle('dim', !low);
    highConstr.classList.toggle('dim', low);
    demLow.setAttribute('class', low ? 'curve' : 'curve-ghost');
    demHigh.setAttribute('class', low ? 'curve-ghost' : 'curve');
    dotLow.style.opacity = low ? 1 : 0.35;
    dotHigh.style.opacity = low ? 0.35 : 1;
    shiftArrow.style.opacity = low ? 0.25 : 1;
    shiftLabel.style.opacity = low ? 0.25 : 1;

    lowFocus.setAttribute('tabindex', low ? '0' : '-1');
    highFocus.setAttribute('tabindex', low ? '-1' : '0');
    btnLow.classList.toggle('on', low);
    btnHigh.classList.toggle('on', !low);
    btnLow.setAttribute('aria-pressed', low ? 'true' : 'false');
    btnHigh.setAttribute('aria-pressed', low ? 'false' : 'true');

    if (low) {
      rState1.textContent = 'Price $20. Firms A and B produce;';
      rState2.textContent = 'C sits idle — its cost floor is $28.';
      rTake1.textContent  = 'Add the firms’ quantities at $20 →';
      rTake2.textContent  = 'market supply of 30 units.';
    } else {
      rState1.textContent = 'Price $30. Now A, B, and C all produce,';
      rState2.textContent = 'each at marginal cost $30.';
      rTake1.textContent  = 'Higher demand → higher price → C enters;';
      rTake2.textContent  = 'output rises to 44 units, at equalized MC.';
    }

    lowFocus.setAttribute('aria-valuenow', low ? '0' : '1');
    highFocus.setAttribute('aria-valuenow', low ? '0' : '1');
    var text = low
      ? "Lower demand. Price $20. Firms A and B produce; C sits idle, its cost floor is $28. Add the firms' quantities at $20: market supply of 30 units."
      : "Higher demand. Price $30. Now A, B, and C all produce, each at marginal cost $30. Output rises to 44 units, all at equalized marginal cost.";
    lowFocus.setAttribute('aria-valuetext', text);
    highFocus.setAttribute('aria-valuetext', text);
  }

  function setState(v) {
    var nv = v ? 1 : 0;
    if (nv === dstate) return;
    dstate = nv;
    render();
  }

  // ---- click / tap (buttons and the two clearing dots themselves) ----
  btnLow.addEventListener('click', function () { setState(0); lowFocus.focus(); });
  btnHigh.addEventListener('click', function () { setState(1); highFocus.focus(); });
  lowHit.addEventListener('pointerdown', function () { setState(0); lowFocus.focus(); });
  lowFocus.addEventListener('pointerdown', function () { setState(0); });
  highHit.addEventListener('pointerdown', function () { setState(1); highFocus.focus(); });
  highFocus.addEventListener('pointerdown', function () { setState(1); });

  // ---- keyboard: arrow keys toggle Lower <-> Higher and move focus ----
  function onKey(evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') {
      evt.preventDefault(); setState(1); highFocus.focus();
    } else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') {
      evt.preventDefault(); setState(0); lowFocus.focus();
    }
  }
  lowFocus.addEventListener('keydown', onKey);
  highFocus.addEventListener('keydown', onKey);

  // ---- debug hook (inert for students) ----
  window.__fig = {
    set: function (v) { if (v && v.dstate !== undefined) setState(v.dstate); },
    get: function () { return { dstate: dstate }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
