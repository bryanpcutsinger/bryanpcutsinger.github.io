<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive diminishing returns: total, marginal, and average product</title>
<!--
  Interactive product-curve figure for the T6a blog post (website-styled, warm
  palette). Recreates UE Fig 14.3 "Diminishing Returns" (p.206), enriched with a
  Total-Product panel per the post's own caption/Table 3 (the UE source is
  single-panel MP-bars + AP-step-line only; the enrichment is instructor-
  approved -- see interactive-specs.md). Self-contained: no libraries, no
  network. The static FAU figure (figures/t06a-diminishing-returns.{tex,svg}) is
  the SLIDE version and is untouched; it is also the <noscript> fallback.

  FAMILY F1 (trace-the-curve). Geometry class: vertically stacked two-plot
  single column (shared "units of variable input" axis), viewBox 460x640,
  aspect-ratio ~5/7 (spec: 23/32), max-width 520px.

  SOURCE DATA (UE Table 14.3, recreated verbatim in post.md Table 3) -- this is
  genuinely discrete integer data (not a continuous function); smooth curves are
  drawn through the data points (Catmull-Rom interpolation), matching the
  static figure's "smooth" pgfplots treatment (interactive-specs.md: cosmetic,
  turning points preserved):
    TP(input): 0:0  1:6  2:16  3:24  4:30  5:34  6:36  7:36  8:32  9:27  10:21
    MP(input): 1:6  2:10 3:8   4:6   5:4   6:2   7:0   8:-4  9:-5  10:-6
    AP(input): 1:6.0 2:8.0 3:8.0 4:7.5 5:6.8 6:6.0 7:5.1 8:4.0 9:3.0 10:2.1
  Turning points: MP peaks at input 2 (=10); MP cuts AP at AP's maximum, input 3
  (both 8.0); MP = 0 and TP peaks at input 7 (=36, flat across inputs 6-7); MP
  negative from input 8 on (TP falling).

  GEOMETRY / coordinate frame (shared input axis across both plots):
    x scale (both plots): xin(i) = 64 + i*(336/11)  [i=0 -> x=64; i=10 -> x=369.45;
      axis line drawn to x=422 so the arrowhead doesn't crowd the data].
    Top plot (Total Product): TP=0 -> y=270 (this plot's own input-axis baseline);
      yTP(tp) = 270 - tp*5.75  [TP=36 -> y=63; axis top arrow at y=20, well past
      the data max so the curve does not crowd the arrowhead].
    Bottom plot (MP & AP): the "input axis" for this plot is the value=0 line at
      y=450 (not the plot's bottom edge, since MP takes negative values);
      yB(v) = 550 - (v+8)*12.5  [scale spans -8..12 across y=550..300, headroom
      past the data's actual -6..10 range so nothing crowds the arrowhead].
    A single input "handle" (thumb, on the value=0 line at y=450) drags/steps
    along x; dots on TP (top plot) and on MP/AP (bottom plot) all ride the same
    integer input i via the shared xin() mapping. Draggable range: i in [1,10]
    (genuinely discrete -- no fractional inputs). The three turning points
    (inputs 2, 3, 7) snap-highlight (turnmark groups toggle an "active" class).
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* TP curve + AP curve + headings */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / captions / static guides */
    --hairline:#e3ddd3;    /* live droplines               */
    --accent:  #b07a2c;    /* brass — MP curve + draggable handle */
    --accent-tint: #efe4d2;/* (unused fill reserve)        */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 defeats the flexbox min-width:auto default so the figure
     scales DOWN to viewports narrower than the SVG's intrinsic width instead
     of clipping (the right side would otherwise be cut off on phones). */
  .fig { width: 100%; max-width: 520px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis    { stroke: var(--muted); stroke-width: 1.4; }
  .tickmark{ stroke: var(--muted); stroke-width: 1; }
  .curveTP { stroke: var(--ink);    stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .curveMP { stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .curveAP { stroke: var(--ink);    stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .guide   { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 3;
             opacity: 0.6; fill: none; }
  .drop    { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }

  /* static turning-point annotations (ring, not the draggable dot); the whole
     group brightens when the current input equals that turning point */
  .turnmark .turnring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0.55; }
  .turnmark .turnlbl  { fill: var(--muted); font-size: 10.3px; font-weight: 600; }
  .turnmark.active .turnring { opacity: 1; stroke-width: 3; }
  .turnmark.active .turnlbl  { fill: var(--accent); }

  /* draggable dots + generous transparent hit targets */
  .ptTP    { fill: var(--ink);    stroke: var(--surface); stroke-width: 2.2; }
  .ptMP    { fill: var(--accent); stroke: var(--surface); stroke-width: 2.2; }
  .ptAP    { fill: var(--ink);    stroke: var(--surface); stroke-width: 2.2; }
  .thumb   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit     { fill: transparent; stroke: transparent; touch-action: none; cursor: grab; }
  .hitTrack{ fill: transparent; stroke: transparent; touch-action: none; cursor: grab; }
  .thumb-focus:focus-visible { outline: none; }
  .thumb-focus:focus-visible + .thumb,
  .grabbing .thumb { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axtitle  { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .tick     { fill: var(--muted); font-size: 10px; }
  .curvelbl { fill: var(--ink);   font-size: 12px; font-style: italic; }
  .curvelbl.mp { fill: var(--accent); }
  .note     { fill: var(--muted); font-size: 10.3px; }
  .peaklbl  { fill: var(--ink);   font-size: 11px; font-weight: 600; }
  /* live readout tags (accent, with a surface backing so they cleanly cover
     whatever static mark they ride over) */
  .tagbg    { fill: var(--surface); }
  .tagtxt   { fill: var(--accent); font-size: 11.5px; font-weight: 700; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted);  font-size: 12px; }
  .r-trade  { fill: var(--accent); font-size: 12.5px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<!-- Everything from here to </div> is REAL base SVG: a no-JS reader sees the

<div class="fig">

    <!-- ============================ BOTTOM PLOT: MP & AP ============================ -->

    <!-- horizontal "zero" line doubles as this plot's input axis (value=0) -->

    <!-- AP(input), 1..10: 6.0,8.0,8.0,7.5,6.8,6.0,5.1,4.0,3.0,2.1 (drawn first so

    <path class="curveAP" d="M94.55,375.00 C99.64,370.83 114.91,354.17 125.09,350.00 C135.27,345.83 145.45,348.96 155.64,350.00 C165.82,351.04 176.00,353.75 186.18,356.25 C196.36,358.75 206.55,361.88 216.73,365.00 C226.91,368.12 237.09,371.46 247.27,375.00 C257.45,378.54 267.64,382.08 277.82,386.25 C288.00,390.42 298.18,395.62 308.36,400.00 C318.55,404.38 328.73,408.54 338.91,412.50 C349.09,416.46 364.36,421.88 369.45,423.75" />

    <g id="turn7B" class="turnmark">

    </g>

    <!-- the negative-region note (input 8+); sits in the open strip below the
         curves' terminus, clear of both lines -->
    <text class="note" text-anchor="end"><tspan x="410" y="558">MP negative — extra input</tspan><tspan x="410" y="570">destroys output (input 8+).</tspan></text>

    <!-- curve name labels, positioned in open space clear of both lines -->
    <text class="curvelbl mp" x="369" y="542" text-anchor="end">Marginal product (MP)</text>
    <text class="curvelbl"    x="300" y="335" text-anchor="start">Average product (AP)</text>

    <!-- axis title (the shared x-axis is already titled once, in the top plot) -->

    <!-- live vertical guide spanning from the handle line to whichever of the

         (primary drag surface) + a visible thumb + a keyboard-focusable proxy -->
    <rect id="hitTrack" class="hitTrack" x="70" y="432" width="320" height="36" />
    <text id="lVal" class="tick" x="125.09" y="496" text-anchor="middle" font-weight="700" fill="var(--accent)">Input = 2</text>

    <circle id="thumb" class="thumb" cx="125.09" cy="450" r="7" />

            aria-valuetext="At 2 units: total product 16, marginal product 10, average product 8.0. Marginal product peaks here at input 2 — beyond it, each extra unit adds less." />

    <line class="sep" x1="44" y1="584" x2="416" y2="584" />
    <text id="rHint"  class="r-hint"  x="230" y="602" text-anchor="middle">At 2 units: total product 16 &#183; marginal product 10 &#183; average product 8.0</text>
    <text id="rTrade" class="r-trade" text-anchor="middle"><tspan x="230" y="620">Marginal product peaks here at input 2 — beyond it,</tspan><tspan x="230" y="636">each extra unit adds less.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: total product on top, marginal and average product below, both plotted against units of the variable input. You can also <a href="t06a-diminishing-returns.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg         = document.getElementById('fig');
  var ptTP        = document.getElementById('ptTP');
  var hitTP       = document.getElementById('hitTP');
  var ptMP        = document.getElementById('ptMP');
  var hitMP       = document.getElementById('hitMP');
  var ptAP        = document.getElementById('ptAP');
  var hitAP       = document.getElementById('hitAP');
  var thumb       = document.getElementById('thumb');
  var hit         = document.getElementById('hit');
  var thumbFocus  = document.getElementById('thumbFocus');
  var hitTrack    = document.getElementById('hitTrack');
  var dropTPv     = document.getElementById('dropTPv');
  var dropTPh     = document.getElementById('dropTPh');
  var dropBv      = document.getElementById('dropBv');
  var dropMPh     = document.getElementById('dropMPh');
  var dropAPh     = document.getElementById('dropAPh');
  var tpVal       = document.getElementById('tpVal');
  var tpTagBg     = document.getElementById('tpTagBg');
  var mpVal       = document.getElementById('mpVal');
  var mpTagBg     = document.getElementById('mpTagBg');
  var apVal       = document.getElementById('apVal');
  var apTagBg     = document.getElementById('apTagBg');
  var lVal        = document.getElementById('lVal');
  var rHint       = document.getElementById('rHint');
  var rTrade      = document.getElementById('rTrade');
  var turn2       = document.getElementById('turn2');
  var turn3       = document.getElementById('turn3');
  var turn7T      = document.getElementById('turn7T');
  var turn7B      = document.getElementById('turn7B');
  var NS = 'http://www.w3.org/2000/svg';

  // pixel frame + scale (mirrors the static SVG markup above)
  var X0 = 64, DX = 336 / 11;                 // shared input scale, both plots
  var xin = function (i) { return X0 + i * DX; };
  var toIn = function (px) { return (px - X0) / DX; };

  var Y0t = 270, DYt = 5.75;                  // top plot: TP=0 baseline, px/unit
  var yTP = function (tp) { return Y0t - tp * DYt; };

  var Y0b = 450, DYb = 12.5, VMIN = -8;       // bottom plot: value=0 zero line, px/unit
  var yB = function (v) { return 550 - (v - VMIN) * DYb; };

  // the source data (UE Table 14.3 / post.md Table 3) -- genuinely discrete
  var TP = { 0: 0, 1: 6, 2: 16, 3: 24, 4: 30, 5: 34, 6: 36, 7: 36, 8: 32, 9: 27, 10: 21 };
  var MP = { 1: 6, 2: 10, 3: 8, 4: 6, 5: 4, 6: 2, 7: 0, 8: -4, 9: -5, 10: -6 };
  var AP = { 1: 6.0, 2: 8.0, 3: 8.0, 4: 7.5, 5: 6.8, 6: 6.0, 7: 5.1, 8: 4.0, 9: 3.0, 10: 2.1 };

  var ILO = 1, IHI = 10;
  var q = 2; // initial state (matches the static markup): input 2

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function n1(v) { return Math.abs(v).toFixed(1).replace(/^/, v < 0 ? '−' : ''); }
  function nInt(v) { return (v < 0 ? '−' : '') + Math.abs(v); }

  // Greedily word-wrap `str` into <tspan> lines inside the accent readout so
  // it never overflows the 460-wide viewBox. Measures with getComputedTextLength.
  function layoutTrade(str) {
    var maxW = 388, x = 230, y0 = 620, lineH = 16;
    while (rTrade.firstChild) rTrade.removeChild(rTrade.firstChild);
    var probe = document.createElementNS(NS, 'tspan');
    rTrade.appendChild(probe);
    var words = str.split(' '), lines = [], cur = words[0] || '';
    for (var i = 1; i < words.length; i++) {
      probe.textContent = cur + ' ' + words[i];
      if (probe.getComputedTextLength() > maxW) { lines.push(cur); cur = words[i]; }
      else { cur = cur + ' ' + words[i]; }
    }
    lines.push(cur);
    rTrade.removeChild(probe);
    var startY = (lines.length === 1) ? y0 + 6 : y0;
    for (var j = 0; j < lines.length; j++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', x);
      t.setAttribute('y', startY + j * lineH);
      t.textContent = lines[j];
      rTrade.appendChild(t);
    }
  }

  function buildReadout(i, tp, mp, ap) {
    var unit = (i === 1) ? 'unit' : 'units';
    var hint = 'At ' + i + ' ' + unit + ': total product ' + tp +
               ' · marginal product ' + nInt(mp) +
               ' · average product ' + n1(ap);
    var trade;
    if (i === 2) {
      trade = 'Marginal product peaks here at input 2 — beyond it, each extra unit adds less.';
    } else if (i === 3) {
      trade = 'MP has fallen to meet AP at AP’s maximum (both 8.0).';
    } else if (i === 7) {
      trade = 'MP hits zero — total product peaks and is about to fall.';
    } else if (i === 9) {
      trade = 'MP is negative — extra input now destroys output.';
    } else if (i === 1) {
      trade = 'Marginal product is still rising — each new unit adds more than the last.';
    } else if (i >= 4 && i <= 6) {
      trade = 'Marginal product keeps falling, dragging the average down behind it.';
    } else if (i === 8) {
      trade = 'Marginal product has just turned negative — extra input is now destroying output.';
    } else { // i === 10
      trade = 'The last unit reduced output outright — marginal product is sharply negative.';
    }
    return { hint: hint, trade: trade };
  }

  function render() {
    var tp = TP[q], mp = MP[q], ap = AP[q];
    var cx  = xin(q);
    var cyT = yTP(tp);
    var cyM = yB(mp);
    var cyA = yB(ap);

    // --- top plot: TP dot + droplines + tag ---
    ptTP.setAttribute('cx', cx);  ptTP.setAttribute('cy', cyT);
    hitTP.setAttribute('cx', cx); hitTP.setAttribute('cy', cyT);
    dropTPv.setAttribute('x1', cx); dropTPv.setAttribute('x2', cx);
    dropTPv.setAttribute('y1', Y0t); dropTPv.setAttribute('y2', cyT);
    dropTPh.setAttribute('y1', cyT); dropTPh.setAttribute('y2', cyT);
    dropTPh.setAttribute('x1', X0); dropTPh.setAttribute('x2', cx);
    tpVal.setAttribute('y', cyT); tpVal.textContent = String(tp);
    tpTagBg.setAttribute('y', cyT - 7.5);

    // --- bottom plot: MP + AP dots + droplines + tags ---
    ptMP.setAttribute('cx', cx);  ptMP.setAttribute('cy', cyM);
    hitMP.setAttribute('cx', cx); hitMP.setAttribute('cy', cyM);
    ptAP.setAttribute('cx', cx);  ptAP.setAttribute('cy', cyA);
    hitAP.setAttribute('cx', cx); hitAP.setAttribute('cy', cyA);
    dropMPh.setAttribute('y1', cyM); dropMPh.setAttribute('y2', cyM);
    dropMPh.setAttribute('x1', X0);  dropMPh.setAttribute('x2', cx);
    dropAPh.setAttribute('y1', cyA); dropAPh.setAttribute('y2', cyA);
    dropAPh.setAttribute('x1', X0);  dropAPh.setAttribute('x2', cx);
    mpVal.setAttribute('y', cyM); mpVal.textContent = nInt(mp);
    mpTagBg.setAttribute('y', cyM - 7.5);
    apVal.setAttribute('y', cyA); apVal.textContent = n1(ap);
    apTagBg.setAttribute('y', cyA - 7.5);

    // shared vertical guide spans from the topmost to the bottommost of
    // {MP dot, AP dot, the zero line} so it reads correctly whether MP is
    // above or below zero
    var topY = Math.min(cyM, cyA, Y0b);
    var botY = Math.max(cyM, cyA, Y0b);
    dropBv.setAttribute('x1', cx); dropBv.setAttribute('x2', cx);
    dropBv.setAttribute('y1', topY); dropBv.setAttribute('y2', botY);

    // --- the shared input handle itself ---
    thumb.setAttribute('cx', cx);      thumb.setAttribute('cy', Y0b);
    hit.setAttribute('cx', cx);        hit.setAttribute('cy', Y0b);
    thumbFocus.setAttribute('cx', cx); thumbFocus.setAttribute('cy', Y0b);
    lVal.setAttribute('x', cx); lVal.textContent = 'Input = ' + q;

    // --- turning-point snap-highlight ---
    turn2.classList.toggle('active', q === 2);
    turn3.classList.toggle('active', q === 3);
    turn7T.classList.toggle('active', q === 7);
    turn7B.classList.toggle('active', q === 7);

    // --- readout grammar (muted state line + accent takeaway line) ---
    var r = buildReadout(q, tp, mp, ap);
    rHint.textContent = r.hint;
    layoutTrade(r.trade);

    thumbFocus.setAttribute('aria-valuenow', String(q));
    thumbFocus.setAttribute('aria-valuetext', r.hint + '. ' + r.trade);
  }

  // single state setter (clamp + no-op guard + render) shared by drag,
  // keyboard, dot-tap, and the debug hook, so state logic lives in one place
  function setQ(newQ) {
    var v = Math.round(newQ);
    if (isNaN(v)) return;
    if (v < ILO) v = ILO;
    if (v > IHI) v = IHI;
    if (v === q) return;
    q = v;
    render();
  }

  function setFromPointer(evt) {
    var pnt = toSvg(evt);
    setQ(toIn(pnt.x));
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  // primary drag surfaces: the fat track, the visible thumb, and each dot
  // (grabbing any one of the four curve dots or the track/thumb all move the
  // same shared input handle)
  [hitTrack, hit, thumbFocus, hitTP, hitMP, hitAP].forEach(function (el) {
    el.addEventListener('pointerdown', onDown);
  });

  // --- keyboard (arrows step one whole unit of input) ---
  thumbFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setQ(q + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setQ(q - 1); }
    else return;
    evt.preventDefault();
  });

  // Debug hook: lets a reviewer screenshot non-initial states via scripting.
  window.__fig = {
    set: function (v) { setQ(+v); },
    get: function () { return { input: q, TP: TP[q], MP: MP[q], AP: AP[q] }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
