<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive product curves: total, marginal, and average product</title>
<!--
  Interactive product-curve figure for the T3a blog post (website-styled, warm
  palette). Recreates UE Fig 7.1 "Graph of Marginal and Average Product Data
  in Table 7.5" (p.101) plus UE Fig 7.2's three marginal/average relationships
  (folded into annotations, per the spec note: 7.2 is not a total-product
  chart, it is the A->M relationship diagram). Self-contained: no libraries,
  no network. The static FAU figure (figures/t03-product-curves.{tex,svg}) is
  the SLIDE version and is untouched; it is also the <noscript> fallback.

  FAMILY F1 (trace-the-curve). Geometry class: vertically stacked two-plot
  single column (shared Labor axis), viewBox 460x640, aspect-ratio ~5/7,
  max-width 480px.

  UNDERLYING FUNCTION (so the marginal-cuts-average-at-its-peak and
  total-product-peaks-where-marginal-is-zero properties hold by construction):
    TP(L) = 15*L^2 - L^3      (top plot; drawn for L in [0,10])
    MP(L) = 30*L - 3*L^2      (bottom plot; drawn for L in [0,11] -- extended
                                past L=10 to show MP going negative)
    AP(L) = 15*L - L^2        (bottom plot; drawn for L in [0,10])
  Key points: AP peaks and MP crosses AP at L*=7.5 (AP=MP=56.25); TP peaks and
  MP=0 at L**=10 (TP=500).

  GEOMETRY / coordinate frame (shared Labor axis across both plots):
    x scale (both plots): xL(L) = 64 + L*(336/11)   [L=0 -> x=64; L=11 -> x=400;
      axis line drawn to x=422 so the arrowhead doesn't crowd the data].
    Top plot (Total Product): TP=0 -> y=270 (plot's own Labor-axis baseline);
      yTP(tp) = 270 - tp*(240/550)  [TP=500 -> y=51.82; axis top arrow at y=18].
    Bottom plot (MP & AP): the "Labor axis" for this plot is the P=0 line at
      y=470 (not the plot's bottom edge, since MP takes negative values);
      yB(p) = 470 - p*(240/135)  [P=90 -> y=310 (near the top arrow, y=300);
      P=-45 -> y=550 (bottom edge, no arrowhead needed since P never needs a
      negative-direction arrow)].
    A single Labor "handle" (thumb, on the P=0 line at y=470) drags along x;
    dots on TP (top plot) and on MP/AP (bottom plot) all ride the same L via
    the shared xL() mapping. Draggable range: L in [0.5, 10] (TP/AP's domain;
    the MP tail past L=10 is a fixed, non-interactive annotation showing where
    marginal product goes negative). Snap-highlight at L*=7.5 and L**=10.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* TP curve + AP curve + headings */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / captions / static guides */
    --hairline:#e3ddd3;    /* live droplines               */
    --accent:  #b07a2c;    /* brass — MP curve + draggable handle */
    --accent-tint: #efe4d2;/* (unused fill reserve)        */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 defeats the flexbox min-width:auto default so the figure
     scales DOWN to viewports narrower than the SVG's intrinsic width instead
     of clipping (the right side would otherwise be cut off on phones). */
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis    { stroke: var(--muted); stroke-width: 1.4; }
  .tickmark{ stroke: var(--muted); stroke-width: 1; }
  .curveTP { stroke: var(--ink);    stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .curveMP { stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .curveAP { stroke: var(--ink);    stroke-width: 2.4; fill: none; stroke-linecap: round; }
  .guide   { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 3;
             opacity: 0.6; fill: none; }
  .drop    { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }

  /* static annotation markers (rings, not filled — distinct from the live dots) */
  .peakring{ fill: none; stroke: var(--accent); stroke-width: 2; }

  /* draggable dots + generous transparent hit targets */
  .ptTP    { fill: var(--ink);    stroke: var(--surface); stroke-width: 2.2; }
  .ptMP    { fill: var(--accent); stroke: var(--surface); stroke-width: 2.2; }
  .ptAP    { fill: var(--ink);    stroke: var(--surface); stroke-width: 2.2; }
  .thumb   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit     { fill: transparent; stroke: transparent; touch-action: none; cursor: grab; }
  .hitTrack{ fill: transparent; stroke: transparent; touch-action: none; cursor: grab; }
  .thumb-focus:focus-visible { outline: none; }
  .thumb-focus:focus-visible + .thumb,
  .grabbing .thumb { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axtitle  { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .tick     { fill: var(--muted); font-size: 10px; }
  .curvelbl { fill: var(--ink);   font-size: 12px; font-style: italic; }
  .curvelbl.mp { fill: var(--accent); }
  .note     { fill: var(--muted); font-size: 10.3px; }
  .peaklbl  { fill: var(--ink);   font-size: 11px; font-weight: 600; }
  /* live readout tags (accent, with a surface backing so they cleanly cover
     whatever static mark they ride over) */
  .tagbg    { fill: var(--surface); }
  .tagtxt   { fill: var(--accent); font-size: 11.5px; font-weight: 700; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted);  font-size: 12px; }
  .r-trade  { fill: var(--accent); font-size: 12.5px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<!-- Everything from here to </div> is REAL base SVG: a no-JS reader sees the
     full figure (both plots, every curve, every static annotation, and an
     initial handle position at L=4 with droplines, live tags, and the
     readout). The script only ATTACHES drag / keyboard / live updates. -->
<div class="fig">
  <svg id="fig" viewBox="0 0 460 640" role="group"
       aria-label="Total product on top, marginal and average product below, both against labor on the horizontal axis. Drag the handle on the marginal/average axis to sweep a labor value through both plots and read off total product, marginal product, and average product together.">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>
    <title>Total, marginal, and average product against labor</title>

    <!-- ============================ TOP PLOT: Total Product ============================ -->
    <!-- axes (drawn first, so the curve sits on top); extended past the data max -->
    <line class="axis" x1="64" y1="270" x2="422" y2="270" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="270" x2="64"  y2="18"  marker-end="url(#arrow)" />

    <!-- TP(L) = 15L^2 - L^3, L in [0,10] -->
    <path class="curveTP" d="M64.00,270.00 L79.27,268.42 L94.55,263.89 L109.82,256.75 L125.09,247.31 L140.36,235.91 L155.64,222.87 L170.91,208.53 L186.18,193.20 L201.45,177.22 L216.73,160.91 L232.00,144.60 L247.27,128.62 L262.55,113.29 L277.82,98.95 L293.09,85.91 L308.36,74.51 L323.64,65.07 L338.91,57.93 L354.18,53.40 L369.45,51.82" />

    <!-- static peak annotation (ring, not the draggable dot) + dashed guide at L**=10 -->
    <line class="guide" x1="369.45" y1="270" x2="369.45" y2="51.82" />
    <circle class="peakring" cx="369.45" cy="51.82" r="5" />
    <text class="peaklbl" x="300" y="32" text-anchor="middle">TP maximum (MP = 0 here)</text>

    <!-- axis titles -->
    <text class="axtitle" x="241" y="286" text-anchor="middle">Labor (L)</text>
    <text class="axtitle" x="18" y="145" text-anchor="middle" transform="rotate(-90 18 145)">Total product</text>

    <!-- live droplines (initial: L=4 -> TP=176 at (186.18,193.20)) -->
    <line id="dropTPv" class="drop" x1="186.18" y1="270" x2="186.18" y2="193.20" />
    <line id="dropTPh" class="drop" x1="64"     y1="193.20" x2="186.18" y2="193.20" />

    <!-- live TP tag riding the horizontal dropline foot -->
    <g id="tpTag">
      <rect id="tpTagBg" class="tagbg" x="18" y="185.70" width="42" height="15" rx="2" />
      <text id="tpVal" class="tagtxt" x="59" y="193.20" text-anchor="end" dominant-baseline="middle">176.0</text>
    </g>

    <!-- draggable TP dot + hit target (bonus: grabbing the dot also drags L) -->
    <circle id="hitTP" class="hit" cx="186.18" cy="193.20" r="22" />
    <circle id="ptTP"  class="ptTP" cx="186.18" cy="193.20" r="6.5" />

    <!-- ============================ BOTTOM PLOT: MP & AP ============================ -->
    <!-- vertical axis (Product per worker, spans negative-to-positive; arrow only at
         the positive/top end) -->
    <line class="axis" x1="64" y1="550" x2="64" y2="300" marker-end="url(#arrow)" />
    <!-- horizontal "zero" line doubles as this plot's Labor axis (P=0) -->
    <line class="axis" x1="64" y1="470" x2="422" y2="470" marker-end="url(#arrow)" />

    <!-- AP(L) = 15L - L^2, L in [0,10] (drawn first so MP sits on top at the crossing) -->
    <path class="curveAP" d="M64.00,470.00 L79.27,457.11 L94.55,445.11 L109.82,434.00 L125.09,423.78 L140.36,414.44 L155.64,406.00 L170.91,398.44 L186.18,391.78 L201.45,386.00 L216.73,381.11 L232.00,377.11 L247.27,374.00 L262.55,371.78 L277.82,370.44 L293.09,370.00 L308.36,370.44 L323.64,371.78 L338.91,374.00 L354.18,377.11 L369.45,381.11" />

    <!-- MP(L) = 30L - 3L^2, L in [0,11] (extended past L=10 into negative territory) -->
    <path class="curveMP" d="M64.00,470.00 L79.27,444.67 L94.55,422.00 L109.82,402.00 L125.09,384.67 L140.36,370.00 L155.64,358.00 L170.91,348.67 L186.18,342.00 L201.45,338.00 L216.73,336.67 L232.00,338.00 L247.27,342.00 L262.55,348.67 L277.82,358.00 L293.09,370.00 L308.36,384.67 L323.64,402.00 L338.91,422.00 L354.18,444.67 L369.45,470.00 L384.73,498.00 L400.00,528.67" />

    <!-- static dashed guides at L*=7.5 (MP=AP) and L**=10 (MP=0); shortened
         (they need not reach the axis) so they stay clear of the falling
         annotation's row below them -->
    <line class="guide" x1="293.09" y1="370.00" x2="293.09" y2="438" />
    <line class="guide" x1="369.45" y1="381.11" x2="369.45" y2="438" />
    <text class="tick" x="293.09" y="482" text-anchor="middle">L = 7.5</text>
    <text class="tick" x="369.45" y="482" text-anchor="middle">L = 10</text>

    <!-- curve name labels, off the lines -->
    <text class="curvelbl mp" x="140" y="350" text-anchor="middle">MP</text>
    <text class="curvelbl"    x="382" y="362" text-anchor="start">AP</text>

    <!-- the four teaching annotations from UE Fig 7.2, folded onto the curves
         (positions collision-checked against the curve paths above) -->
    <text class="note" text-anchor="middle"><tspan x="194" y="359">MP &gt; AP:</tspan><tspan x="194" y="370">AP rising</tspan></text>
    <text class="note" x="280" y="320" text-anchor="middle">MP = AP (AP at its peak)</text>
    <text class="note" text-anchor="middle"><tspan x="300" y="448">MP &lt; AP:</tspan><tspan x="300" y="461">AP falling</tspan></text>
    <text class="note" text-anchor="start"><tspan x="374" y="450">MP &lt; 0</tspan><tspan x="374" y="463">(past L**)</tspan></text>

    <!-- axis titles -->
    <text class="axtitle" x="241" y="566" text-anchor="middle">Labor (L)</text>
    <text class="axtitle" x="18" y="410" text-anchor="middle" transform="rotate(-90 18 410)">Product per worker</text>

    <!-- live vertical guide from the handle up to the higher of the two dots
         (initial: L=4 -> MP dot is higher, y=342.00) -->
    <line id="dropBv" class="drop" x1="186.18" y1="342.00" x2="186.18" y2="470" />
    <!-- live horizontal droplines from each dot to the y-axis -->
    <line id="dropMPh" class="drop" x1="64" y1="342.00"  x2="186.18" y2="342.00" />
    <line id="dropAPh" class="drop" x1="64" y1="391.78" x2="186.18" y2="391.78" />

    <!-- live MP / AP tags riding their dropline feet -->
    <g id="mpTag">
      <rect id="mpTagBg" class="tagbg" x="18" y="334.50" width="42" height="15" rx="2" />
      <text id="mpVal" class="tagtxt" x="59" y="342.00" text-anchor="end" dominant-baseline="middle">72.0</text>
    </g>
    <g id="apTag">
      <rect id="apTagBg" class="tagbg" x="18" y="384.28" width="42" height="15" rx="2" />
      <text id="apVal" class="tagtxt" x="59" y="391.78" text-anchor="end" dominant-baseline="middle">44.0</text>
    </g>

    <!-- draggable MP / AP dots + hit targets (bonus: grabbing a dot also drags L) -->
    <circle id="hitMP" class="hit" cx="186.18" cy="342.00" r="22" />
    <circle id="ptMP"  class="ptMP" cx="186.18" cy="342.00" r="6.5" />
    <circle id="hitAP" class="hit" cx="186.18" cy="391.78" r="22" />
    <circle id="ptAP"  class="ptAP" cx="186.18" cy="391.78" r="6.5" />

    <!-- the Labor handle: a fat invisible track along the zero line (primary
         drag surface) + a visible thumb + a keyboard-focusable proxy -->
    <rect id="hitTrack" class="hitTrack" x="60" y="452" width="345" height="36" />
    <text id="lVal" class="tick" x="186.18" y="503" text-anchor="middle" font-weight="700" fill="var(--accent)">L = 4.0</text>
    <circle id="hit" class="hit" cx="186.18" cy="470" r="22" />
    <circle id="thumb" class="thumb" cx="186.18" cy="470" r="7" />
    <circle id="thumbFocus" class="thumb-focus hit" cx="186.18" cy="470" r="22"
            tabindex="0" role="slider" aria-label="Labor input, sweeping total, marginal, and average product together"
            aria-valuemin="0.5" aria-valuemax="10" aria-valuenow="4"
            aria-valuetext="Labor 4.0. Marginal product 72.0 is above average product 44.0 — the average is still rising." />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line -->
    <line class="sep" x1="44" y1="584" x2="416" y2="584" />
    <text id="rHint"  class="r-hint"  x="230" y="602" text-anchor="middle">At L = 4.0, MP = 72.0 and AP = 44.0.</text>
    <text id="rTrade" class="r-trade" text-anchor="middle"><tspan x="230" y="620">Because the marginal exceeds the average, the</tspan><tspan x="230" y="636">average is still rising.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: total product on top, marginal and average product below, both plotted against units of labor. You can also <a href="t03-product-curves.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg         = document.getElementById('fig');
  var ptTP        = document.getElementById('ptTP');
  var hitTP       = document.getElementById('hitTP');
  var ptMP        = document.getElementById('ptMP');
  var hitMP       = document.getElementById('hitMP');
  var ptAP        = document.getElementById('ptAP');
  var hitAP       = document.getElementById('hitAP');
  var thumb       = document.getElementById('thumb');
  var hit         = document.getElementById('hit');
  var thumbFocus  = document.getElementById('thumbFocus');
  var hitTrack    = document.getElementById('hitTrack');
  var dropTPv     = document.getElementById('dropTPv');
  var dropTPh     = document.getElementById('dropTPh');
  var dropBv      = document.getElementById('dropBv');
  var dropMPh     = document.getElementById('dropMPh');
  var dropAPh     = document.getElementById('dropAPh');
  var tpVal       = document.getElementById('tpVal');
  var tpTagBg     = document.getElementById('tpTagBg');
  var mpVal       = document.getElementById('mpVal');
  var mpTagBg     = document.getElementById('mpTagBg');
  var apVal       = document.getElementById('apVal');
  var apTagBg     = document.getElementById('apTagBg');
  var lVal        = document.getElementById('lVal');
  var rHint       = document.getElementById('rHint');
  var rTrade      = document.getElementById('rTrade');
  var NS = 'http://www.w3.org/2000/svg';

  // pixel frame + scale (mirrors the static SVG markup above)
  var X0 = 64, DX = 336 / 11;                 // shared Labor scale, both plots
  var xL = function (L) { return X0 + L * DX; };
  var toL = function (px) { return (px - X0) / DX; };

  var Y0t = 270, DYt = 240 / 550;             // top plot: TP=0 baseline, px/unit
  var yTP = function (tp) { return Y0t - tp * DYt; };

  var Y0b = 470, DYb = 240 / 135;             // bottom plot: P=0 zero line, px/unit
  var yB = function (p) { return Y0b - p * DYb; };

  // the underlying functions (one shared construction, so the marginal cuts
  // the average at the average's peak, and total product peaks exactly
  // where marginal is zero)
  function TP(L) { return 15 * L * L - L * L * L; }
  function MP(L) { return 30 * L - 3 * L * L; }
  function AP(L) { return 15 * L - L * L; }

  var LLO = 0.5, LHI = 10;
  var LSTAR = 7.5, LMAX = 10;
  var SNAP = 0.28;

  var L = 4; // initial state (matches the static markup)

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function n1(v) { return v.toFixed(1); }

  // Greedily word-wrap `str` into <tspan> lines inside the accent readout so
  // it never overflows the 460-wide viewBox. Measures with getComputedTextLength.
  function layoutTrade(str) {
    var maxW = 388, x = 230, y0 = 620, lineH = 16;
    while (rTrade.firstChild) rTrade.removeChild(rTrade.firstChild);
    var probe = document.createElementNS(NS, 'tspan');
    rTrade.appendChild(probe);
    var words = str.split(' '), lines = [], cur = words[0] || '';
    for (var i = 1; i < words.length; i++) {
      probe.textContent = cur + ' ' + words[i];
      if (probe.getComputedTextLength() > maxW) { lines.push(cur); cur = words[i]; }
      else { cur = cur + ' ' + words[i]; }
    }
    lines.push(cur);
    rTrade.removeChild(probe);
    var startY = (lines.length === 1) ? y0 + 6 : y0;
    for (var j = 0; j < lines.length; j++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', x);
      t.setAttribute('y', startY + j * lineH);
      t.textContent = lines[j];
      rTrade.appendChild(t);
    }
  }

  function render() {
    var tp = TP(L), mp = MP(L), ap = AP(L);
    var cx  = xL(L);
    var cyT = yTP(tp);
    var cyM = yB(mp);
    var cyA = yB(ap);

    // --- top plot: TP dot + droplines + tag ---
    ptTP.setAttribute('cx', cx);  ptTP.setAttribute('cy', cyT);
    hitTP.setAttribute('cx', cx); hitTP.setAttribute('cy', cyT);
    dropTPv.setAttribute('x1', cx); dropTPv.setAttribute('x2', cx);
    dropTPv.setAttribute('y1', Y0t); dropTPv.setAttribute('y2', cyT);
    dropTPh.setAttribute('y1', cyT); dropTPh.setAttribute('y2', cyT);
    dropTPh.setAttribute('x1', X0); dropTPh.setAttribute('x2', cx);
    tpVal.setAttribute('y', cyT); tpVal.textContent = n1(tp);
    tpTagBg.setAttribute('y', cyT - 7.5);

    // --- bottom plot: MP + AP dots + droplines + tags ---
    ptMP.setAttribute('cx', cx);  ptMP.setAttribute('cy', cyM);
    hitMP.setAttribute('cx', cx); hitMP.setAttribute('cy', cyM);
    ptAP.setAttribute('cx', cx);  ptAP.setAttribute('cy', cyA);
    hitAP.setAttribute('cx', cx); hitAP.setAttribute('cy', cyA);
    dropMPh.setAttribute('y1', cyM); dropMPh.setAttribute('y2', cyM);
    dropMPh.setAttribute('x1', X0);  dropMPh.setAttribute('x2', cx);
    dropAPh.setAttribute('y1', cyA); dropAPh.setAttribute('y2', cyA);
    dropAPh.setAttribute('x1', X0);  dropAPh.setAttribute('x2', cx);
    mpVal.setAttribute('y', cyM); mpVal.textContent = n1(mp);
    mpTagBg.setAttribute('y', cyM - 7.5);
    apVal.setAttribute('y', cyA); apVal.textContent = n1(ap);
    apTagBg.setAttribute('y', cyA - 7.5);

    // shared vertical guide runs from the handle up to the higher (smaller-y) dot
    var topY = Math.min(cyM, cyA);
    dropBv.setAttribute('x1', cx); dropBv.setAttribute('x2', cx);
    dropBv.setAttribute('y1', topY); dropBv.setAttribute('y2', Y0b);

    // --- the Labor handle itself ---
    thumb.setAttribute('cx', cx);      thumb.setAttribute('cy', Y0b);
    hit.setAttribute('cx', cx);        hit.setAttribute('cy', Y0b);
    thumbFocus.setAttribute('cx', cx); thumbFocus.setAttribute('cy', Y0b);
    lVal.setAttribute('x', cx); lVal.textContent = 'L = ' + n1(L);

    // --- readout grammar (muted state line + accent takeaway line) ---
    var hint, trade;
    if (Math.abs(L - LSTAR) < 0.01) {
      hint  = 'At L = 7.5, MP = AP = 56.25.';
      trade = 'The marginal cuts the average exactly at the average’s peak.';
    } else if (Math.abs(L - LMAX) < 0.01) {
      hint  = 'At L = 10, MP = 0. Total product = 500.';
      trade = 'Total product is at its maximum — one more worker adds nothing.';
    } else if (L < LSTAR) {
      hint  = 'At L = ' + n1(L) + ', MP = ' + n1(mp) + ' and AP = ' + n1(ap) + '.';
      trade = 'Because the marginal exceeds the average, the average is still rising.';
    } else {
      hint  = 'At L = ' + n1(L) + ', MP = ' + n1(mp) + ' and AP = ' + n1(ap) + '.';
      trade = 'Because the marginal is below the average, the average is falling.';
    }
    rHint.textContent = hint;
    layoutTrade(trade);

    thumbFocus.setAttribute('aria-valuenow', n1(L));
    thumbFocus.setAttribute('aria-valuetext', 'Labor ' + n1(L) + '. ' + hint + ' ' + trade);
  }

  // single state setter (clamp + snap + no-op guard + render) shared by drag,
  // keyboard, dot-tap, and the debug hook, so state logic lives in one place
  function setL(newL) {
    var v = newL;
    if (v < LLO) v = LLO;
    if (v > LHI) v = LHI;
    if (Math.abs(v - LSTAR) < SNAP) v = LSTAR;
    else if (Math.abs(v - LMAX) < SNAP) v = LMAX;
    v = Math.round(v * 10) / 10;
    if (v === L) return;
    L = v;
    render();
  }

  function setFromPointer(evt) {
    var pnt = toSvg(evt);
    setL(toL(pnt.x));
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  // primary drag surfaces: the fat track, the visible thumb, and each dot
  // (grabbing any one of the four curve dots or the track/thumb all move the
  // same shared Labor handle)
  [hitTrack, hit, thumbFocus, hitTP, hitMP, hitAP].forEach(function (el) {
    el.addEventListener('pointerdown', onDown);
  });

  // --- keyboard (arrows step Labor by 0.5, snapping near L*/L**) ---
  thumbFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setL(L + 0.5); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setL(L - 0.5); }
    else return;
    evt.preventDefault();
  });

  // Debug hook: lets a reviewer screenshot non-initial states via scripting.
  window.__fig = {
    set: function (v) { setL(+v); },
    get: function () { return { L: L, TP: TP(L), MP: MP(L), AP: AP(L) }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
