<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive production possibilities frontier</title>
<!--
  Interactive PPF for the T1 blog post (website-styled, not FAU).
  Self-contained: no libraries, no network. The static FAU figure
  (figures/t01-ppf.{tex,svg}) is the SLIDE version and is untouched.

  Same geometry as the static figure: concave Food/Housing frontier,
  quarter-ellipse with food-max (5,0) and housing-max (0,5). A point
  is draggable ALONG the frontier; droplines + LIVE QUANTITIES read off
  the x and y axes; the opportunity-cost trade-off updates below.

  The axes extend past the intercepts so the frontier no longer crowds
  the arrowheads. No-JS / print: the base figure (curve, axes, point at
  E, droplines, axis quantities, trade-off) is real SVG markup; the
  script only ATTACHES interactivity, so it degrades gracefully.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* frontier + headings         */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* captions / secondary labels */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass — the draggable point */
    --accent-tint: #efe4d2;/* feasible-region wash        */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .ppf { width: 100%; max-width: 560px; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .frontier  { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .feasible  { fill: var(--accent-tint); opacity: 0.5; stroke: none; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }

  /* draggable point + generous transparent hit targets */
  .pt        { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 26;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axlabel { fill: var(--muted); font-size: 15px; font-weight: 600; }
  .maxlabel{ fill: var(--muted); font-size: 11.5px; }
  .qlabel  { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .r-hint  { fill: var(--muted); font-size: 12.5px; }
  .r-trade { fill: var(--accent); font-size: 14px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="ppf">
  <!-- viewBox 440 x 540. Plot occupies the top; readout band below.
       Pixel frame: origin (64,360). Frontier intercepts: Food 5 -> x=380,
       Housing 5 -> y=56. Axes extend PAST the intercepts (x to 415, y to 28)
       so the curve no longer crowds the arrowheads. -->
  <svg id="ppf" viewBox="0 0 440 540" role="group"
       aria-label="Production possibilities frontier for food and housing. Drag the point along the curve to see the trade-off.">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- feasible set (interior) -->
    <path class="feasible" d="M64,360 L64,56 A316,304 0 0 1 380,360 Z" />

    <!-- axes (drawn before frontier so the curve sits on top); extend past intercepts -->
    <line class="axis" x1="64" y1="360" x2="415" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="28"  marker-end="url(#arrow)" />

    <!-- the concave frontier: housing-max (0,5)=(64,56) to food-max (5,0)=(380,360) -->
    <path class="frontier" d="M64,56 A316,304 0 0 1 380,360" />

    <!-- axis + corner labels -->
    <text class="axlabel" x="222" y="392" text-anchor="middle">Food</text>
    <text class="axlabel" x="24" y="208" text-anchor="middle"
          transform="rotate(-90 24 208)">Housing</text>
    <text class="maxlabel" x="70" y="50" text-anchor="start">Maximum housing</text>
    <text class="maxlabel" x="380" y="380" text-anchor="end">Maximum food</text>

    <!-- droplines (initial: point E = Food 4, Housing 3 -> px 316.8,177.6) -->
    <line id="dropV" class="drop" x1="316.8" y1="360" x2="316.8" y2="177.6" />
    <line id="dropH" class="drop" x1="64" y1="177.6" x2="316.8" y2="177.6" />

    <!-- live quantities read off the axes (ride the dropline feet) -->
    <text id="qx" class="qlabel" x="316.8" y="376" text-anchor="middle">4.0</text>
    <text id="qy" class="qlabel" x="54" y="177.6" text-anchor="end"
          dominant-baseline="middle">3.0</text>

    <!-- the draggable point + hit targets -->
    <path id="hitCurve" class="hit-curve" d="M64,56 A316,304 0 0 1 380,360" />
    <circle id="hit" class="hit" cx="316.8" cy="177.6" r="22" />
    <circle id="pt"  class="pt"  cx="316.8" cy="177.6" r="7" />
    <!-- focusable proxy for keyboard control -->
    <circle id="ptFocus" class="pt-focus hit" cx="316.8" cy="177.6" r="22"
            tabindex="0" role="slider" aria-label="Point on the frontier"
            aria-valuemin="0" aria-valuemax="5" aria-valuenow="3"
            aria-valuetext="Food 4.0, Housing 3.0" />

    <!-- readout band -->
    <line class="sep" x1="44" y1="430" x2="396" y2="430" />
    <text id="rHint"  class="r-hint"  x="220" y="458" text-anchor="middle">Drag the point along the curve.</text>
    <text id="rTrade" class="r-trade" x="220" y="486" text-anchor="middle">Toward more housing: +1 housing costs ≈ 0.75 food</text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows the static frontier. You can also <a href="t01-ppf.svg">open the static PPF image</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('ppf');
  var pt = document.getElementById('pt');
  var hit = document.getElementById('hit');
  var ptFocus = document.getElementById('ptFocus');
  var hitCurve = document.getElementById('hitCurve');
  var dropV = document.getElementById('dropV');
  var dropH = document.getElementById('dropH');
  var qx = document.getElementById('qx');
  var qy = document.getElementById('qy');
  var rTrade = document.getElementById('rTrade');

  // pixel frame + scale (mirrors the SVG markup above).
  // X1/Y1 are the FRONTIER INTERCEPT pixels (food=5 / housing=5);
  // the drawn axis lines run past them, but the scale maps 0..5 to X0..X1.
  var R = 5;
  var X0 = 64, X1 = 380, Y0 = 360, Y1 = 56;
  var fx = function (f) { return X0 + (f / R) * (X1 - X0); };       // food  -> px x
  var hy = function (h) { return Y0 - (h / R) * (Y0 - Y1); };       // housing -> px y
  var toFood = function (px) { return ((px - X0) / (X1 - X0)) * R; };
  var toHousing = function (py) { return ((Y0 - py) / (Y0 - Y1)) * R; };

  // keep the point a hair off the singular corners so the trade-off stays finite
  var TH_MIN = 4 * Math.PI / 180;
  var TH_MAX = 86 * Math.PI / 180;

  var theta = Math.atan2(3, 4); // initial E = (Food 4, Housing 3)

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function render() {
    var food = R * Math.cos(theta);
    var housing = R * Math.sin(theta);
    var px = fx(food), py = hy(housing);

    pt.setAttribute('cx', px);  pt.setAttribute('cy', py);
    hit.setAttribute('cx', px); hit.setAttribute('cy', py);
    ptFocus.setAttribute('cx', px); ptFocus.setAttribute('cy', py);

    dropV.setAttribute('x1', px); dropV.setAttribute('x2', px);
    dropV.setAttribute('y1', Y0); dropV.setAttribute('y2', py);
    dropH.setAttribute('y1', py); dropH.setAttribute('y2', py);
    dropH.setAttribute('x1', X0); dropH.setAttribute('x2', px);

    // live quantities on the axes (ride the dropline feet)
    qx.setAttribute('x', px); qx.textContent = food.toFixed(1);
    qy.setAttribute('y', py); qy.textContent = housing.toFixed(1);

    // food given up per +1 unit of housing = |dFood/dHousing| = Housing/Food
    var tradeoff = housing / food;
    var tradeText;
    if (tradeoff >= 10) tradeText = 'very large (almost all housing)';
    else if (tradeoff <= 0.1) tradeText = 'almost nothing';
    else tradeText = '≈ ' + tradeoff.toFixed(2) + ' food';

    rTrade.textContent = 'Toward more housing: +1 housing costs ' + tradeText;

    ptFocus.setAttribute('aria-valuenow', housing.toFixed(1));
    ptFocus.setAttribute('aria-valuetext',
      'Food ' + food.toFixed(1) + ', Housing ' + housing.toFixed(1) +
      '. One more housing costs ' + tradeText);
  }

  function setFromPointer(evt) {
    var p = toSvg(evt);
    var fu = toFood(p.x), hu = toHousing(p.y);
    var t = Math.atan2(hu, fu);
    if (isNaN(t)) return;
    theta = Math.max(TH_MIN, Math.min(TH_MAX, t));
    render();
  }

  // --- drag (pointer events with pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    // route subsequent moves to the pressed element even if the pointer
    // leaves it, so pressing squarely on the dot drags reliably
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  hit.addEventListener('pointerdown', onDown);
  hitCurve.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown); // the dot itself is draggable

  // --- keyboard (arrows nudge along the curve) ---
  ptFocus.addEventListener('keydown', function (evt) {
    var step = 2 * Math.PI / 180;
    if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { theta -= step; }
    else if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { theta += step; }
    else return;
    evt.preventDefault();
    theta = Math.max(TH_MIN, Math.min(TH_MAX, theta));
    render();
  });

  render(); // sync the JS state with the static markup on load
})();
</script>
</body>
</html>
