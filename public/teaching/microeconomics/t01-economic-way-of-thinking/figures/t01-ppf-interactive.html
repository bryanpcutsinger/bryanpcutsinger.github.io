<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive production possibilities frontier: food vs. clean air</title>
<!--
  Interactive PPF for the T1 blog post (website-styled, not FAU).
  Self-contained: no libraries, no network. The static FAU figure
  (figures/t01-ppf.{tex,svg}) is the SLIDE version and is untouched.

  Same geometry as the static figure: concave Food/Clean-air frontier,
  quarter-ellipse with food-max (5,0) and clean-air-max (0,5). In DATA
  units (both goods run 0..5) the frontier is a circle of radius 5:
  food^2 + clean_air^2 = 25.

  The draggable point moves ONLY ALONG THE FRONTIER (2026-07-02 redesign):
  pointer input is projected onto the curve, so students explore the
  efficient trade-off corner to corner, reaching both axes. The INTERIOR is
  not draggable. Instead a STATIC muted point inside the frontier, labeled
  "Inefficient", carries two arrows (up = more clean air, right = more food)
  showing that an interior mix could have more of either good without
  giving up the other.

  Droplines + LIVE QUANTITIES read off the x (Food) and y (Clean air) axes.
  The axes extend past the intercepts so the frontier no longer crowds the
  arrowheads. No-JS / print: the base figure (curve, axes, efficient point
  at E, the static inefficient point + arrows, droplines, axis quantities,
  readout) is real SVG markup; the script only ATTACHES interactivity, so
  it degrades gracefully.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* frontier + headings         */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* captions / secondary labels */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass — the draggable point */
    --accent-tint: #efe4d2;/* feasible-region wash        */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 defeats the flexbox min-width:auto default so the figure
     scales DOWN to narrow viewports instead of clipping the right side. */
  .ppf { width: 100%; max-width: 560px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .frontier  { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .feasible  { fill: var(--accent-tint); opacity: 0.5; stroke: none; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }

  /* static inefficient interior point + escape arrows (not interactive) */
  .ineff-pt    { fill: var(--muted); }
  .ineff-arrow { stroke: var(--muted); stroke-width: 1.8; }
  .ineff-label { fill: var(--muted); font-size: 12.5px; font-style: italic; }

  /* draggable point + generous transparent hit targets */
  .pt        { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 26;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axlabel { fill: var(--muted); font-size: 15px; font-weight: 600; }
  .maxlabel{ fill: var(--muted); font-size: 11.5px; }
  .qlabel  { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .r-hint  { fill: var(--muted); font-size: 12.5px; }
  .r-trade { fill: var(--accent); font-size: 14px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="ppf">
  <!-- viewBox 440 x 540. Plot occupies the top; readout band below.
       Pixel frame: origin (64,360). Frontier intercepts: Food 5 -> x=380,
       Clean air 5 -> y=56. Axes extend PAST the intercepts (x to 415, y to 28)
       so the curve no longer crowds the arrowheads. -->
  <svg id="ppf" viewBox="0 0 440 540" role="group"
       aria-label="Production possibilities frontier for food and clean air. Drag the point along the frontier to explore the trade-off. A fixed point inside the frontier marks an inefficient mix, with arrows showing that more of either good is possible without giving up the other.">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- feasible set (interior) — decorative only, NOT a drag target -->
    <path id="feasible" class="feasible" d="M64,360 L64,56 A316,304 0 0 1 380,360 Z" />

    <!-- axes (drawn before frontier so the curve sits on top); extend past intercepts -->
    <line class="axis" x1="64" y1="360" x2="415" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="28"  marker-end="url(#arrow)" />

    <!-- the concave frontier: clean-air-max (0,5)=(64,56) to food-max (5,0)=(380,360) -->
    <path class="frontier" d="M64,56 A316,304 0 0 1 380,360" />

    <!-- axis + corner labels (max-labels held clear of the axis ends so they
         never collide with the live point / quantity readouts) -->
    <text class="axlabel" x="222" y="392" text-anchor="middle">Food</text>
    <text class="axlabel" x="24" y="208" text-anchor="middle"
          transform="rotate(-90 24 208)">Clean air</text>
    <text class="maxlabel" x="80" y="42" text-anchor="start">Maximum clean air</text>
    <text class="maxlabel" x="379" y="400" text-anchor="middle">Maximum food</text>

    <!-- STATIC inefficient interior point (data Food 2, Clean air 1.5) with
         escape arrows: up = more clean air, right = more food, either one
         free of any give-up while inside the frontier. Not interactive. -->
    <circle class="ineff-pt" cx="190.4" cy="268.8" r="5.5" />
    <line class="ineff-arrow" x1="190.4" y1="257.8" x2="190.4" y2="213" marker-end="url(#arrow)" />
    <line class="ineff-arrow" x1="201.4" y1="268.8" x2="246" y2="268.8" marker-end="url(#arrow)" />
    <text class="ineff-label" x="190.4" y="291" text-anchor="middle">Inefficient</text>

    <!-- droplines (initial: point E = Food 4, Clean air 3 -> px 316.8,177.6) -->
    <line id="dropV" class="drop" x1="316.8" y1="360" x2="316.8" y2="177.6" />
    <line id="dropH" class="drop" x1="64" y1="177.6" x2="316.8" y2="177.6" />

    <!-- live quantities read off the axes (ride the dropline feet) -->
    <text id="qx" class="qlabel" x="316.8" y="376" text-anchor="middle">4.0</text>
    <text id="qy" class="qlabel" x="54" y="177.6" text-anchor="end"
          dominant-baseline="middle">3.0</text>

    <!-- the draggable point + hit targets -->
    <path id="hitCurve" class="hit-curve" d="M64,56 A316,304 0 0 1 380,360" />
    <circle id="hit" class="hit" cx="316.8" cy="177.6" r="22" />
    <circle id="pt"  class="pt"  cx="316.8" cy="177.6" r="7" />
    <!-- focusable proxy for keyboard control -->
    <circle id="ptFocus" class="pt-focus hit" cx="316.8" cy="177.6" r="22"
            tabindex="0" role="slider" aria-label="Point in the production set"
            aria-valuemin="0" aria-valuemax="5" aria-valuenow="4"
            aria-valuetext="Food 4.0, clean air 3.0. Producing efficiently: one more food costs about 1.33 clean air." />

    <!-- readout band -->
    <line class="sep" x1="44" y1="430" x2="396" y2="430" />
    <text id="rHint"  class="r-hint"  x="220" y="458" text-anchor="middle">On the frontier: producing efficiently.</text>
    <text id="rTrade" class="r-trade" x="220" y="486" text-anchor="middle">+1 food costs ≈ 1.33 clean air</text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: the frontier with an efficient point on it, and an inefficient point inside it whose arrows show that more of either good is possible without giving up the other. You can also <a href="t01-ppf.svg">open the static PPF image</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('ppf');
  var pt = document.getElementById('pt');
  var hit = document.getElementById('hit');
  var ptFocus = document.getElementById('ptFocus');
  var hitCurve = document.getElementById('hitCurve');
  var dropV = document.getElementById('dropV');
  var dropH = document.getElementById('dropH');
  var qx = document.getElementById('qx');
  var qy = document.getElementById('qy');
  var rHint = document.getElementById('rHint');
  var rTrade = document.getElementById('rTrade');

  // pixel frame + scale (mirrors the SVG markup above).
  // X1/Y1 are the FRONTIER INTERCEPT pixels (food=5 / clean-air=5);
  // the drawn axis lines run past them, but the scale maps 0..5 to X0..X1.
  var R = 5;
  var X0 = 64, X1 = 380, Y0 = 360, Y1 = 56;
  var fx = function (f) { return X0 + (f / R) * (X1 - X0); };       // food      -> px x
  var ay = function (a) { return Y0 - (a / R) * (Y0 - Y1); };       // clean air -> px y
  var toFood = function (px) { return ((px - X0) / (X1 - X0)) * R; };
  var toAir  = function (py) { return ((Y0 - py) / (Y0 - Y1)) * R; };

  // Endpoint epsilon: below this a good is treated as exactly zero, so the
  // corners say "All food, no clean air" instead of dividing by ~0.
  var EP = 0.06;

  // State: the point's coordinates in DATA units. The point lives ON the
  // frontier only (food^2 + air^2 = 25); all input is projected onto it.
  var food = 4, air = 3; // initial efficient point E = (Food 4, Clean air 3)

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // clean air given up per +1 food, phrased for the readout
  function costPhrase(cost) {
    if (cost >= 10)  return 'a large amount of clean air';
    if (cost <= 0.1) return 'very little clean air';
    return '≈ ' + cost.toFixed(2) + ' clean air';
  }

  function render() {
    var px = fx(food), py = ay(air);

    pt.setAttribute('cx', px);  pt.setAttribute('cy', py);
    hit.setAttribute('cx', px); hit.setAttribute('cy', py);
    ptFocus.setAttribute('cx', px); ptFocus.setAttribute('cy', py);

    dropV.setAttribute('x1', px); dropV.setAttribute('x2', px);
    dropV.setAttribute('y1', Y0); dropV.setAttribute('y2', py);
    dropH.setAttribute('y1', py); dropH.setAttribute('y2', py);
    dropH.setAttribute('x1', X0); dropH.setAttribute('x2', px);

    // live quantities on the axes (ride the dropline feet)
    qx.setAttribute('x', px); qx.textContent = food.toFixed(1);
    qy.setAttribute('y', py); qy.textContent = air.toFixed(1);

    // the point is always ON the frontier (efficient); only the corners differ
    var hint, trade, aria;
    if (air < EP) {
      // all-food corner
      hint  = 'On the frontier: producing efficiently.';
      trade = 'All food, no clean air.';
      aria  = 'Food ' + food.toFixed(1) + ', no clean air. Producing efficiently ' +
              'at the all-food corner.';
    } else if (food < EP) {
      // all-clean-air corner
      hint  = 'On the frontier: producing efficiently.';
      trade = 'All clean air, no food.';
      aria  = 'No food, clean air ' + air.toFixed(1) + '. Producing efficiently ' +
              'at the all-clean-air corner.';
    } else {
      // ON the frontier — efficient. Getting +1 food REQUIRES giving up clean
      // air. Slope of food^2 + air^2 = 25 is d(air)/d(food) = -food/air, so the
      // opportunity cost of one more food is food/air units of clean air.
      var phrase = costPhrase(food / air);
      hint  = 'On the frontier: more food costs clean air.';
      trade = '+1 food costs ' + phrase;
      aria  = 'Food ' + food.toFixed(1) + ', clean air ' + air.toFixed(1) +
              '. Producing efficiently: one more food costs ' + phrase + '.';
    }

    rHint.textContent = hint;
    rTrade.textContent = trade;
    ptFocus.setAttribute('aria-valuenow', food.toFixed(1));
    ptFocus.setAttribute('aria-valuetext', aria);
  }

  function setFromPointer(evt) {
    var p = toSvg(evt);
    var f = toFood(p.x), a = toAir(p.y);
    if (isNaN(f) || isNaN(a)) return;
    // clamp into the first quadrant (food>=0, clean-air>=0)
    if (f < 0) f = 0;
    if (a < 0) a = 0;
    // PROJECT onto the frontier from either side: scale the pointer's ray
    // onto the radius-5 circle, so the point only ever travels the curve.
    // Guard the origin (r ~ 0 has no direction): fall back to the arc's
    // midpoint instead of dividing by zero.
    var r = Math.sqrt(f * f + a * a);
    if (r < 0.01) { f = R * Math.SQRT1_2; a = R * Math.SQRT1_2; }
    else { f = f * R / r; a = a * R / r; }
    food = f; air = a;
    render();
  }

  // --- drag (pointer events with pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    // route subsequent moves to the pressed element even if the pointer
    // leaves it, so pressing squarely on the dot drags reliably
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  hit.addEventListener('pointerdown', onDown);
  hitCurve.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);  // the dot itself is draggable
  // (no interior drag target: the point moves only along the frontier)

  // --- keyboard (arrows nudge the point ALONG the frontier) ---
  // Right/Down move toward the all-food corner (point travels right and
  // down the curve); Left/Up move toward the all-clean-air corner.
  ptFocus.addEventListener('keydown', function (evt) {
    var step = 2 * Math.PI / 180;
    var theta = Math.atan2(air, food); // the point's angle on the frontier
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowDown') { theta -= step; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowUp') { theta += step; }
    else return;
    evt.preventDefault();
    // clamp to the quarter arc so the point reaches, but does not pass, each axis
    theta = Math.max(0, Math.min(Math.PI / 2, theta));
    food = R * Math.cos(theta);
    air = R * Math.sin(theta);
    render();
  });

  render(); // sync the JS state with the static markup on load
})();
</script>
</body>
</html>
