<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive wealth vs substitution effect: which force wins decides whether the owner consumes more or less</title>
<!--
  Interactive wealth-vs-substitution figure for the t03b (elasticity &
  applications) blog post. REDRAW of E&P Fig 2-11 (p.35), REDESIGNED 2026-07-26
  per instructor direction: two scenario buttons, one per winner.
    - "Wealth effect wins":        the owner holds a lot of the good, so the
      price rise P1 -> P2 makes her much richer and demand shifts FAR right
      (D1 -> D2). At the higher price she consumes MORE: Q2 > Q1. (This is
      E&P Fig 2-11's own case.)
    - "Substitution effect wins":  the same price rise, but the wealth gain is
      small, so demand shifts right only a LITTLE. The substitution effect
      dominates and she consumes LESS: Q2 < Q1.
  Each state is a COMPLETE picture (both curves, both observed points); the
  buttons switch scenarios, not before/after. Both D1 and D2 slope down in both
  states: what looks like an exception to the law of demand is a shift of
  demand. ABSOLUTE LOCK: no preference-map apparatus, no budget line, no
  surplus shading -- only demand curves, dots, droplines.

  LAYOUT FIX (2026-07-26): the previous build put the toggle buttons in an HTML
  bar ABOVE a square SVG, so buttons + plot overflowed the square iframe and the
  frame scrolled internally (same failure the shifts figure had). Everything --
  buttons, plot, readout -- now lives INSIDE one 440x540 SVG, so the figure
  scales as a unit and can never overflow its frame. Frame matches the section
  standard (4/5 aspect, max-width 520px, like ue8-1 / ue8-2 / the fan).

  Website-styled (warm-editorial palette), NOT the FAU slide palette.

  GEOMETRY (single-panel, viewBox 440x540, aspect 4/5):
    Data space: Quantity 0..10 on x, Price 0..10 on y.
      px(Q) = 64 + 33*Q      py(P) = 396 - 30*P
    D1 (wealth low):  P = 8 - Q   from (64,156) to Q=7.75 (319.75, 388.5)
    State A (wealth wins)        D2: P = 12 - Q, drawn Q=2.2..9.9
      P1=4 -> Q1=4 on D1 (196,276);  P2=6 -> Q2=6 on D2 (262,216).  Q2 > Q1.
    State B (substitution wins)  D2: P = 9 - Q, drawn Q=0..7.5
      P1=4 -> Q1=4 on D1 (196,276);  P2=6 -> Q2=3 on D2 (163,216).  Q2 < Q1.
    Labels use E&P 2-11's own notation: D1, D2, P1, P2, Q1, Q2 (quantities as
    Q per the course-wide 2026-07-26 relabel ruling).
-->
<style>
  :root {
    --surface: #f7f4ef;    /* warm bone background            */
    --ink:     #1a1c1e;     /* primary curve                   */
    --text:    #16181a;     /* body text                       */
    --muted:   #5c6066;     /* axes / captions                 */
    --hairline:#e3ddd3;     /* droplines / button borders      */
    --accent:  #b07a2c;     /* brass -- after-point / D2 / takeaway */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 520px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* in-SVG scenario buttons: visible rect + label are inert; the transparent
     hit rect drawn on top of them carries pointer + keyboard interaction */
  .btn      { fill: var(--surface); stroke: var(--hairline); stroke-width: 1.5;
              pointer-events: none; }
  .btn.on   { fill: var(--accent); stroke: var(--accent); }
  .btnlabel { fill: var(--ink); font-size: 13px; font-weight: 600;
              pointer-events: none; }
  .btnlabel.on { fill: var(--surface); }
  .btnfocus { cursor: pointer; }
  .btnfocus:focus-visible { outline: 2px solid var(--accent);
              outline-offset: 2px; }

  /* structural strokes */
  .axis   { stroke: var(--muted); stroke-width: 1.4; }
  .curve  { stroke: var(--ink); stroke-width: 2.6; fill: none;
            stroke-linecap: round; }
  .curve2 { stroke: var(--accent); stroke-width: 2.6; fill: none;
            stroke-linecap: round; }
  .drop   { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .pline  { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }

  /* points */
  .pt-start { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .pt       { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }

  /* toggled groups */
  .hidden { display: none; }

  /* text */
  .stitle   { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .axlabel  { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .tick     { fill: var(--muted); font-size: 12px; font-weight: 700; }
  .tick-acc { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .curvetag { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .curvetag-acc { fill: var(--accent); font-size: 12.5px; font-weight: 700; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted); font-size: 12.5px; }
  .r-trade  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <!-- Everything below is REAL base SVG: a no-JS reader sees the complete
       "wealth effect wins" scenario (E&P Fig 2-11's own case) -- both curves,
       both observed points, all labels -- plus the two scenario buttons and
       the readout. The script only ATTACHES the button toggle. -->
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="Two demand curves for a good the buyer owns, both sloping down. A price rise from P one to P two shifts demand right from D one to D two, because the higher price raises the owner's wealth. Two buttons choose the scenario. When the wealth effect is bigger than the substitution effect the shift is large and quantity rises from Q one to a larger Q two. When the substitution effect is bigger the shift is small and quantity falls from Q one to a smaller Q two. In both scenarios both curves slope down: this is a shift of demand, not an upward-sloping demand curve.">
    <defs>
      <marker id="axArw" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- ===== scenario buttons (inside the SVG so the figure cannot overflow).
         PAINT ORDER MATTERS: the transparent hit rects carry the listeners and
         must be drawn LAST (on top), or the visible rects swallow the clicks. -->
    <text class="stitle" x="220" y="22" text-anchor="middle">Which effect is bigger?</text>
    <rect id="btnA" class="btn on" x="30" y="32" width="186" height="32" rx="6" />
    <text id="btnALbl" class="btnlabel on" x="123" y="53" text-anchor="middle">Wealth effect wins</text>
    <rect id="btnAHit" class="btnfocus" x="30" y="32" width="186" height="32" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="true"
          aria-label="Wealth effect wins: the owner consumes more at the higher price" />
    <rect id="btnB" class="btn" x="224" y="32" width="186" height="32" rx="6" />
    <text id="btnBLbl" class="btnlabel" x="317" y="53" text-anchor="middle">Substitution effect wins</text>
    <rect id="btnBHit" class="btnfocus" x="224" y="32" width="186" height="32" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Substitution effect wins: the owner consumes less at the higher price" />

    <!-- ===== axes ===== -->
    <line class="axis" x1="64" y1="396" x2="412" y2="396" marker-end="url(#axArw)" />
    <line class="axis" x1="64" y1="396" x2="64"  y2="84"  marker-end="url(#axArw)" />
    <text class="axlabel" x="14" y="240" text-anchor="middle"
          transform="rotate(-90 14 240)">Price</text>
    <text class="axlabel" x="229" y="428" text-anchor="middle">Quantity the owner consumes</text>

    <!-- ===== D1, the low-wealth curve (shared by both scenarios) ===== -->
    <path class="curve" d="M64,156 L319.75,388.5" />
    <text class="curvetag" x="326" y="384" text-anchor="start">D&#8321;</text>

    <!-- ===== before point (P1, Q1) on D1 (shared) ===== -->
    <line class="pline" x1="64"  y1="276" x2="196" y2="276" />
    <line class="drop"  x1="196" y1="276" x2="196" y2="396" />
    <text class="tick" x="58"  y="280" text-anchor="end">P&#8321;</text>
    <text class="tick" x="196" y="412" text-anchor="middle">Q&#8321;</text>

    <!-- ===== scenario A: wealth effect wins (D2 far right; Q2 > Q1) ===== -->
    <g id="gA">
      <path class="curve2" d="M136.6,102 L390.7,333" />
      <text class="curvetag-acc" x="142" y="96" text-anchor="start">D&#8322;</text>
      <line class="pline" x1="64"  y1="216" x2="262" y2="216" />
      <line class="drop"  x1="262" y1="216" x2="262" y2="396" />
      <text class="tick-acc" x="58"  y="220" text-anchor="end">P&#8322;</text>
      <text class="tick-acc" x="262" y="412" text-anchor="middle">Q&#8322;</text>
      <circle class="pt" cx="262" cy="216" r="6" />
    </g>

    <!-- ===== scenario B: substitution effect wins (D2 barely right; Q2 < Q1) ===== -->
    <g id="gB" class="hidden">
      <path class="curve2" d="M64,126 L311.5,351" />
      <text class="curvetag-acc" x="317" y="346" text-anchor="start">D&#8322;</text>
      <line class="pline" x1="64"  y1="216" x2="163" y2="216" />
      <line class="drop"  x1="163" y1="216" x2="163" y2="396" />
      <text class="tick-acc" x="58"  y="220" text-anchor="end">P&#8322;</text>
      <text class="tick-acc" x="163" y="412" text-anchor="middle">Q&#8322;</text>
      <circle class="pt" cx="163" cy="216" r="6" />
    </g>

    <!-- before point drawn over the scenario groups -->
    <circle class="pt-start" cx="196" cy="276" r="5.5" />

    <!-- ===== readout band ===== -->
    <line class="sep" x1="44" y1="444" x2="396" y2="444" />
    <text id="rHint" class="r-hint" text-anchor="middle">
      <tspan x="220" y="462">The price rises P&#8321; &#8594; P&#8322;. She owns a lot, so the</tspan>
      <tspan x="220" y="478">higher price makes her much richer: demand shifts far right.</tspan>
    </text>
    <text id="rTrade" class="r-trade" text-anchor="middle">
      <tspan x="220" y="502">Wealth effect &gt; substitution effect: at the higher</tspan>
      <tspan x="220" y="518">price she consumes more (Q&#8322; &gt; Q&#8321;).</tspan>
    </text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows one scenario only:
      the wealth effect winning. The price rise shifts the owner's demand curve
      far right, so she consumes more at the higher price. In the other scenario
      the shift is small and the substitution effect wins, so she consumes less.
      The static image
      <a href="t03b-ep2-11-endowment-effect.svg">t03b-ep2-11-endowment-effect.svg</a>
      shows the wealth-effect-wins case.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var gA = document.getElementById('gA');
  var gB = document.getElementById('gB');
  var btnA = document.getElementById('btnA'), btnAHit = document.getElementById('btnAHit'),
      btnALbl = document.getElementById('btnALbl');
  var btnB = document.getElementById('btnB'), btnBHit = document.getElementById('btnBHit'),
      btnBLbl = document.getElementById('btnBLbl');
  var rHint = document.getElementById('rHint');
  var rTrade = document.getElementById('rTrade');
  var NS = 'http://www.w3.org/2000/svg';

  var STATE = {
    A: { hint:  ['The price rises P₁ → P₂. She owns a lot, so the',
                 'higher price makes her much richer: demand shifts far right.'],
         trade: ['Wealth effect > substitution effect: at the higher',
                 'price she consumes more (Q₂ > Q₁).'] },
    B: { hint:  ['The same price rise P₁ → P₂, but now the wealth gain',
                 'is small: demand shifts right only a little.'],
         trade: ['Substitution effect > wealth effect: she consumes less',
                 '(Q₂ < Q₁). Both curves still slope down.'] }
  };

  var isB = false; // default = wealth effect wins (E&P Fig 2-11's case)

  function setLines(el, lines, y0, dy) {
    while (el.firstChild) el.removeChild(el.firstChild);
    for (var i = 0; i < lines.length; i++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', 220);
      t.setAttribute('y', y0 + i * dy);
      t.textContent = lines[i];
      el.appendChild(t);
    }
  }

  function render() {
    var s = isB ? STATE.B : STATE.A;
    gA.classList.toggle('hidden', isB);
    gB.classList.toggle('hidden', !isB);
    btnA.classList.toggle('on', !isB);  btnALbl.classList.toggle('on', !isB);
    btnB.classList.toggle('on', isB);   btnBLbl.classList.toggle('on', isB);
    btnAHit.setAttribute('aria-pressed', isB ? 'false' : 'true');
    btnBHit.setAttribute('aria-pressed', isB ? 'true' : 'false');
    setLines(rHint, s.hint, 462, 16);
    setLines(rTrade, s.trade, 502, 16);
  }

  function setState(b) { isB = !!b; render(); }

  btnAHit.addEventListener('click', function () { setState(false); });
  btnBHit.addEventListener('click', function () { setState(true); });
  function keyHandler(evt) {
    if (evt.key === 'Enter' || evt.key === ' ') {
      setState(evt.currentTarget === btnBHit);
    } else if (evt.key === 'ArrowRight' || evt.key === 'ArrowDown') { setState(true); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowUp') { setState(false); }
    else return;
    evt.preventDefault();
  }
  btnAHit.addEventListener('keydown', keyHandler);
  btnBHit.addEventListener('keydown', keyHandler);

  // Debug hook: lets a reviewer screenshot either scenario via scripting.
  // Accepts 0/'wealth'/'A' or 1/'substitution'/'B'.
  window.__fig = {
    set: function (v) {
      setState(v === 1 || v === '1' || v === true ||
               v === 'substitution' || v === 'B' || v === 'b');
    },
    get: function () {
      return isB
        ? { state: 'substitution-wins', q1: 4, q2: 3, p1: 4, p2: 6 }
        : { state: 'wealth-wins',       q1: 4, q2: 6, p1: 4, p2: 6 };
    }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
