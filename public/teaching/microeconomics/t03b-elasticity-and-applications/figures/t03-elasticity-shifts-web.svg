<?xml version="1.0" encoding="UTF-8"?>
<!--
  Static two-panel shifts figure for the t03b blog post (website-styled, NOT FAU).
  HAND-AUTHORED web-native SVG, replacing the palette-remapped LaTeX render
  (instructor 2026-07-26: inline statics must share the widgets' FULL theme -
  typography, stroke weights, background - not just the color palette; exemplar
  t01-ppf-growth.svg). The FAU LaTeX build t03-elasticity-shifts.svg remains the
  slide asset; the \WEBPALETTE web build in the .tex is retired by this file.

  Content is element-for-element the instructor-ratified UE Fig 8.4A/B rebuild
  (same data as the .tex):
    Panel A - supply changes, demand unchanged: one demand line P = 10 - Q
      crossed by three vertical supply lines (low/moderate/high gas stocks at
      Q = 3/5/7 -> prices 7/5/3; subscripts name the STOCKS scenario, so P_low
      = the high price under low stocks); dotted price lines; dashed accent
      arrows alongside the unchanged demand line (the price slides along it).
    Panel B - demand changes, supply unchanged: one vertical supply line at
      Q = 5 crossed by Demand_lower (P = 8 - Q -> P_low = 3) and Demand_higher
      (P = 12 - Q -> P_high = 7); accent arrows for the price jump and the
      rightward shift of the whole line.

  Self-contained: no JS, no network, no external fonts (system sans stack).
  Pixel frame per panel (panel B in a translate(400,0) group, same locals):
    px(Q) = 70 + 27*Q ; py(P) = 380 - 27*P ; origin (70,380).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img"
     aria-label="Two panels. Left: supply changes with demand unchanged. One straight demand line is crossed by three vertical supply lines for low, moderate, and high gas stocks; dotted price lines show the price highest under low stocks and lowest under high stocks, and dashed arrows run alongside the one unchanged demand line. Right: demand changes with supply unchanged. One vertical supply line is crossed by a lower and a higher demand line, and the price jumps from the lower crossing to the higher one at the same quantity.">
  <style>
    .surface { fill: #f7f4ef; }
    .axis    { stroke: #5c6066; stroke-width: 1.4; fill: none; }
    .curve   { stroke: #1a1c1e; stroke-width: 2.6; fill: none; stroke-linecap: round; }
    .supply  { stroke: #5c6066; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    .drop    { stroke: #5c6066; stroke-width: 1.2; fill: none; stroke-dasharray: 2 3; }
    .slide   { stroke: #b07a2c; stroke-width: 2; fill: none; stroke-linecap: round;
               stroke-dasharray: 6 5; }
    .jump    { stroke: #b07a2c; stroke-width: 2.4; fill: none; stroke-linecap: round; }
    .dot     { fill: #b07a2c; stroke: #f7f4ef; stroke-width: 1.5; }
    .ptitle  { fill: #1a1c1e; font-size: 14px; font-weight: 700;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .psub    { fill: #5c6066; font-size: 11.5px; font-weight: 400;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .axlabel { fill: #5c6066; font-size: 13px; font-weight: 600;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .slabel  { fill: #5c6066; font-size: 10.5px; font-weight: 600;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .plabel  { fill: #5c6066; font-size: 12px; font-weight: 600;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .clabel  { fill: #1a1c1e; font-size: 13px; font-weight: 700;
               font-family: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                            'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .subsc   { font-size: 8.5px; }
  </style>

  <defs>
    <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="6" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="6.5" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b07a2c" />
    </marker>
  </defs>

  <!-- warm bone background (matches the interactive widgets) -->
  <rect class="surface" x="0" y="0" width="800" height="440" />

  <!-- ================= PANEL A: supply changes, demand unchanged ================= -->
  <g>
    <text class="ptitle" x="220" y="30" text-anchor="middle">Supply changes, demand unchanged</text>
    <text class="psub"   x="220" y="48" text-anchor="middle">the price slides along one demand line</text>

    <!-- three vertical supply lines (low / moderate / high gas stocks) -->
    <line class="supply" x1="151" y1="380" x2="151" y2="136" />
    <line class="supply" x1="205" y1="380" x2="205" y2="136" />
    <line class="supply" x1="259" y1="380" x2="259" y2="136" />
    <text class="slabel" x="151" y="114" text-anchor="middle">Low gas</text>
    <text class="slabel" x="151" y="127" text-anchor="middle">stocks</text>
    <text class="slabel" x="205" y="114" text-anchor="middle">Moderate</text>
    <text class="slabel" x="205" y="127" text-anchor="middle">gas stocks</text>
    <text class="slabel" x="259" y="114" text-anchor="middle">High gas</text>
    <text class="slabel" x="259" y="127" text-anchor="middle">stocks</text>

    <!-- dotted price lines to the three crossings: P(low)=7, P(mod)=5, P(high)=3 -->
    <line class="drop" x1="70" y1="191" x2="151" y2="191" />
    <line class="drop" x1="70" y1="245" x2="205" y2="245" />
    <line class="drop" x1="70" y1="299" x2="259" y2="299" />
    <text class="plabel" x="64" y="195" text-anchor="end">P<tspan class="subsc" dy="3">low</tspan></text>
    <text class="plabel" x="64" y="249" text-anchor="end">P<tspan class="subsc" dy="3">mod</tspan></text>
    <text class="plabel" x="64" y="303" text-anchor="end">P<tspan class="subsc" dy="3">high</tspan></text>

    <!-- axes -->
    <line class="axis" x1="70" y1="380" x2="370" y2="380" marker-end="url(#arrowMuted)" />
    <line class="axis" x1="70" y1="380" x2="70"  y2="96"  marker-end="url(#arrowMuted)" />

    <!-- the ONE unchanged demand line: P = 10 - Q, from (0,10) to (9.7,0.3) -->
    <line class="curve" x1="70" y1="110" x2="332" y2="372" />
    <text class="clabel" x="338" y="366" text-anchor="start">Demand</text>

    <!-- dashed accent arrows ALONGSIDE the demand line (both directions):
         the buyer slides along one unchanged curve; offset so they never
         sit on the line itself -->
    <line class="slide" x1="224" y1="280" x2="143" y2="199" marker-end="url(#arrowAccent)" />
    <line class="slide" x1="154" y1="226" x2="235" y2="307" marker-end="url(#arrowAccent)" />

    <!-- accent dots at the three crossings -->
    <circle class="dot" cx="151" cy="191" r="4" />
    <circle class="dot" cx="205" cy="245" r="4" />
    <circle class="dot" cx="259" cy="299" r="4" />

    <!-- axis labels (course-wide standard: sentence case; vertical rotated) -->
    <text class="axlabel" x="220" y="412" text-anchor="middle">Weekly gallons of gasoline demanded</text>
    <text class="axlabel" x="30" y="238" text-anchor="middle"
          transform="rotate(-90 30 238)">Price per gallon of gasoline</text>
  </g>

  <!-- ================= PANEL B: demand changes, supply unchanged ================= -->
  <g transform="translate(400,0)">
    <text class="ptitle" x="220" y="30" text-anchor="middle">Demand changes, supply unchanged</text>
    <text class="psub"   x="220" y="48" text-anchor="middle">the price jumps to a new demand line</text>

    <!-- one vertical supply line (unchanged gas stocks at Q = 5) -->
    <line class="supply" x1="205" y1="380" x2="205" y2="136" />
    <text class="slabel" x="205" y="114" text-anchor="middle">Unchanged</text>
    <text class="slabel" x="205" y="127" text-anchor="middle">gas stocks</text>

    <!-- dotted price lines to the two crossings: P(high)=7 on D_higher, P(low)=3 on D_lower -->
    <line class="drop" x1="70" y1="191" x2="205" y2="191" />
    <line class="drop" x1="70" y1="299" x2="205" y2="299" />
    <text class="plabel" x="64" y="195" text-anchor="end">P<tspan class="subsc" dy="3">high</tspan></text>
    <text class="plabel" x="64" y="303" text-anchor="end">P<tspan class="subsc" dy="3">low</tspan></text>

    <!-- axes -->
    <line class="axis" x1="70" y1="380" x2="370" y2="380" marker-end="url(#arrowMuted)" />
    <line class="axis" x1="70" y1="380" x2="70"  y2="96"  marker-end="url(#arrowMuted)" />

    <!-- the two demand lines: D_lower P = 8 - Q ; D_higher P = 12 - Q -->
    <line class="curve" x1="70"  y1="164" x2="278" y2="372" />
    <line class="curve" x1="124" y1="110" x2="332" y2="318" />
    <text class="clabel" x="284" y="366" text-anchor="start">Demand<tspan class="subsc" dy="3">lower</tspan></text>
    <text class="clabel" x="332" y="338" text-anchor="end">Demand<tspan class="subsc" dy="3">higher</tspan></text>

    <!-- accent arrows: the price jumps up at the unchanged quantity, and the
         whole demand line shifts right (arrows clear of every line) -->
    <line class="jump" x1="86" y1="295" x2="86" y2="201" marker-end="url(#arrowAccent)" />
    <line class="jump" x1="84" y1="170" x2="176" y2="170" marker-end="url(#arrowAccent)" />
    <line class="jump" x1="213" y1="280" x2="286" y2="280" marker-end="url(#arrowAccent)" />

    <!-- accent dots at the two crossings -->
    <circle class="dot" cx="205" cy="299" r="4" />
    <circle class="dot" cx="205" cy="191" r="4" />

    <!-- axis labels -->
    <text class="axlabel" x="220" y="412" text-anchor="middle">Weekly gallons of gasoline demanded</text>
    <text class="axlabel" x="30" y="238" text-anchor="middle"
          transform="rotate(-90 30 238)">Price per gallon of gasoline</text>
  </g>
</svg>
