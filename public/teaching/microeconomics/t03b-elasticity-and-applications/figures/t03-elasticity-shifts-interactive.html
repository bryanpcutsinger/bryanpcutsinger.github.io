<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: a price change from a supply shift versus a demand shift</title>
<!--
  Interactive recreation of UE Fig 8.4A/B (p.115-116) for the T3b blog post
  (website-styled warm palette, not FAU). Self-contained: no libraries, no
  network. The static FAU figure (figures/t03-elasticity-shifts.{tex,svg}) is
  the SLIDE version and is untouched; it is also this widget's <noscript>
  fallback.

  ARCHITECTURE: the base figure is REAL SVG markup. A no-JS reader sees the
  FULL two-panel still — both panels complete with every curve, point, axis,
  price line, arrow and label the UE source teaches. The script only ATTACHES
  behavior (the Supply|Demand mode toggle, the along-curve drag, the
  Lower<->Higher demand toggle, dimming of the inactive panel, live readouts);
  it never builds figure DOM.

  GEOMETRY (family F2, two-panel side-by-side): viewBox 720 x 460,
  aspect-ratio 16/10, max-width 640px. Data Q 0..10 on x, P 0..10 on y.
    Panel A frame: x = 70 + Q*25 (Q=10 -> 320); y = 350 - P*28 (P=10 -> 70).
    Panel B frame: x = 410 + Q*25 (Q=10 -> 660); same y.
  Axes are drawn PAST the data max so the curves do not crowd the arrowheads.
    Demand curve A (fixed):        P = 24 / (Q + 1)
    Panel B demand_lower (before): P = 24 / (Q + 1)
    Panel B demand_higher (after): P = 33 / (Q + 1)
  Stock verticals (perfectly inelastic supply) at Q = 2.2 (Low), 5.0 (Moderate),
  7.8 (High) in A; one "Unchanged" stock at Q = 5.0 in B.
  Price-subscript convention follows the SOURCE: subscript = the stock
  condition, so P_Low (Low stocks, small Q) is the HIGH price at the top,
  P_High (High stocks, large Q) is the LOW price at the bottom.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* primary curves + headings   */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* captions / secondary labels */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass — active point/arrows */
    --accent-tint: #efe4d2;/* active-panel wash           */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 640px; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* mode toggle (above the panels) */
  .modebar { display: flex; align-items: center; gap: 8px;
             margin: 0 0 8px; flex-wrap: wrap; }
  .modelabel { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg { font-family: inherit; font-size: 13px; font-weight: 600;
         color: var(--ink); background: var(--surface);
         border: 1.5px solid var(--hairline); border-radius: 6px;
         padding: 5px 14px; cursor: pointer; }
  .seg + .seg { margin-left: -1px; }
  .seg.on { background: var(--accent); color: var(--surface);
            border-color: var(--accent); }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .curve     { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .curve-ghost { stroke: var(--muted); stroke-width: 2; fill: none;
               stroke-dasharray: 6 5; opacity: 0.75; }
  .supply-line { stroke: var(--ink); stroke-width: 2; }
  .panel-wash  { fill: var(--accent-tint); opacity: 0; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }
  .priceline { stroke: var(--muted); stroke-width: 1.2;
               stroke-dasharray: 2 3; }

  /* arrows */
  .slide  { stroke: var(--muted); stroke-width: 1.6; fill: none;
            stroke-dasharray: 5 4; }
  .arrowA { stroke: var(--accent); stroke-width: 2.4; fill: none; }
  .shift  { stroke: var(--accent); stroke-width: 2; }
  .uparrow{ stroke: var(--accent); stroke-width: 2.2; }

  /* points + hit targets */
  .ctx-pt { fill: var(--muted); }
  .pt     { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 26;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* dimmed (inactive) panel */
  .panel { transition: opacity 0.15s ease; }
  .panel.dim { opacity: 0.28; }
  .panel.dim .hit, .panel.dim .hit-curve { pointer-events: none; }

  /* text */
  .panelhead { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .axlabel   { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .stocklabel{ fill: var(--muted); font-size: 10px; }
  .curvelabel{ fill: var(--muted); font-size: 10.5px; font-style: italic; }
  .plabel    { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .sub       { font-size: 8.5px; }
  .qlabel    { fill: var(--ink); font-size: 12px; font-weight: 700;
               paint-order: stroke; stroke: var(--surface); stroke-width: 3px;
               stroke-linejoin: round; }
  .sep       { stroke: var(--hairline); stroke-width: 1; }
  .r-hint    { fill: var(--muted); font-size: 12.5px; }
  .r-trade   { fill: var(--accent); font-size: 14px; font-weight: 600; }
  .fallback  { margin: 8px 0 0; color: var(--muted); font-size: 13px;
               line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <div class="modebar" role="group" aria-label="Choose what changed">
    <span class="modelabel">What changed?</span>
    <button id="btnSupply" class="seg on" type="button" aria-pressed="true">Supply</button>
    <button id="btnDemand" class="seg" type="button" aria-pressed="false">Demand</button>
  </div>

  <svg id="fig" viewBox="0 0 720 460" role="group"
       aria-label="Two panels. Left: supply shifts while one demand curve stays fixed, so the price slides ALONG that demand curve and elasticity applies. Right: the whole demand curve shifts while supply is unchanged, so the price change is not described by the old curve's elasticity. Choose Supply or Demand, then drag the point or toggle the shift.">
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="mut" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="mutS" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto-start-reverse" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="acc" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- ================= PANEL A : supply shifts ================= -->

      <!-- axes (drawn before curve); extended past the data max -->

      <line class="axis" x1="70" y1="350" x2="70"  y2="55"  marker-end="url(#arw)" />
      <text class="axlabel" x="195" y="374" text-anchor="middle">Weekly gallons demanded</text>

      <!-- three perfectly-inelastic supply (stock) verticals -->

      <line class="supply-line" x1="265" y1="350" x2="265" y2="100" />

      <!-- the fixed demand curve -->
      <path class="curve" d="M107.5,81.2 L111.9,99.0 L116.4,114.6 L120.8,128.3 L125.2,140.5 L129.6,151.5 L134.1,161.4 L138.5,170.3 L142.9,178.4 L147.3,185.8 L151.8,192.7 L156.2,198.9 L160.6,204.7 L165.1,210.1 L169.5,215.0 L173.9,219.7 L178.3,224.0 L182.8,228.0 L187.2,231.8 L191.6,235.4 L196.0,238.8 L200.5,241.9 L204.9,244.9 L209.3,247.8 L213.8,250.4 L218.2,253.0 L222.6,255.4 L227.0,257.7 L231.5,259.9 L235.9,262.0 L240.3,264.0 L244.7,265.9 L249.2,267.7 L253.6,269.5 L258.0,271.1 L262.4,272.7 L266.9,274.3 L271.3,275.8 L275.7,277.2 L280.2,278.6 L284.6,279.9 L289.0,281.2 L293.4,282.4 L297.9,283.6 L302.3,284.7 L306.7,285.8 L311.1,286.9 L315.6,287.9 L320.0,288.9" />
      <text class="curvelabel" x="324" y="291" text-anchor="start">Demand</text>

      <!-- horizontal price lines to the y-axis (subscript = stock condition) -->
      <line class="priceline" x1="70" y1="140" x2="125" y2="140" />
      <line class="priceline" x1="70" y1="238" x2="195" y2="238" />
      <line class="priceline" x1="70" y1="273.6" x2="265" y2="273.6" />
      <text class="plabel" x="66" y="143" text-anchor="end">P<tspan class="sub" dy="3">Low</tspan></text>
      <text class="plabel" x="66" y="241" text-anchor="end">P<tspan class="sub" dy="3">Mod</tspan></text>
      <text class="plabel" x="66" y="277" text-anchor="end">P<tspan class="sub" dy="3">High</tspan></text>

      <!-- static "slides along" dashed double-headed arrow hugging the curve -->
      <path class="slide" marker-start="url(#mutS)" marker-end="url(#mut)"
            d="M138.8,156.4 L145.4,171.1 L152.0,183.8 L158.6,194.9 L165.2,204.6 L171.9,213.3 L178.5,221.0 L185.1,227.9 L191.8,234.1 L198.4,239.8 L205.0,245.0 L211.6,249.7 L218.3,254.1 L224.9,258.1 L231.5,261.8 L238.1,265.3 L244.8,268.5 L251.4,271.4 L258.0,274.2 L264.6,276.9 L271.2,279.3" />

      <!-- context dots at the three stock intersections (the "before" prior points) -->
      <circle class="ctx-pt" cx="125" cy="140" r="4" />
      <circle class="ctx-pt" cx="265" cy="273.6" r="4" />

      <!-- accent "before -> after" arrow along the curve (JS updates its d) -->
      <path id="supArrow" class="arrowA" marker-end="url(#acc)"
            d="M116.0,134.0 L130.0,165.3 L147.5,193.3 L165.0,213.8 L182.5,229.3 L186.0,232.0" />

      <!-- droplines for the active (current) point -->
      <line id="supDropV" class="drop" x1="195" y1="350" x2="195" y2="238" />
      <line id="supDropH" class="drop" x1="70" y1="238" x2="195" y2="238" />
      <text id="supQ" class="qlabel" x="195" y="366" text-anchor="middle">5.0</text>
      <text id="supPy" class="qlabel" x="76" y="232" text-anchor="start"
            dominant-baseline="middle">4.0</text>

      <!-- the draggable current point + generous hit targets -->
      <path id="supHitCurve" class="hit-curve"
            d="M107.5,81.2 L125.2,140.5 L142.9,178.4 L160.6,204.7 L178.3,224.0 L196.0,238.8 L213.8,250.4 L231.5,259.9 L249.2,267.7 L266.9,274.3 L284.6,279.9 L302.3,284.7 L320.0,288.9" />
      <circle id="supHit" class="hit" cx="195" cy="238" r="22" />
      <circle id="supPt"  class="pt"  cx="195" cy="238" r="7" />
      <circle id="supFocus" class="pt-focus hit" cx="195" cy="238" r="22"
              tabindex="0" role="slider" aria-label="Supply level along the fixed demand curve"
              aria-valuemin="2.2" aria-valuemax="7.8" aria-valuenow="5.0"
              aria-valuetext="Moderate stocks. Quantity 5.0, price 4.0. The price is sliding along one fixed demand curve, so elasticity of demand describes the response." />
    </g>

    <!-- ================= PANEL B : demand shifts ================= -->
    <g id="panelB" class="panel">
      <rect id="washB" class="panel-wash" x="380" y="24" width="330" height="330" />

      <text class="panelhead" x="535" y="18" text-anchor="middle">Demand shifts &#183; supply fixed</text>

      <line class="axis" x1="410" y1="350" x2="678" y2="350" marker-end="url(#arw)" />
      <line class="axis" x1="410" y1="350" x2="410" y2="55"  marker-end="url(#arw)" />
      <text class="axlabel" x="535" y="374" text-anchor="middle">Weekly gallons demanded</text>
      <text class="axlabel" x="372" y="205" text-anchor="middle"
            transform="rotate(-90 372 205)">Price per gallon</text>

      <!-- one unchanged perfectly-inelastic supply vertical -->
      <line class="supply-line" x1="535" y1="350" x2="535" y2="100" />
      <text class="stocklabel" x="535" y="94" text-anchor="middle">Unchanged stocks</text>

      <!-- two demand curves: lower (before) + higher (after). JS swaps which is
           accent-solid vs muted-ghost. Base state = post-shift (higher active). -->
      <path id="demLower" class="curve-ghost"
            d="M447.5,81.2 L451.9,99.0 L456.4,114.6 L460.8,128.3 L465.2,140.5 L469.6,151.5 L474.1,161.4 L478.5,170.3 L482.9,178.4 L487.3,185.8 L491.8,192.7 L496.2,198.9 L500.6,204.7 L505.1,210.1 L509.5,215.0 L513.9,219.7 L518.3,224.0 L522.8,228.0 L527.2,231.8 L531.6,235.4 L536.0,238.8 L540.5,241.9 L544.9,244.9 L549.3,247.8 L553.8,250.4 L558.2,253.0 L562.6,255.4 L567.0,257.7 L571.5,259.9 L575.9,262.0 L580.3,264.0 L584.7,265.9 L589.2,267.7 L593.6,269.5 L598.0,271.1 L602.4,272.7 L606.9,274.3 L611.3,275.8 L615.7,277.2 L620.2,278.6 L624.6,279.9 L629.0,281.2 L633.4,282.4 L637.9,283.6 L642.3,284.7 L646.7,285.8 L651.1,286.9 L655.6,287.9 L660.0,288.9" />
      <path id="demHigher" class="curve"
            d="M470.9,81.2 L474.9,93.0 L478.8,103.8 L482.8,113.7 L486.7,122.8 L490.6,131.3 L494.6,139.2 L498.5,146.5 L502.4,153.3 L506.4,159.7 L510.3,165.7 L514.3,171.3 L518.2,176.6 L522.1,181.6 L526.1,186.3 L530.0,190.7 L534.0,194.9 L537.9,198.9 L541.8,202.7 L545.8,206.3 L549.7,209.8 L553.7,213.0 L557.6,216.2 L561.5,219.1 L565.5,222.0 L569.4,224.7 L573.3,227.4 L577.3,229.9 L581.2,232.3 L585.2,234.6 L589.1,236.8 L593.0,239.0 L597.0,241.0 L600.9,243.0 L604.9,244.9 L608.8,246.8 L612.7,248.6 L616.7,250.3 L620.6,252.0 L624.6,253.6 L628.5,255.1 L632.4,256.6 L636.4,258.1 L640.3,259.5 L644.2,260.9 L648.2,262.2 L652.1,263.5 L656.1,264.8 L660.0,266.0" />
      <text id="labLower"  class="curvelabel" x="664" y="292" text-anchor="start">D<tspan class="sub" dy="3">lower</tspan></text>
      <text id="labHigher" class="curvelabel" x="664" y="264" text-anchor="start">D<tspan class="sub" dy="3">higher</tspan></text>

      <!-- rightward shift arrows (whole curve moves right) -->
      <line id="shiftUp"  class="shift" marker-end="url(#acc)" x1="474" y1="150" x2="516" y2="150" />
      <line id="shiftLow" class="shift" marker-end="url(#acc)" x1="600" y1="252" x2="642" y2="252" />

      <!-- horizontal price lines at the unchanged stock -->
      <line class="priceline" x1="410" y1="238" x2="535" y2="238" />
      <line class="priceline" x1="410" y1="196" x2="535" y2="196" />
      <text class="plabel" x="406" y="241" text-anchor="end">P<tspan class="sub" dy="3">Low</tspan></text>
      <text class="plabel" x="406" y="199" text-anchor="end">P<tspan class="sub" dy="3">High</tspan></text>

      <!-- vertical up-arrow: price rose because demand shifted -->
      <line id="demUp" class="uparrow" marker-end="url(#acc)" x1="492" y1="238" x2="492" y2="198" />

      <!-- context dot at the "before" (lower) intersection -->
      <circle id="demCtx" class="ctx-pt" cx="535" cy="238" r="4" />

      <!-- the accent point at the active curve's intersection with supply -->
      <circle id="demHit" class="hit" cx="535" cy="196" r="22" />
      <circle id="demPt"  class="pt"  cx="535" cy="196" r="7" />
      <circle id="demFocus" class="pt-focus hit" cx="535" cy="196" r="22"
              tabindex="-1" role="slider" aria-label="Position of the demand curve"
              aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"
              aria-valuetext="Higher demand curve. At the unchanged stock the price is P-High. The whole curve moved, so the old curve's elasticity does not describe this price change." />
    </g>

    <!-- ================= readout band ================= -->
    <line class="sep" x1="60" y1="402" x2="660" y2="402" />
    <text id="rHint"  class="r-hint"  x="360" y="424" text-anchor="middle">Supply rose (Low&#8594;High stocks); price fell along one demand curve.</text>
    <text id="rTrade" class="r-trade" x="360" y="448" text-anchor="middle">Same curve &#8212; elasticity of demand tells you how much quantity adjusts.</text>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image of both
      cases: on the left a supply shift slides the price along one fixed demand
      curve; on the right the whole demand curve shifts while supply is
      unchanged. You can also <a href="t03-elasticity-shifts.svg">open the static
      figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var byId = function (id) { return document.getElementById(id); };

  // ---- panel A (supply) refs ----
  var panelA = byId('panelA'), washA = byId('washA');
  var supPt = byId('supPt'), supHit = byId('supHit'), supFocus = byId('supFocus');
  var supHitCurve = byId('supHitCurve'), supArrow = byId('supArrow');
  var supDropV = byId('supDropV'), supDropH = byId('supDropH');
  var supQ = byId('supQ'), supPy = byId('supPy');

  // ---- panel B (demand) refs ----
  var panelB = byId('panelB'), washB = byId('washB');
  var demLower = byId('demLower'), demHigher = byId('demHigher');
  var labLower = byId('labLower'), labHigher = byId('labHigher');
  var demPt = byId('demPt'), demHit = byId('demHit'), demFocus = byId('demFocus');
  var demUp = byId('demUp'), demCtx = byId('demCtx');
  var shiftUp = byId('shiftUp'), shiftLow = byId('shiftLow');

  // ---- readout + toggle ----
  var rHint = byId('rHint'), rTrade = byId('rTrade');
  var btnSupply = byId('btnSupply'), btnDemand = byId('btnDemand');

  // ---- pixel frames (mirror the markup) ----
  // Panel A: x = 70 + Q*25 ; Panel B: x = 410 + Q*25 ; y = 350 - P*28.
  var AX0 = 70, BX0 = 410, PER_X = 25, Y0 = 350, PER_Y = 28;
  var axA = function (q) { return AX0 + q * PER_X; };
  var pyv = function (p) { return Y0 - p * PER_Y; };
  var toQ_A = function (px) { return (px - AX0) / PER_X; };

  // demand model: A + B_lower share P = 24/(Q+1); B_higher = 33/(Q+1)
  var demandA = function (q) { return 24 / (q + 1); };

  // ---- state ----
  var mode = 'supply';       // 'supply' | 'demand'
  var sq = 5.0;              // supply-mode Q along the fixed demand curve
  var SQ_LO = 2.2, SQ_HI = 7.8;
  var dstate = 1;            // demand-mode: 0 = lower (before), 1 = higher (after)

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // Build a curve-hugging path between two Q values on demand curve A, with a
  // small perpendicular-ish offset so the accent arrow reads as a slide. This
  // only rewrites an existing <path>'s d attribute — it does not build DOM.
  function supArrowPath(q0, q1) {
    var n = 16, d = '', dir = (q1 >= q0) ? 1 : -1;
    for (var i = 0; i <= n; i++) {
      var q = q0 + (q1 - q0) * i / n;
      var x = axA(q) - 9, y = pyv(demandA(q)) - 6;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    }
    return d.trim();
  }

  function renderSupply() {
    var p = demandA(sq);
    var cx = axA(sq), cy = pyv(p);
    supPt.setAttribute('cx', cx); supPt.setAttribute('cy', cy);
    supHit.setAttribute('cx', cx); supHit.setAttribute('cy', cy);
    supFocus.setAttribute('cx', cx); supFocus.setAttribute('cy', cy);

    supDropV.setAttribute('x1', cx); supDropV.setAttribute('x2', cx);
    supDropV.setAttribute('y2', cy);
    supDropH.setAttribute('y1', cy); supDropH.setAttribute('y2', cy);
    supDropH.setAttribute('x2', cx);

    supQ.setAttribute('x', cx); supQ.textContent = sq.toFixed(1);
    supPy.setAttribute('y', cy - 6); supPy.textContent = p.toFixed(1);

    // "before" is Low stocks (Q=2.2); the accent arrow runs from there to now
    supArrow.setAttribute('d', supArrowPath(SQ_LO, sq));
    supArrow.style.opacity = (Math.abs(sq - SQ_LO) < 0.15) ? 0 : 1;

    // spoken state
    var where = sq < 3.6 ? 'Low stocks' : (sq < 6.4 ? 'Moderate stocks' : 'High stocks');
    supFocus.setAttribute('aria-valuenow', sq.toFixed(1));
    supFocus.setAttribute('aria-valuetext',
      where + '. Quantity ' + sq.toFixed(1) + ', price ' + p.toFixed(1) +
      '. The price is sliding along one fixed demand curve, so elasticity of ' +
      'demand describes how much quantity adjusts.');
  }

  function renderDemand() {
    var higher = (dstate === 1);
    // swap accent-solid vs muted-ghost between the two curves
    demHigher.setAttribute('class', higher ? 'curve' : 'curve-ghost');
    demLower.setAttribute('class', higher ? 'curve-ghost' : 'curve');
    // accent point sits on the active curve at the unchanged stock (Q=5)
    var cy = higher ? 196 : 238;
    demPt.setAttribute('cy', cy); demHit.setAttribute('cy', cy);
    demFocus.setAttribute('cy', cy);
    // the up-arrow + shift arrows only make sense for the completed shift
    demUp.style.opacity = higher ? 1 : 0;
    shiftUp.style.opacity = higher ? 1 : 0.25;
    shiftLow.style.opacity = higher ? 1 : 0.25;

    demFocus.setAttribute('aria-valuenow', higher ? 1 : 0);
    demFocus.setAttribute('aria-valuetext', higher
      ? 'Higher demand curve. At the unchanged stock the price rose to P-High. ' +
        'The whole curve moved, so the old curve’s elasticity does not describe ' +
        'this price change.'
      : 'Lower demand curve (the starting point). At the unchanged stock the ' +
        'price is P-Low. Step up to shift the whole curve to the right.');
  }

  function renderReadout() {
    if (mode === 'supply') {
      rHint.textContent  = 'Supply rose (Low→High stocks); price fell along one demand curve.';
      rTrade.textContent = 'Same curve — elasticity of demand tells you how much quantity adjusts.';
    } else if (dstate === 1) {
      rHint.textContent  = 'Demand shifted right (Lower→Higher); price rose at the unchanged stock.';
      rTrade.textContent = 'Whole curve moved — the old curve’s elasticity does not describe this price change.';
    } else {
      rHint.textContent  = 'Demand is at its lower position; price sits at P-Low with the stock unchanged.';
      rTrade.textContent = 'Step up to shift the whole curve right and see what a demand shift does.';
    }
  }

  function applyMode() {
    var supply = (mode === 'supply');
    panelA.classList.toggle('dim', !supply);
    panelB.classList.toggle('dim', supply);
    washA.style.opacity = supply ? 0.5 : 0;
    washB.style.opacity = supply ? 0 : 0.5;
    supFocus.setAttribute('tabindex', supply ? '0' : '-1');
    demFocus.setAttribute('tabindex', supply ? '-1' : '0');
    btnSupply.classList.toggle('on', supply);
    btnDemand.classList.toggle('on', !supply);
    btnSupply.setAttribute('aria-pressed', supply ? 'true' : 'false');
    btnDemand.setAttribute('aria-pressed', supply ? 'false' : 'true');
  }

  function render() {
    renderSupply();
    renderDemand();
    renderReadout();
    applyMode();
  }

  // ---- supply-mode drag (project the pointer onto the fixed demand curve) ----
  function setSupplyFromPointer(evt) {
    var pnt = toSvg(evt);
    var q = toQ_A(pnt.x);
    if (isNaN(q)) return;
    if (q < SQ_LO) q = SQ_LO;
    if (q > SQ_HI) q = SQ_HI;
    sq = q;
    renderSupply(); renderReadout();
  }

  var dragging = false, capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setSupplyFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    if (mode !== 'supply') return;
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setSupplyFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  supHit.addEventListener('pointerdown', onDown);
  supHitCurve.addEventListener('pointerdown', onDown);
  supFocus.addEventListener('pointerdown', onDown);

  // ---- supply-mode keyboard (arrows step along the curve) ----
  supFocus.addEventListener('keydown', function (evt) {
    var step = 0.3;
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowDown') { sq += step; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowUp') { sq -= step; }
    else return;
    evt.preventDefault();
    if (sq < SQ_LO) sq = SQ_LO;
    if (sq > SQ_HI) sq = SQ_HI;
    renderSupply(); renderReadout();
  });

  // ---- demand-mode toggle: drag up/down or arrow keys flip Lower<->Higher ----
  function setDemandFromPointer(evt) {
    var pnt = toSvg(evt);
    // above the midpoint between the two intersections (y=217) => higher
    dstate = (pnt.y < 217) ? 1 : 0;
    renderDemand(); renderReadout();
  }
  var dDragging = false, dCapEl = null, dCapId = null;
  function dMove(evt) { if (dDragging) { evt.preventDefault(); setDemandFromPointer(evt); } }
  function dUp() {
    dDragging = false;
    svg.classList.remove('grabbing');
    if (dCapEl && dCapId !== null) { try { dCapEl.releasePointerCapture(dCapId); } catch (e) {} }
    dCapEl = null; dCapId = null;
    window.removeEventListener('pointermove', dMove);
    window.removeEventListener('pointerup', dUp);
  }
  function dDown(evt) {
    if (mode !== 'demand') return;
    evt.preventDefault();
    dDragging = true;
    svg.classList.add('grabbing');
    dCapEl = evt.currentTarget; dCapId = evt.pointerId;
    try { dCapEl.setPointerCapture(dCapId); } catch (e) {}
    setDemandFromPointer(evt);
    window.addEventListener('pointermove', dMove);
    window.addEventListener('pointerup', dUp);
  }
  demHit.addEventListener('pointerdown', dDown);
  demFocus.addEventListener('pointerdown', dDown);

  demFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') { dstate = 1; }
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') { dstate = 0; }
    else return;
    evt.preventDefault();
    renderDemand(); renderReadout();
  });

  // ---- mode toggle ----
  function setMode(m) {
    mode = m;
    render();
    if (m === 'supply') { supFocus.focus(); } else { demFocus.focus(); }
  }
  btnSupply.addEventListener('click', function () { setMode('supply'); });
  btnDemand.addEventListener('click', function () { setMode('demand'); });

  // ---- debug hook (inert for students) ----
  window.__fig = {
    set: function (v) {
      v = v || {};
      if (v.mode === 'supply' || v.mode === 'demand') mode = v.mode;
      if (typeof v.sq === 'number') sq = Math.max(SQ_LO, Math.min(SQ_HI, v.sq));
      if (typeof v.dstate === 'number') dstate = v.dstate ? 1 : 0;
      render();
    },
    get: function () {
      return { mode: mode, sq: sq, p_supply: demandA(sq), dstate: dstate };
    }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
