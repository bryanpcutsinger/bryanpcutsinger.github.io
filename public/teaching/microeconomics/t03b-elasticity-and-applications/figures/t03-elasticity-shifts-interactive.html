<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: a price change from a supply shift vs a demand shift (after UE Fig 8.4A/B)</title>
<!--
  Faithful interactive recreation of UE Fig 8.4A (p.115) and Fig 8.4B (p.116)
  for the t03b (elasticity) blog post. Website-styled warm palette, not FAU.
  Self-contained: no libraries, no network.

  REBUILT 2026-07-26 (instructor-directed). The previous build showed BOTH
  panels side by side with one ghosted, which crammed each figure into half
  the frame and drifted from the source (extra coordinate tags, arrows tangled
  with the curve, tiny stock labels). This rebuild shows ONE full-width scene
  at a time — the Supply | Demand toggle swaps the whole stage — and each
  scene mirrors its source figure element-for-element, with ONE sanctioned
  deviation (instructor 2026-07-26): the demand curves are LINEAR, not the
  source's convex curves (nothing in the lesson needs curvature).

  Scene A (after Fig 8.4A — "Effects of Change in Price Due to Change in
  Supply, Not Due to Shifts in Demand"): one straight demand line, THREE
  vertical supply lines (low / moderate / high gas stocks) with two-line
  labels above, dotted price lines P_low / P_mod / P_high to the three
  crossings (note the source's naming: P_low = the price when stocks are LOW,
  i.e. the HIGHEST of the three), and dashed arrows running ALONGSIDE the
  demand line in both directions — the buyer slides along one unchanged curve.

  Scene B (after Fig 8.4B — "Change in Price Due to Change in Demand, with
  Unchanged Supply"): ONE vertical supply line (unchanged gas stocks), TWO
  solid straight demand lines (lower and higher), dotted P_low / P_high at
  the two crossings, an up-arrow between the price lines, and right-arrows
  marking the shift from the lower to the higher curve.

  AXIS-LABEL STANDARD (2026-07-25, course-wide — do not undo): vertical label
  rotated -90 bottom-to-top in the left gutter ("Price per gallon of
  gasoline"); horizontal label centered below the axis ("Weekly gallons of
  gasoline demanded"); sentence case.

  GEOMETRY: viewBox 720 x 460 (embed aspect-ratio 16/10, max-width 640px).
  Pixel frame: px(Q) = 100 + 56*Q ; py(P) = 344 - 29*P (Q,P in 0..10).
    Scene A: demand P = 10 - Q; stocks at Q = 3 / 5 / 7
             -> crossings (3,$7) (5,$5) (7,$3), i.e. P_low > P_mod > P_high.
    Scene B: stocks at Q = 5; D_lower P = 8 - Q (crossing (5,$3) = P_low);
             D_higher P = 12 - Q (crossing (5,$7) = P_high).
  Readout band inside the SVG below the plot (sep y=392).

  INTERACTION (one stepper per scene): Scene A steps the ACTIVE stock level
  low -> moderate -> high (drag snaps to the nearest stock line; arrow keys
  step); the accent dot rides the crossings ALONG the one demand line.
  Scene B steps lower -> higher demand; the accent dot rides UP the fixed
  stock line at the same quantity. The toggle above swaps scenes.
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink:     #1a1c1e;
    --text:    #16181a;
    --muted:   #5c6066;
    --hairline:#e3ddd3;
    --accent:  #b07a2c;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 640px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  .modebar { display: flex; align-items: center; gap: 8px;
             margin: 0 0 8px; flex-wrap: wrap; }
  .modelabel { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg { font-family: inherit; font-size: 12.5px; font-weight: 600;
         color: var(--ink); background: var(--surface);
         border: 1.5px solid var(--hairline); border-radius: 6px;
         padding: 5px 12px; cursor: pointer; }
  .seg + .seg { margin-left: -1px; }
  .seg.on { background: var(--accent); color: var(--surface);
            border-color: var(--accent); }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .axis     { stroke: var(--muted); stroke-width: 1.4; }
  .curve    { stroke: var(--ink); stroke-width: 2.6; fill: none;
              stroke-linecap: round; }
  .stock    { stroke: var(--ink); stroke-width: 1.8; }
  .stock-on { stroke: var(--accent); stroke-width: 2.6; }
  .pricedot { stroke: var(--muted); stroke-width: 1.2;
              stroke-dasharray: 2 3; }
  .pricedot-on { stroke: var(--accent); stroke-width: 1.5;
              stroke-dasharray: 2 3; }
  .slide    { stroke: var(--muted); stroke-width: 1.6;
              stroke-dasharray: 6 5; fill: none; }
  .shift    { stroke: var(--accent); stroke-width: 1.8; fill: none; }

  .pt   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit  { fill: transparent; stroke: transparent; touch-action: none;
          cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible ~ .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  .axlabel   { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .datalabel { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .plabel    { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .plabel-on { fill: var(--accent); font-size: 13px; font-weight: 700; }
  .sub       { font-size: 9.5px; }
  .sep       { stroke: var(--hairline); stroke-width: 1; }
  .r-hint    { fill: var(--muted); font-size: 12.5px; }
  .r-trade   { fill: var(--accent); font-size: 14px; font-weight: 600; }
  .fallback  { margin: 8px 0 0; color: var(--muted); font-size: 13px;
               line-height: 1.35; text-align: center; }
</style>
</head>
<body>
<div class="fig">
  <div class="modebar" role="group" aria-label="Choose what changed">
    <span class="modelabel">What changed?</span>
    <button id="btnSupply" class="seg on" type="button" aria-pressed="true">Supply</button>
    <button id="btnDemand" class="seg" type="button" aria-pressed="false">Demand</button>
  </div>

  <svg id="fig" viewBox="0 0 720 460" role="group"
       aria-label="One diagram shown at a time. Supply scene, after UE Figure 8.4A: a single straight demand line crossed by three vertical supply lines for low, moderate, and high gas stocks; as stocks change, the price slides along the one unchanged demand line from its highest level under low stocks to its lowest under high stocks, with dashed arrows running alongside the line in both directions. Demand scene, after UE Figure 8.4B: one vertical supply line for unchanged gas stocks crossed by two straight demand lines; when demand shifts from the lower to the higher line, the price rises at the same quantity, with no movement along either line. Use the toggle to switch scenes and drag or arrow-key the point to step through the cases.">
    <title>A price change from a supply shift is movement along the demand curve; from a demand shift it is not</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- axes + standard labels (shared by both scenes) -->
    <line class="axis" x1="100" y1="344" x2="690" y2="344" marker-end="url(#arrow)" />
    <line class="axis" x1="100" y1="344" x2="100" y2="44"  marker-end="url(#arrow)" />
    <text class="axlabel" x="16" y="194" text-anchor="middle"
          transform="rotate(-90 16 194)">Price per gallon of gasoline</text>
    <text class="axlabel" x="395" y="376" text-anchor="middle">Weekly gallons of gasoline demanded</text>

    <!-- ============ SCENE A — after UE Fig 8.4A (supply shifts) ============ -->
    <g id="sceneA">
      <!-- three vertical supply lines with two-line labels above -->
      <text class="datalabel" text-anchor="middle"><tspan x="268" y="58">Low gas</tspan><tspan x="268" y="73">stocks</tspan></text>
      <text class="datalabel" text-anchor="middle"><tspan x="380" y="58">Moderate</tspan><tspan x="380" y="73">gas stocks</tspan></text>
      <text class="datalabel" text-anchor="middle"><tspan x="492" y="58">High gas</tspan><tspan x="492" y="73">stocks</tspan></text>
      <line id="stockLow"  class="stock"    x1="268" y1="82" x2="268" y2="344" />
      <line id="stockMod"  class="stock-on" x1="380" y1="82" x2="380" y2="344" />
      <line id="stockHigh" class="stock"    x1="492" y1="82" x2="492" y2="344" />

      <!-- dotted price lines to the three crossings (P_low is the HIGHEST) -->
      <line id="pdLow"  class="pricedot"    x1="100" y1="141" x2="268" y2="141" />
      <line id="pdMod"  class="pricedot-on" x1="100" y1="199" x2="380" y2="199" />
      <line id="pdHigh" class="pricedot"    x1="100" y1="257" x2="492" y2="257" />
      <text id="plLow"  class="plabel"    x="94" y="145" text-anchor="end">P<tspan class="sub" dy="3">low</tspan></text>
      <text id="plMod"  class="plabel-on" x="94" y="203" text-anchor="end">P<tspan class="sub" dy="3">mod</tspan></text>
      <text id="plHigh" class="plabel"    x="94" y="261" text-anchor="end">P<tspan class="sub" dy="3">high</tspan></text>

      <!-- the ONE unchanged demand line: P = 10 - Q -->
      <path class="curve" d="M128,68.5 L626.4,326.6" />
      <text class="datalabel" x="634" y="330" text-anchor="start">Demand</text>

      <!-- dashed arrows ALONGSIDE the line, both directions (the source's
           slide-along-the-curve marks) -->
      <path class="slide" d="M452.9,228.9 L284.9,141.9" marker-end="url(#arrow)" />
      <path class="slide" d="M307.1,169.1 L475.1,256.1" marker-end="url(#arrow)" />

      <!-- accent dot on the active crossing + its grab/focus targets -->
      <circle id="hitA" class="hit" cx="380" cy="199" r="26" />
      <circle id="focusA" class="pt-focus hit" cx="380" cy="199" r="26"
              tabindex="0" role="slider"
              aria-label="Gas stocks level (drag or use arrow keys: low, moderate, high)"
              aria-valuemin="1" aria-valuemax="3" aria-valuenow="2"
              aria-valuetext="Moderate gas stocks: the middle supply line, price at the middle level. The dot sits on the same unchanged demand line at every stocks level." />
      <circle id="ptA" class="pt" cx="380" cy="199" r="8" />
    </g>

    <!-- ============ SCENE B — after UE Fig 8.4B (demand shifts) ============ -->
    <g id="sceneB" display="none">
      <!-- one unchanged vertical supply line -->
      <text class="datalabel" text-anchor="middle"><tspan x="380" y="58">Unchanged</tspan><tspan x="380" y="73">gas stocks</tspan></text>
      <line class="stock-on" x1="380" y1="82" x2="380" y2="344" />

      <!-- TWO solid straight demand lines: P = 8 - Q and P = 12 - Q -->
      <path class="curve" d="M122.4,123.6 L525.6,332.4" />
      <text class="datalabel" x="532" y="336" text-anchor="start">Demand<tspan class="sub" dy="3">lower</tspan></text>
      <path class="curve" d="M234.4,65.6 L632,271.5" />
      <text class="datalabel" x="640" y="275" text-anchor="start">Demand<tspan class="sub" dy="3">higher</tspan></text>

      <!-- dotted price lines at the two crossings of the stock line -->
      <line id="pdBHigh" class="pricedot" x1="100" y1="141" x2="380" y2="141" />
      <line id="pdBLow"  class="pricedot-on" x1="100" y1="257" x2="380" y2="257" />
      <text id="plBHigh" class="plabel" x="94" y="145" text-anchor="end">P<tspan class="sub" dy="3">high</tspan></text>
      <text id="plBLow"  class="plabel-on" x="94" y="261" text-anchor="end">P<tspan class="sub" dy="3">low</tspan></text>

      <!-- the price-rise arrow between the two dotted lines, and the two
           right-arrows marking the lower->higher shift -->
      <!-- up-arrow sits at x=130, LEFT of where the lower demand line enters
           the band between the two price lines (D_lower crosses y=149 only at
           x=171), so the arrow never crosses a curve -->
      <line class="shift" x1="130" y1="249" x2="130" y2="149" marker-end="url(#arrowAccent)" />
      <line class="shift" x1="150" y1="120" x2="300" y2="120" marker-end="url(#arrowAccent)" />
      <line class="shift" x1="400" y1="230" x2="530" y2="230" marker-end="url(#arrowAccent)" />

      <!-- accent dot on the active crossing (rides UP the stock line) -->
      <circle id="hitB" class="hit" cx="380" cy="257" r="26" />
      <circle id="focusB" class="pt-focus hit" cx="380" cy="257" r="26"
              tabindex="0" role="slider"
              aria-label="Which demand curve is in force (drag or use arrow keys: lower, higher)"
              aria-valuemin="1" aria-valuemax="2" aria-valuenow="1"
              aria-valuetext="Lower demand curve against unchanged gas stocks: the market sits at the lower crossing, the lower price. Step up to shift demand higher." />
      <circle id="ptB" class="pt" cx="380" cy="257" r="8" />
    </g>

    <!-- readout band -->
    <line class="sep" x1="60" y1="392" x2="660" y2="392" />
    <text id="rHint" class="r-hint" text-anchor="middle"><tspan x="360" y="414">Moderate gas stocks: the middle supply line, the middle price. The demand line has not moved.</tspan></text>
    <text id="rTrade" class="r-trade" text-anchor="middle"><tspan x="360" y="446">Movement ALONG one curve — elasticity describes how much quantity adjusts.</tspan></text>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image of the
      supply scene, the complete Figure 8.4A story: one straight demand line
      crossed by three vertical supply lines (low, moderate, and high gas
      stocks), dotted price lines to the three crossings (the price is highest
      when stocks are low), and dashed arrows alongside the demand line showing
      that these price changes are movements ALONG one unchanged curve. Only
      the Supply/Demand toggle and the draggable point are inactive.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var sceneA = document.getElementById('sceneA');
  var sceneB = document.getElementById('sceneB');
  var btnSupply = document.getElementById('btnSupply');
  var btnDemand = document.getElementById('btnDemand');
  var rHint = document.getElementById('rHint');
  var rTrade = document.getElementById('rTrade');
  var NS = 'http://www.w3.org/2000/svg';

  // scene A elements
  var stockEls = { 1: document.getElementById('stockLow'),
                   2: document.getElementById('stockMod'),
                   3: document.getElementById('stockHigh') };
  var pdEls  = { 1: document.getElementById('pdLow'),
                 2: document.getElementById('pdMod'),
                 3: document.getElementById('pdHigh') };
  var plEls  = { 1: document.getElementById('plLow'),
                 2: document.getElementById('plMod'),
                 3: document.getElementById('plHigh') };
  var ptA = document.getElementById('ptA');
  var hitA = document.getElementById('hitA');
  var focusA = document.getElementById('focusA');

  // scene B elements
  var pdBHigh = document.getElementById('pdBHigh');
  var pdBLow  = document.getElementById('pdBLow');
  var plBHigh = document.getElementById('plBHigh');
  var plBLow  = document.getElementById('plBLow');
  var ptB = document.getElementById('ptB');
  var hitB = document.getElementById('hitB');
  var focusB = document.getElementById('focusB');

  // geometry: crossings in scene A (stock level -> x, y) and scene B
  var A = { 1: { x: 268, y: 141 }, 2: { x: 380, y: 199 }, 3: { x: 492, y: 257 } };
  var B = { 1: { y: 257 }, 2: { y: 141 } };   // on the stock line x = 380

  var mode = 'supply';   // 'supply' | 'demand'
  var stockLevel = 2;    // 1 low, 2 moderate, 3 high
  var demandLevel = 1;   // 1 lower, 2 higher

  var A_COPY = {
    1: { hint: 'Low gas stocks: the supply line sits far left, so the price is at its highest of the three.',
         aria: 'Low gas stocks: the leftmost supply line, the highest price. Same unchanged demand line.' },
    2: { hint: 'Moderate gas stocks: the middle supply line, the middle price. The demand line has not moved.',
         aria: 'Moderate gas stocks: the middle supply line, price at the middle level. The dot sits on the same unchanged demand line at every stocks level.' },
    3: { hint: 'High gas stocks: plentiful supply, so the price is at its lowest. Still the same demand line.',
         aria: 'High gas stocks: the rightmost supply line, the lowest price. Same unchanged demand line.' }
  };
  var A_TRADE = 'Movement ALONG one curve — elasticity describes how much quantity adjusts.';

  var B_COPY = {
    1: { hint: 'The lower demand curve is in force: against unchanged stocks, the market sits at the lower price.',
         trade: 'Step the point up: demand is about to shift with supply unchanged.',
         aria: 'Lower demand curve against unchanged gas stocks: the lower crossing, the lower price. Step up to shift demand higher.' },
    2: { hint: 'Demand shifted to the higher curve against unchanged stocks: the price rose at the very same quantity.',
         trade: 'The whole curve moved — the old curve’s elasticity cannot describe this price change.',
         aria: 'Higher demand curve against unchanged gas stocks: the price rose to the higher level at the same quantity. No movement along either demand line.' }
  };

  function setLine(el, str, y) {
    while (el.firstChild) el.removeChild(el.firstChild);
    var t = document.createElementNS(NS, 'tspan');
    t.setAttribute('x', 360); t.setAttribute('y', y);
    t.textContent = str;
    el.appendChild(t);
  }

  function render() {
    var supply = (mode === 'supply');
    sceneA.setAttribute('display', supply ? 'inline' : 'none');
    sceneB.setAttribute('display', supply ? 'none' : 'inline');
    btnSupply.classList.toggle('on', supply);
    btnDemand.classList.toggle('on', !supply);
    btnSupply.setAttribute('aria-pressed', supply ? 'true' : 'false');
    btnDemand.setAttribute('aria-pressed', supply ? 'false' : 'true');

    if (supply) {
      for (var k = 1; k <= 3; k++) {
        stockEls[k].setAttribute('class', k === stockLevel ? 'stock-on' : 'stock');
        pdEls[k].setAttribute('class', k === stockLevel ? 'pricedot-on' : 'pricedot');
        plEls[k].setAttribute('class', k === stockLevel ? 'plabel-on' : 'plabel');
      }
      var a = A[stockLevel];
      ptA.setAttribute('cx', a.x); ptA.setAttribute('cy', a.y);
      hitA.setAttribute('cx', a.x); hitA.setAttribute('cy', a.y);
      focusA.setAttribute('cx', a.x); focusA.setAttribute('cy', a.y);
      focusA.setAttribute('aria-valuenow', stockLevel);
      focusA.setAttribute('aria-valuetext', A_COPY[stockLevel].aria);
      setLine(rHint, A_COPY[stockLevel].hint, 414);
      setLine(rTrade, A_TRADE, 446);
    } else {
      pdBHigh.setAttribute('class', demandLevel === 2 ? 'pricedot-on' : 'pricedot');
      pdBLow.setAttribute('class', demandLevel === 1 ? 'pricedot-on' : 'pricedot');
      plBHigh.setAttribute('class', demandLevel === 2 ? 'plabel-on' : 'plabel');
      plBLow.setAttribute('class', demandLevel === 1 ? 'plabel-on' : 'plabel');
      var b = B[demandLevel];
      ptB.setAttribute('cy', b.y);
      hitB.setAttribute('cy', b.y);
      focusB.setAttribute('cy', b.y);
      focusB.setAttribute('aria-valuenow', demandLevel);
      focusB.setAttribute('aria-valuetext', B_COPY[demandLevel].aria);
      setLine(rHint, B_COPY[demandLevel].hint, 414);
      setLine(rTrade, B_COPY[demandLevel].trade, 446);
    }
  }

  function setMode(m) {
    if (m !== 'supply' && m !== 'demand') return;
    mode = m;
    render();
  }
  btnSupply.addEventListener('click', function () { setMode('supply'); });
  btnDemand.addEventListener('click', function () { setMode('demand'); });

  // --- drag snaps to the nearest stock line (A) / crossing (B); arrows step ---
  var spt = svg.createSVGPoint();
  function toSvgX(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse()).x;
  }
  function toSvgY(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse()).y;
  }
  function snapA(x) {
    var best = 1, dist = Infinity;
    for (var k = 1; k <= 3; k++) {
      var d = Math.abs(A[k].x - x);
      if (d < dist) { dist = d; best = k; }
    }
    if (best !== stockLevel) { stockLevel = best; render(); }
  }
  function snapB(y) {
    var best = (Math.abs(B[1].y - y) <= Math.abs(B[2].y - y)) ? 1 : 2;
    if (best !== demandLevel) { demandLevel = best; render(); }
  }

  var dragging = null, capturedEl = null, capturedId = null;
  function onMove(evt) {
    if (dragging === 'A') { evt.preventDefault(); snapA(toSvgX(evt)); }
    else if (dragging === 'B') { evt.preventDefault(); snapB(toSvgY(evt)); }
  }
  function onUp() {
    dragging = null;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function down(which) {
    return function (evt) {
      evt.preventDefault();
      dragging = which;
      svg.classList.add('grabbing');
      capturedEl = evt.currentTarget; capturedId = evt.pointerId;
      try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
      if (which === 'A') snapA(toSvgX(evt)); else snapB(toSvgY(evt));
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };
  }
  hitA.addEventListener('pointerdown', down('A'));
  focusA.addEventListener('pointerdown', down('A'));
  hitB.addEventListener('pointerdown', down('B'));
  focusB.addEventListener('pointerdown', down('B'));

  focusA.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { stockLevel = Math.min(3, stockLevel + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { stockLevel = Math.max(1, stockLevel - 1); }
    else return;
    evt.preventDefault();
    render();
  });
  focusB.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') { demandLevel = 2; }
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') { demandLevel = 1; }
    else return;
    evt.preventDefault();
    render();
  });

  // debug hook (inert for students)
  window.__fig = {
    set: function (v) {
      v = v || {};
      if (v.mode === 'supply' || v.mode === 'demand') mode = v.mode;
      if (v.stock === 1 || v.stock === 2 || v.stock === 3) stockLevel = v.stock;
      if (v.demand === 1 || v.demand === 2) demandLevel = v.demand;
      render();
    },
    get: function () { return { mode: mode, stock: stockLevel, demand: demandLevel }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
