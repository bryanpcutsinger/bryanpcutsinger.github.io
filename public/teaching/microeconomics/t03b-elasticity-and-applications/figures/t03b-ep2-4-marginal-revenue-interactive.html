<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive marginal revenue: the gain on the new unit minus the loss on the units already sold</title>
<!--
  Interactive "marginal revenue = gain minus loss" figure for the T3b blog post
  (website-styled, warm palette). REDRAW of E&P Fig 2-4 (p. 23), course-adapted to
  t03b's OWN demand schedule (Table 8.1, the post's revenue grid) so the figure IS
  that table drawn as marginal-revenue rectangles, zero drift.

  FAMILY F4 (area accounting). Geometry class: single-panel, viewBox 440x540,
  aspect-ratio 4/5, max-width 520px — realigned 2026-07-26 (instructor) to match
  the section's other figures (ue8-1, ue8-2, fan: same 4/5 frame, same plain
  axis-title style). Y-axis title simplified to "Price ($)": marginal revenue
  appears only as the dashed accent tick, and the course never draws an MR curve.

  MODEL: demand P = 11 - Q (Q=1->$10, Q=2->$9, ... Q=10->$1; TR = P*Q).
    Selling the Qth unit means moving from Q-1 units at the old price P(Q-1) to Q
    units at the new price P(Q). The lower price applies to EVERY unit, so:
      GAIN  = revenue on the new unit          = P(Q) * 1                = 11 - Q
      LOSS  = revenue given up on old units     = [P(Q-1) - P(Q)] * (Q-1) = Q - 1
      MR(Q) = GAIN - LOSS = (11 - Q) - (Q - 1) = 12 - 2Q = TR(Q) - TR(Q-1).
    Cross-check against Table 8.1: MR(2)=8=18-10; MR(5)=2=30-28; MR(7)=-2=28-30. OK
    MR < price for every unit after the first; MR turns negative past the revenue
    peak (Q=6, where MR=$0 and TR=$30 is at its max).

  NOTE ON THE SOURCE-SPEC NUMBERS: the interactive-specs draft strings for Q=5 and
  Q=7 quoted gain $7 / MR $3 and gain $5 / MR -$1, which are computed off a P=12-Q
  curve and CONTRADICT the post's Table 8.1 (P=11-Q) and the spec's own invariant
  block (which pins P=11-Q and MR(2)=$8). This widget uses Table 8.1 (authoritative,
  zero-drift) with the corrected numbers: Q=5 -> gain $6, loss $4, MR $2; Q=7 ->
  gain $4, loss $6, MR -$2.

  These are REVENUE rectangles (money), NOT welfare areas. No surplus / market-value
  / deadweight vocabulary appears anywhere (verbal-marginal + vocabulary lock).

  GEOMETRY / coordinate frame:
    Data origin (Q=0, $0) at pixel (76, 356). x: px = 76 + Q*30. y: px = 356 - P*28.
    Draggable focus unit Q in [2, 10], integer steps (the schedule is discrete units).
    Default / no-JS state = selling the 2nd unit (old price $10 -> new price $9),
    which the static base markup below matches exactly.

  LIVE ELEMENTS (ids, re-rendered by render()): gainRect, lossRect (the two money
  rectangles), ptNew/hit/ptFocus (draggable new-price point), ptOld (muted old-price
  point), dropP (price dropline), guideMR (MR guide line), lblP/lblMR (price + MR
  axis labels), rHint/rTrade (readout band). STATIC: axes, demand line, $10 old-price
  tick, x-axis numbers, titles, origin.
-->
<style>
  :root {
    --surface:   #f7f4ef;  /* warm bone background            */
    --ink:       #1a1c1e;   /* demand line + headings          */
    --text:      #16181a;   /* body text                       */
    --muted:     #5c6066;   /* axes / old-price point / state  */
    --hairline:  #e3ddd3;   /* droplines / faint strokes       */
    --accent:    #b07a2c;   /* brass -- the live point + MR + takeaway */
    --gain-fill: #ecd9b0;   /* brass tint -- revenue on the new unit   */
    --gain-line: #b07a2c;
    --loss-line: #a8452a;   /* clay red -- revenue given up            */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 lets the figure scale DOWN on phones instead of clipping. */
  .fig { width: 100%; max-width: 520px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis  { stroke: var(--muted); stroke-width: 1.4; }
  .curve { stroke: var(--ink); stroke-width: 2.6; fill: none;
           stroke-linecap: round; stroke-linejoin: round; }
  .drop  { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .guide { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 6 4;
           opacity: 0.9; }

  /* the two money rectangles */
  .gain  { fill: var(--gain-fill); stroke: var(--gain-line); stroke-width: 1.4; }
  .loss  { fill: url(#lossHatch); stroke: var(--loss-line); stroke-width: 1.4; }

  /* points */
  .pt-old { fill: var(--muted); stroke: var(--surface); stroke-width: 2; }
  .pt     { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 26;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axtitle  { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .curvelbl { fill: var(--ink); font-size: 13px; font-weight: 600; font-style: italic; }
  .tick     { fill: var(--muted); font-size: 12px; }
  .lbl-p    { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .lbl-mr   { fill: var(--accent); font-size: 12.5px; font-weight: 700; }
  .origin   { fill: var(--muted); font-size: 12px; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted); font-size: 12.5px; }
  .r-trade  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
</style>
</head>
<body>
<!-- Everything from here to </div> is REAL base SVG: a no-JS reader sees the full
     figure -- axes, the demand line P = 11 - Q, the GAIN rectangle (revenue on the
     2nd unit, $9) and the LOSS rectangle (the $1 price cut on the 1 unit already
     sold), the old/new price points, the price and marginal-revenue axis labels,
     and the readout. The script only ATTACHES drag / keyboard / live re-rendering,
     stepping the focus unit Q along the demand line. -->
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="A downward-sloping demand line, price equals eleven minus quantity. Selling one more unit forces the price down on every unit. The revenue on the new unit is drawn as a tall gain rectangle, and the price cut on the units already sold is drawn as a thin loss rectangle above it. Marginal revenue is the gain minus the loss, which is less than the price. Drag the point along the demand line to sell one more unit and watch marginal revenue fall and eventually turn negative.">
    <title>Interactive marginal revenue as gain minus loss</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <pattern id="lossHatch" width="7" height="7" patternUnits="userSpaceOnUse"
               patternTransform="rotate(45)">
        <rect width="7" height="7" fill="#f0dcd3" />
        <line x1="0" y1="0" x2="0" y2="7" stroke="#a8452a" stroke-width="1.4" />
      </pattern>
    </defs>

    <!-- money rectangles (drawn first, under the demand line and points) -->
    <!-- LOSS: price cut $1 over the 1 inframarginal unit, x[0,1] y[$9,$10] -->
    <rect id="lossRect" class="loss" x="76" y="76" width="30" height="28" />
    <!-- GAIN: revenue on the new (2nd) unit, $9 over x[1,2] down to the axis -->
    <rect id="gainRect" class="gain" x="106" y="104" width="30" height="252" />

    <!-- axes (over the rectangle fills; extended past the data so the demand
         line and arrowheads do not crowd) -->
    <line class="axis" x1="76" y1="356" x2="410" y2="356" marker-end="url(#arrow)" />
    <line class="axis" x1="76" y1="356" x2="76"  y2="36"  marker-end="url(#arrow)" />

    <!-- price + MR guide lines for the default (Q=2) state -->
    <line id="dropP"   class="drop"  x1="76" y1="104" x2="136" y2="104" />
    <line id="guideMR" class="guide" x1="76" y1="132"  x2="106" y2="132" />

    <!-- demand line P = 11 - Q, from (0,$11) to (10,$1) -->
    <line id="demand" class="curve" x1="76" y1="48" x2="376" y2="328" />

    <!-- old-price point (1,$10) and new-price point (2,$9) -->
    <circle id="ptOld" class="pt-old" cx="106" cy="76" r="4.5" />

    <!-- static $10 old-price tick + axis titles + x-axis unit numbers -->
    <text class="tick" x="68" y="76"  text-anchor="end" dominant-baseline="middle">$10</text>
    <text class="origin"  x="68"  y="372" text-anchor="end">O</text>
    <text class="axtitle" x="226" y="400" text-anchor="middle">Quantity</text>
    <text class="axtitle" x="12"  y="202" text-anchor="middle"
          transform="rotate(-90 12 202)">Price ($)</text>
    <g class="tick" text-anchor="middle">
      <text x="106" y="374">1</text><text x="136" y="374">2</text>
      <text x="166" y="374">3</text><text x="196" y="374">4</text>
      <text x="226" y="374">5</text><text x="256" y="374">6</text>
      <text x="286" y="374">7</text><text x="316" y="374">8</text>
      <text x="346" y="374">9</text><text x="376" y="374">10</text>
    </g>
    <!-- curve label at the UPPER tip: the draggable point travels the whole
         lower tail (out to Q=10), so a tail-end label would collide with it -->
    <text class="curvelbl" x="86" y="46" text-anchor="start">Demand</text>

    <!-- live price + MR axis labels (Q=2 state) -->
    <text id="lblP"  class="lbl-p"  x="68" y="104" text-anchor="end" dominant-baseline="middle">$9</text>
    <text id="lblMR" class="lbl-mr" x="68" y="132"  text-anchor="end" dominant-baseline="middle">MR $8</text>

    <!-- draggable new-price point (2,$9) + hit targets -->
    <line id="hitCurve" class="hit-curve" x1="76" y1="48" x2="376" y2="328" />
    <circle id="hit" class="hit" cx="136" cy="104" r="22" />
    <circle id="pt"  class="pt"  cx="136" cy="104" r="7" />
    <circle id="ptFocus" class="pt-focus hit" cx="136" cy="104" r="22"
            tabindex="0" role="slider" aria-label="Unit being sold, along the demand line"
            aria-valuemin="2" aria-valuemax="10" aria-valuenow="2"
            aria-valuetext="Selling the 2nd unit: gain $9 on the new unit, lose $1 on the 1st -- marginal revenue $8." />

    <!-- readout band -->
    <line class="sep" x1="44" y1="428" x2="396" y2="428" />
    <text id="rHint" class="r-hint" text-anchor="middle"><tspan x="220" y="448">Selling the 2nd unit: gain $9 on the new unit,</tspan><tspan x="220" y="464">lose $1 on the 1st &#8212; marginal revenue $8.</tspan></text>
    <text id="rTrade" class="r-trade" text-anchor="middle"><tspan x="220" y="492">Marginal revenue ($8) is below the price ($9),</tspan><tspan x="220" y="510">because the new unit&#8217;s price is cut on the old unit too.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image showing the
    2nd unit being sold: a demand line, a tall gain rectangle (the $9 revenue on the
    new unit) and a thin loss rectangle above it (the $1 price cut on the unit already
    sold), so marginal revenue is $8 &#8212; below the $9 price. The full static figure
    is <a href="t03b-ep2-4-marginal-revenue.svg">t03b-ep2-4-marginal-revenue.svg</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg      = document.getElementById('fig');
  var gainRect = document.getElementById('gainRect');
  var lossRect = document.getElementById('lossRect');
  var dropP    = document.getElementById('dropP');
  var guideMR  = document.getElementById('guideMR');
  var ptOld    = document.getElementById('ptOld');
  var pt       = document.getElementById('pt');
  var hit      = document.getElementById('hit');
  var ptFocus  = document.getElementById('ptFocus');
  var hitCurve = document.getElementById('hitCurve');
  var lblP     = document.getElementById('lblP');
  var lblMR    = document.getElementById('lblMR');
  var rHint    = document.getElementById('rHint');
  var rTrade   = document.getElementById('rTrade');
  var NS = 'http://www.w3.org/2000/svg';

  // pixel frame + scale (mirrors the static SVG markup above)
  var X0 = 76, Y0 = 356, DX = 30, DY = 28;
  var xq = function (q) { return X0 + q * DX; };   // quantity -> px x
  var py = function (p) { return Y0 - p * DY; };    // price/MR -> px y
  var toQ = function (px) { return (px - X0) / DX; };

  // model: demand P = 11 - Q (Table 8.1). Integer focus unit Q in [2,10].
  var QLO = 2, QHI = 10;
  function priceAt(q) { return 11 - q; }            // new price on unit q
  function oldPriceAt(q) { return 12 - q; }         // price on unit q-1 (= P(q-1))
  // MR(q) = gain - loss = (11-q) - (q-1) = 12 - 2q = TR(q) - TR(q-1)
  function mrAt(q) { return 12 - 2 * q; }

  var q = 2; // initial state (matches the static markup)

  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function ord(n) {
    var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }
  // signed dollars: 8 -> "$8", 0 -> "$0", -2 -> "-$2" (real minus sign)
  function money(v) { return '$' + Math.abs(v); }
  function signed(v) { return (v < 0 ? '−' : '') + '$' + Math.abs(v); }

  // Greedily word-wrap a readout string into <tspan> lines so it never overflows
  // the 440-wide viewBox (same approach as the sibling F4 widget). Used for BOTH
  // the muted state line and the accent takeaway line.
  function layout(el, str, y0, lineH, maxW) {
    var x = 220;
    while (el.firstChild) el.removeChild(el.firstChild);
    var probe = document.createElementNS(NS, 'tspan');
    el.appendChild(probe);
    var words = str.split(' '), lines = [], cur = words[0] || '';
    for (var i = 1; i < words.length; i++) {
      probe.textContent = cur + ' ' + words[i];
      if (probe.getComputedTextLength() > maxW) { lines.push(cur); cur = words[i]; }
      else { cur = cur + ' ' + words[i]; }
    }
    lines.push(cur);
    el.removeChild(probe);
    for (var j = 0; j < lines.length; j++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', x);
      t.setAttribute('y', y0 + j * lineH);
      t.textContent = lines[j];
      el.appendChild(t);
    }
  }

  function mutedLine(q) {
    var gain = priceAt(q), loss = q - 1, mr = mrAt(q);
    var infra = (loss === 1) ? 'the 1st' : ('the ' + loss + ' earlier units');
    return 'Selling the ' + ord(q) + ' unit: gain ' + money(gain) +
      ' on the new unit, lose ' + money(loss) + ' on ' + infra +
      ' — marginal revenue ' + signed(mr) + '.';
  }

  function accentLine(q) {
    if (q === 2) {
      return 'Marginal revenue ($8) is below the price ($9), because the new ' +
        'unit’s price is cut on the old unit too.';
    }
    if (q === 6) {
      return 'At the 6th unit marginal revenue is $0 — total revenue is at ' +
        'its peak; selling more now lowers it.';
    }
    if (q >= 7) {
      return 'Past the revenue peak, marginal revenue turns negative: one more ' +
        'unit lowers total revenue.';
    }
    return 'As output grows the loss on the inframarginal units bites harder, so ' +
      'marginal revenue keeps falling below price.';
  }

  function render() {
    var P = priceAt(q), oldP = oldPriceAt(q), mr = mrAt(q);
    var xNew = xq(q), yNew = py(P);
    var xOld = xq(q - 1), yOld = py(oldP);

    // GAIN rectangle: revenue on the new unit = new price x 1 unit, x[q-1,q]
    gainRect.setAttribute('x', xOld);
    gainRect.setAttribute('y', yNew);
    gainRect.setAttribute('width', DX);
    gainRect.setAttribute('height', Y0 - yNew);

    // LOSS rectangle: $1 price cut over the q-1 inframarginal units, x[0,q-1]
    lossRect.setAttribute('x', X0);
    lossRect.setAttribute('y', yOld);
    lossRect.setAttribute('width', xOld - X0);
    lossRect.setAttribute('height', yNew - yOld);

    // price dropline (new price to the y-axis)
    dropP.setAttribute('y1', yNew); dropP.setAttribute('y2', yNew);
    dropP.setAttribute('x2', xNew);

    // MR guide: on the y-axis at MR height when MR >= 0; hidden when negative
    if (mr >= 0) {
      var yMR = py(mr);
      guideMR.setAttribute('x1', X0); guideMR.setAttribute('x2', Math.max(xOld, X0 + 24));
      guideMR.setAttribute('y1', yMR); guideMR.setAttribute('y2', yMR);
      guideMR.style.display = '';
      lblMR.setAttribute('y', yMR);
    } else {
      guideMR.style.display = 'none';
      lblMR.setAttribute('y', Y0 + 30);   // below the x-axis, clear of the O origin
    }

    // points
    ptOld.setAttribute('cx', xOld); ptOld.setAttribute('cy', yOld);
    pt.setAttribute('cx', xNew);      pt.setAttribute('cy', yNew);
    hit.setAttribute('cx', xNew);     hit.setAttribute('cy', yNew);
    ptFocus.setAttribute('cx', xNew); ptFocus.setAttribute('cy', yNew);

    // axis labels
    lblP.setAttribute('y', yNew);
    lblP.textContent = money(P);
    lblMR.textContent = 'MR ' + signed(mr);

    // readout band (both lines wrap to fit the viewBox width)
    layout(rHint, mutedLine(q), 448, 16, 390);
    layout(rTrade, accentLine(q), 492, 18, 380);

    ptFocus.setAttribute('aria-valuenow', q);
    ptFocus.setAttribute('aria-valuetext', mutedLine(q));
  }

  // single state setter (clamp to integer units + no-op guard + render)
  function setQ(newQ) {
    if (isNaN(newQ)) return;
    var qq = Math.round(Math.max(QLO, Math.min(QHI, newQ)));
    if (qq === q) return;
    q = qq;
    render();
  }
  function setFromPointer(evt) { setQ(toQ(toSvg(evt).x)); }

  // --- drag (pointer events + pointer capture for fast drags) ---
  var dragging = false, capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  hit.addEventListener('pointerdown', onDown);
  hitCurve.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);

  // --- keyboard (arrows step one unit along the demand line) ---
  ptFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setQ(q + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setQ(q - 1); }
    else return;
    evt.preventDefault();
  });

  // Debug hook: lets a reviewer screenshot non-initial states via scripting.
  window.__fig = {
    set: function (v) { setQ(+v); },
    get: function () {
      return { q: q, price: priceAt(q), gain: priceAt(q), loss: q - 1, mr: mrAt(q) };
    }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
