<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Middlemen carry the market to equilibrium: drag the cost wedge tighter and watch trade start</title>
<!--
  t02-ep3-3-middlemen-interactive.html — ROUND 3, 2026-08-06 (instructor: the
  diagram should START at 20 bottles of water and then move toward the
  equilibrium, highlighting how middlemen bring the market to equilibrium).
  Round 2 was the first interactive build (instructor: the middlemen diagram
  on the website should be interactive).

  Course-adapted, interactive version of E&P Fig 3-3 "Exchange With
  Transactions Costs With And Without Middlemen" (p. 49). The source's two
  stacked panels (A: costs 1.5 cents, B: middleman at 0.75) become ONE panel
  with a DRAGGABLE COST WEDGE: two dashed price lines symmetric around the
  0.6 crossing — Sam's full price 0.6 + c/2 and Joe's net 0.6 - c/2 — where
  c is the per-bottle cost of arranging the trade. Dragging either line (or
  either stop dot) changes c; trade runs to where the worth gap equals c:
  q = (0.8 - c)/0.08 bottles.

  DEFAULT / NO-JS STATE = c = 0.8, THE NO-TRADE START: the wedge lines pass
  exactly through the two endowment dots (Sam's full price 1.0, Joe's net
  0.2), the wedge swallows the whole initial worth gap, q = 0, and both men
  still hold their 20 bottles. Dragging the wedge TIGHTER is cheaper and
  cheaper middlemen: the stop dots travel out from the 20-bottle start
  toward the 30-bottle crossing, which is how middlemen bring the market to
  equilibrium. The source's A and B panels are the c = 0.4 (arranging it
  yourselves) and c = 0.2 (the newcomer's rate) stops; c = 0 is free trading
  (the ep3-2 crossing). The stacked static t02-ep3-3-middlemen-web.svg
  remains as the noscript fallback; the FAU slide asset keeps the two-panel
  form.

  Numbers (shared t02 system): Sam w = 1.8 - 0.04x, Joe w = 0.04x - 0.6;
  equal start at 20 bottles each (worths 1.0 / 0.2); crossing (30, 0.6).
  Each side's gain at cost c: (1/2) q (0.4 - c/2); arranging absorbs c times q.
  c = 0.4 -> 5 bottles, 0.80/0.40, gains 0.50 each, costs eat 2.00;
  c = 0.2 -> 7.5 bottles, 0.70/0.50 (the prose's paid-7/received-5 per
  bottle), gains 1.13 each, the cut 1.50.

  GEOMETRY (round 3: taller y window, matched EXACTLY to t02-ep3-2's round-3
  reframe): viewBox 720x460, aspect 16/10, max-width 640; X(b) = 64 + 15.5b,
  Y(v) = 366 - 172v (y window 0..1.85). Sam's worth line (0,1.8)=(64,56.4)
  to (38,0.28)=(653,317.84); Joe's (15.5,0.02)=(304.25,362.56) to
  (40,1.0)=(684,194); y ticks every 0.2 from 0.2 to 1.8 on both twin axes
  (tick text baseline = Y(v) + 4, the file's centering convention); axis
  lines y 44..366; initial dots (374,194)/(374,331.6); crossing (529,262.8).
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink:     #1a1c1e;
    --text:    #16181a;
    --muted:   #5c6066;
    --hairline:#e3ddd3;
    --accent:  #b07a2c;
    --accent-tint: #efe4d2;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;            /* grid, not flex — see t03b-ue8-1 mobile note */
    place-items: center;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 640px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; }
  .worth  { stroke: var(--ink); stroke-width: 2.6; fill: none;
            stroke-linecap: round; }
  .drop   { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .dropmut { stroke: var(--muted); stroke-width: 1.2; fill: none;
             stroke-dasharray: 2 3; opacity: 0.8; }
  .wedge  { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5;
            cursor: ns-resize; }
  .wedgehit { stroke: transparent; stroke-width: 26; fill: none;
              touch-action: none; cursor: ns-resize; }
  .gain   { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1;
            fill-opacity: 0.9; }
  .cost   { fill: var(--muted); fill-opacity: 0.13; }
  .dot    { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .dotmut { fill: var(--muted); stroke: var(--surface); stroke-width: 1.5; }
  .sdot   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit-dot { fill: transparent; stroke: transparent; touch-action: none;
             cursor: grab; }
  .grabbing, .grabbing .hit-dot, .grabbing .wedgehit { cursor: grabbing; }
  .pt-focus:focus-visible { outline: none; }
  .focusring { opacity: 0; stroke: var(--accent); stroke-width: 1.5; fill: none;
               stroke-dasharray: 3 3; }
  .pt-focus:focus-visible ~ .focusring { opacity: 1; }
  .grabbing .sdot { stroke: var(--accent); stroke-width: 3.5; }

  .tick    { fill: var(--muted); font-size: 11px; font-weight: 400; }
  .rowlbl  { fill: var(--muted); font-size: 11px; font-weight: 700; }
  .axlabel { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .wlabel  { fill: var(--ink); font-size: 12px; font-weight: 600;
             font-style: italic; }
  .glabel  { fill: var(--accent); font-size: 11.5px; font-weight: 700; }
  .ptag    { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .mutlbl  { fill: var(--muted); font-size: 10.5px; font-weight: 600; }
  .tagbg   { fill: var(--surface); opacity: 0.9; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .r-state { fill: var(--muted); font-size: 12.5px; }
  .r-take  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .hintln  { fill: var(--muted); font-size: 12px; }

  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 720 510" role="group"
       aria-label="Sam's and Joe's personal-worth lines on the shared 40-bottle frame, with a draggable cost wedge: two dashed price lines symmetric around the 0.6 crossing. The upper line is Sam's full price, the price plus his share of the cost of arranging a trade; the lower is Joe's net after his share. The figure opens at a cost of 0.8 bars a bottle, where the wedge swallows the whole worth gap between the two men: not one bottle is worth trading and both still hold the 20 they started with. Trade runs only while the gap between the worths covers the cost, so dragging the wedge tighter — cheaper and cheaper middlemen — starts trade and carries both men out toward the crossing at 30 bottles. Drag either line: at 0.4 bars per bottle, arranging it yourselves, 5 of the 10 gainful bottles trade; at 0.2, a newcomer's cheaper rate, trade grows to 7.5 and both gains grow; at zero all 10 move and the market reaches the crossing.">
    <title>Middlemen carry the market to equilibrium: start at the no-trade wall, then drag the cost wedge tighter</title>

    <!-- ===================== static base (c = 0.8, the no-trade start) ====== -->

    <!-- gains and the cost band (JS reshapes; empty at the no-trade start) -->
    <path id="gainS" class="gain" d=""/>
    <path id="gainJ" class="gain" d=""/>
    <rect id="costBand" class="cost" x="374" y="194" width="0" height="137.6"/>
    <!-- gain labels ride the middle of each gain band (JS moves them); they
         hide once the band is too thin to hold them -->
    <text id="gLblS" class="glabel" x="364" y="214" text-anchor="end"
          visibility="hidden">Sam&#8217;s gain</text>
    <text id="gLblJ" class="glabel" x="364" y="322" text-anchor="end"
          visibility="hidden">Joe&#8217;s gain</text>
    <rect id="costBg" class="tagbg" x="314" y="257" width="120" height="14"
          visibility="hidden"/>
    <text id="costLbl" class="mutlbl" x="374" y="266" text-anchor="middle"
          visibility="hidden">the arranging costs</text>

    <!-- axes: twin y axes, one shared x base -->
    <line class="axis" x1="64"  y1="44" x2="64"  y2="366"/>
    <line class="axis" x1="684" y1="44" x2="684" y2="366"/>
    <line class="axis" x1="64"  y1="366" x2="700" y2="366"/>

    <!-- y ticks, mirrored (baseline = Y(v) + 4) -->
    <g class="tick" text-anchor="end">
      <text x="58" y="335.6">0.2</text><text x="58" y="301.2">0.4</text>
      <text x="58" y="266.8">0.6</text><text x="58" y="232.4">0.8</text>
      <text x="58" y="198">1.0</text><text x="58" y="163.6">1.2</text>
      <text x="58" y="129.2">1.4</text><text x="58" y="94.8">1.6</text>
      <text x="58" y="60.4">1.8</text>
    </g>
    <g class="tick" text-anchor="start">
      <text x="690" y="335.6">0.2</text><text x="690" y="301.2">0.4</text>
      <text x="690" y="266.8">0.6</text><text x="690" y="232.4">0.8</text>
      <text x="690" y="198">1.0</text><text x="690" y="163.6">1.2</text>
      <text x="690" y="129.2">1.4</text><text x="690" y="94.8">1.6</text>
      <text x="690" y="60.4">1.8</text>
    </g>
    <text class="axlabel" transform="rotate(-90 16 205)" x="16" y="205"
          text-anchor="middle">Granola bars per bottle</text>

    <!-- two x rows -->
    <g class="tick" text-anchor="middle">
      <text x="64" y="382">0</text><text x="219" y="382">10</text>
      <text x="374" y="382">20</text><text x="529" y="382">30</text>
      <text x="684" y="382">40</text>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="64" y="397">40</text><text x="219" y="397">30</text>
      <text x="374" y="397">20</text><text x="529" y="397">10</text>
      <text x="684" y="397">0</text>
    </g>
    <text class="rowlbl" x="130" y="382" text-anchor="start">Sam &#8594;</text>
    <text class="rowlbl" x="618" y="397" text-anchor="end">&#8592; Joe</text>
    <text class="axlabel" x="374" y="414" text-anchor="middle">Bottles of water &#8212; 40 in all</text>

    <!-- the equal start (both hold 20) and the free-trading reference -->
    <line class="drop" x1="374" y1="194" x2="374" y2="366"/>
    <line class="dropmut" x1="529" y1="262.8" x2="529" y2="366"/>
    <text class="mutlbl" x="540" y="347">with free trading,</text>
    <text class="mutlbl" x="540" y="360">30 bottles move</text>

    <!-- where trade stops under the current cost (JS moves; nothing trades
         at the no-trade start, so it opens hidden) -->
    <line id="dropStop" class="drop" x1="374" y1="194" x2="374" y2="366"
          visibility="hidden"/>

    <!-- personal-worth lines (the ep3-2 frame) -->
    <line class="worth" x1="64"     y1="56.4"  x2="653" y2="317.84"/>
    <line class="worth" x1="304.25" y1="362.56" x2="684" y2="194"/>
    <text class="wlabel" x="196" y="104">Sam&#8217;s personal worth</text>
    <!-- Joe's label rides the upper tip of his line: the wedge sweeps the whole
         band y 194..331.6, so a label anywhere lower collides at some cost -->
    <text class="wlabel" x="676" y="179" text-anchor="end">Joe&#8217;s personal worth</text>

    <!-- the draggable cost wedge (opens at c = 0.8: the lines pass through
         the two endowment dots, so the whole worth gap is eaten) -->
    <g id="wedgeG">
      <line id="wFull" class="wedge" x1="64" y1="194" x2="684" y2="194"/>
      <line id="wNet"  class="wedge" x1="64" y1="331.6" x2="684" y2="331.6"/>
      <rect id="tagFullBg" class="tagbg" x="68" y="175" width="152" height="15"/>
      <text id="tagFull" class="ptag" x="70" y="187">1.00 &#183; Sam&#8217;s full price</text>
      <rect id="tagNetBg" class="tagbg" x="68" y="335.6" width="110" height="15"/>
      <text id="tagNet" class="ptag" x="70" y="347.6">0.20 &#183; Joe&#8217;s net</text>
      <line id="wFullHit" class="wedgehit" x1="64" y1="194" x2="684" y2="194"/>
      <line id="wNetHit"  class="wedgehit" x1="64" y1="331.6" x2="684" y2="331.6"/>
    </g>

    <!-- keyboard proxy (slider over the cost). It paints over the wedge hit
         lines (ep2-11 lesson: it must also start drags) but UNDER the stop
         dots' hit circles, which at the no-trade start sit on the wedge at
         20 bottles and must stay draggable sideways. -->
    <rect id="cFocus" class="pt-focus" x="64" y="186" width="620" height="16"
          fill="transparent" tabindex="0" role="slider"
          aria-label="Cost of arranging a trade, in granola bars per bottle"
          aria-valuemin="0" aria-valuemax="0.8" aria-valuenow="0.80"
          aria-valuetext="Cost 0.80 a bottle. 0 bottles trade; each side gains 0.00 bars; 0.00 bars go to arranging. The cost of arranging swallows the whole worth gap - no one trades; both men sit at 20 bottles."/>
    <rect id="focusRing" class="focusring" x="60" y="182" width="628" height="24" rx="4"/>

    <!-- initial dots -->
    <circle class="dot" cx="374" cy="194" r="4.5"/>
    <circle class="dot" cx="374" cy="331.6" r="4.5"/>
    <!-- the free-trading crossing -->
    <circle class="dotmut" cx="529" cy="262.8" r="3.5"/>

    <!-- stop dots ride the worth lines (JS moves); they open ON the
         endowment dots, where the men still hold their 20 bottles -->
    <circle id="sdotS" class="sdot" cx="374" cy="194" r="6"/>
    <circle id="sdotJ" class="sdot" cx="374" cy="331.6" r="6"/>
    <circle id="hitStopS" class="hit-dot" cx="374" cy="194" r="24"/>
    <circle id="hitStopJ" class="hit-dot" cx="374" cy="331.6" r="24"/>

    <!-- readout band -->
    <line class="sep" x1="16" y1="424" x2="704" y2="424"/>
    <text id="rState" class="r-state" x="360" y="440" text-anchor="middle">Costs 0.80 a bottle: 0 bottles trade &#183; each side gains 0.00 bars &#183; 0.00 bars go to arranging</text>
    <text id="rTake" class="r-take" x="360" y="456" text-anchor="middle">The cost of arranging swallows the whole worth gap &#8212; no one trades; both men sit at 20 bottles</text>
  
    <text class="hintln" x="360" y="481" text-anchor="middle">Start where costs are so high that no one trades. Drag the wedge tighter &#8212; cheaper and cheaper middlemen &#8212;</text>
    <text class="hintln" x="360" y="499" text-anchor="middle">and watch trade carry both men toward the crossing (arrow keys work too). Try 0.40, then 0.20, then zero.</text>
  </svg>


  <noscript>
    <p class="fallback">The interactive view needs JavaScript. See the
      <a href="t02-ep3-3-middlemen-web.svg">static version of this figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';

  // ---- geometry (must mirror the base markup) ----
  function X (b) { return 64 + 15.5 * b; }
  function Y (v) { return 366 - 172 * v; }
  var CMIN = 0, CMAX = 0.8, STEP = 0.05;

  // ---- economics (see interactive-specs.md) ----
  // trade runs to q = (0.8 - c)/0.08; each side gains (1/2) q (0.4 - c/2)
  function qOf (c) { return (0.8 - c) / 0.08; }
  function gainOf (c) { var q = qOf(c); return 0.5 * q * (0.4 - c / 2); }

  var svg = document.getElementById('fig');
  var $ = function (id) { return document.getElementById(id); };
  var c = 0.8;                         // opens at the no-trade wall

  function f2 (v) { return v.toFixed(2); }
  function fq (q) {
    return Math.abs(q - Math.round(q)) < 1e-9 ? String(Math.round(q)) : q.toFixed(1);
  }

  function render () {
    var vFull = 0.6 + c / 2, vNet = 0.6 - c / 2;
    var yF = Y(vFull), yN = Y(vNet);
    var q = qOf(c), xs = X(20 + q);

    // wedge lines + hit zones + tags + proxy
    ['wFull', 'wFullHit'].forEach(function (id) {
      $(id).setAttribute('y1', yF); $(id).setAttribute('y2', yF);
    });
    ['wNet', 'wNetHit'].forEach(function (id) {
      $(id).setAttribute('y1', yN); $(id).setAttribute('y2', yN);
    });
    $('tagFull').setAttribute('y', yF - 7);
    $('tagFullBg').setAttribute('y', yF - 19);
    $('tagFull').textContent = f2(vFull) + ' · Sam’s full price';
    $('tagNet').setAttribute('y', yN + 16);
    $('tagNetBg').setAttribute('y', yN + 4);
    $('tagNet').textContent = f2(vNet) + ' · Joe’s net';
    $('cFocus').setAttribute('y', yF - 8);
    $('focusRing').setAttribute('y', yF - 12);

    // stop dots + dropline
    $('sdotS').setAttribute('cx', xs); $('sdotS').setAttribute('cy', yF);
    $('sdotJ').setAttribute('cx', xs); $('sdotJ').setAttribute('cy', yN);
    $('hitStopS').setAttribute('cx', xs); $('hitStopS').setAttribute('cy', yF);
    $('hitStopJ').setAttribute('cx', xs); $('hitStopJ').setAttribute('cy', yN);
    $('dropStop').setAttribute('x1', xs); $('dropStop').setAttribute('x2', xs);
    $('dropStop').setAttribute('y1', yF);
    $('dropStop').setAttribute('visibility', q > 0 ? 'visible' : 'hidden');

    // gains + cost band
    $('gainS').setAttribute('d', q <= 0 ? '' :
      'M374,194 L' + xs + ',' + yF + ' L374,' + yF + ' Z');
    $('gainJ').setAttribute('d', q <= 0 ? '' :
      'M374,' + yN + ' L' + xs + ',' + yN + ' L374,331.6 Z');
    $('costBand').setAttribute('x', 374);
    $('costBand').setAttribute('y', yF);
    $('costBand').setAttribute('width', Math.max(0, xs - 374));
    $('costBand').setAttribute('height', Math.max(0, yN - yF));
    // each gain band runs 194..yF (Sam) and yN..331.6 (Joe), both 68.8 - 86c
    // tall; centre the label in it, and drop the label once it no longer fits
    var band = yF - 194, showGain = q > 0 && band >= 24;
    $('gLblS').setAttribute('y', (194 + yF) / 2 + 4);
    $('gLblJ').setAttribute('y', (yN + 331.6) / 2 + 4);
    $('gLblS').setAttribute('visibility', showGain ? 'visible' : 'hidden');
    $('gLblJ').setAttribute('visibility', showGain ? 'visible' : 'hidden');
    var showCost = c >= 0.15 && q >= 3 && (xs - 374) >= 90;
    $('costLbl').setAttribute('visibility', showCost ? 'visible' : 'hidden');
    $('costBg').setAttribute('visibility', showCost ? 'visible' : 'hidden');
    $('costLbl').setAttribute('x', (374 + xs) / 2);
    $('costLbl').setAttribute('y', (yF + yN) / 2 + 4);
    $('costBg').setAttribute('x', (374 + xs) / 2 - 60);
    $('costBg').setAttribute('y', (yF + yN) / 2 - 6);

    // readout
    var g = gainOf(c), eaten = c * qOf(c);
    $('rState').textContent = 'Costs ' + f2(c) + ' a bottle: ' + fq(q) +
      (Math.abs(q - 1) < 1e-9 ? ' bottle trades' : ' bottles trade') +
      ' · each side gains ' + f2(g) + ' bars · ' + f2(eaten) +
      ' bars go to arranging';
    var take;
    if (c <= 1e-9) {
      take = 'Free trading — all 10 bottles move and the whole 4.00-bar gain is captured';
    } else if (Math.abs(c - 0.2) < 1e-9) {
      take = 'The newcomer’s 0.20 rate — he hands back gains the higher costs were eating';
    } else if (Math.abs(c - 0.4) < 1e-9) {
      take = 'Trading on your own is costly — half the gainful bottles never move';
    } else if (c >= 0.8 - 1e-9) {
      take = 'The cost of arranging swallows the whole worth gap — no one trades; both men sit at 20 bottles';
    } else if (c < 0.4) {
      take = 'Cheaper middlemen carry the market toward the crossing — more bottles move and both gains grow';
    } else {
      take = 'Costlier arranging chokes off more of the trade';
    }
    $('rTake').textContent = take;

    var pf = $('cFocus');
    pf.setAttribute('aria-valuenow', c.toFixed(2));
    pf.setAttribute('aria-valuetext', 'Cost ' + f2(c) + ' a bottle. ' + fq(q) +
      ' bottles trade; each side gains ' + f2(g) + ' bars; ' + f2(eaten) +
      ' bars go to arranging. ' + take.replace(/—/g, '-') + '.');
  }

  function clampSnap (v) {
    v = Math.max(CMIN, Math.min(CMAX, v));
    return Math.round(v / STEP) * STEP;
  }

  // ---- pointer drag: wedge lines map by y, stop dots map by x ----
  function svgPoint (evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = null;   // 'wedge' | 'stop'
  function onDown (mode) {
    return function (evt) {
      dragging = mode;
      svg.classList.add('grabbing');
      if (evt.pointerId !== undefined && evt.target.setPointerCapture) {
        try { evt.target.setPointerCapture(evt.pointerId); } catch (e) {}
      }
      evt.preventDefault();
    };
  }
  function onMove (evt) {
    if (!dragging) return;
    var p = svgPoint(evt), v;
    if (dragging === 'stop') {
      var q = Math.max(0, Math.min(10, (p.x - 64) / 15.5 - 20));
      v = clampSnap(0.8 - 0.08 * q);
    } else {
      // each wedge line clamps to its own side of 0.6 so the drag never reverses
      var val = (366 - p.y) / 172;
      if (dragging === 'wedgeTop') { val = Math.max(0.6, val); }
      else { val = Math.min(0.6, val); }
      v = clampSnap(2 * Math.abs(val - 0.6));
    }
    if (Math.abs(v - c) > 1e-9) { c = v; render(); }
  }
  function onUp (evt) {
    dragging = null;
    svg.classList.remove('grabbing');
    if (evt.pointerId !== undefined && evt.target.releasePointerCapture) {
      try { evt.target.releasePointerCapture(evt.pointerId); } catch (e) {}
    }
  }
  // cFocus paints over wFullHit's central band (ep2-11 lesson): it must also
  // start drags
  $('wFullHit').addEventListener('pointerdown', onDown('wedgeTop'));
  $('wNetHit').addEventListener('pointerdown', onDown('wedgeBot'));
  $('cFocus').addEventListener('pointerdown', onDown('wedgeTop'));
  ['hitStopS', 'hitStopJ'].forEach(function (id) {
    $(id).addEventListener('pointerdown', onDown('stop'));
  });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);

  // ---- keyboard: arrows change the cost ----
  $('cFocus').addEventListener('keydown', function (evt) {
    var v = c;
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') v = c + STEP;
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') v = c - STEP;
    else if (evt.key === 'Home') v = CMIN;
    else if (evt.key === 'End') v = CMAX;
    else return;
    evt.preventDefault();
    v = clampSnap(v);
    if (Math.abs(v - c) > 1e-9) { c = v; render(); }
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (v) { c = clampSnap(Number(v)); render(); return c; },
    get: function () {
      return { cost: c, traded: +qOf(c).toFixed(2),
               gainEach: +gainOf(c).toFixed(2),
               eaten: +(c * qOf(c)).toFixed(2) };
    }
  };

  render();
})();
</script>
</body>
</html>
