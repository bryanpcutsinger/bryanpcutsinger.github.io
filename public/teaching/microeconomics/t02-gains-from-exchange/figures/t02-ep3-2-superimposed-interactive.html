<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trade slides both traders along their worth lines: drag past the crossing to see why they stop</title>
<!--
  t02-ep3-2-superimposed-interactive.html — ROUND 3 REBUILD 2026-08-06
  (instructor feedback on the round-2 build; see interactive-specs.md).

  Course-adapted, construction-faithful version of E&P Fig 3-2 "Gains From
  Exchange: Superimposed Marginal Value Lines" (p. 48) merged with UE Fig 6.2
  (p. 83). Double-origin frame: 40 bottles in all; Sam's holdings read
  left-to-right from 0_Sam, Joe's right-to-left from 0_Joe. Both traders START
  AT THE SAME ALLOCATION — the single X1 dropline through both initial dots
  (20 bottles each; worths 1.0 vs 0.2) is the source's equal-start device.

  ROUND-3 CHANGES (instructor, 2026-08-06):
  1. RE-FRAMED TO KILL THE RIGHT SKEW. Round 2 still bunched both curves in
     the right half because the y window (0..1.6) forced the segments to start
     mid-frame. The window is now 0..1.85, so Sam's line can be anchored AT the
     left axis at 1.8 — UE Fig 6.2's own construction — and run clear across to
     (38, 0.28), while Joe's runs from just above the axis at (15.5, 0.02) up to
     the right axis at (40, 1.0). Both curves now span the frame.
     Mapping: X(b) = 64 + 15.5b ; Y(v) = 366 - 172v.
  2. DEFAULT STATE IS THE ENDOWMENT (q = 0, 20 bottles each). The static base
     markup IS the q = 0 picture: no captured-gain fill, the whole bowtie in the
     fainter "still on the table" tint, the brass worth-gap connector open
     between the two starting dots. The script only attaches behavior.
  3. OVERSHOOT FEATURED. q is draggable to 12 (32 bottles for Sam). Past the
     crossing at 30 the two loss wedges shade and the takeaway says why the
     traders stop there. The hint invites dragging past the crossing.

  ROUND-3 CHECKER FIXES (same day): the overshoot wedges now carry a solid
  muted edge and a "Loss to both" label, so the first step past the crossing
  is visible and named; the q = 10 state line reports worths AT the holdings
  (0.60 / 0.60) instead of the marginal 31st bottle, which contradicted the
  takeaway; the transfer-arc label rides the arc (clamped at x = 430) and lost
  its backing rect, which had been erasing the crossing dropline; the gain
  labels lead into their regions with accent arrows; and the worth-gap
  connector hides once the dots are within 18px, where it degenerated into a
  stray round-cap dot (q = 9).

  Numbers (shared t02 system): Sam w = 1.8 - 0.04x, Joe w = 0.04x - 0.6
  (downward in HIS OWN holdings; appears rising because his origin is the
  right edge); crossing (30, 0.6); full trade 10 bottles; gains 2 + 2 bars.
  The source's unexplained X2 axis dot stays omitted (spec deviation note 4).

  GEOMETRY: viewBox 720x460 (embed aspect-ratio 16/10, max-width 640).
  Initial dots (374,194)/(374,331.6); crossing (529,262.8); price line 262.8.
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink:     #1a1c1e;
    --text:    #16181a;
    --muted:   #5c6066;
    --hairline:#e3ddd3;
    --accent:  #b07a2c;
    --accent-tint: #efe4d2;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;            /* grid, not flex — see t03b-ue8-1 mobile note */
    place-items: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 640px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; }
  .worth  { stroke: var(--ink); stroke-width: 2.6; fill: none;
            stroke-linecap: round; }
  .drop   { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .dropmut { stroke: var(--muted); stroke-width: 1.2; fill: none;
             stroke-dasharray: 2 3; opacity: 0.8; }
  .price  { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 7 5; }
  .gain   { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1;
            fill-opacity: 0.9; }
  .gainrest { fill: var(--accent-tint); fill-opacity: 0.4; stroke: none; }
  /* the overshoot wedges are tiny at q = 11 (about 15 x 7 px): they need a
     solid edge, not a dashed hairline, to read at the first step past 30 */
  .loss   { fill: var(--muted); fill-opacity: 0.34; stroke: var(--muted);
            stroke-width: 1.6; }
  .gap    { stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
  .arc    { stroke: var(--muted); stroke-width: 1.6; fill: none; }
  .dot    { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .tdot   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }

  .hit-curve { fill: none; stroke: transparent; stroke-width: 28;
               touch-action: none; cursor: grab; }
  .hit-dot   { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .grabbing, .grabbing .hit-curve, .grabbing .hit-dot { cursor: grabbing; }
  .pt-focus:focus-visible { outline: none; }
  .focusring { opacity: 0; stroke: var(--accent); stroke-width: 1.5; fill: none;
               stroke-dasharray: 3 3; }
  .pt-focus:focus-visible ~ .focusring { opacity: 1; }
  .grabbing .tdot { stroke: var(--accent); stroke-width: 3.5; }

  .tick    { fill: var(--muted); font-size: 11px; font-weight: 400; }
  .rowlbl  { fill: var(--muted); font-size: 11px; font-weight: 700; }
  .axlabel { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .wlabel  { fill: var(--ink); font-size: 12px; font-weight: 600;
             font-style: italic; }
  .glabel  { fill: var(--accent); font-size: 11.5px; font-weight: 700; }
  .glead   { stroke: var(--accent); stroke-width: 1.2; fill: none; }
  .losslbl { fill: var(--muted); font-size: 11.5px; font-weight: 700; }
  .losslead { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .arclbl  { fill: var(--muted); font-size: 11.5px; font-weight: 600; }
  .pricetag { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .tagbg   { fill: var(--surface); opacity: 0.9; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .r-state { fill: var(--muted); font-size: 12.5px; }
  .r-take  { fill: var(--accent); font-size: 13px; font-weight: 600; }

  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 2px;
          text-align: center; }
  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 720 460" role="group"
       aria-label="Sam's and Joe's personal-worth lines superimposed on one frame holding all 40 bottles. Sam's line runs from the top of the left axis down across the frame; Joe's rises from near the axis on the left to the top of the right axis. The figure opens at the starting allocation: 20 bottles each, marked by one dashed vertical through both starting dots, where a bottle is worth 1.0 granola bars to Sam but only 0.2 to Joe, and a brass connector shows the whole gap still open between them. Drag either brass dot along its worth line to trade: both dots move together, Sam sliding down his line and Joe up his own, until the worths meet at the crossing, 0.6 bars per bottle with Sam holding 30 and Joe 10. The shaded bowtie is the captured gain; the fainter shading is gain still on the table. Drag past the crossing and both traders take shaded losses.">
    <title>Trade slides both traders along their own worth lines to the crossing, and past it both would lose</title>

    <!-- ===================== static base (q = 0 state) ====================== -->

    <!-- captured gains (JS reshapes) + fainter still-on-the-table shading -->
    <path id="gainS" class="gain" d=""/>
    <path id="gainJ" class="gain" d=""/>
    <path id="restS" class="gainrest" d="M374,194 L529,262.8 L374,262.8 Z"/>
    <path id="restJ" class="gainrest" d="M374,262.8 L529,262.8 L374,331.6 Z"/>
    <path id="lossS" class="loss" d="" visibility="hidden"/>
    <path id="lossJ" class="loss" d="" visibility="hidden"/>
    <!-- gain labels sit left of the frame's shading and lead into it with a
         thin accent arrow (the .tex does the same), stopping short of the ink -->
    <text class="glabel" x="340" y="230" text-anchor="end">Sam&#8217;s gain</text>
    <line class="glead" x1="344" y1="226" x2="370" y2="226" marker-end="url(#arrowAcc)"/>
    <text class="glabel" x="340" y="308" text-anchor="end">Joe&#8217;s gain</text>
    <line class="glead" x1="344" y1="304" x2="370" y2="304" marker-end="url(#arrowAcc)"/>

    <!-- named only past the crossing: why the traders stop (JS toggles) -->
    <text id="lossLbl" class="losslbl" x="634" y="250" text-anchor="middle"
          visibility="hidden">Loss to both</text>
    <line id="lossLead" class="losslead" x1="596" y1="252" x2="572" y2="257"
          visibility="hidden"/>

    <!-- axes: twin y axes (both origins), one shared x base -->
    <line class="axis" x1="64"  y1="44" x2="64"  y2="366"/>
    <line class="axis" x1="684" y1="44" x2="684" y2="366"/>
    <line class="axis" x1="64"  y1="366" x2="700" y2="366"/>

    <!-- y ticks, mirrored on both axes (the sources' twin cent scales) -->
    <g class="tick" text-anchor="end">
      <text x="58" y="335.6">0.2</text><text x="58" y="301.2">0.4</text>
      <text x="58" y="266.8">0.6</text><text x="58" y="232.4">0.8</text>
      <text x="58" y="198">1.0</text><text x="58" y="163.6">1.2</text>
      <text x="58" y="129.2">1.4</text><text x="58" y="94.8">1.6</text>
      <text x="58" y="60.4">1.8</text>
    </g>
    <g class="tick" text-anchor="start">
      <text x="690" y="335.6">0.2</text><text x="690" y="301.2">0.4</text>
      <text x="690" y="266.8">0.6</text><text x="690" y="232.4">0.8</text>
      <text x="690" y="198">1.0</text><text x="690" y="163.6">1.2</text>
      <text x="690" y="129.2">1.4</text><text x="690" y="94.8">1.6</text>
      <text x="690" y="60.4">1.8</text>
    </g>
    <text class="axlabel" transform="rotate(-90 16 205)" x="16" y="205"
          text-anchor="middle">Granola bars per bottle</text>

    <!-- two x rows: Sam counts from the left origin, Joe from the right -->
    <g class="tick" text-anchor="middle">
      <text x="64" y="382">0</text><text x="219" y="382">10</text>
      <text x="374" y="382">20</text><text x="529" y="382">30</text>
      <text x="684" y="382">40</text>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="64" y="397">40</text><text x="219" y="397">30</text>
      <text x="374" y="397">20</text><text x="529" y="397">10</text>
      <text x="684" y="397">0</text>
    </g>
    <text class="rowlbl" x="130" y="382" text-anchor="start">Sam &#8594;</text>
    <text class="rowlbl" x="618" y="397" text-anchor="end">&#8592; Joe</text>
    <text class="axlabel" x="374" y="414" text-anchor="middle">Bottles of water &#8212; 40 in all</text>

    <!-- the equal start: ONE dropline through BOTH initial dots (each holds 20) -->
    <line class="drop" x1="374" y1="194" x2="374" y2="366"/>

    <!-- the crossing: where the two worths are equal -->
    <line class="dropmut" x1="529" y1="262.8" x2="529" y2="366"/>

    <!-- the equilibrium-sustaining price through the crossing (static) -->
    <line class="price" x1="64" y1="262.8" x2="684" y2="262.8"/>
    <rect class="tagbg" x="68" y="243" width="164" height="15"/>
    <text class="pricetag" x="70" y="255">Price settles at 0.60 a bottle</text>

    <!-- personal-worth lines, spanning the frame (round-3 re-framing) -->
    <line class="worth" x1="64"     y1="56.4"   x2="653" y2="317.84"/>
    <line class="worth" x1="304.25" y1="362.56" x2="684" y2="194"/>
    <text class="wlabel" x="196" y="104">Sam&#8217;s personal worth</text>
    <text class="wlabel" x="676" y="179" text-anchor="end">Joe&#8217;s personal worth</text>

    <!-- transfer arc: the bottles that have changed hands (JS reshapes) -->
    <path id="arcT" class="arc" d="M374,358 Q467,350 560,358"
          marker-end="url(#arrowMuted)" visibility="hidden"/>
    <!-- no tagbg: the band between the two droplines is clear, and a backing
         rect erased the crossing dropline. JS keeps the label over the arc. -->
    <text id="arcLbl" class="arclbl" x="430" y="345" text-anchor="middle">No trades yet</text>

    <!-- initial endowment dots (fixed): the same 20 bottles each -->
    <circle class="dot" cx="374" cy="194" r="4.5"/>
    <circle class="dot" cx="374" cy="331.6" r="4.5"/>

    <!-- the worth gap still open between the two traders (JS moves) -->
    <line id="gapLn" class="gap" x1="374" y1="201" x2="374" y2="324.6"/>

    <!-- the trading dots: drag either; they always share one x (JS moves) -->
    <circle id="dotS" class="tdot" cx="374" cy="194" r="6"/>
    <circle id="dotJ" class="tdot" cx="374" cy="331.6" r="6"/>

    <!-- hit targets: wide strokes along each curve's draggable span + fat dots -->
    <line id="hitS" class="hit-curve" x1="374" y1="194" x2="560" y2="276.56"/>
    <line id="hitJ" class="hit-curve" x1="374" y1="331.6" x2="560" y2="249.04"/>
    <circle id="hitDotS" class="hit-dot" cx="374" cy="194" r="26"/>
    <circle id="hitDotJ" class="hit-dot" cx="374" cy="331.6" r="26"/>

    <!-- keyboard proxy (slider over the traded quantity) -->
    <rect id="qFocus" class="pt-focus" x="348" y="168" width="52" height="52"
          fill="transparent" tabindex="0" role="slider"
          aria-label="Bottles traded, sliding both traders along their personal-worth lines from the equal start of 20 bottles each"
          aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"
          aria-valuetext="At the 20-bottle start: the next bottle is worth 0.98 to Sam, 0.22 to Joe. Their worths still differ - the next trade creates 0.76 bars of gain."/>
    <rect id="focusRing" class="focusring" x="344" y="164" width="60" height="60" rx="6"/>

    <!-- readout band -->
    <line class="sep" x1="16" y1="424" x2="704" y2="424"/>
    <text id="rState" class="r-state" x="360" y="440" text-anchor="middle">At the 20-bottle start: the next bottle is worth 0.98 to Sam, 0.22 to Joe</text>
    <text id="rTake" class="r-take" x="360" y="456" text-anchor="middle">Their worths still differ &#8212; the next trade creates 0.76 bars of gain</text>

    <defs>
      <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066"/>
      </marker>
      <marker id="arrowAcc" markerWidth="7" markerHeight="7" refX="5" refY="3"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L6,3 L0,6 Z" fill="#b07a2c"/>
      </marker>
    </defs>
  </svg>

  <p class="hint">Drag either brass dot forward along its line until the two
    worths meet &#8212; then keep dragging past the crossing to see why the
    trading stops there (arrow keys work too).</p>

  <noscript>
    <p class="fallback">The interactive view needs JavaScript. See the
      <a href="t02-ep3-2-superimposed.svg">static version of this figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';

  // ---- geometry (must mirror the base markup) ----
  function X (b) { return 64 + 15.5 * b; }   // bottles from Sam's origin
  function Y (v) { return 366 - 172 * v; }   // bars per bottle
  var YP = Y(0.6);                            // 262.8
  var QMAX = 12;

  // ---- economics (see interactive-specs.md) ----
  function samW (x) { return 1.8 - 0.04 * x; }   // Sam's worth at shared x
  function joeW (x) { return 0.04 * x - 0.6; }   // Joe's worth at shared x
  function samNext (q) { return samW(20.5 + q); }
  function joeNext (q) { return joeW(20.5 + q); }

  var svg = document.getElementById('fig');
  var $ = function (id) { return document.getElementById(id); };
  var q = 0;

  function f2 (v) { return v.toFixed(2); }

  function render () {
    var x = 20 + q, px = X(x);
    var yS = Y(samW(x)), yJ = Y(joeW(x));
    var y0S = Y(samW(20)), y0J = Y(joeW(20));   // 194 / 331.6

    // trading dots + gap connector + hit/focus followers
    $('dotS').setAttribute('cx', px); $('dotS').setAttribute('cy', yS);
    $('dotJ').setAttribute('cx', px); $('dotJ').setAttribute('cy', yJ);
    $('hitDotS').setAttribute('cx', px); $('hitDotS').setAttribute('cy', yS);
    $('hitDotJ').setAttribute('cx', px); $('hitDotJ').setAttribute('cy', yJ);
    $('qFocus').setAttribute('x', px - 26); $('qFocus').setAttribute('y', Math.min(yS, yJ) - 26);
    $('focusRing').setAttribute('x', px - 30); $('focusRing').setAttribute('y', Math.min(yS, yJ) - 30);
    // the connector needs 7px of inset at each end, so it degenerates into a
    // stray round-cap dot once the dots are closer than ~18px (q = 9)
    if (q < 10 && (yJ - yS) >= 18) {
      $('gapLn').setAttribute('visibility', 'visible');
      $('gapLn').setAttribute('x1', px); $('gapLn').setAttribute('x2', px);
      $('gapLn').setAttribute('y1', yS + 7); $('gapLn').setAttribute('y2', yJ - 7);
    } else {
      $('gapLn').setAttribute('visibility', 'hidden');
    }

    // captured gains up to min(q,10); the remainder in the fainter tint
    var m = Math.min(q, 10);
    var xm = X(20 + m), ySm = Y(samW(20 + m)), yJm = Y(joeW(20 + m));
    $('gainS').setAttribute('d', m === 0 ? '' :
      'M374,' + y0S + ' L' + xm + ',' + ySm + ' L' + xm + ',' + YP + ' L374,' + YP + ' Z');
    $('gainJ').setAttribute('d', m === 0 ? '' :
      'M374,' + YP + ' L' + xm + ',' + YP + ' L' + xm + ',' + yJm + ' L374,' + y0J + ' Z');
    if (m < 10) {
      $('restS').setAttribute('visibility', 'visible');
      $('restJ').setAttribute('visibility', 'visible');
      $('restS').setAttribute('d',
        'M' + xm + ',' + ySm + ' L529,' + YP + ' L' + xm + ',' + YP + ' Z');
      $('restJ').setAttribute('d',
        'M' + xm + ',' + YP + ' L529,' + YP + ' L' + xm + ',' + yJm + ' Z');
    } else {
      $('restS').setAttribute('visibility', 'hidden');
      $('restJ').setAttribute('visibility', 'hidden');
    }

    // overshoot: past the crossing the worths flip and both wedges are losses
    var over = q > 10;
    ['lossS', 'lossJ', 'lossLbl', 'lossLead'].forEach(function (id) {
      $(id).setAttribute('visibility', over ? 'visible' : 'hidden');
    });
    if (over) {
      $('lossS').setAttribute('d',
        'M529,' + YP + ' L' + px + ',' + yS + ' L' + px + ',' + YP + ' Z');
      $('lossJ').setAttribute('d',
        'M529,' + YP + ' L' + px + ',' + YP + ' L' + px + ',' + yJ + ' Z');
    }

    // transfer arc. The label rides the arc's midpoint so it stays attached at
    // small q, but is clamped at 430: any further left and its leading edge
    // runs into Joe's line, which climbs through this band.
    $('arcLbl').setAttribute('x', Math.max(430, (374 + px) / 2));
    if (q === 0) {
      $('arcT').setAttribute('visibility', 'hidden');
      $('arcLbl').textContent = 'No trades yet';
    } else {
      $('arcT').setAttribute('visibility', 'visible');
      $('arcT').setAttribute('d', 'M374,358 Q' + ((374 + px) / 2) + ',350 ' + px + ',358');
      $('arcLbl').textContent = q + (q === 1 ? ' bottle' : ' bottles') + ' traded';
    }

    // readout. At the crossing the marginal (31st) bottle is worth 0.58 vs 0.62,
    // which reads as a contradiction beside a takeaway saying the worths are
    // equal, so q = 10 reports worths AT the holdings instead.
    var sn = samNext(q), jn = joeNext(q), state;
    if (q === 0) {
      state = 'At the 20-bottle start: the next bottle is worth ' +
        f2(sn) + ' to Sam, ' + f2(jn) + ' to Joe';
    } else if (q === 10) {
      state = 'After 10 bottles: a bottle is now worth ' + f2(samW(30)) +
        ' to Sam and ' + f2(joeW(30)) + ' to Joe';
    } else {
      state = 'After ' + q + (q === 1 ? ' bottle' : ' bottles') +
        ': the next bottle is worth ' + f2(sn) + ' to Sam, ' + f2(jn) + ' to Joe';
    }
    $('rState').textContent = state;
    var take;
    if (q < 10) {
      take = 'Their worths still differ — the next trade creates ' +
        f2(sn - jn) + ' bars of gain';
    } else if (q === 10) {
      take = 'Worths equal at 0.60 — every gain is captured, and 0.60 is the price that holds';
    } else {
      take = 'Past 30 bottles Joe values the next one more than Sam — a further trade would hurt both, so they stop';
    }
    $('rTake').textContent = take;

    var pf = $('qFocus');
    pf.setAttribute('aria-valuenow', q);
    pf.setAttribute('aria-valuetext',
      state.replace(/—/g, '-') + '. ' + take.replace(/—/g, '-') + '.');
  }

  function clampQ (v) { return Math.max(0, Math.min(QMAX, Math.round(v))); }

  // ---- pointer drag: x position decides q for BOTH dots ----
  function svgPoint (evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = false;
  function onDown (evt) {
    dragging = true;
    svg.classList.add('grabbing');
    if (evt.pointerId !== undefined && evt.target.setPointerCapture) {
      try { evt.target.setPointerCapture(evt.pointerId); } catch (e) {}
    }
    evt.preventDefault();
  }
  function onMove (evt) {
    if (!dragging) return;
    var v = clampQ((svgPoint(evt).x - 64) / 15.5 - 20);
    if (v !== q) { q = v; render(); }
  }
  function onUp (evt) {
    dragging = false;
    svg.classList.remove('grabbing');
    if (evt.pointerId !== undefined && evt.target.releasePointerCapture) {
      try { evt.target.releasePointerCapture(evt.pointerId); } catch (e) {}
    }
  }
  // qFocus paints over hitDotS (ep2-11 lesson): it must also start drags
  ['hitS', 'hitJ', 'hitDotS', 'hitDotJ', 'qFocus'].forEach(function (id) {
    $(id).addEventListener('pointerdown', onDown);
  });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);

  // ---- keyboard ----
  $('qFocus').addEventListener('keydown', function (evt) {
    var v = q;
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') v = q + 1;
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') v = q - 1;
    else if (evt.key === 'Home') v = 0;
    else if (evt.key === 'End') v = QMAX;
    else return;
    evt.preventDefault();
    v = clampQ(v);
    if (v !== q) { q = v; render(); }
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (v) { q = clampQ(Number(v)); render(); return q; },
    get: function () {
      return { q: q, samNext: +samNext(q).toFixed(2),
               joeNext: +joeNext(q).toFixed(2),
               atCrossing: q === 10 };
    }
  };

  render();
})();
</script>
</body>
</html>
