<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive random-walk fan: fifty steps from a common start</title>
<!--
  Interactive "random-walk fan" for the t11b (capital values & profit) blog post.
  Recreates UE Fig 35.1 (p.563), "Paths of Series of Accumulated Random
  Independent Changes." DEFERRED figure — no static .tex/.svg exists; this
  widget IS the figure. Website-styled (warm-editorial palette), NOT the FAU
  slide palette.

  ARCHITECTURE: the whole figure is REAL SVG markup — a no-JS reader (or the
  <noscript> still image) sees all seven full-length paths (all 50 steps),
  the axes, gridlines, and the start-level reference line. The script only
  ATTACHES the F9 interaction: a step scrubber (1..50) that CLIPS the seven
  paths to reveal them growing left-to-right, a live "now" cursor with
  droplines to both axes (step on the x-axis, current spread min/max on the
  y-axis), a two-line readout, and a re-roll button that regenerates a fresh
  set of paths.

  REPRODUCIBILITY (research-integrity): the seven paths are legitimately
  SIMULATED equal-odds +-1 random walks, not fabricated data. They were
  generated with a FIXED seed (mulberry32 PRNG, seed 12345) so the static
  base SVG and the JS initial state AGREE exactly — the same value array
  (INITIAL_VALS below) both produced the hardcoded <path d="..."> strings AND
  is embedded here for the live readout math. Re-roll uses Math.random() (not
  seed-reproducible) because its whole point is "a fresh, unpredictable set."

  GEOMETRY (F9, single-panel, viewBox 440x540, aspect 4/5):
    Data space: Accumulated value 30..70 on y (ticks/gridlines every 5),
    Step 1..50 on x (ticks every 5). Pixel frame:
      X0=64, XDATA=390 (step 50), axis drawn to 415 (arrowhead)
      Y0=360 (value 30), YTOP=56 (value 70), axis drawn to 28 (arrowhead)
      pxX(step) = 64 + (step-1)/49*326
      pxY(v)    = 360 - (v-30)*7.6
    Seven paths start at (step=1, value=50) = pixel (64, 208) — the common
    start level 50 is marked with a distinct (non-dashed-light) reference
    line. Each path is a 50-point polyline (49 equal-odds +-1 steps).
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* curves + headings           */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* captions / secondary labels */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass — active cursor / controls */
    --accent-tint: #efe4d2;/* shaded region / button fill */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 540px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .grid      { stroke: var(--hairline); stroke-width: 1; stroke-dasharray: 3 4;
               opacity: 0.65; }
  .startline { stroke: var(--hairline); stroke-width: 1.8; opacity: 0.95; }
  .xtick     { stroke: var(--muted); stroke-width: 1.2; opacity: 0.6; }
  .curve     { fill: none; stroke: var(--ink); stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; }
  .drop      { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 4 3;
               opacity: 0.75; }
  .cursor    { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 3;
               opacity: 0.6; }

  /* current-position dots + generous transparent hit targets */
  .nowdot    { fill: var(--accent); stroke: var(--surface); stroke-width: 1.4; }
  .knob      { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .knob-focus:focus-visible { outline: none; }
  .knob-focus:focus-visible + .knob,
  .grabbing .knob { stroke: var(--accent); stroke-width: 3.5; }
  .track     { stroke: var(--hairline); stroke-width: 4; stroke-linecap: round; }

  /* buttons */
  .btn-rect  { fill: var(--accent-tint); stroke: var(--hairline);
               stroke-width: 1.2; cursor: pointer; }
  .btn:focus-visible .btn-rect { stroke: var(--accent); stroke-width: 2; }
  .btn-text  { fill: var(--ink); font-size: 13px; font-weight: 700;
               pointer-events: none; }

  /* text */
  .axlabel  { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .ytick    { fill: var(--muted); font-size: 11px; }
  .xticklbl { fill: var(--muted); font-size: 11px; }
  .steplbl  { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .startlbl { fill: var(--muted); font-size: 11px; }
  .livelbl  { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .stitle   { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .endlbl   { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted); font-size: 12.5px; }
  .r-trade  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0; color: var(--muted); font-size: 13px;
    line-height: 1.4; text-align: center;
  }
</style>
</head>

    <p class="fallback">JavaScript is off, so this frame is a still image, and it
      is the complete figure: seven random walks, each starting at the value
      50, fanning out over 50 equal-odds up-or-down steps with no tendency to
      return to 50 or to each other.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var clipRect = document.getElementById('clipRect');
  var cursorLine = document.getElementById('cursorLine');
  var dropMax = document.getElementById('dropMax');
  var dropMin = document.getElementById('dropMin');
  var lblMax = document.getElementById('lblMax');
  var lblMin = document.getElementById('lblMin');
  var lblStep = document.getElementById('lblStep');
  var knob = document.getElementById('knob');
  var knobHit = document.getElementById('knobHit');
  var rerollBtn = document.getElementById('rerollBtn');
  var rHint = document.getElementById('rHint');
  var rTrade = document.getElementById('rTrade');

  var paths = [], dots = [];
  for (var i = 0; i < 7; i++) {
    paths.push(document.getElementById('rw' + i));
    dots.push(document.getElementById('dot' + i));
  }

  // Pixel frame (matches the hardcoded base-SVG geometry exactly).
  var X0 = 64, XDATA = 390, Y0 = 360, YTOP = 56, VMIN = 30, VMAX = 70;
  function pxX(step) { return X0 + (step - 1) / 49 * (XDATA - X0); }
  function pxY(v)    { return Y0 - (v - VMIN) * 7.6; }

  // FIXED-SEED value arrays (mulberry32, seed 12345) — the same numbers that
  // produced the hardcoded <path d="..."> strings above, so JS math and the
  // static markup agree exactly (reproducibility; see the header comment).
  var VALS = [[50, 49, 50, 49, 50, 49, 48, 47, 48, 49, 50, 51, 50, 51, 52, 53, 54, 55, 56, 55, 56, 55, 54, 55, 54, 53, 52, 53, 54, 55, 56, 55, 54, 55, 54, 55, 54, 53, 54, 53, 52, 53, 52, 51, 50, 49, 50, 51, 50, 49],
                [50, 49, 50, 51, 50, 51, 52, 51, 52, 53, 54, 53, 52, 51, 50, 49, 48, 49, 48, 49, 48, 49, 48, 47, 46, 45, 44, 45, 44, 43, 42, 41, 40, 39, 38, 37, 38, 39, 40, 39, 40, 39, 40, 41, 40, 41, 40, 39, 40, 39],
                [50, 49, 50, 49, 48, 49, 50, 51, 50, 51, 52, 51, 52, 53, 52, 51, 52, 51, 50, 49, 48, 49, 48, 49, 48, 49, 48, 49, 50, 51, 52, 53, 52, 51, 52, 53, 52, 53, 52, 51, 50, 49, 48, 49, 48, 47, 46, 45, 46, 45],
                [50, 51, 50, 49, 50, 51, 52, 53, 52, 51, 50, 51, 52, 51, 52, 53, 54, 55, 54, 53, 54, 55, 56, 57, 58, 57, 56, 55, 54, 53, 54, 53, 54, 55, 54, 55, 54, 53, 52, 53, 54, 53, 52, 53, 52, 51, 52, 53, 54, 53],
                [50, 51, 52, 51, 52, 51, 50, 51, 52, 51, 50, 51, 52, 51, 50, 51, 50, 51, 52, 53, 54, 53, 54, 55, 56, 57, 56, 55, 56, 55, 54, 53, 54, 55, 54, 53, 54, 53, 54, 55, 56, 57, 56, 57, 58, 59, 60, 59, 60, 61],
                [50, 51, 50, 49, 50, 49, 48, 47, 46, 45, 46, 47, 46, 47, 46, 45, 44, 43, 44, 45, 46, 47, 46, 45, 46, 45, 44, 43, 44, 45, 46, 47, 46, 45, 46, 47, 48, 47, 46, 47, 46, 45, 44, 43, 44, 43, 42, 43, 42, 41],
                [50, 51, 50, 51, 52, 51, 52, 51, 52, 53, 52, 53, 52, 53, 54, 55, 56, 55, 56, 55, 56, 55, 54, 55, 56, 57, 58, 57, 58, 57, 58, 57, 58, 57, 56, 55, 56, 55, 54, 55, 56, 57, 58, 59, 60, 61, 60, 61, 60, 59]];

  function buildD(vals) {
    var pts = [];
    for (var s = 1; s <= 50; s++) {
      pts.push(pxX(s).toFixed(2) + ',' + pxY(vals[s - 1]).toFixed(2));
    }
    return 'M' + pts.join(' L');
  }

  var step = 50;          // 1..50, default = fully revealed (matches the static base)
  var justRerolled = false;

  // simple word-wrap: split a string into at most 2 lines near its midpoint
  function wrapLine(str, maxLen) {
    if (str.length <= maxLen) return [str];
    var mid = Math.floor(str.length / 2);
    var left = str.lastIndexOf(' ', mid);
    var right = str.indexOf(' ', mid);
    var idx;
    if (left < 0) idx = right;
    else if (right < 0) idx = left;
    else idx = (mid - left <= right - mid) ? left : right;
    if (idx < 0) idx = mid;
    return [str.slice(0, idx).trim(), str.slice(idx).trim()];
  }

  function setLines(el, text, y0, dy, maxLen) {
    var lines = wrapLine(text, maxLen);
    while (el.firstChild) el.removeChild(el.firstChild);
    for (var k = 0; k < lines.length; k++) {
      var t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      t.setAttribute('x', 220);
      t.setAttribute('dy', k === 0 ? 0 : dy);
      t.textContent = lines[k];
      el.appendChild(t);
    }
    return lines;
  }

  function spreadAt(s) {
    var min = Infinity, max = -Infinity;
    for (var i = 0; i < 7; i++) {
      var v = VALS[i][s - 1];
      if (v < min) min = v;
      if (v > max) max = v;
    }
    return { min: min, max: max };
  }

  function render() {
    var cx = pxX(step);

    // clip the seven paths to reveal only steps <= current (pad so the
    // rightmost dot is never clipped mid-marker)
    clipRect.setAttribute('width', Math.max(0, cx - 60 + 6));

    // "now" cursor + droplines to both axes
    cursorLine.setAttribute('x1', cx); cursorLine.setAttribute('x2', cx);

    var spread = spreadAt(step);
    var yMax = pxY(spread.max), yMin = pxY(spread.min);
    dropMax.setAttribute('x2', cx); dropMax.setAttribute('y1', yMax); dropMax.setAttribute('y2', yMax);
    dropMin.setAttribute('x2', cx); dropMin.setAttribute('y1', yMin); dropMin.setAttribute('y2', yMin);
    lblMax.setAttribute('y', yMax); lblMax.textContent = spread.max;
    lblMin.setAttribute('y', yMin); lblMin.textContent = spread.min;

    // seven current-position dots
    for (var i = 0; i < 7; i++) {
      dots[i].setAttribute('cx', cx);
      dots[i].setAttribute('cy', pxY(VALS[i][step - 1]));
    }

    // live "Step N" label + slider knob (same x-scale as the plot)
    lblStep.setAttribute('x', cx); lblStep.textContent = 'Step ' + step;
    knob.setAttribute('cx', cx);
    knobHit.setAttribute('cx', cx);

    // readout band
    var stateText, tradeText;
    if (justRerolled) {
      stateText = 'A fresh set of coin-flips — a different fan, same rules.';
      tradeText = 'Whichever series leads changes every time; past moves give no edge on the next.';
    } else if (step === 1) {
      stateText = 'All seven paths start at the same point: 50.';
      tradeText = 'Each began at 50 on equal coin-flips — the leader’s edge so far is luck, not skill.';
    } else if (step === 50) {
      stateText = 'After 50 steps the spread is widest, about ' + spread.min + ' to ' + spread.max + '.';
      tradeText = 'No path tends back to 50; the best guess of any path’s next value is wherever it stands now.';
    } else {
      stateText = 'After ' + step + ' steps the paths span about ' + spread.min + ' to ' + spread.max + '.';
      tradeText = step <= 25
        ? 'Each began at 50 on equal coin-flips — the leader’s edge so far is luck, not skill.'
        : 'No path tends back to 50; the best guess of any path’s next value is wherever it stands now.';
    }
    setLines(rHint, stateText, 488, 14, 40);
    setLines(rTrade, tradeText, 518, 14, 44);

    knobHit.setAttribute('aria-valuenow', step);
    knobHit.setAttribute('aria-valuetext', 'Step ' + step + '. ' + stateText + ' ' + tradeText);
  }

  function setStep(s) {
    s = Math.max(1, Math.min(50, Math.round(s)));
    if (s !== step) { step = s; justRerolled = false; render(); }
  }

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function stepFromX(px) { return 1 + (px - X0) / (XDATA - X0) * 49; }

  // --- slider drag (pointer capture so a fast drag can't get stuck) ---
  var dragging = false, capId = null;
  function onMove(evt) {
    if (!dragging) return;
    evt.preventDefault();
    setStep(stepFromX(toSvg(evt).x));
  }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capId !== null) { try { knobHit.releasePointerCapture(capId); } catch (e) {} }
    capId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onKnobDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capId = evt.pointerId;
    try { knobHit.setPointerCapture(capId); } catch (e) {}
    setStep(stepFromX(toSvg(evt).x));
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  knobHit.addEventListener('pointerdown', onKnobDown);

  // --- keyboard on the slider proxy ---
  knobHit.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setStep(step + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setStep(step - 1); }
    else if (evt.key === 'Home') { setStep(1); }
    else if (evt.key === 'End') { setStep(50); }
    else if (evt.key === 'PageUp') { setStep(step + 5); }
    else if (evt.key === 'PageDown') { setStep(step - 5); }
    else return;
    evt.preventDefault();
  });

  // --- re-roll: fresh equal-odds +-1 walks (Math.random — not seed-locked;
  //     the whole point is an unpredictable new fan each click) ---
  function reroll() {
    for (var i = 0; i < 7; i++) {
      var v = 50;
      var vals = [v];
      for (var s = 0; s < 49; s++) {
        v += (Math.random() < 0.5 ? -1 : 1);
        vals.push(v);
      }
      VALS[i] = vals;
      paths[i].setAttribute('d', buildD(vals));
    }
    justRerolled = true;
    render();
  }
  rerollBtn.addEventListener('pointerdown', function (evt) { evt.preventDefault(); reroll(); });
  rerollBtn.addEventListener('keydown', function (evt) {
    if (evt.key === 'Enter' || evt.key === ' ' || evt.key === 'Spacebar') {
      evt.preventDefault(); reroll();
    }
  });

  // Debug hook: lets a reviewer screenshot non-initial states via scripting.
  window.__fig = {
    set: function (v) { setStep(+v); },
    get: function () { return { step: step, vals: VALS.map(function (a) { return a[step - 1]; }) }; },
    reroll: function () { reroll(); }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
