<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: realized real interest rates, 1920–2015</title>
<!--
  Interactive time-series scrubber for the T11b blog post (website-styled, warm
  palette). Redraws the qualitative SHAPE of UE Fig 33.1 "Realized Real Rates
  of Interest, 1920-2015" (p.537) -- an illustrative series, not verified
  historical data (research-integrity note in interactive-specs.md). DEFERRED
  figure: no static .tex/.svg exists for this one, so there is no fallback
  static image -- the base SVG below IS the complete still image a no-JS
  reader sees. Self-contained: no libraries, no network.

  FAMILY F5 (schedule/series hover-to-read; the interaction floor). Geometry
  class: single-panel, viewBox 440x540, aspect-ratio 4/5, max-width 480-560px.

  GEOMETRY / coordinate frame:
    x: year -> px x = 64 + (year - 1920) * 3.3   (year 1920 -> x=64; 2020 -> x=394;
       the year axis is drawn out to x=415 so the arrowhead clears the 2020 tick).
    y: percent -> px y = 250 - pct * 9            (0% -> y=250, the heavier
       "zero" gridline; 20% -> y=70; -15% -> y=385; the vertical axis is drawn
       from y=395 up to y=50 so the arrowhead clears the 20% gridline).
    The bottom (year) axis frame line sits at y=395, below the -15% gridline,
    with decade tick marks/labels 1930..2020.
    DATA holds drawing coordinates sampled from the source's qualitative
    shape. They position the curve and marker; they are not annual observations
    and are never exposed as point estimates. The draggable marker snaps to the
    nearest year; arrow keys step one year at a time. Two shaded
    accent bands mark the below-zero episodes the source flags: 1938-1951
    (wartime/postwar inflation) and 1978-1982 (the 1980 oil-supply shock).
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* series line + headings      */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / captions / labels    */
    --hairline:#e3ddd3;    /* gridlines / droplines       */
    --accent:  #b07a2c;    /* brass -- the draggable marker */
    --accent-tint: #efe4d2;/* below-zero shaded bands     */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 defeats the flexbox min-width:auto default so the figure
     scales DOWN to viewports narrower than the SVG's intrinsic width instead
     of clipping (the right side would otherwise be cut off on phones). */
  .fig { width: 100%; max-width: 520px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* structural strokes */
  .axis        { stroke: var(--muted); stroke-width: 1.4; }
  .tickmark    { stroke: var(--muted); stroke-width: 1; }
  .gridline    { stroke: var(--hairline); stroke-width: 1; }
  .gridline-0  { stroke: var(--muted); stroke-width: 1.8; }
  .curve       { stroke: var(--ink); stroke-width: 2.2; fill: none;
                 stroke-linecap: round; stroke-linejoin: round; }
  .band        { fill: var(--accent-tint); opacity: 0.65; stroke: none; }
  .drop        { stroke: var(--hairline); stroke-width: 1.6;
                 stroke-dasharray: 5 4; }

  /* draggable marker + generous transparent hit targets */
  .pt        { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-band  { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 28;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .axtitle  { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .tick     { fill: var(--muted); font-size: 9.5px; }
  .note     { fill: var(--muted); font-size: 10.5px; font-style: italic; }
  /* live readout tags (accent, with a surface backing so they cover the
     static tick they sit near) */
  .tagbg    { fill: var(--surface); }
  .tagtxt   { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .sep      { stroke: var(--hairline); stroke-width: 1; }
  .r-hint   { fill: var(--muted);  font-size: 12.5px; }
  .r-trade  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
</style>
</head>
<body>
<!-- Everything from here to </div> is REAL base SVG: a no-JS reader sees the
     full figure (both axes, the shaded below-zero bands, the full 1920-2015
     series, a marker at 1946 with droplines, live tags, and the readout). The
     script only ATTACHES drag / keyboard / live updates. -->
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="Qualitative redraw of realized real interest rates in the United States, 1920 to 2015, after Alchian and Allen's Figure 33.1. Year runs along the horizontal axis and the realized real rate along the vertical axis; shaded bands mark periods when the rate fell below zero, in the 1940s and around 1980. Drag or use the arrow keys to compare broad positive, negative, and near-zero episodes. The curve is not a table of annual observations.">
    <title>Realized real interest rates, 1920–2015 (qualitative interactive redraw)</title>
    <defs>

              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- percent gridlines (drawn first, behind everything); the 0% line is

    <rect class="band" x="252.1" y="250" width="16.5" height="18" />

      <line class="tickmark" x1="163" y1="395" x2="163" y2="399" />

      <text class="tick" x="97"  y="411" text-anchor="middle">1930</text>
      <text class="tick" x="130" y="411" text-anchor="middle">1940</text>
      <text class="tick" x="163" y="411" text-anchor="middle">1950</text>
      <text class="tick" x="196" y="411" text-anchor="middle">1960</text>
      <text class="tick" x="229" y="411" text-anchor="middle">1970</text>
      <text class="tick" x="262" y="411" text-anchor="middle">1980</text>

      <text class="tick" x="328" y="411" text-anchor="middle">2000</text>
      <text class="tick" x="361" y="411" text-anchor="middle">2010</text>
      <text class="tick" x="394" y="411" text-anchor="middle">2020</text>
    </g>

    <!-- axis titles -->
    <text class="axtitle" x="232" y="428" text-anchor="middle">Year</text>
    <text class="axtitle" x="14" y="227" text-anchor="middle"
          transform="rotate(-90 14 227)">Realized real interest rate (%)</text>

    <!-- the illustrative 1920-2015 series (redraw of the source's shape) -->
    <path class="curve" d="M64.0,115.0 L67.3,169.0 L70.6,214.0 L73.9,223.0 L77.2,205.0 L80.5,191.5 L83.8,205.0 L87.1,214.0 L90.4,205.0 L93.7,196.0 L97.0,169.0 L100.3,115.0 L103.6,169.0 L106.9,232.0 L110.2,241.0 L113.5,223.0 L116.8,200.5 L120.1,196.0 L123.4,232.0 L126.7,295.0 L130.0,322.0 L133.3,286.0 L136.6,250.0 L139.9,286.0 L143.2,331.0 L146.5,353.5 L149.8,322.0 L153.1,286.0 L156.4,259.0 L159.7,232.0 L163.0,331.0 L166.3,277.0 L169.6,241.0 L172.9,223.0 L176.2,227.5 L179.5,223.0 L182.8,232.0 L186.1,218.5 L189.4,232.0 L192.7,223.0 L196.0,227.5 L199.3,236.5 L202.6,223.0 L205.9,232.0 L209.2,241.0 L212.5,223.0 L215.8,232.0 L219.1,236.5 L222.4,227.5 L225.7,241.0 L229.0,232.0 L232.3,223.0 L235.6,214.0 L238.9,218.5 L242.2,232.0 L245.5,241.0 L248.8,227.5 L252.1,223.0 L255.4,232.0 L258.7,250.0 L262.0,263.5 L265.3,223.0 L268.6,169.0 L271.9,187.0 L275.2,196.0 L278.5,200.5 L281.8,205.0 L285.1,209.5 L288.4,205.0 L291.7,209.5 L295.0,205.0 L298.3,214.0 L301.6,218.5 L304.9,214.0 L308.2,209.5 L311.5,214.0 L314.8,218.5 L318.1,214.0 L321.4,209.5 L324.7,214.0 L328.0,218.5 L331.3,223.0 L334.6,227.5 L337.9,232.0 L341.2,236.5 L344.5,232.0 L347.8,227.5 L351.1,232.0 L354.4,241.0 L357.7,245.5 L361.0,232.0 L364.3,250.0 L367.6,254.5 L370.9,250.0 L374.2,245.5 L377.5,250.0" />

    <!-- muted note: the shaded-band legend (base-SVG content, no JS needed) -->
    <text class="note" text-anchor="middle">
      <tspan x="220" y="440">Qualitative redraw, not annual data. Shading marks rates below zero:</tspan>
      <tspan x="220" y="453">1940s wartime inflation and the 1980 oil-supply shock.</tspan>
    </text>

    <!-- droplines from the marker to both axes (initial: a below-zero 1946 point) -->
    <line id="dropV" class="drop" x1="149.8" y1="395" x2="149.8" y2="322" />
    <line id="dropH" class="drop" x1="64"   y1="322" x2="149.8" y2="322" />

    <!-- live axis readouts riding the dropline feet -->
    <g id="qyTag">
      <rect id="qyBg" class="tagbg" x="17" y="314.5" width="46" height="15" rx="2" />
      <text id="qy" class="tagtxt" x="61" y="322" text-anchor="end"
            dominant-baseline="middle">below 0</text>
    </g>
    <g id="qxTag">
      <rect id="qxBg" class="tagbg" x="129.8" y="369.5" width="40" height="15" rx="2" />
      <text id="qx" class="tagtxt" x="149.8" y="377" text-anchor="middle"
            dominant-baseline="middle">1946</text>
    </g>

    <!-- the draggable marker + hit targets: a wide invisible band spanning the
         whole plot (drag/tap anywhere to jump to that year), a fat invisible
         line tracing the series, and a point-sized circle -->
    <rect id="hitBand" class="hit-band" x="64" y="50" width="313.5" height="345" />
    <path id="hitCurve" class="hit-curve" d="M64.0,115.0 L67.3,169.0 L70.6,214.0 L73.9,223.0 L77.2,205.0 L80.5,191.5 L83.8,205.0 L87.1,214.0 L90.4,205.0 L93.7,196.0 L97.0,169.0 L100.3,115.0 L103.6,169.0 L106.9,232.0 L110.2,241.0 L113.5,223.0 L116.8,200.5 L120.1,196.0 L123.4,232.0 L126.7,295.0 L130.0,322.0 L133.3,286.0 L136.6,250.0 L139.9,286.0 L143.2,331.0 L146.5,353.5 L149.8,322.0 L153.1,286.0 L156.4,259.0 L159.7,232.0 L163.0,331.0 L166.3,277.0 L169.6,241.0 L172.9,223.0 L176.2,227.5 L179.5,223.0 L182.8,232.0 L186.1,218.5 L189.4,232.0 L192.7,223.0 L196.0,227.5 L199.3,236.5 L202.6,223.0 L205.9,232.0 L209.2,241.0 L212.5,223.0 L215.8,232.0 L219.1,236.5 L222.4,227.5 L225.7,241.0 L229.0,232.0 L232.3,223.0 L235.6,214.0 L238.9,218.5 L242.2,232.0 L245.5,241.0 L248.8,227.5 L252.1,223.0 L255.4,232.0 L258.7,250.0 L262.0,263.5 L265.3,223.0 L268.6,169.0 L271.9,187.0 L275.2,196.0 L278.5,200.5 L281.8,205.0 L285.1,209.5 L288.4,205.0 L291.7,209.5 L295.0,205.0 L298.3,214.0 L301.6,218.5 L304.9,214.0 L308.2,209.5 L311.5,214.0 L314.8,218.5 L318.1,214.0 L321.4,209.5 L324.7,214.0 L328.0,218.5 L331.3,223.0 L334.6,227.5 L337.9,232.0 L341.2,236.5 L344.5,232.0 L347.8,227.5 L351.1,232.0 L354.4,241.0 L357.7,245.5 L361.0,232.0 L364.3,250.0 L367.6,254.5 L370.9,250.0 L374.2,245.5 L377.5,250.0" />
    <circle id="hit" class="hit" cx="149.8" cy="322" r="22" />
    <circle id="pt"  class="pt"  cx="149.8" cy="322" r="6.5" />
    <!-- focusable proxy for keyboard control -->
    <circle id="ptFocus" class="pt-focus hit" cx="149.8" cy="322" r="22"
            tabindex="0" role="slider" aria-label="Marker on the realized-real-rate series (year)"
            aria-valuemin="1920" aria-valuemax="2015" aria-valuenow="1946"
            aria-valuetext="1946: realized real return is below zero in this qualitative redraw. Unexpected wartime inflation repaid lenders in cheaper dollars -- a negative real return they never priced in." />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line -->
    <line class="sep" x1="44" y1="466" x2="396" y2="466" />
    <text id="rHint" class="r-hint" x="220" y="488" text-anchor="middle">1946: realized real return is below zero.</text>
    <text id="rTrade" class="r-trade" text-anchor="middle"><tspan x="220" y="508">Unexpected wartime inflation repaid lenders in cheaper</tspan><tspan x="220" y="526">dollars &#8212; a negative real return they never priced in.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: the qualitative 1920&#8211;2015 curve is already drawn above, with the below-zero episodes (1940s wartime inflation, the 1980 oil-supply shock) shaded. The redraw is not a table of annual observations.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg      = document.getElementById('fig');
  var pt       = document.getElementById('pt');
  var hit      = document.getElementById('hit');
  var hitBand  = document.getElementById('hitBand');
  var hitCurve = document.getElementById('hitCurve');
  var ptFocus  = document.getElementById('ptFocus');
  var dropV    = document.getElementById('dropV');
  var dropH    = document.getElementById('dropH');
  var qx       = document.getElementById('qx');
  var qy       = document.getElementById('qy');
  var qxBg     = document.getElementById('qxBg');
  var qyBg     = document.getElementById('qyBg');
  var rHint    = document.getElementById('rHint');
  var rTrade   = document.getElementById('rTrade');
  var NS = 'http://www.w3.org/2000/svg';

  // Drawing coordinates for a qualitative redraw of the source's shape.
  // These values are not verified annual observations and are not displayed.
  var DATA = {1920:15,1921:9,1922:4,1923:3,1924:5,1925:6.5,1926:5,1927:4,1928:5,1929:6,1930:9,1931:15,1932:9,1933:2,1934:1,1935:3,1936:5.5,1937:6,1938:2,1939:-5,1940:-8,1941:-4,1942:0,1943:-4,1944:-9,1945:-11.5,1946:-8,1947:-4,1948:-1,1949:2,1950:-9,1951:-3,1952:1,1953:3,1954:2.5,1955:3,1956:2,1957:3.5,1958:2,1959:3,1960:2.5,1961:1.5,1962:3,1963:2,1964:1,1965:3,1966:2,1967:1.5,1968:2.5,1969:1,1970:2,1971:3,1972:4,1973:3.5,1974:2,1975:1,1976:2.5,1977:3,1978:2,1979:0,1980:-1.5,1981:3,1982:9,1983:7,1984:6,1985:5.5,1986:5,1987:4.5,1988:5,1989:4.5,1990:5,1991:4,1992:3.5,1993:4,1994:4.5,1995:4,1996:3.5,1997:4,1998:4.5,1999:4,2000:3.5,2001:3,2002:2.5,2003:2,2004:1.5,2005:2,2006:2.5,2007:2,2008:1,2009:0.5,2010:2,2011:0,2012:-0.5,2013:0,2014:0.5,2015:0};

  var YLO = 1920, YHI = 2015;

  // pixel frame + scale (mirrors the static SVG markup above)
  var X0 = 64, Y0 = 250;
  var PXY = 3.3;   // px per year
  var PXP = 9;     // px per percentage point
  var xYear = function (yr) { return X0 + (yr - 1920) * PXY; };
  var yPct  = function (p)  { return Y0 - p * PXP; };
  var toYear = function (px) { return 1920 + (px - X0) / PXY; };

  var year = 1946; // initial state (matches the static markup)

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function categoryFor(v) {
    if (Math.abs(v) < 1) return 'near zero';
    return v < 0 ? 'below zero' : 'above zero';
  }

  // Greedily word-wrap `str` into <tspan> lines inside the accent readout so it
  // never overflows the 440-wide viewBox. Measures with getComputedTextLength.
  function layoutTrade(str) {
    var maxW = 404, x = 220, y0 = 508, lineH = 18;
    while (rTrade.firstChild) rTrade.removeChild(rTrade.firstChild);
    var probe = document.createElementNS(NS, 'tspan');
    rTrade.appendChild(probe);
    var words = str.split(' '), lines = [], cur = words[0] || '';
    for (var i = 1; i < words.length; i++) {
      probe.textContent = cur + ' ' + words[i];
      if (probe.getComputedTextLength() > maxW) { lines.push(cur); cur = words[i]; }
      else { cur = cur + ' ' + words[i]; }
    }
    lines.push(cur);
    rTrade.removeChild(probe);
    var startY = (lines.length === 1) ? y0 + 4 : y0;
    for (var j = 0; j < lines.length; j++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', x);
      t.setAttribute('y', startY + j * lineH);
      t.textContent = lines[j];
      rTrade.appendChild(t);
    }
  }

  function takeawayFor(yr, v) {
    if (yr === 1946) {
      return 'Unexpected wartime inflation repaid lenders in cheaper dollars — a negative real return they never priced in.';
    }
    if (yr === 1982) {
      return 'When inflation fell faster than lenders expected, they earned an unusually high real return.';
    }
    if (yr === 2011) {
      return 'Near-zero realized real return: the nominal rate barely covered inflation.';
    }
    if (v <= -5) {
      return 'A sharp negative real return: unexpected inflation transferred wealth from lenders to borrowers.';
    }
    if (v < 0) {
      return 'A negative realized real return: inflation ran ahead of what lenders had priced in.';
    }
    if (v >= 7) {
      return 'An unusually high realized real return: inflation came in lower than lenders expected.';
    }
    if (Math.abs(v) < 1) {
      return 'A near-zero realized real return: the nominal rate barely covered inflation.';
    }
    return 'Realized real returns swing with surprise inflation — never confuse them with the rate lenders anticipated.';
  }

  function render() {
    var v = DATA[year];
    var cx = xYear(year), cy = yPct(v);

    pt.setAttribute('cx', cx);      pt.setAttribute('cy', cy);
    hit.setAttribute('cx', cx);     hit.setAttribute('cy', cy);
    ptFocus.setAttribute('cx', cx); ptFocus.setAttribute('cy', cy);

    dropV.setAttribute('x1', cx); dropV.setAttribute('x2', cx);
    dropV.setAttribute('y1', 395); dropV.setAttribute('y2', cy);
    dropH.setAttribute('y1', cy); dropH.setAttribute('y2', cy);
    dropH.setAttribute('x1', X0); dropH.setAttribute('x2', cx);

    // live tags ride the dropline feet
    qy.setAttribute('y', cy); qy.textContent = categoryFor(v).replace('zero', '0');
    qyBg.setAttribute('y', cy - 7.5);
    qx.setAttribute('x', cx); qx.textContent = String(year);
    qxBg.setAttribute('x', cx - 20);

    var hint = year + ': realized real return is ' + categoryFor(v) + ' in this qualitative redraw.';
    var trade = takeawayFor(year, v);
    rHint.textContent = hint;
    layoutTrade(trade);

    ptFocus.setAttribute('aria-valuenow', String(year));
    ptFocus.setAttribute('aria-valuetext', hint + ' ' + trade);
  }

  // single state setter (clamp + snap-to-nearest-year + no-op guard + render)
  // shared by drag, keyboard, and the debug hook
  function setYear(newYear) {
    var yr = Math.round(newYear);
    if (isNaN(yr)) return;
    if (yr < YLO) yr = YLO;
    if (yr > YHI) yr = YHI;
    if (yr === year) return;
    year = yr;
    render();
  }

  function setFromPointer(evt) {
    var pnt = toSvg(evt);
    setYear(toYear(pnt.x));
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  hit.addEventListener('pointerdown', onDown);
  hitBand.addEventListener('pointerdown', onDown);
  hitCurve.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);  // the marker itself is draggable

  // --- keyboard (arrows step one year at a time) ---
  ptFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setYear(year + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setYear(year - 1); }
    else return;
    evt.preventDefault();
  });

  // Debug hook: lets a reviewer screenshot non-initial states via scripting.
  window.__fig = {
    set: function (v) { setYear(+v); },
    get: function () { return { year: year, value: DATA[year] }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
