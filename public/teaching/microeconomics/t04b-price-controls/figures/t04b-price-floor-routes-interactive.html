<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive price floor: two routes to the same support price</title>
<!--
  Interactive recreation of UE Fig 12.3 (p.165) for the t04b-price-controls blog
  post (website-styled warm palette, NOT the FAU slide palette). Self-contained:
  vanilla SVG + JS, no libraries, no network, no build step. The static FAU
  figure (figures/t04b-price-floor-routes.{tex,svg}) is the SLIDE version,
  untouched, and is this widget's <noscript> fallback.

  ARCHITECTURE: the base figure is REAL SVG markup — a no-JS reader sees the
  FULL still figure: original S and D, BOTH alternative routes S' (restrict
  supply) and D' (boost demand) each drawn in full with their shift arrow and
  label, the equilibrium dot + droplines, the P' support-price line, and the
  filled dots at both P' crossings. The script only ATTACHES behavior (the
  Neither / Route 1 / Route 2 toggle — by click or by dragging/stepping a knob
  along the P' line — dimming the route NOT currently selected to a muted
  dashed ghost, plus live readouts); it never builds figure DOM.

  Family F2 (before/after shift), corrected from the ledger's F3 at the
  2026-07 audit: this figure teaches two ALTERNATIVE shift scenarios that both
  reach one target price, not a single draggable ceiling/floor line. The
  "before" role is played by whichever route is not selected: its shifted
  curve, arrow, and label go to a muted dashed ghost while the selected
  route's shifted curve stays accent-solid with its arrow.

  DATA SPACE: x = quantity 0..7.8, y = price 0..7.8. Pixel frame:
  px(q) = 64 + 40*q ; py(p) = 360 - 40*p (40 px/unit, both axes).
  Axes are drawn PAST the data max (x to 402, y to 30) so the curves and
  arrows never crowd the arrowheads.
    Original supply S:  P = 0.5 + Q   from (0.3,0.8) to (6.2,6.7)
    Original demand D:  P = 6.5 - Q   from (0.3,6.2) to (6.2,0.3)
    Equilibrium:         (3.0, 3.5)
    Support price P':    y = 5.0, from the axis to x ~= 5.2
    Route 1 (limit output)   S': P = 3.5 + Q  (0.3,3.8)-(3.5,7.0); crosses D at (1.5,5.0)
    Route 2 (govt. purchases) D': P = 9.5 - Q  (2.5,7.0)-(6.5,3.0); crosses S at (4.5,5.0)
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* primary curves + headings   */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / ghosted routes       */
    --hairline:#e3ddd3;    /* axis muting / droplines     */
    --accent:  #b07a2c;    /* brass — active route + knob */
    --accent-tint: #efe4d2;/* unused wash reserved        */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 lets this flex item shrink below the SVG's min-content width,
     so the figure tracks the viewport instead of overflowing on narrow screens */
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* mode toggle (above the figure) */
  .modebar { display: flex; align-items: center; gap: 8px;
             margin: 0 0 8px; flex-wrap: wrap; }
  .modelabel { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg { font-family: inherit; font-size: 12.5px; font-weight: 600;
         color: var(--ink); background: var(--surface);
         border: 1.5px solid var(--hairline); border-radius: 6px;
         padding: 5px 12px; cursor: pointer; }
  .seg + .seg { margin-left: -1px; }
  .seg.on { background: var(--accent); color: var(--surface);
            border-color: var(--accent); }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* structural strokes */
  .axis  { stroke: var(--muted); stroke-width: 1.4; }
  .curve { stroke: var(--ink); stroke-width: 2.6; fill: none;
           stroke-linecap: round; }
  .drop  { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }
  .pfloor{ stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 4 3; }

  /* route curves: accent-solid when selected, muted dashed ghost otherwise */
  .rcurve      { stroke: var(--accent); stroke-width: 2.6; fill: none;
                 stroke-linecap: round; }
  .rcurve.ghost{ stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5;
                 opacity: 0.75; }
  .rarrow      { stroke: var(--accent); stroke-width: 2.2; }
  .rnote       { fill: var(--muted); font-size: 11px; }
  .rlab        { fill: var(--accent); font-size: 13px; font-weight: 700; }
  .rlab.ghost  { fill: var(--muted); font-weight: 600; }
  .rdot        { fill: var(--accent); stroke: var(--surface); stroke-width: 1.6; }

  /* fixed (always-on) points and labels */
  .pt-static { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .lab   { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .axlab { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .plab  { fill: var(--muted); font-size: 12.5px; font-weight: 600; }

  /* draggable knob on the P' line + generous hit targets */
  .knob    { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit     { fill: transparent; stroke: transparent; touch-action: none;
             cursor: grab; }
  .hit-line{ fill: none; stroke: transparent; stroke-width: 30;
             touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .knob,
  .grabbing .knob { stroke: var(--ink); stroke-width: 3.2; }

  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .readout { font-family: var(--font-body); text-align: center; }
  .r-hint  { color: var(--muted); font-size: 12.5px; line-height: 1.3;
             margin-bottom: 5px; }
  .r-trade { color: var(--accent); font-size: 14px; font-weight: 600;
             line-height: 1.3; }
  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <div class="modebar" role="group" aria-label="Choose a route to the support price">
    <span class="modelabel">Route to P&#8242;:</span>
    <button id="btnNeither" class="seg" type="button" aria-pressed="false">Neither</button>
    <button id="btnRoute1" class="seg on" type="button" aria-pressed="true">Restrict supply</button>
    <button id="btnRoute2" class="seg" type="button" aria-pressed="false">Boost demand</button>
  </div>

  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="A supply and demand diagram. The original curves cross at price 3.5. A support price of 5.0 above that crossing can be reached two ways: restricting supply so it shifts left to S prime, meeting demand at quantity 1.5, or boosting demand with government purchases so it shifts right to D prime, meeting supply at quantity 4.5. Choose a route with the buttons or drag the knob along the support-price line.">
    <title>Interactive price floor: two routes to the same support price</title>
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="acc" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
      <marker id="accL" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M8,0 L0,4 L8,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- axes (drawn before the curves; extended past the data max) -->
    <line class="axis" x1="64" y1="360" x2="402" y2="360" marker-end="url(#arw)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="30"  marker-end="url(#arw)" />
    <text class="axlab" x="232" y="392" text-anchor="middle">Quantity</text>
    <text class="axlab" x="24" y="208" text-anchor="middle"
          transform="rotate(-90 24 208)">Price</text>

    <!-- original supply S and demand D (always full-strength — never toggled) -->
    <path class="curve" d="M76,328 L312,92" />
    <text class="lab" x="318" y="92" text-anchor="start">S</text>
    <path class="curve" d="M76,112 L312,348" />
    <text class="lab" x="318" y="352" text-anchor="start">D</text>

    <!-- equilibrium at (3.0, 3.5): dashed droplines + static dot -->
    <line class="drop" x1="184" y1="360" x2="184" y2="220" />
    <line class="drop" x1="64"  y1="220" x2="184" y2="220" />
    <circle class="pt-static" cx="184" cy="220" r="4.5" />
    <text class="plab" x="54" y="224" text-anchor="end">P</text>

    <!-- support price P' (accent, dashed): axis to just past the D'xS crossing -->
    <line class="pfloor" x1="64" y1="160" x2="272" y2="160" />
    <text class="plab" x="54" y="164" text-anchor="end">P&#8242;</text>

    <!-- ============ Route 1: restrict supply, S -> S' ============ -->
    <g id="route1">
      <path id="sPrime" class="rcurve" d="M76,208 L204,80" />
      <text id="labSPrime" class="rlab" x="208" y="72" text-anchor="start">S&#8242;</text>
      <line id="arrow1" class="rarrow" marker-end="url(#accL)" x1="296" y1="76" x2="228" y2="76" />
      <text id="note1" class="rnote" x="262" y="68" text-anchor="middle">limit output</text>
      <circle id="dot1" class="rdot" cx="124" cy="160" r="4" />
    </g>

    <!-- ============ Route 2: boost demand, D -> D' ============ -->
    <g id="route2">
      <path id="dPrime" class="rcurve" d="M164,80 L324,240" />
      <text id="labDPrime" class="rlab" x="330" y="244" text-anchor="start">D&#8242;</text>
      <line id="arrow2" class="rarrow" marker-end="url(#acc)" x1="204" y1="336" x2="276" y2="336" />
      <text id="note2" class="rnote" x="240" y="352" text-anchor="middle">govt. purchases</text>
      <circle id="dot2" class="rdot" cx="244" cy="160" r="4" />
    </g>

    <!-- fat invisible hit line over the whole P' line (grab anywhere) -->
    <line id="knobHit" class="hit-line" x1="64" y1="160" x2="272" y2="160" />
    <!-- keyboard proxy (screen-reader slider): 0 = neither, 1 = route1, 2 = route2 -->
    <circle id="ptFocus" class="pt-focus hit" cx="124" cy="160" r="22"
            tabindex="0" role="slider" aria-label="Route to the support price"
            aria-valuemin="0" aria-valuemax="2" aria-valuenow="1"
            aria-valuetext="Route 1: supply shifts left to S prime. Price rises to 5.0 at quantity 1.5." />
    <!-- visible drag knob -->
    <circle id="knob" class="knob" cx="124" cy="160" r="7" />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line.
         A foreignObject lets the full-sentence readouts wrap so nothing clips. -->
    <line class="sep" x1="44" y1="446" x2="396" y2="446" />
    <foreignObject x="38" y="452" width="364" height="80">
      <div xmlns="http://www.w3.org/1999/xhtml" class="readout">
        <div id="rHint"  class="r-hint">Supply shifts left (S&#8594;S&#8242;): price rises to P&#8242; = 5.0 at Q = 1.5.</div>
        <div id="rTrade" class="r-trade">Route 1 reaches the support price by cutting output &#8212; buyers pay more for less.</div>
      </div>
    </foreignObject>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: the
      original S and D cross at price 3.5; a support price of 5.0 is reached
      either by restricting supply (S shifts left to S&#8242;, meeting demand
      at quantity 1.5) or by government purchases boosting demand (D shifts
      right to D&#8242;, meeting supply at quantity 4.5). You can also
      <a href="t04b-price-floor-routes.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var byId = function (id) { return document.getElementById(id); };

  var btnNeither = byId('btnNeither'), btnRoute1 = byId('btnRoute1'), btnRoute2 = byId('btnRoute2');
  var sPrime = byId('sPrime'), labSPrime = byId('labSPrime'), arrow1 = byId('arrow1'),
      note1 = byId('note1'), dot1 = byId('dot1');
  var dPrime = byId('dPrime'), labDPrime = byId('labDPrime'), arrow2 = byId('arrow2'),
      note2 = byId('note2'), dot2 = byId('dot2');
  var knob = byId('knob'), knobHit = byId('knobHit'), ptFocus = byId('ptFocus');
  var rHint = byId('rHint'), rTrade = byId('rTrade');

  // knob positions along the P' line (y = 160), one per state
  var KX = { 0: 184, 1: 124, 2: 244 };
  var KY = 160;

  // state: 0 = neither, 1 = route 1 (restrict supply), 2 = route 2 (boost demand)
  var state = 1;

  function setGhost(el, ghost) {
    var base = el.getAttribute('data-base') || el.getAttribute('class').replace(/\s*ghost\s*/, '');
    el.setAttribute('data-base', base);
    el.setAttribute('class', ghost ? (base + ' ghost') : base);
  }

  function render() {
    var active1 = (state === 1), active2 = (state === 2);

    setGhost(sPrime, !active1);
    setGhost(labSPrime, !active1);
    arrow1.style.opacity = active1 ? 1 : 0.3;
    note1.style.opacity = active1 ? 1 : 0.45;
    dot1.style.opacity = active1 ? 1 : 0.45;

    setGhost(dPrime, !active2);
    setGhost(labDPrime, !active2);
    arrow2.style.opacity = active2 ? 1 : 0.3;
    note2.style.opacity = active2 ? 1 : 0.45;
    dot2.style.opacity = active2 ? 1 : 0.45;

    var kx = KX[state];
    knob.setAttribute('cx', kx); knob.setAttribute('cy', KY);
    ptFocus.setAttribute('cx', kx); ptFocus.setAttribute('cy', KY);

    var hint, trade;
    if (state === 1) {
      hint = 'Supply shifts left (S→S′): price rises to P′ = 5.0 at Q = 1.5.';
      trade = 'Route 1 reaches the support price by cutting output — buyers pay more for less.';
    } else if (state === 2) {
      hint = 'Demand shifts right (D→D′): price rises to P′ = 5.0 at Q = 4.5.';
      trade = 'Route 2 reaches the same support price by government buying the surplus — taxpayers foot it.';
    } else {
      hint = 'Both routes start from the same S/D crossing at P = 3.5.';
      trade = 'Pick a route to see how each pushes the price up to the support level P′ = 5.0.';
    }
    rHint.textContent = hint;
    rTrade.textContent = trade;

    btnNeither.classList.toggle('on', state === 0);
    btnRoute1.classList.toggle('on', state === 1);
    btnRoute2.classList.toggle('on', state === 2);
    btnNeither.setAttribute('aria-pressed', state === 0 ? 'true' : 'false');
    btnRoute1.setAttribute('aria-pressed', state === 1 ? 'true' : 'false');
    btnRoute2.setAttribute('aria-pressed', state === 2 ? 'true' : 'false');

    ptFocus.setAttribute('aria-valuenow', state);
    ptFocus.setAttribute('aria-valuetext', hint + ' ' + trade);
  }

  function setState(s) {
    state = Math.max(0, Math.min(2, s));
    render();
  }

  // nearest-state lookup from a pointer x along the P' line
  function stateFromX(px) {
    if (px < 154) return 1;
    if (px < 214) return 0;
    return 2;
  }

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function setFromPointer(evt) {
    var pnt = toSvg(evt);
    setState(stateFromX(pnt.x));
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false, capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  knobHit.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);

  // --- keyboard: arrows step through Route 1 <-> Neither <-> Route 2 ---
  ptFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { setState(state + 1); }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { setState(state - 1); }
    else return;
    evt.preventDefault();
  });

  // --- direct buttons ---
  btnNeither.addEventListener('click', function () { setState(0); ptFocus.focus(); });
  btnRoute1.addEventListener('click', function () { setState(1); ptFocus.focus(); });
  btnRoute2.addEventListener('click', function () { setState(2); ptFocus.focus(); });

  // Debug hook (inert for students): set/get the active route.
  window.__fig = {
    set: function (v) {
      v = v || {};
      if (typeof v.state === 'number') state = Math.max(0, Math.min(2, v.state));
      render();
    },
    get: function () { return { state: state }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
