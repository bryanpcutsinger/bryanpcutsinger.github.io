<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One support price, two routes: restrict supply or boost demand</title>
<!--
  t04b-price-floor-routes-interactive.html — REBUILD round 2, 2026-08-08
  (round 1 moved the buttons inside the SVG and added the consequence layers.
  Round 2 re-pins the NUMBER SYSTEM onto the sibling t04b-price-floor widget,
  which sits in the same post section: the two figures now share one market,
  so the reader never meets two different clearing quantities a paragraph
  apart.)

  Course recreation of Universal Economics Fig 12.3 (p.165): a support price P'
  ABOVE the market crossing is not reached by announcing it. It is reached
  either by RESTRICTING SUPPLY (tax output, or pay producers to cut it, so
  S -> S') or by BLOATING DEMAND (government buys the "excess" output, so
  D -> D'). Same price, two machineries, two different sets of losers.

  DATA SPACE: x = quantity 0..7, y = price 0..7.
    X(q) = 56 + 48q      Y(p) = 400 - 48p      (48 px per unit on BOTH axes, so
    the +/-1 slopes read as true 45 degrees, as in the source figure)

  SHARED MARKET (identical to t04b-price-floor-interactive.html)
    S : P = Q          D : P = 7 - Q
    Equilibrium E = (3.5, 3.5):  Q = 7 - Q  ->  Q = 3.5, P = 3.5
    Support price P' = 5.0 (above 3.5, so it binds)
    At P' the sibling's readings are Qs = 5 (off S) and Qd = 2 (off D); those
    same two quantities are this figure's two route crossings, which is what
    ties the pair together.

  ROUTE 1 — RESTRICT SUPPLY (S -> S')
    S': P = 3 + Q,  drawn q in [0.2, 3.2]
    S' meets the UNCHANGED D at P':  3 + Q = 7 - Q  ->  Q = 2, P = 5.0
    Consequence drawn: output falls 3.5 -> 2 (the "output cut" dimension line
    between the two droplines). Buyers pay 5.0 instead of 3.5 AND get 2 units
    instead of 3.5 — they pay for this route twice.

  ROUTE 2 — BOOST DEMAND (D -> D', government purchases)
    D': P = 10 - Q, drawn q in [3.8, 7.0]
    D' meets the UNCHANGED S at P':  Q = 10 - Q  ->  Q = 5, P = 5.0
    At P' = 5.0 PRIVATE demand D still takes only 7 - 5 = 2, while S supplies
    5. Government absorbs 5 - 2 = 3 units — the bracket along the P' line from
    x = 2 to x = 5. The private-demand point (2, 5.0) is a small muted dot so
    the split is visible. That 3-unit block is exactly the surplus the sibling
    price-floor figure brackets at the same floor.
    No dollar cost is ever computed or printed: the outlay is named, not priced.

  KEY CROSSINGS (dots, per the source figure): E (3.5, 3.5); S' x D (2, 5.0);
  D' x S (5, 5.0). Note (2, 5.0) is also where D meets the P' line, and
  (5, 5.0) is where S meets it — the routes bend a curve to each of the two
  readings the bare floor already produces.

  GEOMETRY: buttons, plot, readout and hint all live inside ONE 480x600 SVG, so
  the widget fits an aspect-ratio:4/5 iframe exactly. No media query, no HTML
  modebar, no width/height attributes on the svg.
    y  12.. 40  segmented buttons (Neither / Restrict supply / Boost demand)
    y  80..400  plot (y-axis 80..400, x-axis at 400 running x 56..400)
    y     418   quantity foot labels (Q* at 3.5; Q' at the route's quantity)
    y     440   "Quantity" axis label
    y     458   hairline separator
    y 478..494  muted state rows
    y 516..532  accent takeaway rows
    y 556..574  hint rows

  Static-base architecture: the DEFAULT state (Restrict supply) is fully drawn
  in markup — a no-JS reader sees route 1 complete. The script only toggles
  visibility, ghosts the moved curve's ORIGINAL position, and rewrites the
  readout. The static t04b-price-floor-routes.svg (FAU slide asset) is the
  <noscript> fallback.
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink:     #1a1c1e;
    --text:    #16181a;
    --muted:   #5c6066;
    --hairline:#e3ddd3;
    --accent:  #b07a2c;
    --accent-tint: #efe4d2;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;            /* grid, not flex — see t03b-ue8-1 mobile note */
    /* the explicit minmax(0,1fr) track is load-bearing: an AUTO track sizes to
       the svg's intrinsic 480px viewBox width, so on a narrower viewport the
       figure overflows and clips instead of scaling down */
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; }

  /* structure */
  .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; }
  .axlabel{ fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .drop   { stroke: var(--hairline); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .pfloor { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; }

  /* original curves; .ghost marks the pre-shift position of the curve that
     MOVED (route 1 ghosts S, route 2 ghosts D) */
  .curve      { stroke: var(--ink); stroke-width: 2.6; fill: none;
                stroke-linecap: round; }
  .curve.ghost{ stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 6 5;
                opacity: .8; }
  .clab       { fill: var(--ink); font-size: 13px; font-weight: 700;
                font-style: italic; }
  .clab.ghost { fill: var(--muted); font-weight: 600; }

  /* the shifted curve of the selected route */
  .rcurve { stroke: var(--accent); stroke-width: 2.6; fill: none;
            stroke-linecap: round; }
  .rlab   { fill: var(--accent); font-size: 13px; font-weight: 700;
            font-style: italic; }
  .shift  { stroke: var(--accent); stroke-width: 2.1; fill: none; }
  .shifthead { fill: var(--accent); }
  .shiftlbl  { fill: var(--accent); font-size: 10.5px; font-weight: 700; }

  /* points. The two P' crossings carry a WIDE surface halo so that where the
     bracket, D' and S all converge the dot still reads as its own mark. */
  .pt      { fill: var(--ink); stroke: var(--surface); stroke-width: 1.6; }
  .ptr     { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .ptmuted { fill: var(--muted); stroke: var(--surface); stroke-width: 2; }
  .plab    { fill: var(--muted); font-size: 12px; font-weight: 600; }

  /* consequence markers: the output cut and the government purchase span */
  .dim     { stroke: var(--accent); stroke-width: 2.2; fill: none;
             stroke-linecap: butt; }
  .dimhead { fill: var(--accent); }
  .dimlbl  { fill: var(--accent); font-size: 10.5px; font-weight: 700; }
  .brk     { stroke: var(--accent); stroke-width: 2.2; fill: none;
             stroke-linecap: butt; stroke-linejoin: miter; }

  /* readout band */
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .r-state { fill: var(--muted); font-size: 11.5px; }
  .r-take  { fill: var(--accent); font-size: 12px; font-weight: 600; }
  .hintln  { fill: var(--muted); font-size: 11px; }

  /* in-SVG segmented buttons (ep2-11 / ep4-1 pattern): the visible rect and its
     label are inert; the transparent focusable hit rect is painted LAST so the
     click always lands on the element that carries the listener */
  .btn      { fill: var(--surface); stroke: var(--hairline); stroke-width: 1.5; }
  .btn.on   { fill: var(--accent); stroke: var(--accent); }
  .btnlabel { fill: var(--ink); font-size: 12px; font-weight: 600;
              pointer-events: none; }
  .btnlabel.on { fill: var(--surface); }
  .btnfocus { cursor: pointer; }
  .btnfocus:focus-visible { outline: 2px solid var(--accent);
                            outline-offset: 2px; }

  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 480 600" role="group"
       aria-label="A supply and demand diagram of a support price, drawn on the same market as the price-floor figure: supply and demand cross at a price of 3.5 and a quantity of 3.5. A support price P prime of 5.0 is drawn above that crossing. Three buttons show how it can be reached. With neither route, nothing holds the price there: a bare decree of 5.0 would leave sellers offering 5 while buyers take only 2. Restricting supply shifts supply left to S prime, which meets demand at the support price with a quantity of only 2, so buyers pay more and get less. Boosting demand with government purchases shifts demand right to D prime, which meets supply at the support price with a quantity of 5, while private buyers still take only 2, so taxpayers buy the three unit difference.">
    <title>One support price, two routes: restrict supply or boost demand</title>

    <defs>
      <marker id="axhead" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- ================= segmented buttons (visible layer) ================= -->
    <rect id="btn-neither" class="btn"    x="12"  y="12" width="148" height="28" rx="6"/>
    <text id="btnl-neither" class="btnlabel" x="86" y="31" text-anchor="middle">Neither</text>
    <rect id="btn-route1"  class="btn on" x="166" y="12" width="148" height="28" rx="6"/>
    <text id="btnl-route1" class="btnlabel on" x="240" y="31" text-anchor="middle">Restrict supply</text>
    <rect id="btn-route2"  class="btn"    x="320" y="12" width="148" height="28" rx="6"/>
    <text id="btnl-route2" class="btnlabel" x="394" y="31" text-anchor="middle">Boost demand</text>

    <!-- ================= axes ================= -->
    <line class="axis" x1="56" y1="400" x2="400" y2="400" marker-end="url(#axhead)"/>
    <line class="axis" x1="56" y1="400" x2="56"  y2="80"  marker-end="url(#axhead)"/>
    <text class="axlabel" x="228" y="440" text-anchor="middle">Quantity</text>
    <text class="axlabel" x="18" y="240" text-anchor="middle"
          transform="rotate(-90 18 240)">Price ($)</text>

    <!-- ================= original supply and demand =================
         S : P = Q      drawn q in [1, 6.2]  (the sibling figure's domain)
         D : P = 7 - Q  drawn q in [1, 6.2]
         The DEFAULT state is route 1, in which S is the curve that MOVES, so
         the base markup ships S ghosted (its pre-shift position) and D solid. -->
    <path id="sCurve" class="curve ghost" d="M104,352 L353.6,102.4"/>
    <text id="sLab"   class="clab ghost" x="360" y="99" text-anchor="start">S</text>
    <path id="dCurve" class="curve" d="M104,112 L353.6,361.6"/>
    <text id="dLab"   class="clab" x="360" y="366" text-anchor="start">D</text>

    <!-- equilibrium E = (3.5, 3.5): droplines to both axes, dot, axis tags.
         P* / Q* match the sibling price-floor widget's tags for this same
         crossing. -->
    <line class="drop" x1="224" y1="400" x2="224" y2="232"/>
    <line class="drop" x1="56"  y1="232" x2="224" y2="232"/>
    <circle class="pt" cx="224" cy="232" r="4.4"/>
    <text class="plab" x="48" y="236" text-anchor="end">P*</text>
    <text class="plab" x="224" y="418" text-anchor="middle">Q*</text>

    <!-- the support price P' = 5.0, drawn past both P' crossings -->
    <line class="pfloor" x1="56" y1="160" x2="312" y2="160"/>
    <text class="plab" x="48" y="164" text-anchor="end">P&#8242;</text>

    <!-- ================= ROUTE 1: restrict supply (default) =================
         S' : P = 3 + Q, drawn q in [0.2, 3.2]; meets D at (2, 5.0).
         The output cut 3.5 -> 2 is a dimension line between the two droplines,
         in the empty lower-left of the plot (S is far above it there).     -->
    <g id="gRoute1">
      <path class="rcurve" d="M65.6,246.4 L209.6,102.4"/>
      <text class="rlab" x="216" y="99" text-anchor="start">S&#8242;</text>

      <!-- leftward shift arrow at P = 5.6, between S' (x=181) and S (x=325) -->
      <g class="shift">
        <line x1="310" y1="131" x2="199" y2="131"/>
      </g>
      <polygon class="shifthead" points="191,131 200,126 200,136"/>
      <text class="shiftlbl" x="253" y="123" text-anchor="middle">limit output</text>

      <!-- the new quantity: dropline, foot label, and the crossing dot -->
      <line class="drop" x1="152" y1="400" x2="152" y2="160"/>
      <text class="plab" x="152" y="418" text-anchor="middle">Q&#8242;</text>
      <circle class="ptr" cx="152" cy="160" r="4.4"/>

      <!-- output cut: 3.5 -> 2 on the quantity axis -->
      <line class="dim" x1="159" y1="386" x2="217" y2="386"/>
      <polygon class="dimhead" points="152,386 160,382 160,390"/>
      <polygon class="dimhead" points="224,386 216,382 216,390"/>
      <text class="dimlbl" x="188" y="377" text-anchor="middle">output cut</text>
    </g>

    <!-- ================= ROUTE 2: boost demand (hidden by default) ==========
         D' : P = 10 - Q, drawn q in [3.8, 7.0]; meets S at (5, 5.0).
         At P' private demand D takes 2; S supplies 5; the 3-unit difference is
         the bracket along the P' line.                                      -->
    <g id="gRoute2" visibility="hidden">
      <path class="rcurve" d="M238.4,102.4 L392,256"/>
      <text class="rlab" x="398" y="260" text-anchor="start">D&#8242;</text>

      <!-- Rightward shift arrow at P = 3.33. It sits BELOW the crossing on
           purpose: between P = 3.5 and P = 5.0 the solid S runs through the
           middle of the D-to-D' gap, so a label there would land on it. The
           two label rows also sit right of the Q' dropline (x=296), which
           otherwise ran through the words. -->
      <g class="shift">
        <line x1="242" y1="240" x2="350" y2="240"/>
      </g>
      <polygon class="shifthead" points="358,240 349,235 349,245"/>
      <text class="shiftlbl" x="338" y="258" text-anchor="middle">government</text>
      <text class="shiftlbl" x="338" y="270" text-anchor="middle">purchases</text>

      <!-- the quantity produced: dropline, foot label, and the crossing dot -->
      <line class="drop" x1="296" y1="400" x2="296" y2="160"/>
      <text class="plab" x="296" y="418" text-anchor="middle">Q&#8242;</text>
      <circle class="ptr" cx="296" cy="160" r="4.4"/>

      <!-- private buyers still take only 2 at P' — the small muted dot -->
      <circle class="ptmuted" cx="152" cy="160" r="3.4"/>

      <!-- What the government buys: the span along P' from 2 to 5. The rail
           rides at y=140 so its one crossing with D' (x=276) falls well short
           of the right tick, and both ticks stop at y=154 — on the halo of the
           crossing dots, not through them, so bracket and curve stay distinct
           marks despite sharing the accent colour. -->
      <path class="brk" d="M152,154 L152,140 L296,140 L296,154"/>
      <text class="dimlbl" x="196" y="132" text-anchor="middle">government buys this</text>
    </g>

    <!-- ============ button hit rects: painted LAST so they sit on top ====== -->
    <rect id="btnh-neither" class="btnfocus" x="12" y="12" width="148" height="28" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Neither route. Supply and demand are left alone and the market clears at a price of 3.5 with a quantity of 3.5. A bare decree of 5.0 would leave sellers offering 5 and buyers taking only 2."/>
    <rect id="btnh-route1" class="btnfocus" x="166" y="12" width="148" height="28" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="true"
          aria-label="Restrict supply. Taxing output or paying producers to cut it shifts supply left to S prime, which meets demand at the support price of 5.0, but quantity falls from 3.5 to 2, so buyers pay more and get less."/>
    <rect id="btnh-route2" class="btnfocus" x="320" y="12" width="148" height="28" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Boost demand. Government purchases shift demand right to D prime, which meets supply at the support price of 5.0 with a quantity of 5, while private buyers take only 2, so taxpayers buy the three unit difference and the state stores or gives it away."/>

    <!-- ================= readout band ================= -->
    <line class="sep" x1="16" y1="458" x2="464" y2="458"/>
    <g id="readout" role="status" aria-live="polite">
      <text class="r-state" text-anchor="middle">
        <tspan id="state1" x="240" y="478">Supply is cut back to S&#8242; (tax output, or pay producers to cut it),</tspan>
        <tspan id="state2" x="240" y="494">so S&#8242; meets D at P&#8242; = 5.0 with Q = 2, down from Q = 3.5.</tspan>
      </text>
      <text class="r-take" text-anchor="middle">
        <tspan id="take1" x="240" y="516">Buyers pay 5.0 instead of 3.5 &#8212; and get 2 units instead of 3.5.</tspan>
        <tspan id="take2" x="240" y="532">Consumers pay for this route twice: higher price, less of the good.</tspan>
      </text>
    </g>

    <text class="hintln" x="240" y="556" text-anchor="middle">Press a button to reach the same support price a different way.</text>
    <text class="hintln" x="240" y="574" text-anchor="middle">Both routes hold the price at P&#8242; = 5.0; each one bills a different group.</text>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows only the
      restrict-supply route: supply shifts left to S&#8242; and meets demand at
      the support price 5.0, where just 2 units change hands instead of 3.5.
      The government-purchase route needs the interactive view. See the
      <a href="/teaching/microeconomics/t04b-price-controls/figures/t04b-price-floor-routes.svg">static version of this figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';

  // ---- economics: the four lines, solved, never hard-coded ----
  // Shared with t04b-price-floor-interactive.html:  S : P = Q,  D : P = 7 - Q.
  var S  = { a: 0,  m:  1 };                    // P = a + m*Q
  var D  = { a: 7,  m: -1 };
  var S2 = { a: 3,  m:  1 };                    // S' — supply restricted
  var D2 = { a: 10, m: -1 };                    // D' — demand bloated
  var PSUP = 5.0;                               // the support price P'

  function qAt (L, p) { return (p - L.a) / L.m; }           // quantity on a line
  function cross (L1, L2) {                                  // where two lines meet
    var q = (L2.a - L1.a) / (L1.m - L2.m);
    return { q: q, p: L1.a + L1.m * q };
  }

  var EQ  = cross(S, D);          // (3.5, 3.5)
  var R1  = cross(S2, D);         // (2, 5.0) — restricted supply meets demand
  var R2  = cross(S, D2);         // (5, 5.0) — bloated demand meets supply
  var QPRIV = qAt(D, PSUP);       // 2 — what private buyers take at P'
  var QSUPP = qAt(S, PSUP);       // 5 — what sellers offer at P' (= R2.q)
  var QGOV  = QSUPP - QPRIV;      // 3 — the units the government must absorb

  // ---- states ----
  // `ghost` names the curve that MOVES in this route; its original position is
  // drawn as the muted dashed ghost. Route 1 moves S, route 2 moves D.
  var STATES = {
    neither: {
      ghost: null, group: null,
      state: ['Left alone, S and D cross at P = 3.5 with Q = 3.5.',
              'The support price P′ = 5.0 sits above that crossing.'],
      take:  ['A bare decree of 5.0 leaves sellers offering 5, buyers taking 2 —',
              'the 3-unit surplus. The two routes are ways to make 5.0 hold.']
    },
    route1: {
      ghost: 'S', group: 'gRoute1',
      state: ['Supply is cut back to S′ (tax output, or pay producers to cut it),',
              'so S′ meets D at P′ = 5.0 with Q = 2, down from Q = 3.5.'],
      take:  ['Buyers pay 5.0 instead of 3.5 — and get 2 units instead of 3.5.',
              'Consumers pay for this route twice: higher price, less of the good.']
    },
    route2: {
      ghost: 'D', group: 'gRoute2',
      state: ['Demand is bloated to D′ by government buying, so D′ meets',
              'supply at the support price: P′ = 5.0 with Q = 5.'],
      take:  ['Sellers supply 5, private buyers take 2 — taxpayers buy the',
              '3-unit difference and the state stores or gives it away.']
    }
  };
  var NAMES  = ['neither', 'route1', 'route2'];
  var GROUPS = ['gRoute1', 'gRoute2'];

  var $ = function (id) { return document.getElementById(id); };
  var route = 'route1';                          // matches the static markup

  function ghostToggle (curveId, labId, on) {
    $(curveId).setAttribute('class', on ? 'curve ghost' : 'curve');
    $(labId).setAttribute('class',   on ? 'clab ghost'  : 'clab');
  }

  function render () {
    var st = STATES[route];

    GROUPS.forEach(function (g) {
      $(g).setAttribute('visibility', st.group === g ? 'visible' : 'hidden');
    });
    ghostToggle('sCurve', 'sLab', st.ghost === 'S');
    ghostToggle('dCurve', 'dLab', st.ghost === 'D');

    $('state1').textContent = st.state[0];
    $('state2').textContent = st.state[1];
    $('take1').textContent  = st.take[0];
    $('take2').textContent  = st.take[1];

    NAMES.forEach(function (n) {
      var on = (n === route);
      $('btn-' + n).classList.toggle('on', on);
      $('btnl-' + n).classList.toggle('on', on);
      $('btnh-' + n).setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function setRoute (name) {
    if (!STATES[name]) return;
    route = name;
    render();
  }

  // ---- buttons: click + Enter/Space ----
  NAMES.forEach(function (name) {
    var hit = $('btnh-' + name);
    hit.addEventListener('click', function () { setRoute(name); });
    hit.addEventListener('keydown', function (evt) {
      if (evt.key === 'Enter' || evt.key === ' ' || evt.key === 'Spacebar') {
        evt.preventDefault();
        setRoute(name);
      }
    });
  });

  // ---- debug hook (widget standard §2.9). set('neither'|'route1'|'route2') ----
  window.__fig = {
    set: function (name) { setRoute(name); return window.__fig.get(); },
    get: function () {
      var out = { route: route, supportPrice: PSUP,
                  equilibrium: { q: EQ.q, p: EQ.p },
                  atSupportPrice: { offered: QSUPP, privateTaken: QPRIV,
                                    surplus: QGOV } };
      if (route === 'route1') {
        out.price = R1.p; out.quantity = R1.q;
        out.outputCut = { from: EQ.q, to: R1.q };
      } else if (route === 'route2') {
        out.price = R2.p; out.quantity = R2.q;
        out.split = { supplied: R2.q, privateBuyers: QPRIV, government: QGOV };
      } else {
        out.price = EQ.p; out.quantity = EQ.q;
      }
      return out;
    }
  };

  render();   // sync JS state with the static markup on load
})();
</script>
</body>
</html>
