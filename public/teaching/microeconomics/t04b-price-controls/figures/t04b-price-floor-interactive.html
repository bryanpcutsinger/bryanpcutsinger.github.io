<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive price floor: a floor above the clearing price creates a surplus</title>
<!--
  Interactive price-floor diagram for the t04b-price-controls blog post
  (website-styled warm palette, NOT the FAU slide palette). Self-contained:
  vanilla SVG + JS, no libraries, no network, no build step. The static FAU
  figure (figures/t04b-price-floor.{tex,svg}) is the SLIDE version, untouched,
  and is the <noscript> fallback.

  Recreates UE Fig 12.4 (p.166). Family F3 (policy line / wedge): the horizontal
  FLOOR line is draggable in price (vertical drag; arrow keys step it). Supply
  slopes up (P = Q) and demand slopes down (P = 7 - Q), crossing at the fixed
  equilibrium (3.5, 3.5). While the floor sits ABOVE 3.5 it binds: quantity
  supplied Qs = floor (read off supply) exceeds quantity demanded Qd = 7 -
  floor (read off demand), and the Qd->Qs gap is the surplus someone must buy
  or store. Drop the floor to 3.5 or below and it stops binding -- the market
  simply settles at the 3.5 equilibrium, gap closed.

  ARCHITECTURE: the base figure is REAL SVG markup -- a no-JS reader sees the
  full still figure (both S/D curves, the fixed equilibrium point + droplines,
  the floor line at its initial 5.0, the Qd/Qs points + droplines + axis
  labels, the shaded surplus band, the surplus bracket + label, the sellers'
  nonprice-attractions annotation, and the readout for the initial floor = 5.0
  state). The script only ATTACHES behavior (drag the floor, keyboard, live
  readouts + shading); it never builds the DOM.

  DATA SPACE: x = quantity 0..7, y = price 0..7.
  PIXEL FRAME: origin (64,360). Data max maps q=7 -> x=392, p=7 -> y=44. Axes
  extend past the data max (x to 418, y to 24) so lines never crowd the
  arrowheads. sx = 328/7 = 46.857 px/unit; sy = 316/7 = 45.143 px/unit.
  Drag range: floor in [2.5, 5.7] (keeps Qd/Qs within the drawn curve domain
  [1, 6.2] on both sides of the 3.5 equilibrium).
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* primary curves + headings   */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / secondary labels     */
    --hairline:#e3ddd3;    /* axis muting / droplines     */
    --accent:  #b07a2c;    /* brass -- floor + surplus     */
    --accent-tint: #efe4d2;/* shaded surplus gap          */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 lets this flex item shrink below the SVG's min-content width,
     so the figure tracks the viewport instead of overflowing on narrow screens */
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; max-width: 100%; height: auto; display: block;
        touch-action: pan-y; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .curve     { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }

  /* floor (draggable policy line) + surplus shading */
  .floor     { stroke: var(--accent); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .band      { fill: var(--accent-tint); opacity: 0.75; stroke: none; }
  .bracket   { stroke: var(--accent); stroke-width: 1.8; fill: none;
               stroke-linecap: round; }

  /* points */
  .pt-static { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .pt        { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .knob      { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5;
               pointer-events: none; }

  /* transparent hit targets */
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-line  { fill: none; stroke: transparent; stroke-width: 28;
               touch-action: none; cursor: ns-resize; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .knob,
  .grabbing .knob { stroke: var(--ink); stroke-width: 3.2; }

  /* text */
  .lab     { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .axlab   { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .qlab    { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .floor-lab { fill: var(--accent); font-size: 13px; font-weight: 700; }
  .brlab   { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .annot   { fill: var(--muted); font-size: 11px; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .readout { font-family: var(--font-body); text-align: center; }
  .r-hint  { color: var(--muted); font-size: 12.5px; line-height: 1.3;
             margin-bottom: 5px; }
  .r-trade { color: var(--accent); font-size: 14px; font-weight: 600;
             line-height: 1.3; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="A price-floor diagram. Supply slopes up and demand slopes down, crossing at an equilibrium price of 3.5. Drag the horizontal price floor up or down: when it sits above 3.5, sellers offer more units than buyers will take at that price, and a surplus opens between the quantity demanded and the quantity supplied.">
    <title>Interactive price floor diagram</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- static droplines for the fixed equilibrium (never move) -->
    <line class="drop" x1="228.0" y1="202.0" x2="228.0" y2="360" />
    <line class="drop" x1="64"    y1="202.0" x2="228.0" y2="202.0" />

    <!-- dynamic droplines for Qd / Qs (move with the floor; hidden when the
         floor doesn't bind) -->
    <line id="dropQd" class="drop" x1="157.7" y1="134.3" x2="157.7" y2="360" />
    <line id="dropQs" class="drop" x1="298.3" y1="134.3" x2="298.3" y2="360" />

    <!-- axes (drawn before the curves; extended past the data max) -->
    <line class="axis" x1="64" y1="360" x2="418" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="24"  marker-end="url(#arrow)" />

    <!-- surplus band along the floor, Qd -> Qs (below the curves so they read on top) -->
    <rect id="band" class="band" x="157.7" y="128.3" width="140.6" height="12" />

    <!-- upward supply S: P = Q, Q in [1, 6.2] -->
    <line class="curve" x1="110.9" y1="314.9" x2="354.5" y2="80.1" />
    <!-- downward demand D: P = 7 - Q, Q in [1, 6.2] -->
    <line class="curve" x1="110.9" y1="89.1" x2="354.5" y2="323.9" />

    <!-- the draggable floor line at P_min = 5.0 -->
    <line id="floor" class="floor" x1="68.7" y1="134.3" x2="373.3" y2="134.3" />

    <!-- axis titles -->
    <text class="axlab" x="228" y="430" text-anchor="middle">Quantity</text>
    <text class="axlab" x="22" y="200" text-anchor="middle"
          transform="rotate(-90 22 200)">Price</text>

    <!-- curve labels (held clear of the lines) -->
    <text class="lab" x="362" y="76" text-anchor="start">S</text>
    <text class="lab" x="100" y="71" text-anchor="end">D</text>
    <text id="floorLabel" class="floor-lab" x="55" y="129.3" text-anchor="end">P<tspan baseline-shift="sub" font-size="9.5">min</tspan></text>

    <!-- static annotation (fidelity: mirrors UE's "sellers offer nonpriced
         added attractions" note; fixed position, clear of every curve and of
         the floor line's full drag range) -->
    <text class="annot" x="235" y="42" text-anchor="middle">Sellers offer nonprice attractions;</text>
    <text class="annot" x="235" y="57" text-anchor="middle">government typically buys the excess.</text>

    <!-- static context point: the fixed equilibrium (S ∩ D), unlabeled (the
         droplines locate it; a numeric label would collide with the axis titles) -->
    <circle class="pt-static" cx="228.0" cy="202.0" r="4.5" />

    <!-- the moving points Qd (on demand) and Qs (on supply) at the floor -->
    <circle id="dotQd" class="pt" cx="157.7" cy="134.3" r="6" />
    <circle id="dotQs" class="pt" cx="298.3" cy="134.3" r="6" />

    <!-- quantity-axis labels for Qd / Qs -->
    <text id="qdLabel" class="qlab" x="157.7" y="377" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="9.5">d</tspan></text>
    <text id="qsLabel" class="qlab" x="298.3" y="377" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="9.5">s</tspan></text>

    <!-- surplus bracket, just above the floor, Qd -> Qs -->
    <path id="bracket" class="bracket" d="M157.7,103.2 L157.7,111.2 M157.7,107.2 L298.3,107.2 M298.3,103.2 L298.3,111.2" />
    <text id="bracketLabel" class="brlab" x="228.0" y="98.2" text-anchor="middle">Surplus (Q<tspan baseline-shift="sub" font-size="9">s</tspan> &gt; Q<tspan baseline-shift="sub" font-size="9">d</tspan>)</text>

    <!-- fat invisible hit line over the floor (grab anywhere) -->
    <line id="floorHit" class="hit-line" x1="68.7" y1="134.3" x2="373.3" y2="134.3" />
    <!-- keyboard proxy (screen-reader slider) beneath the visible knob -->
    <circle id="ptFocus" class="pt-focus hit" cx="140" cy="134.3" r="22"
            tabindex="0" role="slider" aria-label="Price floor"
            aria-valuemin="2.5" aria-valuemax="5.7" aria-valuenow="5.0"
            aria-valuetext="Floor at 5.0. Sellers offer 5, buyers take 2. Propped above the 3.5 clearing price, the 3-unit surplus must be bought or stored." />
    <!-- visible drag knob on the floor -->
    <circle id="floorKnob" class="knob" cx="140" cy="134.3" r="6" />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line.
         A foreignObject lets the full-sentence readouts wrap so nothing clips. -->
    <line class="sep" x1="44" y1="446" x2="396" y2="446" />
    <foreignObject x="38" y="452" width="364" height="86">
      <div xmlns="http://www.w3.org/1999/xhtml" class="readout">
        <div id="rHint"  class="r-hint">Floor at 5.0 &#8594; sellers offer 5, buyers take 2.</div>
        <div id="rTrade" class="r-trade">Propped above the 3.5 clearing price, the 3-unit surplus must be bought or stored.</div>
      </div>
    </foreignObject>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: an upward supply and downward demand crossing at the 3.5 equilibrium, and a price floor at 5.0 above it that leaves a Q<sub>d</sub>&#8211;Q<sub>s</sub> surplus. You can also <a href="t04b-price-floor.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var floor      = document.getElementById('floor');
  var floorHit   = document.getElementById('floorHit');
  var floorKnob  = document.getElementById('floorKnob');
  var ptFocus    = document.getElementById('ptFocus');
  var floorLabel = document.getElementById('floorLabel');
  var dotQd      = document.getElementById('dotQd');
  var dotQs      = document.getElementById('dotQs');
  var dropQd     = document.getElementById('dropQd');
  var dropQs     = document.getElementById('dropQs');
  var qdLabel    = document.getElementById('qdLabel');
  var qsLabel    = document.getElementById('qsLabel');
  var band       = document.getElementById('band');
  var bracket    = document.getElementById('bracket');
  var bracketLabel = document.getElementById('bracketLabel');
  var rHint      = document.getElementById('rHint');
  var rTrade     = document.getElementById('rTrade');

  // pixel frame + scale (mirrors the base SVG markup)
  var QMAX = 7, PMAX = 7;
  var X0 = 64, X1 = 392, Y0 = 360, Y1 = 44;
  var px = function (q) { return X0 + (q / QMAX) * (X1 - X0); };  // qty   -> px x
  var py = function (p) { return Y0 - (p / PMAX) * (Y0 - Y1); };  // price -> px y
  var toP = function (yy) { return ((Y0 - yy) / (Y0 - Y1)) * PMAX; };

  // model constants (read off the .tex / corrected inventory)
  var PEQ = 3.5;       // equilibrium price = equilibrium quantity (S=D at 3.5,3.5)

  // floor range (in price). Keeps Qd = 7-floor and Qs = floor within the
  // curves' drawn domain [1, 6.2] on both sides of the 3.5 equilibrium.
  var FMIN = 2.5, FMAX = 5.7;

  // Lowest pixel-y (i.e. highest screen position) the surplus bracket may
  // reach. Below FMAX the "0.6 price-units above the floor" offset alone
  // would carry the bracket label's glyphs on top of the fixed annotation
  // strip (its two lines sit at y=42/57); clamping the bracket at this y
  // keeps a clear gap under the annotation for every reachable floor value.
  var MIN_BRACKET_Y = 90;

  // demand/supply read at the floor
  function qDemanded(f) { return 7 - f; }
  function qSupplied(f) { return f; }

  // State in DATA units.
  var c = 5.0;   // initial floor = P_min

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // format a quantity: drop a trailing .0 so "5" not "5.0"
  function fmt(v) {
    var r = Math.round(v * 10) / 10;
    return (Math.abs(r - Math.round(r)) < 0.05) ? String(Math.round(r)) : r.toFixed(1);
  }

  function setDynamicVisible(on) {
    var v = on ? 'visible' : 'hidden';
    dotQd.style.visibility = v; dotQs.style.visibility = v;
    dropQd.style.visibility = v; dropQs.style.visibility = v;
    qdLabel.style.visibility = v; qsLabel.style.visibility = v;
    band.style.visibility = v;
    bracket.style.visibility = v; bracketLabel.style.visibility = v;
  }

  function render() {
    var fy = py(c);
    var qd = qDemanded(c);
    var qs = qSupplied(c);
    var gap = qs - qd;
    var binding = gap > 0.05;

    // floor line + its handle, hit target, label
    floor.setAttribute('y1', fy); floor.setAttribute('y2', fy);
    floorHit.setAttribute('y1', fy); floorHit.setAttribute('y2', fy);
    floorKnob.setAttribute('cy', fy);
    ptFocus.setAttribute('cy', fy);
    floorLabel.setAttribute('y', fy - 5);

    if (binding) {
      var qdx = px(qd), qsx = px(qs);

      dotQd.setAttribute('cx', qdx); dotQd.setAttribute('cy', fy);
      dotQs.setAttribute('cx', qsx); dotQs.setAttribute('cy', fy);

      dropQd.setAttribute('x1', qdx); dropQd.setAttribute('x2', qdx);
      dropQd.setAttribute('y1', fy);  dropQd.setAttribute('y2', Y0);
      dropQs.setAttribute('x1', qsx); dropQs.setAttribute('x2', qsx);
      dropQs.setAttribute('y1', fy);  dropQs.setAttribute('y2', Y0);

      qdLabel.setAttribute('x', qdx);
      qsLabel.setAttribute('x', qsx);

      band.setAttribute('x', qdx);
      band.setAttribute('width', qsx - qdx);
      band.setAttribute('y', fy - 6);

      // bracket sits a fixed 0.6 price-units above the CURRENT floor, but is
      // clamped to a minimum pixel height (MIN_BRACKET_Y) so it can never
      // climb into the fixed annotation strip near the top of the frame --
      // the naive "0.6 above the floor" offset alone puts the bracket LABEL
      // (whose glyphs extend ~9px above its anchor) on top of the
      // annotation's second line once the floor is dragged past ~5.4, so the
      // clamp takes over for the top of the drag range instead of trusting
      // the fixed offset to stay clear on its own.
      var by = py(c + 0.6);
      if (by < MIN_BRACKET_Y) by = MIN_BRACKET_Y;
      bracket.setAttribute('d',
        'M' + qdx + ',' + (by - 4) + ' L' + qdx + ',' + (by + 4) + ' ' +
        'M' + qdx + ',' + by + ' L' + qsx + ',' + by + ' ' +
        'M' + qsx + ',' + (by - 4) + ' L' + qsx + ',' + (by + 4));
      bracketLabel.setAttribute('x', (qdx + qsx) / 2);
      bracketLabel.setAttribute('y', by - 9);

      setDynamicVisible(true);
    } else {
      setDynamicVisible(false);
    }

    // readout grammar: muted state line + accent takeaway line
    var hint, trade;
    if (binding) {
      hint  = 'Floor at ' + c.toFixed(1) + ' → sellers offer ' + fmt(qs) +
              ', buyers take ' + fmt(qd) + '.';
      trade = 'Propped above the ' + PEQ.toFixed(1) +
              ' clearing price, the ' + fmt(gap) + '-unit surplus must be bought or stored.';
    } else if (Math.abs(c - PEQ) <= 0.05) {
      hint  = 'Floor at 3.5 = the clearing price → 3.5 offered = 3.5 taken.';
      trade = 'At or below clearing the floor doesn’t bind — no surplus.';
    } else {
      hint  = 'Floor at ' + c.toFixed(1) +
              ' → the market settles at the ' + PEQ.toFixed(1) + ' clearing price.';
      trade = 'Below the ' + PEQ.toFixed(1) +
              ' clearing price the floor doesn’t bind — no surplus.';
    }
    rHint.textContent  = hint;
    rTrade.textContent = trade;

    ptFocus.setAttribute('aria-valuenow', c.toFixed(1));
    ptFocus.setAttribute('aria-valuetext', hint + ' ' + trade);
  }

  function setFromPointer(evt) {
    var p = toSvg(evt);
    var cc = toP(p.y);
    if (isNaN(cc)) return;
    if (cc < FMIN) cc = FMIN;
    if (cc > FMAX) cc = FMAX;
    c = cc;
    render();
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  floorHit.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);

  // --- keyboard: arrows step the floor in price ---
  ptFocus.addEventListener('keydown', function (evt) {
    var step = 0.2;
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { c += step; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { c -= step; }
    else return;
    evt.preventDefault();
    if (c < FMIN) c = FMIN;
    if (c > FMAX) c = FMAX;
    render();
  });

  // Debug hook (inert for students): set/get the floor price.
  window.__fig = {
    set: function (v) { c = Math.max(FMIN, Math.min(FMAX, +v)); render(); },
    get: function () { return { floor: c, qDemanded: qDemanded(c), qSupplied: qSupplied(c) }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
