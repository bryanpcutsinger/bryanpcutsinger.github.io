<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive oil shortage: capping the input price can't undo a supply cut</title>
<!--
  Interactive oil/gasoline-shortage diagram for the t04b-price-controls blog post
  (website-styled warm palette, NOT the FAU slide palette). Self-contained:
  vanilla SVG + JS, no libraries, no network, no build step. The static FAU
  figure (figures/t04b-oil-shortage.{tex,svg}) is the SLIDE version, untouched,
  and is the <noscript> fallback.

  Recreates UE Fig 12.2 (p.161). Family F3 (policy line / wedge): the horizontal
  CEILING line P3 is draggable in price (vertical drag; arrow keys step it).
  Demand D is fixed. Supply has been cut from the original S (dashed, "before",
  x=7.0) to the reduced S1 (solid, x=3.5), so the free-market clearing price
  would rise from P1=3.5 to P2=6.514 at the reduced stock. The quantity
  demanded at the capped price is read off D: Qd = 0.6 + (9.0-ceiling)/0.857.
  While the ceiling sits below the 6.5 clearing price, Qd > 3.5 (the reduced
  supply) and the shortage gap shades between them; raise the ceiling to 6.5
  and the cap stops binding (the price cut simply raised price, no shortage).
  The point of the figure: a ceiling on the OUTPUT (or, as the surrounding
  prose argues, on an INPUT) cannot restore a supply a real-world cut removed.

  ARCHITECTURE: the base figure is REAL SVG markup — a no-JS reader sees the
  full still figure (demand, both supplies, the shift arrow, the ceiling,
  the three key points, all axis labels, droplines, the shortage band +
  bracket, and the readout for the initial ceiling = 5.0 state). The script
  only ATTACHES behavior (drag the ceiling, keyboard, live readouts +
  shading); it never builds the DOM.

  DATA SPACE: x = quantity 0..9.5, y = price 0..9.5 (matches the .tex source).
  PIXEL FRAME: origin (64,360). Data max maps q=9.5 -> x=392, p=9.5 -> y=44.
  Axes extend PAST the data max (x to 418, y to 24) so lines never crowd the
  arrowheads. sx = 328/9.5 = 34.526 px/unit; sy = 316/9.5 = 33.263 px/unit.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* primary curves + headings   */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* axes / secondary labels     */
    --hairline:#e3ddd3;    /* axis muting / droplines     */
    --accent:  #b07a2c;    /* brass — ceiling + shortage  */
    --accent-tint: #efe4d2;/* shaded shortage gap         */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  /* min-width:0 lets this flex item shrink below the SVG's min-content width,
     so the figure tracks the viewport instead of overflowing on narrow screens */
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; max-width: 100%; height: auto; display: block;
        touch-action: pan-y; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .curve     { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .curve-before { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; stroke-dasharray: 7 5; }
  .shift     { stroke: var(--muted); stroke-width: 2.2; fill: none;
               stroke-linecap: round; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }

  /* ceiling (draggable policy line) + shortage shading */
  .ceiling   { stroke: var(--accent); stroke-width: 2.6; fill: none;
               stroke-linecap: round; stroke-dasharray: 9 5; }
  .band      { fill: var(--accent-tint); opacity: 0.75; stroke: none; }
  .bracket   { stroke: var(--accent); stroke-width: 1.8; fill: none;
               stroke-linecap: round; }

  /* points */
  .pt-static { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .pt        { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .knob      { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5;
               pointer-events: none; }

  /* transparent hit targets */
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-line  { fill: none; stroke: transparent; stroke-width: 28;
               touch-action: none; cursor: ns-resize; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .knob,
  .grabbing .knob { stroke: var(--ink); stroke-width: 3.2; }

  /* text */
  .lab     { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .axlab   { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .plab    { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .p3lab   { fill: var(--accent); font-size: 12.5px; font-weight: 700; }
  .qlab    { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .ceil-lab{ fill: var(--accent); font-size: 13px; font-weight: 700; }
  .brlab   { fill: var(--accent); font-size: 12px; font-weight: 700; }
  .sep     { stroke: var(--hairline); stroke-width: 1; }
  .readout { font-family: var(--font-body); text-align: center; }
  .r-hint  { color: var(--muted); font-size: 12.5px; line-height: 1.3;
             margin-bottom: 5px; }
  .r-trade { color: var(--accent); font-size: 14px; font-weight: 600;
             line-height: 1.3; }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="An oil-shortage diagram. Demand for gasoline is fixed. Supply has fallen from an original stock S to a reduced stock S1, so the free-market clearing price would rise to 6.5. Drag the horizontal price ceiling up or down: when it sits below 6.5, buyers want more gasoline than the reduced supply provides and a shortage opens between the reduced supply and the quantity demanded.">
    <title>Interactive oil-shortage diagram</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <!-- static droplines (drawn first so curves sit on top) -->
    <!-- P2 -> y-axis horizontal dropline (new clearing price at the reduced stock) -->
    <line class="drop" x1="64" y1="143.3" x2="184.8" y2="143.3" />
    <!-- P1 -> y-axis horizontal dropline (old clearing price at the original stock) -->
    <line class="drop" x1="64" y1="243.1" x2="305.7" y2="243.1" />
    <!-- Q2 vertical dropline at x=3.5 (coincident with S1) -->
    <line class="drop" x1="184.8" y1="193.7" x2="184.8" y2="360" />
    <!-- Q3 vertical dropline (moves with the ceiling) -->
    <line id="dropQ3" class="drop" x1="245.9" y1="193.7" x2="245.9" y2="360" />

    <!-- axes (drawn before the curves; extended past the data max) -->
    <line class="axis" x1="64" y1="360" x2="418" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="24"  marker-end="url(#arrow)" />

    <!-- shortage band along the ceiling, Q2 -> Q3 (below the curves so they read on top) -->
    <rect id="band" class="band" x="184.8" y="187.7" width="61.1" height="12" />

    <!-- fixed demand D: P = 9.0 - 0.857*(x-0.6), x in [0.6, 9.0] -->
    <line class="curve" x1="84.7" y1="60.6" x2="374.7" y2="300.1" />

    <!-- original supply S (dashed = "before" the cut), vertical at x=7.0 -->
    <line class="curve-before" x1="305.7" y1="343.4" x2="305.7" y2="67.3" />
    <!-- reduced supply S1 (solid, shifted LEFT to x=3.5) -->
    <line class="curve" x1="184.8" y1="343.4" x2="184.8" y2="67.3" />

    <!-- leftward "supply falls" shift arrow, S -> S1, in clear space above D -->
    <line class="shift" x1="298.8" y1="100.5" x2="191.7" y2="100.5" marker-end="url(#arrow)" />

    <!-- the draggable ceiling line at P3 = 5.0 -->
    <line id="ceiling" class="ceiling" x1="64" y1="193.7" x2="381.6" y2="193.7" />

    <!-- axis titles -->
    <text class="axlab" x="228" y="430" text-anchor="middle">Quantity of gasoline</text>
    <text class="axlab" x="22" y="200" text-anchor="middle"
          transform="rotate(-90 22 200)">Price</text>

    <!-- curve labels (held clear of the lines) -->
    <text class="lab" x="380" y="305" text-anchor="start">D</text>
    <text class="lab" x="313.7" y="64" text-anchor="start">S</text>
    <text class="lab" x="192.8" y="64" text-anchor="start">S<tspan baseline-shift="sub" font-size="9.5">1</tspan></text>
    <text id="ceilLabel" class="ceil-lab" x="386" y="189" text-anchor="start">Ceiling</text>

    <!-- price-axis reference labels (top -> bottom: P2, P3 ceiling, P1) -->
    <text class="plab" x="55" y="147" text-anchor="end">P<tspan baseline-shift="sub" font-size="9.5">2</tspan></text>
    <text id="p3Label" class="p3lab" x="55" y="198" text-anchor="end">P<tspan baseline-shift="sub" font-size="9.5">3</tspan></text>
    <text class="plab" x="55" y="247" text-anchor="end">P<tspan baseline-shift="sub" font-size="9.5">1</tspan></text>

    <!-- static context points: P2 (D∩S1, new clearing) and P1 (D∩S, old clearing) -->
    <circle class="pt-static" cx="184.8" cy="143.3" r="4.5" />
    <circle class="pt-static" cx="305.7" cy="243.1" r="4.5" />

    <!-- the moving point Q3 = demand at the ceiling (quantity demanded) -->
    <circle id="q3Dot" class="pt" cx="245.9" cy="193.7" r="6" />

    <!-- quantity-axis labels -->
    <text class="qlab" x="184.8" y="377" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="9.5">2</tspan></text>
    <text id="q3Label" class="qlab" x="245.9" y="377" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="9.5">3</tspan></text>

    <!-- shortage bracket below the x-axis, Q2 -> Q3 -->
    <path id="bracket" class="bracket" d="M184.8,393 L184.8,403 M184.8,398 L245.9,398 M245.9,393 L245.9,403" />
    <text id="bracketLabel" class="brlab" x="215.4" y="414" text-anchor="middle">Shortage</text>

    <!-- fat invisible hit line over the ceiling (grab anywhere) -->
    <line id="ceilHit" class="hit-line" x1="64" y1="193.7" x2="381.6" y2="193.7" />
    <!-- keyboard proxy (screen-reader slider) beneath the visible knob -->
    <circle id="ptFocus" class="pt-focus hit" cx="110" cy="193.7" r="22"
            tabindex="0" role="slider" aria-label="Price ceiling"
            aria-valuemin="2.5" aria-valuemax="7.5" aria-valuenow="5.0"
            aria-valuetext="Ceiling at 5.0. Supply has fallen to S1, 3.5 units. Buyers want 5.3; only 3.5 exist. The cap can't undo the supply cut — it opens a 1.8-unit shortage." />
    <!-- visible drag knob on the ceiling -->
    <circle id="ceilKnob" class="knob" cx="110" cy="193.7" r="6" />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line.
         A foreignObject lets the full-sentence readouts wrap so nothing clips. -->
    <line class="sep" x1="44" y1="446" x2="396" y2="446" />
    <foreignObject x="38" y="452" width="364" height="86">
      <div xmlns="http://www.w3.org/1999/xhtml" class="readout">
        <div id="rHint"  class="r-hint">Supply has fallen to S&#8321; (3.5 units). Ceiling at 5.0 &#8594; buyers want 5.3.</div>
        <div id="rTrade" class="r-trade">The cap can't undo the supply cut &#8212; it opens a 1.8-unit shortage.</div>
      </div>
    </foreignObject>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image: fixed demand, a supply that has fallen from S to a reduced S&#8321;, and a price ceiling P&#8323; sitting below the new 6.5 clearing price, leaving the Q2&#8211;Q3 shortage. You can also <a href="t04b-oil-shortage.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var ceiling  = document.getElementById('ceiling');
  var ceilHit  = document.getElementById('ceilHit');
  var ceilKnob = document.getElementById('ceilKnob');
  var ptFocus  = document.getElementById('ptFocus');
  var ceilLabel= document.getElementById('ceilLabel');
  var p3Label  = document.getElementById('p3Label');
  var q3Dot    = document.getElementById('q3Dot');
  var dropQ3   = document.getElementById('dropQ3');
  var q3Label  = document.getElementById('q3Label');
  var band     = document.getElementById('band');
  var bracket  = document.getElementById('bracket');
  var bracketLabel = document.getElementById('bracketLabel');
  var rHint    = document.getElementById('rHint');
  var rTrade   = document.getElementById('rTrade');

  // pixel frame + scale (mirrors the base SVG markup)
  var QMAX = 9.5, PMAX = 9.5;
  var X0 = 64, X1 = 392, Y0 = 360, Y1 = 44;
  var px = function (q) { return X0 + (q / QMAX) * (X1 - X0); };  // qty   -> px x
  var py = function (p) { return Y0 - (p / PMAX) * (Y0 - Y1); };  // price -> px y
  var toP = function (yy) { return ((Y0 - yy) / (Y0 - Y1)) * PMAX; };

  // model constants (read off the .tex / corrected inventory)
  var QS1 = 3.5;         // fixed reduced supply (vertical S1 at x = 3.5)
  var PCLEAR = 6.514286; // new free-market clearing price (D ∩ S1)
  var POLD = 3.514286;   // old clearing price (D ∩ original S, x = 7.0) — static P1 label
  var XQ2 = px(QS1);     // pixel x of Q2 = 3.5
  var YP2 = py(PCLEAR);  // pixel y of the static P2 axis label
  var YP1 = py(POLD);    // pixel y of the static P1 axis label

  // demand line D: from (0.6, 9.0) to (9.0, 1.8); slope = -0.857142857
  var D_X0 = 0.6, D_P0 = 9.0, D_SLOPE = 0.857142857;
  function qDemanded(c) { return D_X0 + (D_P0 - c) / D_SLOPE; }

  // ceiling range (in price). Keeps Q3 on the drawn demand segment [0.6, 9.0]
  // and keeps the ceiling clear of the top annotation band and the D label.
  var CMIN = 2.5, CMAX = 7.5;

  // State in DATA units.
  var c = 5.0;   // initial ceiling = P3

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // format a quantity: drop a trailing .0 so "5" not "5.0"
  function fmt(v) {
    var r = Math.round(v * 10) / 10;
    return (Math.abs(r - Math.round(r)) < 0.05) ? String(Math.round(r)) : r.toFixed(1);
  }

  function setShortageVisible(on) {
    var v = on ? 'visible' : 'hidden';
    band.style.visibility = v;
    bracket.style.visibility = v;
    bracketLabel.style.visibility = v;
  }

  function render() {
    var cy = py(c);
    var qd = qDemanded(c);
    var gx = px(qd);
    var gap = qd - QS1;
    var shortage = gap > 0.05;

    // ceiling line + its handle, hit target, labels
    ceiling.setAttribute('y1', cy); ceiling.setAttribute('y2', cy);
    ceilHit.setAttribute('y1', cy); ceilHit.setAttribute('y2', cy);
    ceilKnob.setAttribute('cy', cy);
    ptFocus.setAttribute('cy', cy);
    ceilLabel.setAttribute('y', cy - 5);
    p3Label.setAttribute('y', cy + 4);
    // when the ceiling coincides with the static P2 OR P1 label's height, hide
    // the P3 label so the two axis tags don't print on top of each other
    p3Label.style.visibility =
      (Math.abs(cy - YP2) < 8 || Math.abs(cy - YP1) < 8) ? 'hidden' : 'visible';

    // Q3 point (quantity demanded on D at the ceiling) + its dropline + label
    q3Dot.setAttribute('cx', gx); q3Dot.setAttribute('cy', cy);
    dropQ3.setAttribute('x1', gx); dropQ3.setAttribute('x2', gx);
    dropQ3.setAttribute('y1', cy); dropQ3.setAttribute('y2', Y0);
    q3Label.setAttribute('x', gx);
    // when the ceiling clears the market, Q3's foot coincides with Q2's —
    // hide the Q3 axis label to avoid it overprinting Q2
    q3Label.style.visibility = (Math.abs(gx - XQ2) < 26) ? 'hidden' : 'visible';

    // shortage shading (band along the ceiling Q2->Q3) + below-axis bracket
    if (shortage) {
      band.setAttribute('x', XQ2);
      band.setAttribute('width', gx - XQ2);
      band.setAttribute('y', cy - 6);
      bracket.setAttribute('d',
        'M' + XQ2 + ',393 L' + XQ2 + ',403 ' +
        'M' + XQ2 + ',398 L' + gx + ',398 ' +
        'M' + gx + ',393 L' + gx + ',403');
      bracketLabel.setAttribute('x', (XQ2 + gx) / 2);
      setShortageVisible(true);
    } else {
      setShortageVisible(false);
    }

    // readout grammar: muted state line + accent takeaway line
    var hint, trade;
    if (shortage) {
      hint  = 'Supply has fallen to S₁ (3.5 units). Ceiling at ' +
              c.toFixed(1) + ' → buyers want ' + fmt(qd) + '.';
      trade = 'The cap can’t undo the supply cut — it opens a ' +
              fmt(gap) + '-unit shortage.';
    } else if (Math.abs(gap) <= 0.05) {
      hint  = 'Ceiling at ' + c.toFixed(1) + ' = the new clearing price → 3.5 wanted = 3.5 available.';
      trade = 'At the new clearing price the market clears — the cut raised price, no shortage.';
    } else {
      hint  = 'Ceiling at ' + c.toFixed(1) + ' (above the new clearing price) → quantity demanded ' +
              fmt(qd) + ', quantity supplied 3.5.';
      trade = 'Above the ' + PCLEAR.toFixed(1) + ' clearing price the cap no longer binds — no shortage.';
    }
    rHint.textContent  = hint;
    rTrade.textContent = trade;

    ptFocus.setAttribute('aria-valuenow', c.toFixed(1));
    ptFocus.setAttribute('aria-valuetext', hint + ' ' + trade);
  }

  function setFromPointer(evt) {
    var p = toSvg(evt);
    var cc = toP(p.y);
    if (isNaN(cc)) return;
    if (cc < CMIN) cc = CMIN;
    if (cc > CMAX) cc = CMAX;
    c = cc;
    render();
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false;
  var capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false;
    svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault();
    dragging = true;
    svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  ceilHit.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);

  // --- keyboard: arrows step the ceiling in price ---
  ptFocus.addEventListener('keydown', function (evt) {
    var step = 0.2;
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { c += step; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { c -= step; }
    else return;
    evt.preventDefault();
    if (c < CMIN) c = CMIN;
    if (c > CMAX) c = CMAX;
    render();
  });

  // Debug hook (inert for students): set/get the ceiling price.
  window.__fig = {
    set: function (v) { c = Math.max(CMIN, Math.min(CMAX, +v)); render(); },
    get: function () { return { ceiling: c, qDemanded: qDemanded(c), qSupplied: QS1 }; }
  };

  render(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
