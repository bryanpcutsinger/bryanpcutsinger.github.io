      <path class="wedge" d="M216.5,205 L226.5,205 M221.5,205 L221.5,265 M216.5,265 L226.5,265"></path>
      <circle class="pt-A" r="5.5" cx="221.5" cy="265"></circle><circle class="pt-B" r="5.5" cx="221.5" cy="205"></circle>
