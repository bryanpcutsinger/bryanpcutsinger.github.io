    <line class="axis" x1="64" y1="400" x2="424" y2="400" marker-end="url(#arrow)"></line>
    <line class="axis" x1="64" y1="400" x2="64" y2="90" marker-end="url(#arrow)"></line>
    <text class="axlab" x="244" y="440" text-anchor="middle">Quantity (millions of gallons a week)</text>
    <text class="axlab" x="8" y="250" text-anchor="middle" transform="rotate(-90 8 250)">Price per gallon ($)</text>

    <g>
      <line class="tk tk5" visibility="visible" x1="59" y1="250" x2="63" y2="250"></line><text class="small" text-anchor="end" visibility="visible" x="58" y="254">$5</text>
      <line class="tk tkB" visibility="visible" x1="59" y1="220" x2="63" y2="220"></line><text class="tagB" text-anchor="end" visibility="visible" x="58" y="224">$6</text>
      <line class="tk tkA" visibility="visible" x1="59" y1="280" x2="63" y2="280"></line><text class="tagA" text-anchor="end" visibility="visible" x="58" y="284">$4</text>
    </g>
    <line class="tk tk5" visibility="hidden"></line><line class="tk tk5" visibility="hidden"></line>
    <text class="small" text-anchor="middle" visibility="visible" x="239" y="418">10</text>

    <g>
      <line class="dropB" x1="64" y1="220" x2="204" y2="220"></line><line class="dropA" x1="64" y1="280" x2="204" y2="280"></line><line class="drop" x1="204" y1="280" x2="204" y2="400"></line>
      <path class="wedge" d="M199,220 L209,220 M204,220 L204,280 M199,280 L209,280"></path>
      <circle class="pt-A" r="5.5" cx="204" cy="280"></circle><circle class="pt-B" r="5.5" cx="204" cy="220"></circle>
      <text class="qlab" text-anchor="middle" visibility="visible" x="204" y="418">8</text>
    </g>
    <circle class="pt-eq" r="5" cx="239" cy="250"></circle><text class="small" text-anchor="start" x="251" y="254">No tax</text>
    <line class="sep" x1="16" y1="456" x2="464" y2="456"></line>
    <text class="smallD" x="60" y="468" text-anchor="start" style="font-size:12px">Drivers bear</text>
    <text class="cap" x="240" y="468" text-anchor="middle">of the $2 tax</text>
    <text class="smallS" x="420" y="468" text-anchor="end" style="font-size:12px">Stations bear</text>
    <g>
      <rect x="60" y="474" width="180" height="26" fill="#1f5a96"></rect>
      <rect x="240" y="474" width="180" height="26" fill="#b8510d"></rect>
      <text class="barT" x="150" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$1</text>
      <text class="barT" x="330" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$1</text>
    </g>
    <g class="ro">
      <text class="r-state" text-anchor="middle"><tspan x="240" y="530">Original market: drivers pay $6, stations keep $4, 8M gallons trade.</tspan><tspan x="240" y="547"></tspan></text>
      <text class="r-take" text-anchor="middle"><tspan x="240" y="565.5">Neither side responds less than the other to a</tspan><tspan x="240" y="582.5">price change, so each bears $1 of the $2 tax.</tspan><tspan x="240" y="599.5" visibility="hidden"></tspan></text>
    </g>
    
    
  </g><g transform="translate(0,600)"><text x="240" y="30" text-anchor="middle" fill="#16181a" style="font-size:17px;font-weight:700">Steeper demand</text>
    
    

