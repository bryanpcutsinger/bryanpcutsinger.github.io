    <text class="smallS" x="420" y="468" text-anchor="end" style="font-size:12px">Stations bear</text>
    <g>
      <rect x="60" y="474" width="270" height="26" fill="#1f5a96"></rect>
      <rect x="330" y="474" width="90" height="26" fill="#b8510d"></rect>
      <text class="barT" x="195" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$1.50</text>
      <text class="barT" x="375" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$0.50</text>
