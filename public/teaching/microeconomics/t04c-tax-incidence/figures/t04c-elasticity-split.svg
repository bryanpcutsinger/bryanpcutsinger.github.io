<svg xmlns="http://www.w3.org/2000/svg" id="fig" viewBox="0 0 480 1800" role="img" aria-label="Who bears a $2 gasoline tax in three markets (still image)"><style> svg { --surface: #f7f4ef;   /* warm bone background               */ --ink:     #1a1c1e;   /* curves + primary labels            */ --text:    #16181a;   /* body text                          */ --muted:   #5c6066;   /* axes / secondary labels            */ --hairline:#e3ddd3;   /* separators                         */ --accent:  #b07a2c;   /* brass: the draggable policy handle */ --accent-tint: #efe4d2; --drivers: #1f5a96;   /* t04c deck semantics: drivers (demand)  */ --stations:#b8510d;   /* stations (supply)                       */ --state:   #1e7a64;   /* the state: tax revenue, the wedge       */ --lost:    #4a433d;   /* deadweight loss                         */ --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }       .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; } .curve  { stroke-width: 2.6; fill: none; stroke-linecap: round; } .cD     { stroke: var(--drivers); } .cS     { stroke: var(--stations); } .ref    { stroke-width: 1.5; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .75; } .shift  { stroke-width: 2.4; fill: none; stroke-dasharray: 7 4; stroke-linecap: round; } .drop   { stroke: var(--muted); stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; opacity: .6; } .dropB  { stroke: var(--drivers);  stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .8; fill: none; } .dropA  { stroke: var(--stations); stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .8; fill: none; } .wedge  { stroke: var(--state); stroke-width: 2.6; fill: none; stroke-linecap: butt; } .testln { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; opacity: .8; } .tk     { fill: none; stroke-width: 1.4; } .tkB    { stroke: var(--drivers); } .tkA    { stroke: var(--stations); } .tk5    { stroke: var(--muted); } .f-cs   { fill: var(--drivers);  fill-opacity: .20; } .f-ps   { fill: var(--stations); fill-opacity: .24; } .f-rev  { fill: var(--state);    fill-opacity: .26; stroke: var(--state); stroke-width: 1.2; } .f-dwl  { fill: #6e6862; stroke: var(--lost); stroke-width: 1.2; } .f-cost { fill: none; stroke: var(--state); stroke-width: 2.2; } .pt-eq  { fill: var(--ink);       stroke: var(--surface); stroke-width: 1.6; } .pt-B   { fill: var(--drivers);   stroke: var(--surface); stroke-width: 2; } .pt-A   { fill: var(--stations);  stroke: var(--surface); stroke-width: 2; } .ghost  { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-dasharray: 3 2.5; } .knob   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.4; pointer-events: none; } .lead   { stroke: var(--muted); stroke-width: 1.1; fill: none; }    .lab    { font-size: 13px; font-weight: 700; } .labD   { fill: var(--drivers); } .labS   { fill: var(--stations); } .axlab  { fill: var(--muted); font-size: 12.5px; font-weight: 600; } .qlab   { fill: var(--muted); font-size: 12px; font-weight: 600; } .tagB   { fill: var(--drivers);  font-size: 11.5px; font-weight: 700; } .tagA   { fill: var(--stations); font-size: 11.5px; font-weight: 700; } .tagW   { fill: #14604f; font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; } .tagX   { fill: var(--ink);      font-size: 11.5px; font-weight: 700; } .small  { fill: var(--muted); font-size: 11.5px; font-weight: 600; } .smallS { fill: var(--stations); font-size: 11px; font-weight: 700; } .smallD { fill: var(--drivers);  font-size: 11px; font-weight: 700; } .inCS   { fill: #17487a; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #e6e4e6; stroke-width: 3px; stroke-linejoin: round; } .inPS   { fill: #8f3f0a; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #ecdccd; stroke-width: 3px; stroke-linejoin: round; } .inRev  { fill: #14604f; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #d7e3dd; stroke-width: 3px; stroke-linejoin: round; } .inDwl  { fill: var(--lost); font-size: 11.5px; font-weight: 700; } .sep    { stroke: var(--hairline); stroke-width: 1; } .r-state{ fill: var(--muted); font-size: 13.5px; } .r-take { fill: #8a5a14; font-size: 13.5px; font-weight: 600; } .hintln { fill: var(--muted); font-size: 12px; } .cap    { fill: var(--muted); font-size: 12px; }          svg { font-family: var(--font-body); }</style><rect x="0" y="0" width="480" height="1800" fill="#f7f4ef" /><title>Who bears a $2 gasoline tax in three markets (still image)</title><desc>Still image of the same $2 tax in three gasoline markets that share the no-tax point of $5 and 10 million gallons. Left, the original market: drivers pay $6, stations keep $4, each bears $1. Middle, steeper demand: drivers pay $6.50, stations keep $4.50, drivers bear $1.50 and stations $0.50. Right, steeper supply: drivers pay $5.50, stations keep $3.50, drivers bear $0.50 and stations $1.50.</desc><g transform="translate(0,0)"><text x="240" y="30" text-anchor="middle" fill="#16181a" style="font-size:17px;font-weight:700">Original market</text>
    
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066"></path>
      </marker>
      <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#1a1c1e"></path>
      </marker>
    </defs>

    <line class="ref cD" visibility="hidden"></line><line class="ref cS" visibility="hidden"></line>
