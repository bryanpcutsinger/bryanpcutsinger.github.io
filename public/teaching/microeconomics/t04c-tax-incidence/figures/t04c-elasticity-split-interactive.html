<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive tax incidence: the side that cuts back less bears more of the same $2 tax</title>
<!--
  t04c-elasticity-split-interactive.html — built 2026-10-09 for the t04c post, section
  "The Side That Cuts Back Less Bears More"; revised after two blind reviews. Family F3. ONE widget, three-way toggle,
  the SAME $2 tax and the SAME no-tax point ($5, 10 million gallons) in every view; only a curve's steepness changes.

  ECONOMICS (oracle = slides/t04c-numbers-check.py). Demand P = a - bQ, supply P = s0 + cQ, tax t on stations:
    Q = (a - s0 - t)/(b + c),  Pb = a - bQ,  Ps = Pb - t.   Drivers bear Pb - 5, stations bear 5 - Ps.
    original        D: 10 - Q/2   S: Q/2        Q 8   $6.00 / $4.00   bear $1.00 / $1.00
    steeper demand  D: 20 - 1.5Q  S: Q/2        Q 9   $6.50 / $4.50   bear $1.50 / $0.50
    steeper supply  D: 10 - Q/2   S: 1.5Q - 10  Q 9   $5.50 / $3.50   bear $0.50 / $1.50
  Both steeper curves pass through (10, $5), so the pre-tax market is identical. "Cuts back less" means: responds less
  to a GIVEN price change (quantity falls from 10 to 9 on both sides); the takeaway says so.

  GEOMETRY MAP. viewBox 0 0 480 600. X(q) = 64 + 17.5q, Y(p) = 400 - 30p.
  Y-LAYOUT: 8-42 buttons | 100..400 plot | 418 foot | 440 axis title | 456 separator |
            466 burden-bar captions | 474-500 BURDEN BAR (180 px per $1 of tax, x 60..420) |
            520-537 state line | 561-595 takeaway (<= 2 rows).
  The burden bar splits the $2 tax: drivers' part (blue, left) + stations' part (orange, right).
  ARCHITECTURE: static base baked by _build/build_figures.py; script re-lays out; window.__fig test hook.
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background               */
    --ink:     #1a1c1e;   /* curves + primary labels            */
    --text:    #16181a;   /* body text                          */
    --muted:   #5c6066;   /* axes / secondary labels            */
    --hairline:#e3ddd3;   /* separators                         */
    --accent:  #b07a2c;   /* brass: the draggable policy handle */
    --accent-tint: #efe4d2;
    --drivers: #1f5a96;   /* t04c deck semantics: drivers (demand)  */
    --stations:#b8510d;   /* stations (supply)                       */
    --state:   #1e7a64;   /* the state: tax revenue, the wedge       */
    --lost:    #4a433d;   /* deadweight loss                         */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--surface); color: var(--text); font-family: var(--font-body);
         display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
  .fig { width: 100%; max-width: 480px; min-width: 0; position: relative; }
  svg { width: 100%; height: auto; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; }
  .curve  { stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .cD     { stroke: var(--drivers); }
  .cS     { stroke: var(--stations); }
  .ref    { stroke-width: 1.5; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; opacity: .75; }
  .shift  { stroke-width: 2.4; fill: none; stroke-dasharray: 7 4; stroke-linecap: round; }
  .drop   { stroke: var(--muted); stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; opacity: .6; }
  .dropB  { stroke: var(--drivers);  stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .8; fill: none; }
  .dropA  { stroke: var(--stations); stroke-width: 1.2; stroke-dasharray: 4 3; opacity: .8; fill: none; }
  .wedge  { stroke: var(--state); stroke-width: 2.6; fill: none; stroke-linecap: butt; }
  .testln { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 6 4; fill: none; opacity: .8; }
  .tk     { fill: none; stroke-width: 1.4; }
  .tkB    { stroke: var(--drivers); }
  .tkA    { stroke: var(--stations); }
  .tk5    { stroke: var(--muted); }

  .f-cs   { fill: var(--drivers);  fill-opacity: .20; }
  .f-ps   { fill: var(--stations); fill-opacity: .24; }
  .f-rev  { fill: var(--state);    fill-opacity: .26; stroke: var(--state); stroke-width: 1.2; }
  .f-dwl  { fill: #6e6862; stroke: var(--lost); stroke-width: 1.2; }
  .f-cost { fill: none; stroke: var(--state); stroke-width: 2.2; }

  .pt-eq  { fill: var(--ink);       stroke: var(--surface); stroke-width: 1.6; }
  .pt-B   { fill: var(--drivers);   stroke: var(--surface); stroke-width: 2; }
  .pt-A   { fill: var(--stations);  stroke: var(--surface); stroke-width: 2; }
  .ghost  { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-dasharray: 3 2.5; }
  .knob   { fill: var(--accent); stroke: var(--surface); stroke-width: 2.4; pointer-events: none; }
  .lead   { stroke: var(--muted); stroke-width: 1.1; fill: none; }

  .hit      { fill: transparent; stroke: transparent; touch-action: none; cursor: ns-resize; }
  .hit:focus-visible { outline: none; }
  .hit:focus-visible + .knob, .grabbing .knob { stroke: var(--ink); stroke-width: 3.2; }

  .lab    { font-size: 13px; font-weight: 700; }
  .labD   { fill: var(--drivers); }
  .labS   { fill: var(--stations); }
  .axlab  { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .qlab   { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .tagB   { fill: var(--drivers);  font-size: 11.5px; font-weight: 700; }
  .tagA   { fill: var(--stations); font-size: 11.5px; font-weight: 700; }
  .tagW   { fill: #14604f; font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .tagX   { fill: var(--ink);      font-size: 11.5px; font-weight: 700; }
  .small  { fill: var(--muted); font-size: 11.5px; font-weight: 600; }
  .smallS { fill: var(--stations); font-size: 11px; font-weight: 700; }
  .smallD { fill: var(--drivers);  font-size: 11px; font-weight: 700; }
  .inCS   { fill: #17487a; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #e6e4e6; stroke-width: 3px; stroke-linejoin: round; }
  .inPS   { fill: #8f3f0a; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #ecdccd; stroke-width: 3px; stroke-linejoin: round; }
  .inRev  { fill: #14604f; font-size: 11.5px; font-weight: 700; paint-order: stroke; stroke: #d7e3dd; stroke-width: 3px; stroke-linejoin: round; }
  .inDwl  { fill: var(--lost); font-size: 11.5px; font-weight: 700; }
  .sep    { stroke: var(--hairline); stroke-width: 1; }
  .r-state{ fill: var(--muted); font-size: 13.5px; }
  .r-take { fill: #8a5a14; font-size: 13.5px; font-weight: 600; }
  .hintln { fill: var(--muted); font-size: 12px; }
  .cap    { fill: var(--muted); font-size: 12px; }

  .btn rect { fill: #fbf9f5; stroke: #cfc5b8; stroke-width: 1.3; cursor: pointer; }
  .btn text { fill: var(--text); font-size: 12.5px; font-weight: 600; pointer-events: none; }
  .btn[aria-checked="true"] rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2.2; }
  .btn[aria-checked="true"] text { font-weight: 700; }
  .btn:focus-visible { outline: none; }
  .btn:focus-visible rect { stroke: var(--ink); stroke-width: 3; }

  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 480 600" role="group" aria-label="Who bears a 2 dollar tax. A gasoline market with the same no-tax point of 5 dollars and 10 million gallons. Three buttons switch between the original market, a market with steeper demand where drivers respond less to a price change, and one with steeper supply where stations respond less. A bar below the plot splits the 2 dollar tax between drivers and stations.">
    <title>Interactive split of a $2 tax by elasticity</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066"></path>
      </marker>
      <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#1a1c1e"></path>
      </marker>
    </defs>

    <line id="rD" class="ref cD" visibility="hidden"></line><line id="rS" class="ref cS" visibility="hidden"></line>
    <text id="lbRef" class="small" text-anchor="start" visibility="hidden"></text>
    <line id="cS" class="curve cS" x1="99" y1="370" x2="396.5" y2="115"></line><line id="cD" class="curve cD" x1="99" y1="130" x2="396.5" y2="385"></line>
    <text id="lbS" class="lab labS" text-anchor="start" x="403.5" y="119">S</text><text id="lbD" class="lab labD" text-anchor="end" x="92" y="134">D</text>
    <line id="cSs" class="shift cS" x1="99" y1="310" x2="330" y2="112"></line><text id="lbSs" class="smallS" text-anchor="end" x="330" y="104">S + tax</text>
    
    <line class="axis" x1="64" y1="400" x2="424" y2="400" marker-end="url(#arrow)"></line>
    <line class="axis" x1="64" y1="400" x2="64" y2="90" marker-end="url(#arrow)"></line>
    <text class="axlab" x="244" y="440" text-anchor="middle">Quantity (millions of gallons a week)</text>
    <text class="axlab" x="8" y="250" text-anchor="middle" transform="rotate(-90 8 250)">Price per gallon ($)</text>

    <g id="gTags">
      <line id="lead5" class="tk tk5" visibility="visible" x1="59" y1="250" x2="63" y2="250"></line><text id="tag5" class="small" text-anchor="end" visibility="visible" x="58" y="254">$5</text>
      <line id="leadB" class="tk tkB" visibility="visible" x1="59" y1="220" x2="63" y2="220"></line><text id="tagB" class="tagB" text-anchor="end" visibility="visible" x="58" y="224">$6</text>
      <line id="leadA" class="tk tkA" visibility="visible" x1="59" y1="280" x2="63" y2="280"></line><text id="tagA" class="tagA" text-anchor="end" visibility="visible" x="58" y="284">$4</text>
    </g>

    <g id="gWedge">
      <line id="dropB" class="dropB" x1="64" y1="220" x2="204" y2="220"></line><line id="dropA" class="dropA" x1="64" y1="280" x2="204" y2="280"></line><line id="dropV" class="drop" x1="204" y1="280" x2="204" y2="400"></line>
      <path id="wedge" class="wedge" d="M199,220 L209,220 M204,220 L204,280 M199,280 L209,280"></path>
      <circle id="dotA" class="pt-A" r="5.5" cx="204" cy="280"></circle><circle id="dotB" class="pt-B" r="5.5" cx="204" cy="220"></circle>
      <text id="footQ" class="qlab" text-anchor="middle" visibility="visible" x="204" y="418">8</text>
    </g>
    <circle id="e0" class="pt-eq" r="5" cx="239" cy="250"></circle><text id="e0Lab" class="small" text-anchor="start" x="251" y="254">No tax</text>
    <line class="sep" x1="16" y1="456" x2="464" y2="456"></line>
    <text class="smallD" x="60" y="468" text-anchor="start" style="font-size:12px">Drivers bear</text>
    <text class="cap" x="240" y="468" text-anchor="middle">of the $2 tax</text>
    <text class="smallS" x="420" y="468" text-anchor="end" style="font-size:12px">Stations bear</text>
    <g id="bar">
      <rect id="barB" x="60" y="474" width="180" height="26" fill="#1f5a96"></rect>
      <rect id="barA" x="240" y="474" width="180" height="26" fill="#b8510d"></rect>
      <text id="barBt" class="barT" x="150" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$1</text>
      <text id="barAt" class="barT" x="330" y="492" text-anchor="middle" fill="#ffffff" style="font-size:13.5px;font-weight:700">$1</text>
    </g>
    <g id="readout" class="ro">
      <text class="r-state" text-anchor="middle"><tspan id="s1" x="240" y="530">Original market: drivers pay $6, stations keep $4, 8M gallons trade.</tspan><tspan id="s2" x="240" y="547"></tspan></text>
      <text class="r-take" text-anchor="middle"><tspan id="t1" x="240" y="565.5">Neither side responds less than the other to a</tspan><tspan id="t2" x="240" y="582.5">price change, so each bears $1 of the $2 tax.</tspan><tspan id="t3" x="240" y="599.5" visibility="hidden"></tspan></text>
    </g>
    <g id="gUI" class="ui" role="radiogroup" aria-label="Choose a view">
      <g id="btn0" class="btn ui" role="radio" tabindex="0" aria-checked="true"><rect x="15" y="8" width="146" height="34" rx="7"></rect><text id="btnT0" x="88" y="30" text-anchor="middle">Original market</text></g>
      <g id="btn1" class="btn ui" role="radio" tabindex="-1" aria-checked="false"><rect x="167" y="8" width="146" height="34" rx="7"></rect><text id="btnT1" x="240" y="30" text-anchor="middle">Steeper demand</text></g>
      <g id="btn2" class="btn ui" role="radio" tabindex="-1" aria-checked="false"><rect x="319" y="8" width="146" height="34" rx="7"></rect><text id="btnT2" x="392" y="30" text-anchor="middle">Steeper supply</text></g>
    </g>
    <text id="meas" x="-999" y="-999" class="r-take">xx</text>
  </svg>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image of the original gasoline market with a $2 tax: drivers and stations each bear $1. You can also
      <a href="/teaching/microeconomics/t04c-tax-incidence/figures/t04c-elasticity-split.svg">open the static figure</a>.</p>
  </noscript>
</div>
<script>
(function () {
  "use strict";

  // ---- pixel frame: data -> viewBox 0 0 480 600 (see the geometry map above) ----
  var X0 = 64, SX = 17.5;             // x origin px; px per million gallons
  var Y0 = 400, SY = 30;              // x-axis foot; px per dollar
  function X (q) { return X0 + q * SX; }
  function Y (p) { return Y0 - p * SY; }
  function toP (yy) { return (Y0 - yy) / SY; }
  var MAXW = 448, LH = 17;

  var $ = function (id) { return document.getElementById(id); };
  var svg = $('fig'), meas = $('meas'), live = $('live');
  function sa (el, o) { for (var k in o) { el.setAttribute(k, o[k]); } }
  function vis (el, on) { el.setAttribute('visibility', on ? 'visible' : 'hidden'); }
  function show (el, on) { el.style.display = on ? '' : 'none'; }       // group switch: beats any child's own visibility
  function ln (el, x1, y1, x2, y2) { sa(el, { x1: x1, y1: y1, x2: x2, y2: y2 }); }
  function seg (el, q1, p1, q2, p2) { ln(el, X(q1), Y(p1), X(q2), Y(p2)); }
  function poly (el, arr) { el.setAttribute('points', arr.map(function (v) { return v[0] + ',' + v[1]; }).join(' ')); }
  function pt (el, q, p) { sa(el, { cx: X(q), cy: Y(p) }); }
  function txt (el, x, y, s) { el.setAttribute('x', x); el.setAttribute('y', y); if (s !== undefined) { el.textContent = s; } }
  function clamp (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- number words: prices as $6 / $6.50 / $5.125, quantities as 8 / 9.75, money as $16M ----
  function r2 (v) { return Math.round(v * 100 + 1e-9) / 100; }
  function pr (v) {
    var r = Math.round(v * 1000) / 1000;
    if (Math.abs(r - Math.round(r)) < 1e-9) { return '$' + Math.round(r); }
    var s = r.toFixed(3); if (s.charAt(s.length - 1) === '0') { s = s.slice(0, -1); }
    return '$' + s;
  }
  function nn (v) { return String(r2(v)); }
  function mon (v) { return '$' + nn(v) + 'M'; }

  // ---- text measuring + greedy wrap into at most `rows` lines (balanced) ----
  function layout (words, w, sp, maxW, rows) {
    var out = [], line = [], run = 0, wide = 0;
    function close () { out.push(line.join(' ')); if (run > wide) { wide = run; } }
    for (var i = 0; i < words.length; i++) {
      var add = (line.length ? sp : 0) + w[i];
      if (line.length && run + add > maxW && out.length < rows - 1) { close(); line = [words[i]]; run = w[i]; }
      else { line.push(words[i]); run += add; }
    }
    close();
    return { lines: out, n: out.length, wide: wide };
  }
  function wrap (s, cls, maxW, rows) {
    meas.setAttribute('class', cls);
    var words = s.split(' '), w = [], i;
    for (i = 0; i < words.length; i++) { meas.textContent = words[i]; w.push(meas.getComputedTextLength()); }
    meas.textContent = 'x x'; var sp = meas.getComputedTextLength();
    meas.textContent = 'xx'; sp -= meas.getComputedTextLength();
    var n = layout(words, w, sp, maxW, rows).n, lo = 0, hi = maxW;
    for (i = 0; i < 12; i++) {
      var mid = (lo + hi) / 2, trial = layout(words, w, sp, mid, rows);
      if (trial.n > n || trial.wide > mid + 0.5) { lo = mid; } else { hi = mid; }
    }
    return layout(words, w, sp, hi, rows).lines;
  }
  function setRows (ids, lines, mid, lh) {
    var n = lines.length, top = mid - ((n - 1) * lh) / 2;
    for (var i = 0; i < ids.length; i++) {
      var el = $(ids[i]); el.textContent = i < n ? lines[i] : ''; el.setAttribute('y', top + i * lh);
    }
  }
  function widthOf (el, s) { el.textContent = s; return el.getComputedTextLength(); }
  // readout: a muted state line (<= 2 rows) over an accent takeaway (<= takeRows rows); also mirrored to the live region
  var lastSay = '';
  function readout (state, take, stateMid, takeMid, takeRows) {
    setRows(['s1', 's2'], wrap(state, 'r-state', MAXW, 2), stateMid, LH);
    setRows(['t1', 't2', 't3'], wrap(take, 'r-take', MAXW, takeRows || 3), takeMid, LH);
    lastSay = state + ' ' + take;
    return lastSay;
  }
  // the live region speaks only on button / mode changes and at the end of a drag, not on every keypress or on load
  function announce () { live.textContent = lastSay; }

  // ---- left-gutter price tags: spread apart if closer than 15 px; a short leader keeps each tied to its true height ----
  // items: {t: text el, l: leader el, y: true y, on: bool, s: string}
  function gutter (items) {
    var vs = items.filter(function (i) { return i.on; }).sort(function (a, b) { return a.y - b.y; }), p = [], k, sh = 0;
    for (k = 0; k < vs.length; k++) { p.push(k === 0 ? vs[0].y : Math.max(vs[k].y, p[k - 1] + 15)); sh += vs[k].y - p[k]; }
    if (vs.length) { sh = 0; for (k = 0; k < vs.length; k++) { sh += vs[k].y - p[k]; } sh /= vs.length; }
    items.forEach(function (i) { vis(i.t, i.on); vis(i.l, i.on); });
    vs.forEach(function (i, k2) {
      var py = p[k2] + sh;
      i.t.textContent = i.s; sa(i.t, { x: X0 - 6, y: py + 4 });
      ln(i.l, X0 - 5, py, X0 - 1, i.y);
    });
  }
  // foot labels under the axis: spread apart if closer than 22 px, tied to the true x by a short leader
  // items: {t: text el, l: leader el (optional), x: true x, on: bool, s: string}
  function foot (items) {
    var vs = items.filter(function (i) { return i.on; }).sort(function (a, b) { return a.x - b.x; }), p = [], k, sh = 0;
    for (k = 0; k < vs.length; k++) { p.push(k === 0 ? vs[0].x : Math.max(vs[k].x, p[k - 1] + 22)); sh += vs[k].x - p[k]; }
    if (vs.length) { sh /= vs.length; }
    items.forEach(function (i) { vis(i.t, i.on); if (i.l) { vis(i.l, false); } });
    vs.forEach(function (i, k2) {
      var nx = p[k2] + sh; i.t.textContent = i.s; sa(i.t, { x: nx, y: 418 });
      if (i.l && Math.abs(nx - i.x) > 1.5) { vis(i.l, true); ln(i.l, i.x, 402, nx, 409); }   // leader to the true quantity
    });
  }

  // ---- drag (pointer capture, grab offset so the knob never jumps; cancel and lost capture clean up) ----
  var spt = svg.createSVGPoint();
  function toSvg (evt) { spt.x = evt.clientX; spt.y = evt.clientY; return spt.matrixTransform(svg.getScreenCTM().inverse()); }
  function bindDrag (els, knobY, onY, onEnd) {
    var dragging = false, capEl = null, capId = null, off = 0;
    function onMove (e) { if (dragging && e.pointerId === capId) { e.preventDefault(); onY(toSvg(e).y - off); } }
    function onUp (e) {
      if (e && e.pointerId !== undefined && capId !== null && e.pointerId !== capId) { return; }
      var was = dragging;
      dragging = false; svg.classList.remove('grabbing');
      if (was && onEnd) { onEnd(); }
      if (capEl && capId !== null) { try { capEl.releasePointerCapture(capId); } catch (x) {} }
      capEl = null; capId = null;
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    }
    function onDown (e) {
      if (dragging) { return; }
      e.preventDefault(); dragging = true; svg.classList.add('grabbing');
      capEl = e.currentTarget; capId = e.pointerId;
      try { capEl.setPointerCapture(capId); } catch (x) {}
      off = clamp(toSvg(e).y - knobY(), -26, 26);
      onY(toSvg(e).y - off);
      window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    els.forEach(function (el) {
      el.addEventListener('pointerdown', onDown);
      el.addEventListener('lostpointercapture', onUp);
    });
  }
  // keyboard for a 0..4 slider: Up/Right = more, Down/Left = less; arrows step `step` (default 0.25), Page keys step 1
  function bindKeys (el, get, set, step) {
    step = step || 0.25;
    el.addEventListener('keydown', function (e) {
      var v = get();
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { v += step; }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { v -= step; }
      else if (e.key === 'PageUp') { v += 1; }
      else if (e.key === 'PageDown') { v -= 1; }
      else if (e.key === 'Home') { v = 0; }
      else if (e.key === 'End') { v = 4; }
      else { return; }
      e.preventDefault(); set(v);
    });
  }
  // SVG radio buttons: click, Enter, Space; arrows move the choice
  function bindRadio (ids, get, set) {
    ids.forEach(function (id, i) {
      var b = $(id);
      b.addEventListener('click', function () { set(i); });
      b.addEventListener('keydown', function (e) {
        var n = ids.length;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(i); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); set((i + 1) % n); $(ids[(i + 1) % n]).focus(); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); set((i + n - 1) % n); $(ids[(i + n - 1) % n]).focus(); }
      });
    });
  }
  function showRadio (ids, k) {
    ids.forEach(function (id, i) { $(id).setAttribute('aria-checked', i === k ? 'true' : 'false'); $(id).setAttribute('tabindex', i === k ? '0' : '-1'); });
  }
  // test hook: switches ride in the URL hash (Canvas drops query strings)
  function hashParam (k, d) {
    var m = new RegExp('[#&]' + k + '=([^&]*)').exec(location.hash || '');
    return m ? m[1] : d;
  }


  var T = 2;
  var VIEWS = [
    { name: 'original',       a: 10, b: 0.5, s0: 0,   c: 0.5 },
    { name: 'steeper demand', a: 20, b: 1.5, s0: 0,   c: 0.5 },
    { name: 'steeper supply', a: 10, b: 0.5, s0: -10, c: 1.5 }
  ];
  var BTN = ['btn0', 'btn1', 'btn2'];
  var view = 0;

  function solve (v) {
    var q = (v.a - v.s0 - T) / (v.b + v.c), pb = v.a - v.b * q, ps = pb - T;
    return { q: q, pb: pb, ps: ps, drivers: pb - 5, stations: 5 - ps };
  }
  // draw a straight line P = k0 + k1*q between price limits, clipped to q in [qLo, qHi]
  function drawLine (el, k0, k1, qLo, qHi) {
    var pLo = 0.4, pHi = 9.6, a = (pLo - k0) / k1, b = (pHi - k0) / k1;
    var lo = Math.max(qLo, Math.min(a, b)), hi = Math.min(qHi, Math.max(a, b));
    seg(el, lo, k0 + k1 * lo, hi, k0 + k1 * hi);
    return { lo: lo, hi: hi };
  }

  function render () {
    var v = VIEWS[view], s = solve(v), q = s.q;
    var d = drawLine($('cD'), v.a, -v.b, 2, 19), sp = drawLine($('cS'), v.s0, v.c, 2, 19);
    txt($('lbD'), X(d.lo) - 7, Y(v.a - v.b * d.lo) + 4);
    txt($('lbS'), X(sp.hi) + 7, Y(v.s0 + v.c * sp.hi) + 4);
    var ss = drawLine($('cSs'), v.s0 + T, v.c, 2, 19);
    txt($('lbSs'), X(ss.hi), Y(v.s0 + T + v.c * ss.hi) - 8);
    // the replaced original curve stays as a dotted reference
    vis($('rD'), view === 1); vis($('rS'), view === 2); vis($('lbRef'), view !== 0);
    if (view === 1) { seg($('rD'), 2, 9, 19, 0.5); txt($('lbRef'), X(17.3) + 6, Y(1.35) - 6, 'original D'); }
    if (view === 2) { seg($('rS'), 2, 1, 19, 9.5); txt($('lbRef'), X(17.3) + 6, Y(8.65) + 14, 'original S'); }

    pt($('e0'), 10, 5); txt($('e0Lab'), X(10) + 12, Y(5) + 4);

    var xq = X(q), yb = Y(s.pb), ya = Y(s.ps);
    show($('gWedge'), true);
    pt($('dotB'), q, s.pb); pt($('dotA'), q, s.ps);
    ln($('dropB'), X0, yb, xq, yb); ln($('dropA'), X0, ya, xq, ya); ln($('dropV'), xq, ya, xq, Y0);
    $('wedge').setAttribute('d', 'M' + (xq - 5) + ',' + yb + ' L' + (xq + 5) + ',' + yb + ' M' + xq + ',' + yb + ' L' + xq + ',' + ya + ' M' + (xq - 5) + ',' + ya + ' L' + (xq + 5) + ',' + ya);
    gutter([
      { t: $('tag5'), l: $('lead5'), y: Y(5), on: true, s: '$5' },
      { t: $('tagB'), l: $('leadB'), y: yb, on: true, s: pr(s.pb) },
      { t: $('tagA'), l: $('leadA'), y: ya, on: true, s: pr(s.ps) }
    ]);
    foot([{ t: $('foot10'), l: $('fl10'), x: X(10), on: Math.abs(q - 10) > 0.01, s: '10' }, { t: $('footQ'), l: $('flQ'), x: xq, on: true, s: nn(q) }]);

    // burden bar: 180 px per $1 of tax
    var wB = s.drivers * 180, wA = s.stations * 180;
    sa($('barB'), { x: 60, width: wB }); sa($('barA'), { x: 60 + wB, width: wA });
    txt($('barBt'), 60 + wB / 2, 492, pr(s.drivers));
    txt($('barAt'), 60 + wB + wA / 2, 492, pr(s.stations));

    var state, take;
    if (view === 0) {
      state = 'Original market: drivers pay ' + pr(s.pb) + ', stations keep ' + pr(s.ps) + ', ' + nn(q) + 'M gallons trade.';
      take = 'Neither side responds less than the other to a price change, so each bears ' + pr(s.drivers) + ' of the ' + pr(T) + ' tax.';
    } else if (view === 1) {
      state = 'Steeper demand: drivers pay ' + pr(s.pb) + ', stations keep ' + pr(s.ps) + ', ' + nn(q) + 'M gallons trade.';
      take = 'Drivers cut back less for a given price rise, so they bear more: ' + pr(s.drivers) + ' of the ' + pr(T) + ' tax, and stations ' + pr(s.stations) + '.';
    } else {
      state = 'Steeper supply: drivers pay ' + pr(s.pb) + ', stations keep ' + pr(s.ps) + ', ' + nn(q) + 'M gallons trade.';
      take = 'Stations cut back less for a given price change, so they bear more: ' + pr(s.stations) + ' of the ' + pr(T) + ' tax, and drivers ' + pr(s.drivers) + '.';
    }
    readout(state, take, 530, 574, 2);
    showRadio(BTN, view);
  }
  function setView (k) { view = k; render(); announce(); }
  bindRadio(BTN, function () { return view; }, setView);

  window.__fig = {
    set: function (o) { if (o.view !== undefined) { view = o.view; } render(); return window.__fig.get(); },
    get: function () {
      var v = VIEWS[view], s = solve(v);
      return { view: v.name, tax: T, q: s.q, pb: s.pb, ps: s.ps, driversBear: s.drivers, stationsBear: s.stations };
    }
  };
  var hv = hashParam('view', null); if (hv !== null) { view = clamp(+hv, 0, 2); }
  render();

})();
</script>
