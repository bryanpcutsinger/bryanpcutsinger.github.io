<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A tax on fixed land: the owner bears the whole tax, whoever the law taxes</title>
<!--
  Interactive land-tax figure for the t07b-tax-incidence-and-quasi-rent blog post,
  after E&P Fig 4-6 (p.66) "Effect of a Tax on Demands and Price with Fixed Supply".
  Website-styled warm palette (NOT the FAU slide palette). Self-contained: vanilla
  SVG + JS, no libraries, no network, no build step. The static FAU figure
  (t07b-ep4-6-land-tax.{tex,svg}) is the SLIDE version and the <noscript> fallback.

  DISTINCT JOB vs the sibling t04c-land-incidence widget in the same post section:
  that one shows a SINGLE schedule with the owner's rent slice shrinking. THIS one
  draws TWO demand schedules -- the renters' demand D_c and the demand NET OF TAX
  that reaches the owner, D_s = D_c - tax -- and adds the legal-side toggle to make
  the "who writes the check does not matter, even for land" point.

  THE ONE ECONOMIC POINT: land supply is fixed (a vertical S at Q-bar = 50). A tax
  never moves the renters' price ($1.00) or the acreage (50); it only drops the
  net-of-tax demand that reaches the owner by the full tax, so the owner nets
  $1.00 - tax. Taxing the renter or the owner gives the identical result.

  Family F3 (policy line / wedge on fixed supply): drag the net-of-tax demand D_s
  down (grab anywhere along it; the knob sits at the owner's crossing at Q=50) to
  raise the tax 0..80c; the renters' demand D_c, the fixed supply S, the renters'
  price $1.00, and the acreage 50 are drawn as part of the static base and NEVER
  move under the script -- that invariance is the whole lesson.

  ARCHITECTURE: the base figure is REAL SVG markup (a no-JS reader sees the full
  still figure at the default 40c tax). The script only ATTACHES behavior; it
  never builds the DOM.

  DATA SPACE: x = land 0..80 units, y = rent 0..2.00 $/sq ft.
  PIXEL FRAME: X(q) = 64 + q*4.1 ; Y(p) = 360 - p*150. Axes extend past the data
  max (x to 418, y to 24) so lines never crowd the arrowheads.
  Fixed model: S vertical at Q-bar = 50 (x=269). D_c: P = 2.00 - 0.02*Q, through
  (0,2.00)->(64,60) and (50,1.00)->(269,210)=renters' price. D_s = D_c - tax.
  SCOPE LOCK (verbal-marginal): NO surplus shading, NO deadweight-loss vocabulary.
  A fixed-supply tax causes no quantity change, so there is no welfare loss to draw.
  The tax gap is a TRANSFER (owner -> government), never a welfare area.
-->
<style>
  :root {
    --surface: #f7f4ef;    /* warm bone background          */
    --ink:     #1a1c1e;    /* renters' demand + headings    */
    --text:    #16181a;    /* body text                     */
    --muted:   #5c6066;    /* axes / secondary labels       */
    --hairline:#e3ddd3;    /* axis muting / droplines       */
    --accent:  #b07a2c;    /* brass -- net-of-tax demand, tax wedge, owner knob */
    --accent-soft: #c69a5e;/* lighter brass for the dashed net-of-tax line      */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; max-width: 100%; height: auto; display: block;
        touch-action: pan-y; }

  /* structural strokes */
  .axis    { stroke: var(--muted); stroke-width: 1.4; }
  .curve   { stroke: var(--ink); stroke-width: 2.6; fill: none;
             stroke-linecap: round; }
  .supply  { stroke: var(--ink); stroke-width: 2.6; fill: none;
             stroke-linecap: round; }
  .netline { stroke: var(--accent-soft); stroke-width: 2.6; fill: none;
             stroke-linecap: round; stroke-dasharray: 7 5; }
  .refline { stroke: var(--ink); stroke-width: 2.0; fill: none;
             stroke-linecap: round; }
  .drop    { stroke: var(--hairline); stroke-width: 1.6; stroke-dasharray: 5 4; }

  /* tax wedge */
  .wedge   { stroke: var(--accent); stroke-width: 2.4; fill: none;
             stroke-linecap: round; }

  /* points */
  .pt-static { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .knob      { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5;
               pointer-events: none; }

  /* transparent hit targets */
  .hit-line { fill: none; stroke: transparent; stroke-width: 30;
              touch-action: none; cursor: ns-resize; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .knob,
  .grabbing .knob { stroke: var(--ink); stroke-width: 3.2; }

  /* light "at the snap" emphasis at the 40c reference tax */
  .atsnap #ownerKnob { stroke: var(--ink); stroke-width: 3.0; }

  /* text */
  .lab    { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .netlab { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .axlab  { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .qlab   { fill: var(--muted); font-size: 12px; font-weight: 600; }
  .plab   { fill: var(--muted); font-size: 12.5px; font-weight: 600; }
  .taxlab { fill: var(--accent); font-size: 13px; font-weight: 700; }
  .sep    { stroke: var(--hairline); stroke-width: 1; }
  .readout{ font-family: var(--font-body); text-align: center; }
  .r-hint { color: var(--muted); font-size: 12.5px; line-height: 1.3;
            margin-bottom: 5px; }
  .r-take { color: var(--accent); font-size: 14px; font-weight: 600;
            line-height: 1.3; }

  /* HTML legal-side toggle below the figure */
  .controls { margin: 10px 2px 0; display: flex; justify-content: center; }
  .toggle { display: inline-flex; border: 1px solid var(--hairline);
            border-radius: 8px; overflow: hidden; background: #fff; }
  .seg { appearance: none; border: 0; background: transparent; cursor: pointer;
         font-family: var(--font-body); font-size: 13.5px; font-weight: 600;
         color: var(--muted); padding: 8px 14px; min-height: 40px; }
  .seg + .seg { border-left: 1px solid var(--hairline); }
  .seg.active { background: var(--accent); color: #fff; }
  .seg:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="A land-tax diagram. Land supply is fixed at 50 units, drawn as a vertical line, so demand crosses it at a market rent of one dollar per square foot. A tax drops the net-of-tax demand that reaches the owner by the full tax, so the renters still pay one dollar and 50 units of land stay in use while the owner's net rent falls by the whole tax. Drag the dashed net-of-tax demand down to raise or lower the tax; toggle whether the law taxes the owner or the renter to see the result is identical.">
    <title>Interactive fixed-land tax-incidence diagram (two demand schedules)</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="wedgeUp" markerWidth="10" markerHeight="10" refX="4" refY="1.5"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M4,0 L7.5,7 L0.5,7 Z" fill="#b07a2c" />
      </marker>
      <marker id="wedgeDn" markerWidth="10" markerHeight="10" refX="4" refY="8.5"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M4,10 L0.5,3 L7.5,3 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- static droplines (drawn first, under the solid lines) -->
    <line class="drop" x1="64" y1="210" x2="269" y2="210" />          <!-- renters' $1.00 -->
    <line id="ownerDrop" class="drop" x1="64" y1="270" x2="269" y2="270" /> <!-- owner net -->

    <!-- axes (extended past the data max) -->
    <line class="axis" x1="64" y1="360" x2="418" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64"  y2="24"  marker-end="url(#arrow)" />

    <!-- fixed vertical supply S at Q-bar = 50 (the whole point: cannot move) -->
    <line class="supply" x1="269" y1="360" x2="269" y2="60" />

    <!-- renters' demand D_c: P = 2.00 - 0.02*Q, (0,2.00)->(80,0.40) -->
    <line class="curve" x1="64" y1="60" x2="392" y2="300" />

    <!-- net-of-tax demand D_s = D_c - tax (draggable). Default tax = 40c:
         (0,1.60)->(80,0.00) => (64,120)->(392,360) -->
    <line id="netLine" class="netline" x1="64" y1="120" x2="392" y2="360" />

    <!-- renters'-price reference line at $1.00, Q = 0..50 -- NEVER moves -->
    <line class="refline" x1="64" y1="210" x2="269" y2="210" />

    <!-- tax wedge: the constant 40c gap between D_c and D_s, shown at Q=16
         (x=129.6). Top on D_c (y=108), bottom on D_s (default y=168). -->
    <line id="wedge" class="wedge" x1="129.6" y1="108" x2="129.6" y2="168"
          marker-start="url(#wedgeUp)" marker-end="url(#wedgeDn)" />

    <!-- axis titles -->
    <text class="axlab" x="241" y="430" text-anchor="middle">Land (units)</text>
    <text class="axlab" x="20" y="200" text-anchor="middle"
          transform="rotate(-90 20 200)">Monthly land rent ($/sq ft)</text>

    <!-- S label (above the supply's top, clear of every line) -->
    <text class="lab" x="269" y="50" text-anchor="middle">S: fixed stock of land</text>

    <!-- tax-amount label, in the always-clear top strip above D_c, over the wedge -->
    <text id="taxLabel" class="taxlab" x="129.6" y="44" text-anchor="middle">Tax = 40&#162;</text>

    <!-- D_c label (renters' demand), below both lines in the clear bottom-right -->
    <text class="lab" x="360" y="342" text-anchor="middle">D<tspan baseline-shift="sub" font-size="9.5">c</tspan>: renters&#8217; demand</text>

    <!-- D_s label (net-of-tax demand), lower-left, in the clear bottom band -->
    <text id="netLabel" class="netlab" x="188" y="336" text-anchor="middle">D<tspan baseline-shift="sub" font-size="9.5">s</tspan>: demand net of tax</text>

    <!-- static equilibrium / outcome dots -->
    <circle class="pt-static" cx="269" cy="210" r="4.5" />           <!-- renters' price $1.00 -->

    <!-- y-axis foot labels: renters' $1.00 (static) + owner net (dynamic) -->
    <text class="plab" x="55" y="213.5" text-anchor="end">$1.00</text>
    <text id="ownerFoot" class="plab" x="55" y="273.5" text-anchor="end">$0.60</text>

    <!-- x-axis foot label: the fixed acreage -->
    <text class="qlab" x="269" y="377" text-anchor="middle">50</text>

    <!-- in-figure notes echoing the source's two arrows -->
    <text class="lab" x="279" y="200" text-anchor="start">Price to renters</text>
    <text class="lab" x="132" y="300" text-anchor="start">Net-of-tax price to owner</text>

    <!-- fat invisible hit line over D_s (grab anywhere along it) -->
    <line id="netHit" class="hit-line" x1="64" y1="120" x2="392" y2="360" />
    <!-- keyboard proxy (screen-reader slider) beneath the visible owner knob -->
    <circle id="ptFocus" class="pt-focus" cx="269" cy="270" r="22"
            tabindex="0" role="slider" aria-label="Tax on land rent, in cents"
            aria-valuemin="0" aria-valuemax="80" aria-valuenow="40"
            fill="transparent"
            aria-valuetext="Tax 40 cents: renters still pay $1.00, owner nets $0.60, 50 units of land in use. The whole tax comes out of the owner's rent; the renter's price and the acres never move." />
    <!-- visible owner-net knob on D_s at Q=50 (the outcome + the drag handle) -->
    <circle id="ownerKnob" class="knob" cx="269" cy="270" r="6.5" />

    <!-- readout band: hairline separator, muted STATE line, accent TAKEAWAY line -->
    <line class="sep" x1="44" y1="446" x2="396" y2="446" />
    <foreignObject x="30" y="452" width="380" height="86">
      <div xmlns="http://www.w3.org/1999/xhtml" class="readout">
        <div id="rHint" class="r-hint">Tax 40&#162;: renters still pay $1.00, owner nets $0.60, 50 units of land in use.</div>
        <div id="rTake" class="r-take">The whole tax comes out of the owner's rent; the renter's price and the acres never move.</div>
      </div>
    </foreignObject>
  </svg>

  <div class="controls">
    <div class="toggle" role="group" aria-label="Who does the law tax?">
      <button id="btnOwner" class="seg active" type="button" aria-pressed="true">Tax the owner</button>
      <button id="btnRenter" class="seg" type="button" aria-pressed="false">Tax the renter</button>
    </div>
  </div>

  <noscript>
    <p class="fallback">JavaScript is off, so the figure above is a complete still
      image at a 40&#162; tax: land supply fixed at 50 units, renters' demand crossing
      it at a $1.00 market rent, and the net-of-tax demand dropped 40&#162; so the owner
      nets $0.60 while renters still pay $1.00 for the same 50 units. You can also
      <a href="t07b-ep4-6-land-tax.svg">open the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg       = document.getElementById('fig');
  var netLine   = document.getElementById('netLine');
  var netHit    = document.getElementById('netHit');
  var ownerKnob = document.getElementById('ownerKnob');
  var ptFocus   = document.getElementById('ptFocus');
  var ownerDrop = document.getElementById('ownerDrop');
  var ownerFoot = document.getElementById('ownerFoot');
  var wedge     = document.getElementById('wedge');
  var taxLabel  = document.getElementById('taxLabel');
  var rHint     = document.getElementById('rHint');
  var rTake     = document.getElementById('rTake');
  var btnOwner  = document.getElementById('btnOwner');
  var btnRenter = document.getElementById('btnRenter');

  // pixel frame + scale (mirrors the base SVG markup)
  var X0 = 64, SX = 4.1, Y0 = 360, SY = 150;
  function X (q) { return X0 + q * SX; }
  function Y (p) { return Y0 - p * SY; }
  function toP (yy) { return (Y0 - yy) / SY; }

  // fixed model constants
  var QBAR = 50;                 // fixed land stock (vertical supply)
  var P0   = 2.00;               // D_c intercept: P = 2.00 - 0.02*Q
  var SLOPE = 0.02;
  var RENT = P0 - SLOPE * QBAR;  // renters' clearing rent = $1.00 (invariant)
  var WQ   = 16;                 // x-location of the tax-wedge indicator
  var TMIN = 0, TMAX = 0.80, TSNAP = 0.40;

  function dcAt (q) { return P0 - SLOPE * q; }        // renters' demand
  // right end of D_s where it hits P=0 (or Q=80 max), so it never dips below axis
  function netEndQ (t) { return Math.min(80, (P0 - t) / SLOPE); }

  // clamp + gentle snap to the 40c reference tax and the two ends
  function clampSnap (v) {
    if (v < TMIN) v = TMIN;
    if (v > TMAX) v = TMAX;
    if (Math.abs(v - TSNAP) < 0.02) v = TSNAP;   // snap to 40c
    else if (v < 0.015) v = 0;
    else if (v > TMAX - 0.015) v = TMAX;
    return v;
  }

  // State in DATA units (t = tax, dollars). Legal side: 'owner' | 'renter'.
  var t = 0.40;
  var side = 'owner';

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg (evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function fmt2 (v) { return v.toFixed(2); }
  function cents (v) { return Math.round(v * 100); }

  function render () {
    var ownerNet = RENT - t;               // owner nets $1.00 - tax
    var ownerY   = Y(ownerNet);
    var endQ     = netEndQ(t);

    // net-of-tax demand line D_s = D_c - t : (0, P0-t) -> (endQ, dc(endQ)-t)
    var x1 = X(0),  y1 = Y(P0 - t);
    var x2 = X(endQ), y2 = Y(dcAt(endQ) - t);
    netLine.setAttribute('x1', x1); netLine.setAttribute('y1', y1);
    netLine.setAttribute('x2', x2); netLine.setAttribute('y2', y2);
    // Hit region: a band on D_s around the Q=50 crossing only (fidelity review
    // 2026-07-20) - grabbing the sloped line at its far ends read the pointer's
    // absolute y as the Q=50 value and made the line jump. The knob remains the
    // primary handle; this band gives it forgiving margins without that jump.
    var hq1 = 40, hq2 = Math.min(endQ, 60);
    netHit.setAttribute('x1', X(hq1)); netHit.setAttribute('y1', Y(dcAt(hq1) - t));
    netHit.setAttribute('x2', X(hq2)); netHit.setAttribute('y2', Y(dcAt(hq2) - t));

    // owner knob + keyboard proxy sit on D_s at Q=50 (the crossing with S)
    ownerKnob.setAttribute('cx', X(QBAR)); ownerKnob.setAttribute('cy', ownerY);
    ptFocus.setAttribute('cx', X(QBAR));   ptFocus.setAttribute('cy', ownerY);

    // owner-net dropline + foot label track the crossing
    ownerDrop.setAttribute('y1', ownerY); ownerDrop.setAttribute('y2', ownerY);
    ownerFoot.setAttribute('y', ownerY + 3.5);
    ownerFoot.textContent = '$' + fmt2(ownerNet);

    // tax wedge at Q=WQ: top on D_c, bottom on D_s (= top + t)
    var wx = X(WQ);
    var wTop = Y(dcAt(WQ));
    var wBot = Y(dcAt(WQ) - t);
    wedge.setAttribute('x1', wx); wedge.setAttribute('y1', wTop);
    wedge.setAttribute('x2', wx); wedge.setAttribute('y2', wBot);
    // hide the wedge when the tax is ~0 (no gap to show)
    wedge.style.visibility = (t < 0.02) ? 'hidden' : 'visible';

    // tax label at the top strip, over the wedge column
    taxLabel.setAttribute('x', wx);
    taxLabel.textContent = 'Tax = ' + cents(t) + '¢';

    // snap emphasis at the 40c reference
    svg.classList.toggle('atsnap', Math.abs(t - TSNAP) < 0.001);

    // ---- readout grammar: muted STATE line + accent TAKEAWAY line ----
    var c = cents(t);
    var on = fmt2(ownerNet);
    var hint, take;
    if (t <= 0) {
      hint = 'No tax: renters pay $1.00 and the owner keeps the full $1.00.';
      take = 'Nothing to shift — the whole rent is the owner’s.';
    } else if (side === 'renter') {
      // legal side = renter: identical outcome, different check-writer
      hint = 'Now the law taxes the renter: renter pays the owner $' + on +
             ' and the government ' + c + '¢ — total $1.00.';
      take = 'Identical to taxing the owner: who writes the check does not matter, even for land.';
    } else if (Math.abs(t - TSNAP) < 0.001) {
      // owner side, the 40c reference
      hint = 'Tax 40¢: renters still pay $1.00, owner nets $0.60, 50 units of land in use.';
      take = 'The whole tax comes out of the owner’s rent; the renter’s price and the acres never move.';
    } else if (Math.abs(t - TMAX) < 0.001) {
      // owner side, the 80c end
      hint = 'Tax 80¢: renters pay $1.00, owner nets $0.20, acreage unchanged.';
      take = 'A bigger tax carves a bigger slice from the owner; the fixed supply still cannot pass any of it forward.';
    } else {
      // owner side, general
      hint = 'Tax ' + c + '¢: renters pay $1.00, owner nets $' + on +
             ', 50 units of land in use.';
      take = 'The whole tax comes out of the owner’s rent — the renter’s price and the acres never move.';
    }
    rHint.textContent = hint;
    rTake.textContent = take;

    ptFocus.setAttribute('aria-valuenow', c);
    ptFocus.setAttribute('aria-valuetext', hint + ' ' + take);
  }

  function setFromPointer (evt) {
    var p = toSvg(evt);
    var netP = toP(p.y);          // treat the drag as vertical: read D_s at Q=50
    if (isNaN(netP)) return;
    t = clampSnap(RENT - netP);   // t = renters' rent - owner's net
    render();
  }

  // --- drag (pointer events + pointer capture so a fast drag can't get stuck) ---
  var dragging = false, capturedEl = null, capturedId = null;
  function onMove (evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp () {
    dragging = false; svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown (evt) {
    evt.preventDefault();
    dragging = true; svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  netHit.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);

  // --- keyboard: arrows step the tax in 5c increments ---
  ptFocus.addEventListener('keydown', function (evt) {
    var step = 0.05;
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') { t += step; }
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') { t -= step; }
    else if (evt.key === 'Home') { t = TMIN; }
    else if (evt.key === 'End') { t = TMAX; }
    else return;
    evt.preventDefault();
    // round to a clean 5c grid, then clamp/snap
    t = clampSnap(Math.round(t / 0.05) * 0.05);
    render();
  });

  // --- legal-side toggle (geometry identical; only the readout wording changes) ---
  function setSide (s) {
    side = s;
    var ownerActive = (s === 'owner');
    btnOwner.classList.toggle('active', ownerActive);
    btnRenter.classList.toggle('active', !ownerActive);
    btnOwner.setAttribute('aria-pressed', String(ownerActive));
    btnRenter.setAttribute('aria-pressed', String(!ownerActive));
    render();
  }
  btnOwner.addEventListener('click', function () { setSide('owner'); });
  btnRenter.addEventListener('click', function () { setSide('renter'); });

  // Debug hook (inert for students): set/get the tax + legal side.
  window.__fig = {
    set: function (o) {
      if (o == null) return;
      if (typeof o === 'number') { t = clampSnap(+o); render(); return; }
      if (o.side) setSide(o.side === 'renter' ? 'renter' : 'owner');
      if (o.t != null) { t = clampSnap(+o.t); }
      render();
    },
    get: function () {
      return { t: t, taxCents: cents(t), side: side,
               rentersPay: RENT, ownerNets: RENT - t, acres: QBAR };
    }
  };

  render();  // sync JS state with the static markup on load
})();
</script>
</body>
</html>
