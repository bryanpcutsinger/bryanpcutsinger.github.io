<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: a change in the amount demanded versus a change in demand</title>
<!--
  Interactive recreation of UE Fig 5.3A/B (p.67) for the T3a blog post
  (website-styled warm palette, not FAU). Self-contained: no libraries, no
  network. The static FAU figure (figures/t03-demand-shift-vs-move.{tex,svg})
  is the SLIDE version and is untouched; it is also this widget's <noscript>
  fallback.

  ARCHITECTURE: the base figure is REAL SVG markup. A no-JS reader sees the
  FULL two-panel still -- both panels complete with every curve, point, axis,
  droplines, arrows and label the corrected element inventory calls for. The
  script only ATTACHES behavior (Panel A: drag/keyboard slide the point along
  the fixed curve; Panel B: a Lower/Higher demand toggle); it never builds
  figure DOM.

  GEOMETRY (family F2, two-panel side-by-side): viewBox 720 x 460,
  aspect-ratio 16/10, max-width 640px.
    Panel A frame: x = 70  + Q*22 (Q=11 -> 312); y = 298 - P*215 (P=1.10 -> 61.5).
    Panel B frame: x = 410 + Q*22 (Q=11 -> 652); same y.
  Axes drawn PAST the data max (to Q~12.5) so arrowheads don't crowd the lines.
    Panel A demand (fixed):     P = 1.10 - 0.10*Q   (milk-schedule line, 0..11)
    Panel B demand_lower:       P = 0.80 - 0.10*Q   (0..8)
    Panel B demand_higher:      P = 1.10 - 0.10*Q   (0..11, same line as Panel A)
  Panel A: anchor (before) point fixed at Q=3.5,P=0.75; draggable current point
  starts at Q=6,P=0.50 -- both match the UE source's two plotted points exactly.
  Panel B: shift compares Q=3 on D_lower to Q=6 on D_higher, both at P=0.50
  (parallel lines -> constant 0.30 price gap -> constant 64.5px pixel gap).
-->
<style>
  :root {
    --surface: #f7f4ef;   /* warm bone background        */
    --ink:     #1a1c1e;    /* primary curves + headings   */
    --text:    #16181a;    /* body text                   */
    --muted:   #5c6066;    /* captions / secondary labels */
    --hairline:#e3ddd3;    /* axes muting / droplines     */
    --accent:  #b07a2c;    /* brass -- active point/arrows */
    --accent-tint: #efe4d2;/* (unused shading reserve)     */
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 640px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; touch-action: pan-y; }

  /* Panel-B mode toggle (above the panels) */
  .modebar { display: flex; align-items: center; gap: 8px;
             margin: 0 0 8px; flex-wrap: wrap; }
  .modelabel { color: var(--muted); font-size: 13px; font-weight: 600; }
  .seg { font-family: inherit; font-size: 13px; font-weight: 600;
         color: var(--ink); background: var(--surface);
         border: 1.5px solid var(--hairline); border-radius: 6px;
         padding: 5px 14px; cursor: pointer; }
  .seg + .seg { margin-left: -1px; }
  .seg.on { background: var(--accent); color: var(--surface);
            border-color: var(--accent); }
  .seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* structural strokes */
  .axis      { stroke: var(--muted); stroke-width: 1.4; }
  .curve     { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
  .curve-ghost { stroke: var(--muted); stroke-width: 2; fill: none;
               stroke-dasharray: 6 5; opacity: 0.75; }
  .drop      { stroke: var(--hairline); stroke-width: 1.6;
               stroke-dasharray: 5 4; }

  /* arrows */
  .slideArrow { stroke: var(--accent); stroke-width: 2.4; fill: none; }
  .deltaArrow { stroke: var(--accent); stroke-width: 2; fill: none; }
  .shift      { stroke: var(--accent); stroke-width: 2.2; fill: none; }

  /* points + hit targets */
  .ctx-pt { fill: var(--muted); }
  .pt     { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
  .hit       { fill: transparent; stroke: transparent; touch-action: none;
               cursor: grab; }
  .hit-curve { fill: none; stroke: transparent; stroke-width: 26;
               touch-action: none; cursor: grab; }
  .pt-focus:focus-visible { outline: none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke: var(--accent); stroke-width: 3.5; }

  /* text */
  .panelhead { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .axlabel   { fill: var(--muted); font-size: 10.5px; font-weight: 600; }
  .curvelabel{ fill: var(--muted); font-size: 11px; font-style: italic; }
  .note      { fill: var(--muted); font-size: 9px; }
  .qlabel    { fill: var(--ink); font-size: 12px; font-weight: 700;
               paint-order: stroke; stroke: var(--surface); stroke-width: 3px;
               stroke-linejoin: round; }
  .sep       { stroke: var(--hairline); stroke-width: 1; }
  .r-hint    { fill: var(--muted); font-size: 12px; }
  .r-trade   { fill: var(--accent); font-size: 12.5px; font-weight: 600; }
  .fallback  { margin: 8px 0 0; color: var(--muted); font-size: 13px;
               line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <div class="modebar" role="group" aria-label="Panel B: choose the demand curve">
    <span class="modelabel">Panel B demand:</span>
    <button id="btnLower" class="seg" type="button" aria-pressed="false">Lower</button>
    <button id="btnHigher" class="seg on" type="button" aria-pressed="true">Higher</button>
  </div>

  <svg id="fig" viewBox="0 0 720 460" role="group"
       aria-label="Two panels contrasting a change in the amount demanded with a change in demand. Left: one fixed demand curve -- drag the point or use arrow keys to slide it along the curve as price changes. Right: two parallel demand curves -- toggle Lower or Higher to shift the whole curve and see the price change at an unchanged quantity offered.">
    <title>A change in the amount demanded (slide along one curve) versus a change in demand (the whole curve shifts)</title>
    <defs>
      <marker id="arwMuted" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="arwAccent" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <!-- ================= PANEL A: change in the amount demanded ================= -->
    <g id="panelA">
      <text class="panelhead" x="207" y="16" text-anchor="middle">Change in the amount demanded</text>

      <!-- axes (drawn before the curve); extended past the data max (Q~12.5, P~1.20) -->
      <line class="axis" x1="70" y1="298" x2="345" y2="298" marker-end="url(#arwMuted)" />
      <line class="axis" x1="70" y1="298" x2="70"  y2="40"  marker-end="url(#arwMuted)" />
      <text class="axlabel" x="207.5" y="313" text-anchor="middle">Amount of X Demanded per Period</text>
      <text class="axlabel" x="28" y="169" text-anchor="middle"
            transform="rotate(-90 28 169)">Price per Amount of X Demanded</text>

      <!-- the fixed demand line: (Q=0,$1.10) to (Q=11,$0.00); does NOT move -->
      <path class="curve" d="M70,61.5 L312,298" />
      <path id="aHitCurve" class="hit-curve" d="M70,61.5 L312,298" />
      <text class="curvelabel" x="276" y="250" text-anchor="start">Demand for X</text>

      <!-- static explanatory annotation (matches the UE source's two plotted points) -->
      <text class="note" x="185" y="100" text-anchor="start">Larger amount demanded</text>
      <text class="note" x="185" y="113" text-anchor="start">because of lower price</text>

      <!-- anchor (before) point: fixed at Q=3.5, $0.75; muted dashed ghost droplines -->
      <line class="drop" x1="147" y1="298" x2="147"    y2="136.75" />
      <line class="drop" x1="70"  y1="136.75" x2="147" y2="136.75" />
      <circle class="ctx-pt" cx="147" cy="136.75" r="4" />

      <!-- accent slide arrow, anchor -> current (JS updates its d) -->
      <path id="slideArrow" class="slideArrow" marker-end="url(#arwAccent)"
            d="M144.6,127.1 L199.6,180.9" />

      <!-- below-axis change-in-quantity arrow, anchor x -> current x (JS updates) -->
      <line id="deltaArrow" class="deltaArrow" marker-end="url(#arwAccent)"
            x1="147" y1="342" x2="202" y2="342" />
      <text id="deltaLabel" class="note" x="174.5" y="356" text-anchor="middle">increase in amount demanded</text>

      <!-- the draggable current point + droplines + live axis readouts -->
      <line id="curDropV" class="drop" x1="202" y1="298" x2="202" y2="190.5" />
      <line id="curDropH" class="drop" x1="70"  y1="190.5" x2="202" y2="190.5" />
      <text id="curQLabel" class="qlabel" x="202" y="328" text-anchor="middle">6.0</text>
      <text id="curPLabel" class="qlabel" x="60" y="190.5" text-anchor="end"
            dominant-baseline="middle">$0.50</text>

      <circle id="curHit"   class="hit" cx="202" cy="190.5" r="22" />
      <circle id="curPt"    class="pt"  cx="202" cy="190.5" r="7" />
      <circle id="curFocus" class="pt-focus hit" cx="202" cy="190.5" r="22"
              tabindex="0" role="slider" aria-label="Point on the fixed demand curve"
              aria-valuemin="0.5" aria-valuemax="10.5" aria-valuenow="6.0"
              aria-valuetext="Quantity 6.0, price $0.50. Own price fell from $0.75 to $0.50. Same curve -- you slide down it. This is a change in the amount demanded." />

      <!-- readout band (accent takeaway wraps to 2 short lines so it fits the half-width column) -->
      <line class="sep" x1="70" y1="374" x2="345" y2="374" />
      <text id="hintA"  class="r-hint"  x="207.5" y="394" text-anchor="middle">Own price fell from $0.75 to $0.50.</text>
      <text id="tradeA1" class="r-trade" x="207.5" y="412" text-anchor="middle">Same curve -- you slide down it.</text>
      <text id="tradeA2" class="r-trade" x="207.5" y="428" text-anchor="middle">A change in the amount demanded.</text>
    </g>

    <!-- ================= PANEL B: change in demand ================= -->
    <g id="panelB">
      <text class="panelhead" x="547" y="16" text-anchor="middle">Change in demand</text>

      <line class="axis" x1="410" y1="298" x2="685" y2="298" marker-end="url(#arwMuted)" />
      <line class="axis" x1="410" y1="298" x2="410" y2="40"  marker-end="url(#arwMuted)" />
      <text class="axlabel" x="547.5" y="313" text-anchor="middle">Amount of X Demanded per Period</text>
      <text class="axlabel" x="368" y="169" text-anchor="middle"
            transform="rotate(-90 368 169)">Price per Amount of X Demanded</text>

      <!-- two parallel demand lines; JS swaps which is accent-solid vs muted-ghost -->
      <path id="dLower"  class="curve-ghost" d="M410,126  L586,298" />
      <path id="dHigher" class="curve"       d="M410,61.5 L652,298" />
      <text id="labLower"  class="curvelabel" x="592" y="290" text-anchor="start">D<tspan font-size="8" dy="3">lower</tspan></text>
      <text id="labHigher" class="curvelabel" x="658" y="290" text-anchor="start">D<tspan font-size="8" dy="3">higher</tspan></text>

      <!-- static explanatory annotations (clear of both curves, upper right) -->
      <text class="note" x="545" y="85"  text-anchor="start">Higher demand: higher income,</text>
      <text class="note" x="545" y="98"  text-anchor="start">more buyers -- not a price change</text>
      <text class="note" x="545" y="120" text-anchor="start">Lower demand: lower income,</text>
      <text class="note" x="545" y="133" text-anchor="start">fewer buyers -- not a price change</text>

      <!-- fixed reference dot at the Lower-demand intersection -->
      <circle id="ctxLower" class="ctx-pt" cx="476" cy="190.5" r="4" />

      <!-- horizontal shift arrow at the unchanged price $0.50 (JS reverses direction) -->
      <line id="shiftArrow" class="shift" marker-end="url(#arwAccent)"
            x1="476" y1="190.5" x2="542" y2="190.5" />

      <!-- droplines + live axis readouts for the active point (JS updates x) -->
      <line id="bDropV" class="drop" x1="542" y1="298" x2="542" y2="190.5" />
      <line id="bDropH" class="drop" x1="410" y1="190.5" x2="542" y2="190.5" />
      <text id="bQLabel" class="qlabel" x="542" y="328" text-anchor="middle">6.0</text>
      <text id="bPLabel" class="qlabel" x="400" y="190.5" text-anchor="end"
            dominant-baseline="middle">$0.50</text>

      <circle id="bHit"   class="hit" cx="542" cy="190.5" r="22" />
      <circle id="bPt"    class="pt"  cx="542" cy="190.5" r="7" />
      <circle id="bFocus" class="pt-focus hit" cx="542" cy="190.5" r="22"
              tabindex="0" role="slider" aria-label="Position of the demand curve: Lower or Higher"
              aria-valuemin="0" aria-valuemax="1" aria-valuenow="1"
              aria-valuetext="Higher demand curve. At the unchanged price, $0.50, the quantity demanded is 6.0. Income rose (not the good's own price). The whole curve shifts right -- this is a change in demand itself." />

      <!-- readout band (accent takeaway wraps to 2 short lines so it fits the half-width column) -->
      <line class="sep" x1="410" y1="374" x2="685" y2="374" />
      <text id="hintB"  class="r-hint"  x="547.5" y="394" text-anchor="middle">Income rose (not the good's own price).</text>
      <text id="tradeB1" class="r-trade" x="547.5" y="412" text-anchor="middle">The whole curve shifts right --</text>
      <text id="tradeB2" class="r-trade" x="547.5" y="428" text-anchor="middle">a change in demand itself.</text>
    </g>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame is a still image showing
      both distinctions: on the left, a price change slides the point along one
      fixed demand curve (a change in the amount demanded); on the right, two
      parallel curves show the whole curve shifting from a lower to a higher
      demand (a change in demand). You can also <a href="t03-demand-shift-vs-move.svg">open
      the static figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var byId = function (id) { return document.getElementById(id); };

  // ---- pixel frame (mirrors the markup comment above) ----
  var AX0 = 70, BX0 = 410, PER_X = 22, Y0 = 298, PER_Y = 215;
  var qToX_A = function (q) { return AX0 + q * PER_X; };
  var qToX_B = function (q) { return BX0 + q * PER_X; };
  var pToY   = function (p) { return Y0 - p * PER_Y; };
  var toQ_A  = function (px) { return (px - AX0) / PER_X; };

  // demand models (same slope -0.10; D_lower and D_higher are parallel)
  var priceA      = function (q) { return 1.10 - 0.10 * q; }; // Panel A + D_higher
  var priceLower  = function (q) { return 0.80 - 0.10 * q; }; // D_lower

  // ---- Panel A refs ----
  var slideArrow = byId('slideArrow'), deltaArrow = byId('deltaArrow'), deltaLabel = byId('deltaLabel');
  var curDropV = byId('curDropV'), curDropH = byId('curDropH');
  var curQLabel = byId('curQLabel'), curPLabel = byId('curPLabel');
  var curHit = byId('curHit'), curPt = byId('curPt'), curFocus = byId('curFocus'), aHitCurve = byId('aHitCurve');
  var hintA = byId('hintA'), tradeA1 = byId('tradeA1'), tradeA2 = byId('tradeA2');

  var AQ_ANCHOR = 3.5, AQ_LO = 0.5, AQ_HI = 10.5;
  var aq = 6.0; // current draggable quantity in Panel A

  // ---- Panel B refs ----
  var dLower = byId('dLower'), dHigher = byId('dHigher');
  var shiftArrow = byId('shiftArrow');
  var bDropV = byId('bDropV'), bDropH = byId('bDropH');
  var bQLabel = byId('bQLabel'), bPLabel = byId('bPLabel');
  var bHit = byId('bHit'), bPt = byId('bPt'), bFocus = byId('bFocus');
  var hintB = byId('hintB'), tradeB1 = byId('tradeB1'), tradeB2 = byId('tradeB2');
  var btnLower = byId('btnLower'), btnHigher = byId('btnHigher');

  var B_Q_LOWER = 3.0, B_Q_HIGHER = 6.0;
  var bHigher = true; // Panel B state: true = Higher demand active

  // convert a client event to SVG user coords (handles responsive scaling)
  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  // offset a straight anchor->current line by a small perpendicular amount so
  // the accent arrow doesn't sit directly on top of the ink curve.
  function slideArrowPath(q0, q1) {
    var x0 = qToX_A(q0), y0 = pToY(priceA(q0));
    var x1 = qToX_A(q1), y1 = pToY(priceA(q1));
    var dx = x1 - x0, dy = y1 - y0, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ox = (dy / len) * 8, oy = -(dx / len) * 8;
    return 'M' + (x0 + ox).toFixed(1) + ',' + (y0 + oy).toFixed(1) +
           ' L' + (x1 + ox).toFixed(1) + ',' + (y1 + oy).toFixed(1);
  }

  function renderA() {
    var p = priceA(aq), pAnchor = priceA(AQ_ANCHOR);
    var cx = qToX_A(aq), cy = pToY(p);

    curPt.setAttribute('cx', cx); curPt.setAttribute('cy', cy);
    curHit.setAttribute('cx', cx); curHit.setAttribute('cy', cy);
    curFocus.setAttribute('cx', cx); curFocus.setAttribute('cy', cy);

    curDropV.setAttribute('x1', cx); curDropV.setAttribute('x2', cx); curDropV.setAttribute('y2', cy);
    curDropH.setAttribute('y1', cy); curDropH.setAttribute('y2', cy); curDropH.setAttribute('x2', cx);

    curQLabel.setAttribute('x', cx); curQLabel.textContent = aq.toFixed(1);
    curPLabel.setAttribute('y', cy - 0); curPLabel.textContent = '$' + p.toFixed(2);

    slideArrow.setAttribute('d', slideArrowPath(AQ_ANCHOR, aq));
    slideArrow.style.opacity = (Math.abs(aq - AQ_ANCHOR) < 0.1) ? 0 : 1;

    var deltaMidX = (qToX_A(AQ_ANCHOR) + cx) / 2;
    deltaArrow.setAttribute('x1', qToX_A(AQ_ANCHOR)); deltaArrow.setAttribute('x2', cx);
    deltaLabel.setAttribute('x', deltaMidX);
    if (aq > AQ_ANCHOR + 0.05) { deltaLabel.textContent = 'increase in amount demanded'; }
    else if (aq < AQ_ANCHOR - 0.05) { deltaLabel.textContent = 'decrease in amount demanded'; }
    else { deltaLabel.textContent = 'no change in amount demanded'; }

    var qStr = aq.toFixed(1), pStr = p.toFixed(2), pAnchorStr = pAnchor.toFixed(2);
    var stateText, trade1, trade2;
    if (Math.abs(aq - AQ_ANCHOR) < 0.05) {
      stateText = 'Own price holds at $' + pAnchorStr + '.';
      trade1 = 'Drag the point to slide';
      trade2 = 'along the curve.';
    } else if (aq > AQ_ANCHOR) {
      stateText = 'Own price fell from $' + pAnchorStr + ' to $' + pStr + '.';
      trade1 = 'Same curve -- you slide down it.';
      trade2 = 'A change in the amount demanded.';
    } else {
      stateText = 'Own price rose from $' + pAnchorStr + ' to $' + pStr + '.';
      trade1 = 'Same curve -- you slide up it.';
      trade2 = 'A change in the amount demanded.';
    }
    hintA.textContent = stateText;
    tradeA1.textContent = trade1;
    tradeA2.textContent = trade2;

    curFocus.setAttribute('aria-valuenow', qStr);
    curFocus.setAttribute('aria-valuetext',
      'Quantity ' + qStr + ', price $' + pStr + '. ' + stateText + ' ' + trade1 + ' ' + trade2);
  }

  function renderB() {
    dHigher.setAttribute('class', bHigher ? 'curve' : 'curve-ghost');
    dLower.setAttribute('class', bHigher ? 'curve-ghost' : 'curve');

    var q = bHigher ? B_Q_HIGHER : B_Q_LOWER;
    var cx = qToX_B(q), cy = 190.5; // both intersections sit at the unchanged $0.50 price

    bPt.setAttribute('cx', cx); bPt.setAttribute('cy', cy);
    bHit.setAttribute('cx', cx); bHit.setAttribute('cy', cy);
    bFocus.setAttribute('cx', cx); bFocus.setAttribute('cy', cy);

    bDropV.setAttribute('x1', cx); bDropV.setAttribute('x2', cx);
    bDropH.setAttribute('x2', cx);

    bQLabel.setAttribute('x', cx); bQLabel.textContent = q.toFixed(1);

    // shift arrow always runs Lower -> Higher visually; reverse ends when Lower is active
    if (bHigher) {
      shiftArrow.setAttribute('x1', qToX_B(B_Q_LOWER)); shiftArrow.setAttribute('x2', qToX_B(B_Q_HIGHER));
    } else {
      shiftArrow.setAttribute('x1', qToX_B(B_Q_HIGHER)); shiftArrow.setAttribute('x2', qToX_B(B_Q_LOWER));
    }

    btnLower.classList.toggle('on', !bHigher);
    btnHigher.classList.toggle('on', bHigher);
    btnLower.setAttribute('aria-pressed', bHigher ? 'false' : 'true');
    btnHigher.setAttribute('aria-pressed', bHigher ? 'true' : 'false');

    var stateText, trade1, trade2;
    if (bHigher) {
      stateText = "Income rose (not the good's own price).";
      trade1 = 'The whole curve shifts right --';
      trade2 = 'a change in demand itself.';
    } else {
      stateText = "Income fell (not the good's own price).";
      trade1 = 'The whole curve shifts left --';
      trade2 = 'a change in demand itself, again.';
    }
    hintB.textContent = stateText;
    tradeB1.textContent = trade1;
    tradeB2.textContent = trade2;

    bFocus.setAttribute('aria-valuenow', bHigher ? '1' : '0');
    bFocus.setAttribute('aria-valuetext',
      (bHigher ? 'Higher' : 'Lower') + ' demand curve. At the unchanged price, $0.50, the quantity demanded is ' +
      q.toFixed(1) + '. ' + stateText + ' ' + trade1 + ' ' + trade2);
  }

  // ---- Panel A: pointer drag (projects onto the fixed straight line) ----
  function setAFromPointer(evt) {
    var pnt = toSvg(evt);
    var q = toQ_A(pnt.x);
    if (isNaN(q)) return;
    if (q < AQ_LO) q = AQ_LO;
    if (q > AQ_HI) q = AQ_HI;
    aq = q;
    renderA();
  }
  var aDragging = false, aCapEl = null, aCapId = null;
  function aMove(evt) { if (aDragging) { evt.preventDefault(); setAFromPointer(evt); } }
  function aUp() {
    aDragging = false;
    svg.classList.remove('grabbing');
    if (aCapEl && aCapId !== null) { try { aCapEl.releasePointerCapture(aCapId); } catch (e) {} }
    aCapEl = null; aCapId = null;
    window.removeEventListener('pointermove', aMove);
    window.removeEventListener('pointerup', aUp);
  }
  function aDown(evt) {
    evt.preventDefault();
    aDragging = true;
    svg.classList.add('grabbing');
    aCapEl = evt.currentTarget; aCapId = evt.pointerId;
    try { aCapEl.setPointerCapture(aCapId); } catch (e) {}
    setAFromPointer(evt);
    window.addEventListener('pointermove', aMove);
    window.addEventListener('pointerup', aUp);
  }
  curHit.addEventListener('pointerdown', aDown);
  aHitCurve.addEventListener('pointerdown', aDown);
  curFocus.addEventListener('pointerdown', aDown);

  curFocus.addEventListener('keydown', function (evt) {
    var step = 0.5;
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { aq += step; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { aq -= step; }
    else return;
    evt.preventDefault();
    if (aq < AQ_LO) aq = AQ_LO;
    if (aq > AQ_HI) aq = AQ_HI;
    renderA();
  });

  // ---- Panel B: pointer drag/click chooses the nearer curve position ----
  function setBFromPointer(evt) {
    var pnt = toSvg(evt);
    var mid = (qToX_B(B_Q_LOWER) + qToX_B(B_Q_HIGHER)) / 2;
    bHigher = pnt.x >= mid;
    renderB();
  }
  var bDragging = false, bCapEl = null, bCapId = null;
  function bMove(evt) { if (bDragging) { evt.preventDefault(); setBFromPointer(evt); } }
  function bUp() {
    bDragging = false;
    svg.classList.remove('grabbing');
    if (bCapEl && bCapId !== null) { try { bCapEl.releasePointerCapture(bCapId); } catch (e) {} }
    bCapEl = null; bCapId = null;
    window.removeEventListener('pointermove', bMove);
    window.removeEventListener('pointerup', bUp);
  }
  function bDown(evt) {
    evt.preventDefault();
    bDragging = true;
    svg.classList.add('grabbing');
    bCapEl = evt.currentTarget; bCapId = evt.pointerId;
    try { bCapEl.setPointerCapture(bCapId); } catch (e) {}
    setBFromPointer(evt);
    window.addEventListener('pointermove', bMove);
    window.addEventListener('pointerup', bUp);
  }
  bHit.addEventListener('pointerdown', bDown);
  bFocus.addEventListener('pointerdown', bDown);

  bFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') { bHigher = true; }
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') { bHigher = false; }
    else return;
    evt.preventDefault();
    renderB();
  });

  btnLower.addEventListener('click', function () { bHigher = false; renderB(); bFocus.focus(); });
  btnHigher.addEventListener('click', function () { bHigher = true; renderB(); bFocus.focus(); });

  // ---- debug hook (inert for students) ----
  window.__fig = {
    set: function (v) {
      v = v || {};
      if (typeof v.aq === 'number') aq = Math.max(AQ_LO, Math.min(AQ_HI, v.aq));
      if (typeof v.bHigher === 'boolean') bHigher = v.bHigher;
      renderA(); renderB();
    },
    get: function () {
      return { aq: aq, aPrice: priceA(aq), bHigher: bHigher,
               bQ: bHigher ? B_Q_HIGHER : B_Q_LOWER };
    }
  };

  renderA(); renderB(); // sync JS state with the static markup on load
})();
</script>
</body>
</html>
