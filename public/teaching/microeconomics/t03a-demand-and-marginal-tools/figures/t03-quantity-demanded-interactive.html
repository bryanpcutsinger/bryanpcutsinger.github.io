<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: a change in quantity demanded</title>
<style>
  :root {
    --surface:#f7f4ef; --ink:#1a1c1e; --text:#16181a; --muted:#5c6066;
    --hairline:#e3ddd3; --accent:#b07a2c;
    --font-body:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,
                'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--surface); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:8px;
    -webkit-font-smoothing:antialiased;
  }
  .fig { width:100%; max-width:480px; min-width:0; }
  svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  .axis { stroke:var(--muted); stroke-width:1.4; }
  .curve { fill:none; stroke:var(--ink); stroke-width:2.7; stroke-linecap:round; }
  .drop { stroke:var(--hairline); stroke-width:1.6; stroke-dasharray:5 4; }
  .slide { fill:none; stroke:var(--accent); stroke-width:2.3; }
  .ctx { fill:var(--muted); }
  .pt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; }
  .hit { fill:transparent; stroke:transparent; touch-action:none; cursor:grab; }
  .hit-curve { fill:none; stroke:transparent; stroke-width:28;
               touch-action:none; cursor:grab; }
  .grabbing .pt { stroke:var(--accent); stroke-width:3.5; }
  .pt-focus:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .head { fill:var(--ink); font-size:15px; font-weight:700; }
  .instruction { fill:var(--muted); font-size:12.5px; }
  .axlabel { fill:var(--muted); font-size:12px; font-weight:600; }
  .curve-label { fill:var(--muted); font-size:12px; font-style:italic; }
  .tag-bg { fill:var(--surface); }
  .tag { fill:var(--accent); font-size:12px; font-weight:700; }
  .ref-label { fill:var(--muted); font-size:10.5px; }
  .sep { stroke:var(--hairline); stroke-width:1; }
  .readout { fill:var(--muted); font-size:12.5px; }
  .takeaway { fill:var(--accent); font-size:13px; font-weight:600; }
  .fallback { margin:8px 0 0; color:var(--muted); font-size:13px;
              line-height:1.35; text-align:center; }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 480 520" role="group"
       aria-label="A change in quantity demanded. One fixed demand curve is shown. Starting at the vertical-axis intercept at $1.10, drag the current-price point downward through the entire curve to lower the price and see quantity demanded increase.">
    <title>Lower the current price to increase quantity demanded</title>
    <defs>
      <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <text class="head" x="240" y="22" text-anchor="middle">Change in quantity demanded</text>
    <text class="instruction" x="240" y="44" text-anchor="middle">Drag the current-price point downward to lower the price.</text>

    <line class="axis" x1="98" y1="355" x2="438" y2="355" marker-end="url(#arrowMuted)" />
    <line class="axis" x1="98" y1="355" x2="98" y2="54" marker-end="url(#arrowMuted)" />
    <text class="axlabel" x="268" y="400" text-anchor="middle">Quantity of X Demanded per Period</text>
    <text class="axlabel" x="24" y="205" text-anchor="middle"
          transform="rotate(-90 24 205)">Price of X</text>

    <path class="curve" d="M98,80 L406,355" />
    <path id="hitCurve" class="hit-curve" d="M98,80 L406,355" />
    <text class="curve-label" x="326" y="268">Demand for X</text>

    <!-- Starting point at the vertical-axis intercept: Q=0 at $1.10. -->
    <circle class="ctx" cx="98" cy="80" r="4" />
    <text class="ref-label" x="110" y="70">Starting price: $1.10</text>

    <path id="slideArrow" class="slide" marker-end="url(#arrowAccent)"
          d="M104,86 L258,224" opacity="0" />

    <line id="dropV" class="drop" x1="98" y1="355" x2="98" y2="80" />
    <line id="dropH" class="drop" x1="98" y1="80" x2="98" y2="80" />

    <!-- The live price tag sits near the axis, well clear of the rotated label. -->
    <rect id="pBg" class="tag-bg" x="43" y="71" width="43" height="18" rx="2" />
    <text id="pLabel" class="tag" x="82" y="80" text-anchor="end"
          dominant-baseline="middle">$1.10</text>
    <rect id="qBg" class="tag-bg" x="80" y="360" width="36" height="18" rx="2" />
    <text id="qLabel" class="tag" x="98" y="373" text-anchor="middle">0.0</text>

    <circle id="hit" class="hit" cx="98" cy="80" r="24" />
    <circle id="point" class="pt" cx="98" cy="80" r="7" />
    <circle id="focus" class="pt-focus hit" cx="98" cy="80" r="24"
            tabindex="0" role="slider" aria-label="Current price on the fixed demand curve"
            aria-valuemin="0.00" aria-valuemax="1.10" aria-valuenow="1.10"
            aria-valuetext="Starting price $1.10 at the vertical axis; quantity demanded 0.0. Lower the price to move through the entire demand curve." />

    <line class="sep" x1="54" y1="424" x2="426" y2="424" />
    <text id="readout" class="readout" x="240" y="448" text-anchor="middle">Starting price: $1.10; quantity demanded: 0.0.</text>
    <text id="takeaway" class="takeaway" x="240" y="472" text-anchor="middle">Lower the price to move through the entire demand curve.</text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this is a still image. The current
    point begins at the vertical-axis intercept, where the price is $1.10 and
    quantity demanded is 0.0. Lower prices trace the same curve toward its
    horizontal-axis intercept.</p>
  </noscript>
</div>
<script>
(function () {
  "use strict";
  var svg=document.getElementById('fig'), byId=function(id){return document.getElementById(id);};
  var point=byId('point'), hit=byId('hit'), focus=byId('focus'), hitCurve=byId('hitCurve');
  var dropV=byId('dropV'), dropH=byId('dropH'), pBg=byId('pBg'), pLabel=byId('pLabel');
  var qBg=byId('qBg'), qLabel=byId('qLabel'), slideArrow=byId('slideArrow');
  var readout=byId('readout'), takeaway=byId('takeaway');
  var X0=98, Y0=355, PX=28, PY=250, price=1.10, REF_X=98, REF_Y=80;
  var spt=svg.createSVGPoint();
  function quantityAt(p){return (1.10-p)/0.10;}
  function xQ(q){return X0+q*PX;}
  function yP(p){return Y0-p*PY;}
  function toSvg(evt){spt.x=evt.clientX;spt.y=evt.clientY;return spt.matrixTransform(svg.getScreenCTM().inverse());}
  function render(){
    var q=quantityAt(price), x=xQ(q), y=yP(price);
    point.setAttribute('cx',x); point.setAttribute('cy',y);
    hit.setAttribute('cx',x); hit.setAttribute('cy',y);
    focus.setAttribute('cx',x); focus.setAttribute('cy',y);
    dropV.setAttribute('x1',x); dropV.setAttribute('x2',x); dropV.setAttribute('y2',y);
    dropH.setAttribute('y1',y); dropH.setAttribute('y2',y); dropH.setAttribute('x2',x);
    pLabel.setAttribute('y',y); pLabel.textContent='$'+price.toFixed(2);
    pBg.setAttribute('y',y-9);
    qLabel.setAttribute('x',x); qLabel.textContent=q.toFixed(1);
    qBg.setAttribute('x',x-18);
    slideArrow.setAttribute('d','M'+(REF_X+6)+','+(REF_Y+6)+' L'+(x-8)+','+(y-7));
    slideArrow.setAttribute('opacity',price<1.099?'1':'0');
    readout.textContent=(price<1.099?'Current':'Starting')+' price: $'+price.toFixed(2)+'; quantity demanded: '+q.toFixed(1)+'.';
    if(price<1.099) takeaway.textContent='The lower price produces a larger quantity demanded.';
    else takeaway.textContent='Lower the price to move through the entire demand curve.';
    focus.setAttribute('aria-valuenow',price.toFixed(2));
    focus.setAttribute('aria-valuetext',(price<1.099?'Current':'Starting')+' price $'+price.toFixed(2)+'; quantity demanded '+q.toFixed(1)+'. The control spans the full curve and never rises above the $1.10 vertical-axis intercept.');
  }
  function setPrice(v){
    var p=+v;if(isNaN(p))return;if(p<0.00)p=0.00;if(p>1.10)p=1.10;
    if(p===price)return;price=p;render();
  }
  function fromPointer(evt){setPrice((Y0-toSvg(evt).y)/PY);}
  var dragging=false,captured=null,capturedId=null;
  function move(evt){if(!dragging)return;evt.preventDefault();fromPointer(evt);}
  function up(){dragging=false;svg.classList.remove('grabbing');if(captured&&capturedId!==null){try{captured.releasePointerCapture(capturedId);}catch(e){}}captured=null;capturedId=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);}
  function down(evt){evt.preventDefault();dragging=true;svg.classList.add('grabbing');captured=evt.currentTarget;capturedId=evt.pointerId;try{captured.setPointerCapture(capturedId);}catch(e){}fromPointer(evt);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);}
  [hit,focus,hitCurve].forEach(function(el){el.addEventListener('pointerdown',down);});
  focus.addEventListener('keydown',function(evt){
    if(evt.key==='ArrowUp'||evt.key==='ArrowLeft')setPrice(price+0.05);
    else if(evt.key==='ArrowDown'||evt.key==='ArrowRight')setPrice(price-0.05);
    else return;evt.preventDefault();
  });
  window.__fig={set:function(v){if(v&&typeof v.price==='number')setPrice(v.price);else setPrice(v);},get:function(){return{price:price,quantity:quantityAt(price)};}};
  render();
})();
</script>
</body>
</html>
