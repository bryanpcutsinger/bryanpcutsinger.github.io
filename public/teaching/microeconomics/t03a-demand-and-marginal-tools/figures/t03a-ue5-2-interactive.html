<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Figure: possible demand-curve shapes</title>
<!--
  Static HTML/SVG recreation of UE Fig 5.2 "Possible Demand Curves" (p.65)
  for the T3a blog post. All source-like schedules are shown together; there
  are no controls, selected states, or scripted behavior. Self-contained:
  no libraries and no network requests.
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink: #1a1c1e;
    --muted: #5c6066;
    --hairline: #e3ddd3;
    --accent: #b07a2c;
    --accent-tint: #efe4d2;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 480px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; }
  .axis { stroke: var(--muted); stroke-width: 1.4; }
  .axtitle { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .shape {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dashdot { stroke-dasharray: 8 3 2 3; }
  .inset-box {
    fill: var(--accent-tint);
    fill-opacity: 0.58;
    stroke: var(--hairline);
    stroke-width: 1.4;
  }
  .inset-curve {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.9;
    stroke-linecap: round;
  }
  .warning-mark {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .inset-label {
    fill: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-anchor: middle;
  }
  .sep { stroke: var(--hairline); stroke-width: 1; }
  .note {
    fill: var(--accent);
    font-size: 13px;
    font-weight: 600;
    text-anchor: middle;
  }
  .fallback {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
    text-align: center;
  }
</style>
</head>
<body>
<div class="fig">
  <svg viewBox="0 0 440 500" role="img" tabindex="0"
       aria-label="Possible demand-curve shapes. Several differently shaped demand curves are shown together. Demand curves may bend and change steepness but they can never slope upward. A lower-left warning marks a locally upward-sloping portion as prohibited.">
    <title>Possible demand curves: shapes vary, but they never slope upward</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <line class="axis" x1="64" y1="360" x2="415" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="64" y1="360" x2="64" y2="46" marker-end="url(#arrow)" />
    <text class="axtitle" x="240" y="386" text-anchor="middle">Quantity</text>
    <text class="axtitle" x="24" y="204" text-anchor="middle"
          transform="rotate(-90 24 204)">Price</text>

    <!-- All valid shapes remain visible with equal visual emphasis. -->
    <path class="shape" transform="translate(-12 8)"
          d="M82,88 C120,80 120,145 150,172 C190,207 248,204 276,258 C300,305 350,314 390,318" />
    <path class="shape dashdot" transform="translate(-2 -8)"
          d="M104,62 C100,124 146,172 204,194 C264,217 286,255 318,298 C340,326 370,330 394,332" />
    <path class="shape" transform="translate(8 -2)"
          d="M112,74 L170,112 V170 H235 V228 H300 V286 H356 C374,286 386,294 396,302" />
    <path class="shape" transform="translate(18 10)" d="M82,78 L390,326" />

    <!-- The source's separate warning callout. -->
    <rect class="inset-box" x="70" y="254" width="128" height="94" rx="4" />
    <path class="inset-curve" d="M82,270 C84,316 104,330 120,324" />
    <path class="inset-curve" d="M120,324 C138,316 146,286 168,286" />
    <path class="inset-curve" d="M168,286 C180,288 188,298 192,304" />
    <line class="warning-mark" x1="118" y1="314" x2="118" y2="334" />
    <line class="warning-mark" x1="168" y1="276" x2="168" y2="296" />
    <path class="warning-mark" d="M142,338 L142,322 M136,328 L142,320 L148,328" />
    <text class="inset-label" x="134" y="342">No upward slope</text>

    <line class="sep" x1="44" y1="414" x2="396" y2="414" />
    <text class="note" text-anchor="middle">
      <tspan x="220" y="448">Demand curves may bend and change steepness</tspan>
      <tspan x="220" y="468">but they can never slope upward.</tspan>
    </text>
  </svg>
  <noscript>
    <p class="fallback">This figure is static by design. It shows smooth,
    dash-dot, stepped, and straight demand curves together, plus the source's
    warning that demand curves can never slope upward.</p>
  </noscript>
</div>
</body>
</html>
