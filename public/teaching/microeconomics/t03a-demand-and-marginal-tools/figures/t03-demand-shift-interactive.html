<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: an increase or decrease in demand</title>
<style>
  :root {
    --surface:#f7f4ef; --ink:#1a1c1e; --text:#16181a; --muted:#5c6066;
    --hairline:#e3ddd3; --accent:#b07a2c;
    --font-body:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,
                'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--surface); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:8px;
    -webkit-font-smoothing:antialiased;
  }
  .fig { width:100%; max-width:480px; min-width:0; }
  svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  .axis { stroke:var(--muted); stroke-width:1.4; }
  .baseline { fill:none; stroke:var(--muted); stroke-width:2;
              stroke-dasharray:6 5; opacity:.72; }
  .curve { fill:none; stroke:var(--accent); stroke-width:2.8; stroke-linecap:round; }
  .fixed-price { stroke:var(--hairline); stroke-width:1.6; stroke-dasharray:5 4; }
  .shift-arrow { stroke:var(--accent); stroke-width:2.2; fill:none; }
  .pt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5; }
  .hit { fill:transparent; stroke:transparent; touch-action:none; cursor:grab; }
  .track-hit { stroke:transparent; stroke-width:30; touch-action:none; cursor:grab; }
  .grabbing .pt { stroke:var(--accent); stroke-width:3.5; }
  .pt-focus:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .head { fill:var(--ink); font-size:15px; font-weight:700; }
  .instruction { fill:var(--muted); font-size:12.5px; }
  .axlabel { fill:var(--muted); font-size:12px; font-weight:600; }
  .tag-bg { fill:var(--surface); }
  .tag { fill:var(--accent); font-size:12px; font-weight:700; }
  .sep { stroke:var(--hairline); stroke-width:1; }
  .readout { fill:var(--muted); font-size:12.5px; }
  .takeaway { fill:var(--accent); font-size:13px; font-weight:600; }
  .fallback { margin:8px 0 0; color:var(--muted); font-size:13px;
              line-height:1.35; text-align:center; }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 480 520" role="group"
       aria-label="A change in demand. Drag the point left to decrease demand or right to increase demand. The horizontal comparison shows a lower or higher quantity demanded at the fixed price of $0.50. A vertical comparison at the original quantity of 4.5 shows willingness to pay falling or rising. After a shift, the dashed curve marks the original demand position.">
    <title>Decrease or increase demand while price stays fixed</title>
    <defs>
      <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
    </defs>

    <text class="head" x="240" y="22" text-anchor="middle">Change in demand</text>
    <text class="instruction" x="240" y="44" text-anchor="middle">Drag left to decrease demand or right to increase demand.</text>

    <line class="axis" x1="98" y1="355" x2="438" y2="355" marker-end="url(#arrowMuted)" />
    <line class="axis" x1="98" y1="355" x2="98" y2="54" marker-end="url(#arrowMuted)" />
    <text class="axlabel" x="268" y="400" text-anchor="middle">Quantity of X Demanded per Period</text>
    <text class="axlabel" x="24" y="205" text-anchor="middle"
          transform="rotate(-90 24 205)">Price of X</text>

    <path class="baseline" d="M98,117.5 L364,355" />
    <path id="currentCurve" class="curve" d="M98,117.5 L364,355" />

    <!-- Price remains fixed at $0.50 while the point and curve move horizontally. -->
    <line id="fixedPrice" class="fixed-price" x1="98" y1="230" x2="224" y2="230" />
    <rect class="tag-bg" x="43" y="221" width="43" height="18" rx="2" />
    <text class="tag" x="82" y="230" text-anchor="end" dominant-baseline="middle">$0.50</text>

    <!-- At the original quantity, a vertical comparison shows the change in
         willingness to pay. Hidden in the unshifted state. -->
    <g id="wtpGroup" opacity="0" aria-hidden="true">
      <line id="wtpGuideV" class="fixed-price" x1="224" y1="355" x2="224" y2="230" />
      <line id="wtpGuideH" class="fixed-price" x1="98" y1="230" x2="224" y2="230" />
      <circle id="wtpPoint" class="pt" cx="224" cy="230" r="5.5" />
      <rect id="wtpBg" class="tag-bg" x="43" y="221" width="43" height="18" rx="2" />
      <text id="wtpLabel" class="tag" x="82" y="230" text-anchor="end"
            dominant-baseline="middle">$0.50</text>
    </g>

    <line id="shiftArrow" class="shift-arrow" x1="224" y1="230" x2="224" y2="230"
          marker-end="url(#arrowAccent)" opacity="0" />
    <line id="dropV" class="fixed-price" x1="224" y1="230" x2="224" y2="355" />
    <rect id="qBg" class="tag-bg" x="206" y="360" width="36" height="18" rx="2" />
    <text id="qLabel" class="tag" x="224" y="373" text-anchor="middle">4.5</text>

    <line id="track" class="track-hit" x1="182" y1="230" x2="266" y2="230" />
    <circle id="hit" class="hit" cx="224" cy="230" r="24" />
    <circle id="point" class="pt" cx="224" cy="230" r="7" />
    <circle id="focus" class="pt-focus hit" cx="224" cy="230" r="24"
            tabindex="0" role="slider" aria-label="Demand at the fixed price of $0.50"
            aria-valuemin="3.0" aria-valuemax="6.0" aria-valuenow="4.5"
            aria-valuetext="Original demand. At the fixed price of $0.50, quantity demanded is 4.5. Move left to decrease demand or right to increase demand." />

    <line class="sep" x1="54" y1="424" x2="426" y2="424" />
    <text id="readout" class="readout" x="240" y="448" text-anchor="middle">At $0.50, quantity demanded is 4.5.</text>
    <text id="takeaway" class="takeaway" x="240" y="472" text-anchor="middle">Shift demand to compare quantity and willingness to pay.</text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this is a still image of the
    original demand curve at a fixed price of $0.50. Moving the whole curve
    left would lower both quantity demanded at that price and willingness to
    pay for the original quantity; moving it right would raise both.</p>
  </noscript>
</div>
<script>
(function () {
  "use strict";
  var svg=document.getElementById('fig'), byId=function(id){return document.getElementById(id);};
  var currentCurve=byId('currentCurve'), fixedPrice=byId('fixedPrice'), shiftArrow=byId('shiftArrow');
  var wtpGroup=byId('wtpGroup'), wtpGuideV=byId('wtpGuideV'), wtpGuideH=byId('wtpGuideH');
  var wtpPoint=byId('wtpPoint');
  var wtpBg=byId('wtpBg'), wtpLabel=byId('wtpLabel');
  var dropV=byId('dropV'), qBg=byId('qBg'), qLabel=byId('qLabel');
  var point=byId('point'), hit=byId('hit'), focus=byId('focus'), track=byId('track');
  var readout=byId('readout'), takeaway=byId('takeaway');
  var X0=98, Y0=355, PX=28, PY=250, BASE_Q=4.5, shift=0, spt=svg.createSVGPoint();
  function xQ(q){return X0+q*PX;}
  function toSvg(evt){spt.x=evt.clientX;spt.y=evt.clientY;return spt.matrixTransform(svg.getScreenCTM().inverse());}
  function render(){
    var q=BASE_Q+shift, x=xQ(q);
    var yIntercept=117.5-shift*25, xIntercept=364+shift*28;
    var currentWtp=0.50+shift*0.10, wtpY=Y0-currentWtp*PY;
    currentCurve.setAttribute('d','M98,'+yIntercept.toFixed(2)+' L'+xIntercept.toFixed(2)+',355');
    fixedPrice.setAttribute('x2',x);
    point.setAttribute('cx',x); hit.setAttribute('cx',x); focus.setAttribute('cx',x);
    dropV.setAttribute('x1',x); dropV.setAttribute('x2',x);
    qLabel.setAttribute('x',x); qLabel.textContent=q.toFixed(1); qBg.setAttribute('x',x-18);
    shiftArrow.setAttribute('x2',x); shiftArrow.setAttribute('opacity',Math.abs(shift)<0.02?'0':'1');
    var shifted=Math.abs(shift)>=0.02;
    wtpGroup.setAttribute('opacity',shifted?'1':'0');
    wtpGroup.setAttribute('aria-hidden',shifted?'false':'true');
    wtpGuideV.setAttribute('y2',wtpY);
    wtpGuideH.setAttribute('y1',wtpY); wtpGuideH.setAttribute('y2',wtpY);
    wtpPoint.setAttribute('cy',wtpY);
    wtpBg.setAttribute('y',wtpY-9); wtpLabel.setAttribute('y',wtpY);
    wtpLabel.textContent='$'+currentWtp.toFixed(2);
    if(shift>0.02){
      readout.textContent='At $0.50, quantity demanded rises to '+q.toFixed(1)+'.';
      takeaway.textContent='At original Q=4.5, willingness to pay rises to $'+currentWtp.toFixed(2)+'.';
    }else if(shift<-0.02){
      readout.textContent='At $0.50, quantity demanded falls to '+q.toFixed(1)+'.';
      takeaway.textContent='At original Q=4.5, willingness to pay falls to $'+currentWtp.toFixed(2)+'.';
    }else{
      readout.textContent='At $0.50, quantity demanded is '+q.toFixed(1)+'.';
      takeaway.textContent='Shift demand to compare quantity and willingness to pay.';
    }
    focus.setAttribute('aria-valuenow',q.toFixed(1));
    var state=shift>0.02?'Demand increased':shift<-0.02?'Demand decreased':'Original demand';
    focus.setAttribute('aria-valuetext',state+'. At the fixed price of $0.50, quantity demanded is '+q.toFixed(1)+'. At the original quantity of 4.5, willingness to pay is $'+currentWtp.toFixed(2)+'. Move left to decrease demand or right to increase demand.');
  }
  function setShift(v){
    var s=+v;if(isNaN(s))return;if(s<-1.5)s=-1.5;if(s>1.5)s=1.5;
    if(s===shift)return;shift=s;render();
  }
  function fromPointer(evt){setShift((toSvg(evt).x-xQ(BASE_Q))/PX);}
  var dragging=false,captured=null,capturedId=null;
  function move(evt){if(!dragging)return;evt.preventDefault();fromPointer(evt);}
  function up(){dragging=false;svg.classList.remove('grabbing');if(captured&&capturedId!==null){try{captured.releasePointerCapture(capturedId);}catch(e){}}captured=null;capturedId=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);}
  function down(evt){evt.preventDefault();dragging=true;svg.classList.add('grabbing');captured=evt.currentTarget;capturedId=evt.pointerId;try{captured.setPointerCapture(capturedId);}catch(e){}fromPointer(evt);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);}
  [hit,focus,track].forEach(function(el){el.addEventListener('pointerdown',down);});
  focus.addEventListener('keydown',function(evt){
    if(evt.key==='ArrowRight'||evt.key==='ArrowUp')setShift(shift+0.15);
    else if(evt.key==='ArrowLeft'||evt.key==='ArrowDown')setShift(shift-0.15);
    else return;evt.preventDefault();
  });
  window.__fig={set:function(v){if(v&&typeof v.shift==='number')setShift(v.shift);else setShift(v);},get:function(){return{shift:shift,quantity:BASE_Q+shift,price:0.50};}};
  render();
})();
</script>
</body>
</html>
