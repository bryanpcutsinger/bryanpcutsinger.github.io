<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: butter, margarine, and dinner rolls</title>
<style>
  :root {
    --surface:#f7f4ef; --ink:#1a1c1e; --text:#16181a; --muted:#5c6066;
    --hairline:#e3ddd3; --accent:#b07a2c; --accent-tint:#efe4d2;
    --font-body:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,
    'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--surface); color:var(--text); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:8px;
    -webkit-font-smoothing:antialiased; }
  .fig { width:100%; max-width:720px; min-width:0; }
  svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  .axis { stroke:var(--muted); stroke-width:1.4; }
  .curve { stroke:var(--ink); stroke-width:2.4; fill:none; stroke-linecap:round; }
  .curve-original { stroke:var(--muted); stroke-width:1.8; fill:none;
    stroke-dasharray:6 5; }
  .curve-shifted { stroke:var(--accent); stroke-width:2.4; fill:none;
    stroke-linecap:round; }
  .shift-arrow { stroke:var(--accent); stroke-width:1.8; }
  .guide { stroke:var(--hairline); stroke-width:1.6; stroke-dasharray:5 4; }
  .pt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5;
    touch-action:none; cursor:grab; }
  .related-pt { fill:var(--accent); stroke:var(--surface); stroke-width:2; }
  .hit { fill:transparent; stroke:transparent; touch-action:none; cursor:grab; }
  .hit-curve { fill:none; stroke:transparent; stroke-width:28;
    touch-action:none; cursor:grab; }
  .pt-focus:focus-visible { outline:none; }
  .focus-ring { fill:none; stroke:transparent; stroke-width:3; pointer-events:none; }
  .pt-focus:focus-visible ~ .focus-ring,.grabbing .focus-ring { stroke:var(--accent); }
  .heading { fill:var(--ink); font-size:16px; font-weight:700; }
  .instruction { fill:var(--muted); font-size:12.5px; }
  .panelhead { fill:var(--ink); font-size:13px; font-weight:700; }
  .relation { fill:var(--muted); font-size:11px; font-weight:600; }
  .axtitle { fill:var(--muted); font-size:10.5px; font-weight:600; }
  .tagbg { fill:var(--surface); }
  .tag { fill:var(--accent); font-size:11px; font-weight:700; }
  .fixedtag { fill:var(--muted); font-size:10px; font-weight:600; }
  .sep { stroke:var(--hairline); stroke-width:1; }
  .readout { fill:var(--muted); font-size:12px; }
  .takeaway { fill:var(--accent); font-size:12px; font-weight:600; }
  .fallback { margin:8px 0 0; color:var(--muted); font-size:13px;
    line-height:1.35; text-align:center; }
  .fallback a { color:var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 720 650" role="group"
       aria-label="Related goods comparison. Drag butter's current-price point through its demand curve. Margarine demand, as a substitute, shifts in the opposite direction from dinner-roll demand, as a complement.">
    <title>How butter's price shifts demand for a substitute and a complement</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
      <marker id="arrowAccent" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto-start-reverse" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#b07a2c" />
      </marker>
      <clipPath id="clipSub"><rect x="80" y="330" width="250" height="172" /></clipPath>
      <clipPath id="clipComp"><rect x="410" y="330" width="250" height="172" /></clipPath>
    </defs>

    <text class="heading" x="360" y="24" text-anchor="middle">One price change, opposite demand shifts</text>
    <text class="instruction" x="360" y="44" text-anchor="middle">Drag butter's current-price point up or down.</text>

    <!-- Butter: the shared cause. -->
    <text class="panelhead" x="360" y="70" text-anchor="middle">Butter</text>
    <line class="axis" x1="210" y1="260" x2="520" y2="260" marker-end="url(#arrow)" />
    <line class="axis" x1="210" y1="260" x2="210" y2="84" marker-end="url(#arrow)" />
    <path class="curve" d="M210,100 L490,260" />
    <path id="hitCurve" class="hit-curve" d="M210,100 L490,260" />
    <line id="butterPriceGuide" class="guide" x1="210" y1="180" x2="350" y2="180" />
    <line id="butterQtyGuide" class="guide" x1="350" y1="180" x2="350" y2="260" />
    <text class="axtitle" x="375" y="291" text-anchor="middle">Weekly Pounds of Butter Demanded</text>
    <text class="axtitle" x="166" y="180" text-anchor="middle"
          transform="rotate(-90 166 180)">Price per Pound of Butter</text>
    <g>
      <rect id="butterPriceBg" class="tagbg" x="166" y="172.5" width="38" height="15" rx="2" />
      <text id="butterPriceText" class="tag" x="202" y="180" text-anchor="end"
            dominant-baseline="middle">$4.00</text>
    </g>
    <g>
      <rect id="butterQtyBg" class="tagbg" x="333" y="267" width="34" height="15" rx="2" />
      <text id="butterQtyText" class="tag" x="350" y="277" text-anchor="middle">4.0</text>
    </g>
    <circle id="butterHit" class="hit" cx="350" cy="180" r="22" />
    <circle id="butterFocus" class="pt-focus hit" cx="350" cy="180" r="22"
            tabindex="0" role="slider" aria-label="Current price of butter"
            aria-valuemin="0.00" aria-valuemax="8.00" aria-valuenow="4.00"
            aria-valuetext="Butter costs $4.00 per pound; 4.0 pounds are demanded per week. Both related-good demand curves are at their normal positions." />
    <circle id="butterPoint" class="pt" cx="350" cy="180" r="7" />
    <circle id="focusRing" class="focus-ring" cx="350" cy="180" r="11" />

    <!-- Margarine: substitute. -->
    <text class="panelhead" x="205" y="315" text-anchor="middle">Margarine</text>
    <text class="relation" x="205" y="329" text-anchor="middle">substitute</text>
    <line class="axis" x1="80" y1="500" x2="340" y2="500" marker-end="url(#arrow)" />
    <line class="axis" x1="80" y1="500" x2="80" y2="326" marker-end="url(#arrow)" />
    <g clip-path="url(#clipSub)">
      <path id="subOriginal" class="curve" d="M80,340 L304,500" />
      <path id="subShifted" class="curve-shifted" d="M80,340 L304,500" opacity="0" />
      <line id="subArrow" class="shift-arrow" x1="136" y1="380" x2="136" y2="380"
            marker-end="url(#arrowAccent)" opacity="0" />
    </g>
    <line id="subPriceGuide" class="guide" x1="80" y1="420" x2="192" y2="420" />
    <line id="subQtyGuide" class="guide" x1="192" y1="420" x2="192" y2="500" />
    <circle id="subPoint" class="related-pt" cx="192" cy="420" r="6" />
    <text class="axtitle" x="210" y="529" text-anchor="middle">Weekly Pounds of Margarine Demanded</text>
    <text class="axtitle" x="38" y="420" text-anchor="middle"
          transform="rotate(-90 38 420)">Price per Pound</text>
    <text class="fixedtag" x="72" y="420" text-anchor="end" dominant-baseline="middle">$4.00</text>
    <g>
      <rect id="subQtyBg" class="tagbg" x="175" y="506" width="34" height="15" rx="2" />
      <text id="subQtyText" class="tag" x="192" y="517" text-anchor="middle">4.0</text>
    </g>

    <!-- Dinner rolls: complement. -->
    <text class="panelhead" x="535" y="315" text-anchor="middle">Dinner rolls</text>
    <text class="relation" x="535" y="329" text-anchor="middle">complement</text>
    <line class="axis" x1="410" y1="500" x2="670" y2="500" marker-end="url(#arrow)" />
    <line class="axis" x1="410" y1="500" x2="410" y2="326" marker-end="url(#arrow)" />
    <g clip-path="url(#clipComp)">
      <path id="compOriginal" class="curve" d="M410,340 L634,500" />
      <path id="compShifted" class="curve-shifted" d="M410,340 L634,500" opacity="0" />
      <line id="compArrow" class="shift-arrow" x1="466" y1="380" x2="466" y2="380"
            marker-end="url(#arrowAccent)" opacity="0" />
    </g>
    <line id="compPriceGuide" class="guide" x1="410" y1="420" x2="522" y2="420" />
    <line id="compQtyGuide" class="guide" x1="522" y1="420" x2="522" y2="500" />
    <circle id="compPoint" class="related-pt" cx="522" cy="420" r="6" />
    <text class="axtitle" x="540" y="529" text-anchor="middle">Dozens of Dinner Rolls Demanded per Week</text>
    <text class="axtitle" x="368" y="420" text-anchor="middle"
          transform="rotate(-90 368 420)">Price per Dozen</text>
    <text class="fixedtag" x="402" y="420" text-anchor="end" dominant-baseline="middle">$4.00</text>
    <g>
      <rect id="compQtyBg" class="tagbg" x="505" y="506" width="34" height="15" rx="2" />
      <text id="compQtyText" class="tag" x="522" y="517" text-anchor="middle">4.0</text>
    </g>

    <line class="sep" x1="54" y1="554" x2="666" y2="554" />
    <text id="stateReadout" class="readout" x="360" y="578" text-anchor="middle">Butter: $4.00 per pound; 4.0 pounds demanded per week.</text>
    <text id="effectReadout" class="takeaway" text-anchor="middle"
          aria-label="At butter's normal price, both related-good demand curves are unchanged."><tspan x="360" y="607">At butter's normal price, both related-good demand curves are unchanged.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows the normal-price state. A lower butter price shifts margarine demand left and dinner-roll demand right; a higher butter price reverses both shifts. You can also <a href="t03-cross-price.svg">view the static source comparison</a>.</p>
  </noscript>
</div>
<script>
(function () {
  "use strict";
  var svg=document.getElementById('fig'), byId=function(id){return document.getElementById(id);};
  var hitCurve=byId('hitCurve'), butterHit=byId('butterHit'), butterFocus=byId('butterFocus'), butterPoint=byId('butterPoint'), focusRing=byId('focusRing');
  var butterPriceGuide=byId('butterPriceGuide'), butterQtyGuide=byId('butterQtyGuide');
  var butterPriceBg=byId('butterPriceBg'), butterPriceText=byId('butterPriceText');
  var butterQtyBg=byId('butterQtyBg'), butterQtyText=byId('butterQtyText');
  var subOriginal=byId('subOriginal'), subShifted=byId('subShifted'), subArrow=byId('subArrow');
  var subPriceGuide=byId('subPriceGuide'), subQtyGuide=byId('subQtyGuide'), subPoint=byId('subPoint');
  var subQtyBg=byId('subQtyBg'), subQtyText=byId('subQtyText');
  var compOriginal=byId('compOriginal'), compShifted=byId('compShifted'), compArrow=byId('compArrow');
  var compPriceGuide=byId('compPriceGuide'), compQtyGuide=byId('compQtyGuide'), compPoint=byId('compPoint');
  var compQtyBg=byId('compQtyBg'), compQtyText=byId('compQtyText');
  var stateReadout=byId('stateReadout'), effectReadout=byId('effectReadout');
  var NS='http://www.w3.org/2000/svg';
  var XB=210, XS=80, XC=410, YB=260, YR=500, PXB=35, PXR=28, PY=20, NORMAL=4, STEP=.25;
  var butterPrice=4;
  function butterQuantity(p){return 8-p;}
  function subShift(p){return .35*(p-NORMAL);}
  function compShift(p){return -.35*(p-NORMAL);}
  function xButter(q){return XB+q*PXB;}
  function xRelated(origin,q){return origin+q*PXR;}
  function yButter(p){return YB-p*PY;}
  function money(v){return '$'+v.toFixed(2);}
  var spt=svg.createSVGPoint();
  function toSvg(evt){spt.x=evt.clientX;spt.y=evt.clientY;return spt.matrixTransform(svg.getScreenCTM().inverse());}

  function layoutEffect(str){
    var maxW=620,x=360,y0=607,lineH=16;
    effectReadout.setAttribute('aria-label',str);
    while(effectReadout.firstChild)effectReadout.removeChild(effectReadout.firstChild);
    var probe=document.createElementNS(NS,'tspan');effectReadout.appendChild(probe);
    var words=str.split(' '),lines=[],cur=words[0]||'';
    for(var i=1;i<words.length;i++){
      probe.textContent=cur+' '+words[i];
      if(probe.getComputedTextLength()>maxW){lines.push(cur);cur=words[i];}else cur+=' '+words[i];
    }
    lines.push(cur);effectReadout.removeChild(probe);
    var start=lines.length===1?y0+5:y0;
    for(var j=0;j<lines.length;j++){
      var t=document.createElementNS(NS,'tspan');t.setAttribute('x',x);
      t.setAttribute('y',start+j*lineH);t.textContent=lines[j];effectReadout.appendChild(t);
    }
  }

  function renderRelated(shift,origin,original,shifted,arrow,priceGuide,qtyGuide,point,qtyBg,qtyText){
    var q=NORMAL+shift, x=xRelated(origin,q), moved=Math.abs(shift)>.001;
    original.setAttribute('class',moved?'curve-original':'curve');
    shifted.setAttribute('transform','translate('+(shift*PXR).toFixed(2)+' 0)');
    shifted.setAttribute('opacity',moved?'1':'0');
    arrow.setAttribute('x1',origin+56);arrow.setAttribute('x2',origin+56+shift*PXR);
    arrow.setAttribute('opacity',moved?'1':'0');
    priceGuide.setAttribute('x2',x);
    qtyGuide.setAttribute('x1',x);qtyGuide.setAttribute('x2',x);
    point.setAttribute('cx',x);qtyText.setAttribute('x',x);qtyText.textContent=q.toFixed(1);
    qtyBg.setAttribute('x',x-17);
    return q;
  }

  function render(){
    var bq=butterQuantity(butterPrice), bx=xButter(bq), by=yButter(butterPrice);
    butterPoint.setAttribute('cx',bx);butterPoint.setAttribute('cy',by);
    butterHit.setAttribute('cx',bx);butterHit.setAttribute('cy',by);
    butterFocus.setAttribute('cx',bx);butterFocus.setAttribute('cy',by);
    focusRing.setAttribute('cx',bx);focusRing.setAttribute('cy',by);
    butterPriceGuide.setAttribute('x2',bx);butterPriceGuide.setAttribute('y1',by);butterPriceGuide.setAttribute('y2',by);
    butterQtyGuide.setAttribute('x1',bx);butterQtyGuide.setAttribute('x2',bx);butterQtyGuide.setAttribute('y1',by);
    butterPriceGuide.setAttribute('opacity',butterPrice===0?'0':'1');
    butterQtyGuide.setAttribute('opacity',bq===0?'0':'1');
    butterPriceText.setAttribute('y',by);butterPriceText.textContent=money(butterPrice);butterPriceBg.setAttribute('y',by-7.5);
    butterQtyText.setAttribute('x',bx);butterQtyText.textContent=bq.toFixed(1);butterQtyBg.setAttribute('x',bx-17);

    var sq=renderRelated(subShift(butterPrice),XS,subOriginal,subShifted,subArrow,subPriceGuide,subQtyGuide,subPoint,subQtyBg,subQtyText);
    var cq=renderRelated(compShift(butterPrice),XC,compOriginal,compShifted,compArrow,compPriceGuide,compQtyGuide,compPoint,compQtyBg,compQtyText);
    stateReadout.textContent='Butter: '+money(butterPrice)+' per pound; '+bq.toFixed(1)+' pounds demanded per week.';
    var effect;
    if(butterPrice===NORMAL) effect="At butter's normal price, both related-good demand curves are unchanged.";
    else if(butterPrice<NORMAL) effect='Cheaper butter shifts substitute demand LEFT to '+sq.toFixed(1)+' and complement demand RIGHT to '+cq.toFixed(1)+' at the fixed $4.00 prices.';
    else effect='Costlier butter shifts substitute demand RIGHT to '+sq.toFixed(1)+' and complement demand LEFT to '+cq.toFixed(1)+' at the fixed $4.00 prices.';
    layoutEffect(effect);
    butterFocus.setAttribute('aria-valuenow',butterPrice.toFixed(2));
    butterFocus.setAttribute('aria-valuetext','Butter costs '+money(butterPrice)+' per pound; '+bq.toFixed(1)+' pounds are demanded per week. '+effect);
  }
  function setPrice(v){
    var p=+v;if(isNaN(p))return;p=Math.round(p/STEP)*STEP;
    p=Math.max(0,Math.min(8,p));if(p===butterPrice)return;butterPrice=p;render();
  }
  function fromPointer(evt){setPrice((YB-toSvg(evt).y)/PY);}
  var dragging=false,captured=null,capturedId=null;
  function move(evt){if(dragging){evt.preventDefault();fromPointer(evt);}}
  function up(){
    dragging=false;svg.classList.remove('grabbing');
    if(captured&&capturedId!==null){try{captured.releasePointerCapture(capturedId);}catch(e){}}
    captured=null;capturedId=null;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
  }
  function down(evt){
    evt.preventDefault();dragging=true;svg.classList.add('grabbing');captured=evt.currentTarget;
    capturedId=evt.pointerId;try{captured.setPointerCapture(capturedId);}catch(e){}
    fromPointer(evt);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  }
  [hitCurve,butterHit,butterFocus,butterPoint].forEach(function(el){el.addEventListener('pointerdown',down);});
  butterFocus.addEventListener('keydown',function(evt){
    if(evt.key==='ArrowUp'||evt.key==='ArrowLeft')setPrice(butterPrice+STEP);
    else if(evt.key==='ArrowDown'||evt.key==='ArrowRight')setPrice(butterPrice-STEP);
    else return;evt.preventDefault();
  });
  window.__fig={
    set:function(v){setPrice(v&&typeof v.price==='number'?v.price:v);},
    get:function(){return{butterPrice:butterPrice,butterQuantity:butterQuantity(butterPrice),margarineQuantity:NORMAL+subShift(butterPrice),dinnerRollQuantity:NORMAL+compShift(butterPrice)};}
  };
  render();
})();
</script>
</body>
</html>
