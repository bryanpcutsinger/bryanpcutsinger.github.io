<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive figure: market value, buyer's surplus, and total worth</title>
<!--
  Single-panel adaptation of UE Fig 5.5, "Buyer's Surplus plus Market Value
  Equals Total Worth" (p.72). The source's two cases are consolidated into one
  demand diagram: the student moves one point along the curve and watches the
  same three areas change. Self-contained vanilla SVG/JS; no network or
  libraries. The static FAU slide figure remains untouched.

  MODEL: P = 8 - Q, Q in [0, 8]. Total worth is the area under demand,
  TW(Q) = 8Q - Q^2/2; market value is MV(Q) = (8-Q)Q; buyer's surplus is
  CS(Q) = Q^2/2. The initial Q=3, P=$5 state is the source's small-quantity,
  high-price case. Dragging right reveals the source's larger-quantity,
  lower-price comparison without duplicating axes or mechanically linking
  two separate controls.
-->
<style>
  :root {
    --surface:#f7f4ef;
    --ink:#1a1c1e;
    --text:#16181a;
    --muted:#5c6066;
    --hairline:#e3ddd3;
    --accent:#b07a2c;
    --accent-tint:#efe4d2;
    --font-body:'Inter Variable',Inter,-apple-system,BlinkMacSystemFont,
      'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--surface);
    color:var(--text);
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    -webkit-font-smoothing:antialiased;
  }
  .fig { width:100%; max-width:480px; min-width:0; }
  svg { width:100%; height:auto; display:block; touch-action:pan-y; }
  .axis { stroke:var(--muted); stroke-width:1.4; }
  .curve { stroke:var(--ink); stroke-width:2.4; fill:none; stroke-linecap:round; }
  .region-market { fill:var(--muted); fill-opacity:.20; stroke:none; }
  .region-surplus { fill:var(--accent-tint); stroke:none; }
  .guide { stroke:var(--hairline); stroke-width:1.6; stroke-dasharray:5 4; }
  .sw-surplus { fill:var(--accent-tint); stroke:var(--accent); stroke-width:.8; }
  .sw-market { fill:var(--muted); fill-opacity:.20; stroke:var(--muted); stroke-width:.8; }
  .pt { fill:var(--accent); stroke:var(--surface); stroke-width:2.5;
        touch-action:none; cursor:grab; }
  .hit { fill:transparent; stroke:transparent; touch-action:none; cursor:grab; }
  .hit-curve { fill:none; stroke:transparent; stroke-width:28; touch-action:none; cursor:grab; }
  .pt-focus:focus-visible { outline:none; }
  .pt-focus:focus-visible + .pt,
  .grabbing .pt { stroke:var(--accent); stroke-width:3.5; }
  .heading { fill:var(--ink); font-size:15px; font-weight:700; }
  .instruction { fill:var(--muted); font-size:12.5px; }
  .axtitle { fill:var(--muted); font-size:13px; font-weight:600; }
  .leg { font-size:11px; }
  .leg-surplus { fill:var(--accent); font-weight:600; }
  .leg-market { fill:var(--muted); font-weight:600; }
  .leg-total { fill:var(--ink); font-weight:700; }
  .tagbg { fill:var(--surface); }
  .tagtxt { fill:var(--accent); font-size:12px; font-weight:700; }
  .sep { stroke:var(--hairline); stroke-width:1; }
  .r-state { fill:var(--muted); font-size:12.5px; }
  .r-values { fill:var(--accent); font-size:13px; font-weight:600; }
  .fallback {
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.35;
    text-align:center;
  }
  .fallback a { color:var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 440 540" role="group"
       aria-label="One demand diagram showing market value, buyer's surplus, and total personal worth. Drag the current-price point downward to lower the price and increase quantity; the gray market-value rectangle and tinted buyer's-surplus triangle update with the point.">
    <title>Market value and buyer's surplus as quantity changes</title>
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#5c6066" />
      </marker>
    </defs>

    <text class="heading" x="220" y="24" text-anchor="middle">Market value and buyer's surplus</text>
    <text class="instruction" x="220" y="44" text-anchor="middle">Move the price through the full range of the demand curve.</text>

    <line class="axis" x1="72" y1="360" x2="410" y2="360" marker-end="url(#arrow)" />
    <line class="axis" x1="72" y1="360" x2="72" y2="66" marker-end="url(#arrow)" />

    <!-- Base state: Q=3, P=$5. These are real SVG shapes for no-JS readers. -->
    <rect id="marketRect" class="region-market" x="72" y="190" width="102" height="170" />
    <path id="surplusRegion" class="region-surplus" d="M72,88 L174,190 L72,190 Z" />
    <line id="priceGuide" class="guide" x1="72" y1="190" x2="174" y2="190" />
    <line id="qtyGuide" class="guide" x1="174" y1="190" x2="174" y2="360" />
    <path class="curve" d="M72,88 L344,360" />

    <text class="axtitle" x="224" y="404" text-anchor="middle">Quantity of good</text>
    <text class="axtitle" x="18" y="220" text-anchor="middle"
          transform="rotate(-90 18 220)">Price</text>

    <g class="leg">
      <rect class="sw-surplus" x="252" y="70" width="14" height="11" />
      <text class="leg-surplus" x="272" y="79">Buyer's surplus</text>
      <rect class="sw-market" x="252" y="90" width="14" height="11" />
      <text class="leg-market" x="272" y="99">Market value</text>
      <rect class="sw-surplus" x="252" y="110" width="14" height="5.5" />
      <rect class="sw-market" x="252" y="115.5" width="14" height="5.5" />
      <text class="leg-total" x="272" y="119">Together: total worth</text>
    </g>

    <g id="priceTag">
      <rect id="priceBg" class="tagbg" x="24" y="182.5" width="38" height="15" rx="2" />
      <text id="priceText" class="tagtxt" x="60" y="190" text-anchor="end"
            dominant-baseline="middle">$5.00</text>
    </g>
    <g id="qtyTag">
      <rect id="qtyBg" class="tagbg" x="157" y="369.5" width="34" height="15" rx="2" />
      <text id="qtyText" class="tagtxt" x="174" y="377" text-anchor="middle"
            dominant-baseline="middle">3.0</text>
    </g>

    <path id="hitCurve" class="hit-curve" d="M72,88 L344,360" />
    <circle id="hit" class="hit" cx="174" cy="190" r="22" />
    <circle id="ptFocus" class="pt-focus hit" cx="174" cy="190" r="22"
            tabindex="0" role="slider" aria-label="Current price on the demand curve"
            aria-valuemin="0.00" aria-valuemax="8.00" aria-valuenow="5.00"
            aria-valuetext="3.0 units at $5.00. Market value $15.00; buyer's surplus $4.50; total worth $19.50." />
    <circle id="pt" class="pt" cx="174" cy="190" r="7" />

    <line class="sep" x1="42" y1="430" x2="398" y2="430" />
    <text id="rState" class="r-state" x="220" y="454" text-anchor="middle">At $5.00, quantity is 3.0 units.</text>
    <text id="rValues" class="r-values" text-anchor="middle"
          aria-label="Market value $15.00; buyer's surplus $4.50; total worth $19.50."><tspan x="220" y="478">Market value = $15.00 · Buyer's surplus = $4.50</tspan><tspan x="220" y="496">Total worth = $19.50.</tspan></text>
  </svg>
  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows the starting case: 3 units at $5.00, with a gray market-value rectangle and a tinted buyer's-surplus triangle. You can also <a href="t03-surplus-two-panel.svg">open the source-faithful static comparison</a>.</p>
  </noscript>
</div>

<script>
(function () {
  "use strict";
  var svg = document.getElementById('fig');
  var byId = function (id) { return document.getElementById(id); };
  var marketRect = byId('marketRect'), surplusRegion = byId('surplusRegion');
  var priceGuide = byId('priceGuide'), qtyGuide = byId('qtyGuide');
  var hitCurve = byId('hitCurve'), hit = byId('hit'), ptFocus = byId('ptFocus'), pt = byId('pt');
  var priceText = byId('priceText'), priceBg = byId('priceBg');
  var qtyText = byId('qtyText'), qtyBg = byId('qtyBg');
  var rState = byId('rState'), rValues = byId('rValues');
  var NS = 'http://www.w3.org/2000/svg';

  var X0 = 72, Y0 = 360, SCALE = 34, YTOP = 88;
  var QLO = 0, QHI = 8, STEP = 0.25;
  var q = 3;
  function xQ(v) { return X0 + v * SCALE; }
  function yP(v) { return Y0 - v * SCALE; }
  function priceAt(v) { return 8 - v; }
  function surplus(v) { return v * v / 2; }
  function marketValue(v) { return priceAt(v) * v; }
  function totalWorth(v) { return surplus(v) + marketValue(v); }
  function money(v) { return '$' + v.toFixed(2); }

  var spt = svg.createSVGPoint();
  function toSvg(evt) {
    spt.x = evt.clientX; spt.y = evt.clientY;
    return spt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function layoutValues(str) {
    var maxW = 400, x = 220, y0 = 478, lineH = 18;
    rValues.setAttribute('aria-label', str);
    while (rValues.firstChild) rValues.removeChild(rValues.firstChild);
    var probe = document.createElementNS(NS, 'tspan');
    rValues.appendChild(probe);
    var words = str.split(' '), lines = [], cur = words[0] || '';
    for (var i = 1; i < words.length; i++) {
      probe.textContent = cur + ' ' + words[i];
      if (probe.getComputedTextLength() > maxW) { lines.push(cur); cur = words[i]; }
      else { cur += ' ' + words[i]; }
    }
    lines.push(cur);
    rValues.removeChild(probe);
    var startY = lines.length === 1 ? y0 + 5 : y0;
    for (var j = 0; j < lines.length; j++) {
      var t = document.createElementNS(NS, 'tspan');
      t.setAttribute('x', x); t.setAttribute('y', startY + j * lineH);
      t.textContent = lines[j]; rValues.appendChild(t);
    }
  }

  function render() {
    var p = priceAt(q), xr = xQ(q), yr = yP(p);
    var mv = marketValue(q), cs = surplus(q), tw = totalWorth(q);
    marketRect.setAttribute('x', X0); marketRect.setAttribute('y', yr);
    marketRect.setAttribute('width', xr - X0); marketRect.setAttribute('height', Y0 - yr);
    surplusRegion.setAttribute('d', 'M' + X0 + ',' + YTOP + ' L' + xr.toFixed(2) + ',' + yr.toFixed(2) + ' L' + X0 + ',' + yr.toFixed(2) + ' Z');
    priceGuide.setAttribute('x2', xr); priceGuide.setAttribute('y1', yr); priceGuide.setAttribute('y2', yr);
    qtyGuide.setAttribute('x1', xr); qtyGuide.setAttribute('x2', xr); qtyGuide.setAttribute('y1', yr);
    priceGuide.setAttribute('opacity', p === 0 ? '0' : '1');
    qtyGuide.setAttribute('opacity', q === 0 ? '0' : '1');
    hit.setAttribute('cx', xr); hit.setAttribute('cy', yr);
    ptFocus.setAttribute('cx', xr); ptFocus.setAttribute('cy', yr);
    pt.setAttribute('cx', xr); pt.setAttribute('cy', yr);
    priceText.setAttribute('y', yr); priceText.textContent = money(p);
    priceBg.setAttribute('y', yr - 7.5);
    qtyText.setAttribute('x', xr); qtyText.textContent = q.toFixed(1);
    qtyBg.setAttribute('x', xr - 17);
    rState.textContent = 'At ' + money(p) + ', quantity is ' + q.toFixed(1) + ' units.';
    layoutValues('Market value = ' + money(mv) + ' · Buyer\'s surplus = ' + money(cs) + ' · Total worth = ' + money(tw) + '.');
    ptFocus.setAttribute('aria-valuenow', p.toFixed(2));
    ptFocus.setAttribute('aria-valuetext', q.toFixed(1) + ' units at ' + money(p) + '. Market value ' + money(mv) + '; buyer\'s surplus ' + money(cs) + '; total worth ' + money(tw) + '.');
  }

  function setQ(v) {
    var next = +v;
    if (isNaN(next)) return;
    next = Math.round(next / STEP) * STEP;
    next = Math.max(QLO, Math.min(QHI, next));
    if (next === q) return;
    q = next; render();
  }
  function setFromPointer(evt) {
    var selectedPrice = (Y0 - toSvg(evt).y) / SCALE;
    setQ(8 - selectedPrice);
  }

  var dragging = false, capturedEl = null, capturedId = null;
  function onMove(evt) { if (dragging) { evt.preventDefault(); setFromPointer(evt); } }
  function onUp() {
    dragging = false; svg.classList.remove('grabbing');
    if (capturedEl && capturedId !== null) {
      try { capturedEl.releasePointerCapture(capturedId); } catch (e) {}
    }
    capturedEl = null; capturedId = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  function onDown(evt) {
    evt.preventDefault(); dragging = true; svg.classList.add('grabbing');
    capturedEl = evt.currentTarget; capturedId = evt.pointerId;
    try { capturedEl.setPointerCapture(capturedId); } catch (e) {}
    setFromPointer(evt);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  hit.addEventListener('pointerdown', onDown);
  hitCurve.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('pointerdown', onDown);
  pt.addEventListener('pointerdown', onDown);
  ptFocus.addEventListener('keydown', function (evt) {
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowDown') setQ(q + STEP);
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowUp') setQ(q - STEP);
    else return;
    evt.preventDefault();
  });

  window.__fig = {
    set:function (v) { setQ(typeof v === 'number' ? v : v && v.q); },
    get:function () {
      return { q:q, price:priceAt(q), marketValue:marketValue(q), surplus:surplus(q), totalWorth:totalWorth(q) };
    }
  };
  render();
})();
</script>
</body>
</html>
