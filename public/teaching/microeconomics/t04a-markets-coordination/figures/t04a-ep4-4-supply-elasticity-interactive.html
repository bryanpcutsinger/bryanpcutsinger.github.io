<!doctype html>
<!--
  t04a-ep4-4-supply-elasticity-interactive.html
  Interactive version of the T4a supply-elasticity figure (after E&P Fig 4-4,
  course-adapted numbers per the brief Section C invariants).
  Family F2 (before/after shift; cause = a demand increase): ONE demand curve
  is dragged rightward over a market with TWO supplies of different elasticity
  that share a common initial equilibrium. Both supply equilibria track live so
  the small-vs-large price jump is always on screen.
    D:  P = a - Q          (a = the demand intercept the slider sweeps, 14..18)
    S1 (flat, MORE elastic, "more general inputs"):  P = 6.5 + 0.25Q
    S2 (steep, LESS elastic, "less general inputs"): P = 2 + Q
  EQUILIBRIA recomputed from the line equations at EVERY slider value (never
  keyframed): S1 n D solves 6.5 + 0.25Q = a - Q -> Q1 = (a-6.5)/1.25, P1 = a-Q1;
  S2 n D solves 2 + Q = a - Q -> Q2 = (a-2)/2, P2 = 2 + Q2.
  At a = 14 BOTH equal exactly E0 = (6, $8). At a = 16 (the +2 shift, snap):
  S1 -> (7.6, $8.40) [price up $0.40]; S2 -> (7.0, $9.00) [price up $1.00] --
  the steep (inelastic) supply's price jump is 2.5x the flat one's.
  TIE-BREAKS / CONVENTIONS:
  - Range a in [14, 18], step 0.5, SNAP at a = 16 (the D2 state). a = 14 is the
    base (both supplies meet the demand at E0); a > 16 is "beyond D2".
  - The pre-shift demand D1 (a = 14) stays drawn as a MUTED DASHED GHOST; the
    draggable active demand rides on top of it at the base state.
  - Verbal-marginal course: NO surplus/welfare shading. The only emphasis marks
    are the two outcome dots + their droplines and the rightward shift arrow.
  Static-base architecture: the initial markup below is the a = 16 (post-shift)
  state -- the same picture as the slide-track SVG -- so the no-JS DOM shows the
  complete base figure; the script only re-attaches drag/keyboard/readout.
  The static SVG t04a-ep4-4-supply-elasticity.svg is the <noscript> fallback.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply elasticity and the price jump - drag the demand curve</title>
<style>
  :root{
    --font-body: Georgia, 'Times New Roman', serif;
    --paper:   #f7f4ef;   /* card background              */
    --surface: #fdfcf9;   /* plot backing                */
    --ink:     #1a1c1e;   /* supply curves + headings     */
    --muted:   #6b6459;   /* axes, ticks, ghost demand    */
    --accent:  #b3402a;   /* outcomes, shift arrow, jumps */
    --accent2: #b07a2c;   /* the draggable demand + focus (house warm gold) */
    --grid:    #e3ddd3;
  }
  html,body{margin:0;padding:0;background:var(--paper);font-family:var(--font-body);}
  .wrap{max-width:480px;margin:0 auto;padding:10px 8px 6px;}
  svg{display:block;width:100%;height:auto;background:var(--surface);
      border:1px solid var(--grid);border-radius:4px;}
  .hint{color:var(--muted);font-size:13px;margin:6px 2px 2px;text-align:center;}
  .fallback{color:var(--muted);font-size:14px;padding:8px;}
  .fallback a{color:var(--ink);}
  text{font-family:var(--font-body);}
  .axis{stroke:var(--muted);stroke-width:1.4;}
  .tick{fill:var(--muted);font-size:11px;}
  .axlbl{fill:var(--muted);font-size:12px;}
  .curve{stroke:var(--ink);stroke-width:2.6;fill:none;stroke-linecap:round;}
  .curvelbl{fill:var(--ink);font-size:11.5px;font-style:italic;}
  .ghost{stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5;opacity:.55;fill:none;}
  .ghostlbl{fill:var(--muted);font-size:11.5px;font-style:italic;opacity:.8;}
  .demand{stroke:var(--accent2);stroke-width:3;fill:none;stroke-linecap:round;}
  .demandhit{stroke:transparent;stroke-width:24;cursor:ew-resize;fill:none;}
  .demandlbl{fill:var(--accent2);font-size:12px;font-weight:bold;}
  .drop{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.8;}
  .dot{fill:var(--ink);}
  .outdot{fill:var(--accent);}
  .pxlbl{fill:var(--accent);font-size:10.5px;font-weight:bold;}
  .p0lbl{fill:var(--muted);font-size:10.5px;}
  .shift{stroke:var(--accent);stroke-width:2;}
  .state{fill:var(--muted);font-size:12px;}
  .takeaway{fill:var(--accent);font-size:12.5px;font-weight:bold;}
  .sep{stroke:var(--grid);stroke-width:1;}
  #demFocus:focus{outline:none;}
  #demFocus:focus + .focusring{opacity:1;}
  .focusring{opacity:0;stroke:var(--accent2);stroke-width:1.5;fill:none;
             stroke-dasharray:3 3;}
</style>
</head>
<body>
<div class="wrap">
  <svg id="fig" viewBox="0 0 440 550" role="group"
       aria-label="A market with one demand curve and two supply curves that share a common starting equilibrium at a price of 8 dollars and a quantity of 6. One supply is flat (its inputs are general and easily redeployed, so supply is elastic); the other is steep (its inputs are specialized, so supply is inelastic). Drag the demand curve to the right to increase demand: the same increase raises the price only a little on the flat, elastic supply but a lot on the steep, inelastic supply, because a supply that cannot easily expand absorbs a demand increase in price rather than quantity.">

    <defs>
      <marker id="ep44ah" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#b3402a"/>
      </marker>
    </defs>

    <!-- ====================== static base (a = 16 state) ======================
         Geometry: X(q) = 58 + 25q  (q 0..14 -> 58..408)
                   Y(p) = 410 - 22p (p 0..16 -> 410..58)
         E0 (6,8)=(208,234); S1 outcome (7.6,8.4)=(248,225.2);
         S2 outcome (7,9)=(233,212).                                          -->

    <!-- axes -->
    <line class="axis" x1="58" y1="46"  x2="58"  y2="410" marker-end="url(#ep44ah)"/>
    <line class="axis" x1="58" y1="410" x2="424" y2="410" marker-end="url(#ep44ah)"/>

    <!-- droplines (under the curves): E0 + two outcomes -->
    <line class="drop" x1="208" y1="234"   x2="58"  y2="234"/>
    <line class="drop" x1="208" y1="234"   x2="208" y2="410"/>
    <line id="dropH1" class="drop" x1="248" y1="225.2" x2="58"  y2="225.2"/>
    <line id="dropV1" class="drop" x1="248" y1="225.2" x2="248" y2="410"/>
    <line id="dropH2" class="drop" x1="233" y1="212"   x2="58"  y2="212"/>
    <line id="dropV2" class="drop" x1="233" y1="212"   x2="233" y2="410"/>

    <!-- ghost pre-shift demand D1 (a = 14) -->
    <line class="ghost" x1="58" y1="102" x2="408" y2="410"/>
    <text class="ghostlbl" x="392" y="404">D&#8321;</text>

    <!-- rightward shift arrow (at price 4: ghost Q=10 -> active Q=(a-4)); it lives
         in the busy band between the ghost and the active demand, so no text label
         rides with it -- the gold draggable line, hint, and readout carry "demand
         rises" instead -->
    <line id="shiftArr" class="shift" x1="308" y1="322" x2="356" y2="322" marker-end="url(#ep44ah)"/>

    <!-- supplies (fixed) -->
    <line class="curve" x1="58" y1="267" x2="408" y2="190"/>   <!-- S1 flat  -->
    <line class="curve" x1="58" y1="366" x2="408" y2="58"/>    <!-- S2 steep -->
    <text class="curvelbl" x="411" y="188">S&#8321;</text>
    <text class="curvelbl" x="398" y="52">S&#8322;</text>
    <!-- elasticity idiom, short, placed in line-free bands the demand never sweeps
         (full "general inputs" causal idiom lives in the readout + aria + caption) -->
    <text class="curvelbl" x="245" y="112" text-anchor="middle">inelastic supply</text>
    <text class="curvelbl" x="345" y="172" text-anchor="middle">elastic supply</text>

    <!-- active (draggable) demand D, initial a = 16 -->
    <line id="demand"    class="demand"    x1="58" y1="58" x2="408" y2="366"/>
    <line id="demandHit" class="demandhit" x1="58" y1="58" x2="408" y2="366"/>
    <text id="demandLbl" class="demandlbl" x="392" y="380">D&#8322;</text>

    <!-- equilibrium dots: E0 (fixed reference) + two moving outcomes -->
    <circle class="dot" cx="208" cy="234" r="3.6"/>
    <circle id="outDot1" class="outdot" cx="248" cy="225.2" r="4"/>
    <circle id="outDot2" class="outdot" cx="233" cy="212" r="4"/>

    <!-- price-axis marks: P0 (fixed) + two live outcome prices -->
    <text class="p0lbl" x="54" y="237" text-anchor="end">$8.00</text>
    <text id="pxLbl1" class="pxlbl" x="54" y="228" text-anchor="end">$8.40</text>
    <text id="pxLbl2" class="pxlbl" x="54" y="215" text-anchor="end">$9.00</text>

    <!-- axis titles + a couple of quantity ticks -->
    <text class="tick" x="208" y="424" text-anchor="middle">6</text>
    <text class="axlbl" x="240" y="440" text-anchor="middle">Quantity</text>
    <text class="axlbl" transform="rotate(-90 20 232)" x="20" y="232"
          text-anchor="middle">Price ($)</text>

    <!-- keyboard proxy for the demand line -->
    <rect id="demFocus" x="120" y="150" width="230" height="120" fill="transparent"
          tabindex="0" role="slider"
          aria-label="Demand level. Drag right to increase demand from the base through the plus-2 shift and beyond."
          aria-valuemin="14" aria-valuemax="18" aria-valuenow="16"
          aria-valuetext="Demand up by 2: on elastic supply price is $8.40 (up $0.40); on inelastic supply price is $9.00 (up $1.00)."/>
    <rect id="focusRing" class="focusring" x="116" y="146" width="238" height="128" rx="4"/>

    <!-- readout band: muted state (2 rows) + accent takeaway (3 rows) -->
    <line class="sep" x1="16" y1="452" x2="424" y2="452"/>
    <text class="state" text-anchor="middle">
      <tspan id="state1" x="220" y="470">Demand up by 2: on elastic supply price is $8.40 (up $0.40);</tspan>
      <tspan id="state2" x="220" y="485">on inelastic supply price is $9.00 (up $1.00).</tspan>
    </text>
    <text class="takeaway" text-anchor="middle">
      <tspan id="take1" x="220" y="507">Same demand increase, very different price jumps: the</tspan>
      <tspan id="take2" x="220" y="522">specialized-input good&#8217;s price rises 2&#189; times as much,</tspan>
      <tspan id="take3" x="220" y="537">because supply cannot easily expand.</tspan>
    </text>
  </svg>

  <p class="hint">Drag the gold demand curve to the right (or focus it and use the
    arrow keys). Watch the two price jumps pull apart.</p>

  <noscript>
    <p class="fallback">Interactive view needs JavaScript. See the
      <a href="t04a-ep4-4-supply-elasticity.svg">static version of this figure</a>
      (it shows both price jumps at the plus-2 demand shift).</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';
  // ---- geometry (must mirror the base markup) ----
  var X0 = 58, SX = 25;                 // x px origin; px per unit quantity
  var YAX = 410, SY = 22;               // x-axis foot; px per dollar
  function X (q) { return X0 + q * SX; }
  function Y (p) { return YAX - p * SY; }

  // ---- economics (brief Section C invariants) ----
  // D: P = a - Q  (a = intercept the slider sweeps).
  // S1 flat  (more elastic): P = 6.5 + 0.25Q.
  // S2 steep (less elastic): P = 2 + Q.
  // Equilibria recomputed live at EVERY a (never keyframed):
  //   S1 n D: 6.5 + 0.25Q = a - Q  -> Q1 = (a-6.5)/1.25, P1 = a - Q1
  //   S2 n D: 2 + Q      = a - Q   -> Q2 = (a-2)/2,      P2 = 2 + Q2
  // a = 14 -> both at E0 (6,8); a = 16 -> (7.6,8.40) & (7,9.00).
  var AMIN = 14, AMAX = 18, STEP = 0.5, ASNAP = 16, P0 = 8;
  var a = 16;

  var svg = document.getElementById('fig');
  var $ = function (id) { return document.getElementById(id); };

  function eqS1 (aa) { var q = (aa - 6.5) / 1.25; return { q: q, p: aa - q }; }
  function eqS2 (aa) { var q = (aa - 2) / 2;      return { q: q, p: 2 + q }; }
  function money (v) { return '$' + v.toFixed(2); }
  // active-demand segment, clipped to the plot box [0,14] x [0,16]:
  // top end at P=16 once a>16 (else the y-axis), bottom end at Q=14.
  function demandSeg (aa) {
    var qTop = aa <= 16 ? 0 : aa - 16, pTop = aa <= 16 ? aa : 16;
    return { x1: X(qTop), y1: Y(pTop), x2: X(14), y2: Y(aa - 14) };
  }

  // ---- readout strings: the three pinned states are verbatim; 14<a<16 gets a
  //      live transitional line that never contradicts the pinned states. ----
  function strings (aa) {
    var e1 = eqS1(aa), e2 = eqS2(aa), out = {};
    if (Math.abs(aa - AMIN) < 1e-9) {                 // base (D1)
      out.state = 'Both supplies meet demand at $8.00 and 6 units.';
      out.take  = 'Start here: one equilibrium, two supplies of different ' +
                  'elasticity waiting to be tested.';
    } else if (Math.abs(aa - ASNAP) < 1e-9) {         // the +2 shift (D2), snap
      out.state = 'Demand up by 2: on elastic supply price is $8.40 (up $0.40); ' +
                  'on inelastic supply price is $9.00 (up $1.00).';
      out.take  = 'Same demand increase, very different price jumps: the ' +
                  'specialized-input good’s price rises 2½ times as ' +
                  'much, because supply cannot easily expand.';
    } else if (aa > ASNAP + 1e-9) {                   // beyond D2
      out.state = 'A larger demand increase widens the gap between the two ' +
                  'price outcomes.';
      out.take  = 'The more inelastic the supply, the more any demand increase ' +
                  'is absorbed by price rather than quantity.';
    } else {                                          // transitional 14<a<16
      out.state = 'Demand up by ' + (aa - AMIN).toFixed(1) +
                  ': on elastic supply price is ' + money(e1.p) + ' (up ' +
                  money(e1.p - P0) + '); on inelastic supply price is ' +
                  money(e2.p) + ' (up ' + money(e2.p - P0) + ').';
      out.take  = 'As demand rises the steep (inelastic) supply’s price ' +
                  'pulls ahead of the flat (elastic) one.';
    }
    return out;
  }

  // ---- word-wrap into up to N rows ----
  function wrapN (s, max, rows) {
    var words = s.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var trial = cur ? cur + ' ' + words[i] : words[i];
      if (trial.length > max && cur && lines.length < rows - 1) {
        lines.push(cur); cur = words[i];
      } else { cur = trial; }
    }
    if (cur) lines.push(cur);
    while (lines.length < rows) lines.push('');
    return lines;
  }

  function render () {
    var e1 = eqS1(a), e2 = eqS2(a), seg = demandSeg(a);
    var atBase = Math.abs(a - AMIN) < 1e-9;

    // active demand line + hit zone + label
    ['demand', 'demandHit'].forEach(function (id) {
      $(id).setAttribute('x1', seg.x1); $(id).setAttribute('y1', seg.y1);
      $(id).setAttribute('x2', seg.x2); $(id).setAttribute('y2', seg.y2);
    });
    $('demandLbl').setAttribute('x', X(14) - 16);
    $('demandLbl').setAttribute('y', Y(a - 14) + 14);

    // outcome dots + droplines (recomputed, never keyframed)
    $('outDot1').setAttribute('cx', X(e1.q)); $('outDot1').setAttribute('cy', Y(e1.p));
    $('outDot2').setAttribute('cx', X(e2.q)); $('outDot2').setAttribute('cy', Y(e2.p));
    $('dropH1').setAttribute('x1', X(e1.q)); $('dropH1').setAttribute('y1', Y(e1.p));
    $('dropH1').setAttribute('y2', Y(e1.p));
    $('dropV1').setAttribute('x1', X(e1.q)); $('dropV1').setAttribute('x2', X(e1.q));
    $('dropV1').setAttribute('y1', Y(e1.p));
    $('dropH2').setAttribute('x1', X(e2.q)); $('dropH2').setAttribute('y1', Y(e2.p));
    $('dropH2').setAttribute('y2', Y(e2.p));
    $('dropV2').setAttribute('x1', X(e2.q)); $('dropV2').setAttribute('x2', X(e2.q));
    $('dropV2').setAttribute('y1', Y(e2.p));

    // live outcome price labels; hidden at the base (they equal P0 = $8.00)
    $('pxLbl1').textContent = money(e1.p); $('pxLbl1').setAttribute('y', Y(e1.p) + 3.5);
    $('pxLbl2').textContent = money(e2.p); $('pxLbl2').setAttribute('y', Y(e2.p) + 3.5);
    $('pxLbl1').setAttribute('opacity', atBase ? 0 : 1);
    $('pxLbl2').setAttribute('opacity', atBase ? 0 : 1);

    // rightward shift arrow at price 4: ghost Q=10 -> active Q=(a-4); hide at base
    var ay = Y(4), gx = X(10), dx = X(a - 4);
    var showArr = (a - AMIN) > 1e-9;
    $('shiftArr').setAttribute('opacity', showArr ? 1 : 0);
    if (showArr) {
      $('shiftArr').setAttribute('x1', gx + 2); $('shiftArr').setAttribute('x2', dx - 2);
      $('shiftArr').setAttribute('y1', ay);     $('shiftArr').setAttribute('y2', ay);
    }

    // readout + aria
    var str = strings(a);
    var sRows = wrapN(str.state, 58, 2);
    $('state1').textContent = sRows[0]; $('state2').textContent = sRows[1];
    var tRows = wrapN(str.take, 54, 3);
    $('take1').textContent = tRows[0];
    $('take2').textContent = tRows[1];
    $('take3').textContent = tRows[2];
    var f = $('demFocus');
    f.setAttribute('aria-valuenow', String(a));
    f.setAttribute('aria-valuetext', str.state);
  }

  function clampSnap (v) {
    v = Math.max(AMIN, Math.min(AMAX, v));
    v = Math.round(v / STEP) * STEP;
    if (Math.abs(v - ASNAP) < STEP / 2) v = ASNAP;   // firm snap at the +2 shift
    return v;
  }

  // ---- pointer drag: grab the demand line; a = P + Q at the pointer, so the
  //      line follows the cursor as a parallel rightward shift. ----
  function svgPoint (evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = false;
  function onDown (evt) {
    dragging = true;
    if (evt.pointerId !== undefined && evt.target.setPointerCapture) {
      try { evt.target.setPointerCapture(evt.pointerId); } catch (e) {}
    }
    evt.preventDefault();
  }
  function onMove (evt) {
    if (!dragging) return;
    var pt = svgPoint(evt);
    var q = (pt.x - X0) / SX, p = (YAX - pt.y) / SY;
    var snapped = clampSnap(p + q);                  // intercept a = P + Q
    if (Math.abs(snapped - a) > 1e-9) { a = snapped; render(); }
  }
  function onUp (evt) {
    dragging = false;
    if (evt.pointerId !== undefined && evt.target.releasePointerCapture) {
      try { evt.target.releasePointerCapture(evt.pointerId); } catch (e) {}
    }
  }
  ['demandHit', 'demFocus'].forEach(function (id) {
    $(id).addEventListener('pointerdown', onDown);
  });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);

  // ---- keyboard ----
  $('demFocus').addEventListener('keydown', function (evt) {
    var delta = 0;
    if (evt.key === 'ArrowRight' || evt.key === 'ArrowUp') delta = STEP;
    else if (evt.key === 'ArrowLeft' || evt.key === 'ArrowDown') delta = -STEP;
    else if (evt.key === 'Home') { a = AMIN; render(); evt.preventDefault(); return; }
    else if (evt.key === 'End') { a = AMAX; render(); evt.preventDefault(); return; }
    else return;
    evt.preventDefault();
    a = clampSnap(a + delta);
    render();
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (v) { a = clampSnap(Number(v)); render(); return a; },
    get: function () {
      var e1 = eqS1(a), e2 = eqS2(a);
      return {
        intercept: a,
        elastic:   { q: +e1.q.toFixed(4), p: +e1.p.toFixed(4), jump: +(e1.p - P0).toFixed(4) },
        inelastic: { q: +e2.q.toFixed(4), p: +e2.p.toFixed(4), jump: +(e2.p - P0).toFixed(4) },
        ratio: (e1.p - P0) > 1e-9 ? +((e2.p - P0) / (e1.p - P0)).toFixed(4) : null
      };
    }
  };

  render();
})();
</script>
</body>
</html>
