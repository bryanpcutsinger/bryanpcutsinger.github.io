<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One staircase, three experiments: sum the demands, then change the stock or the buyers</title>
<!--
  t04a-ep4-1-market-demand-sum-interactive.html — ROUND 3, 2026-08-07
  (instructor: round 2's hand-set price control is retired. Each button now
  SHOWS its equilibrium directly, and each
  of the three change scenarios also shows the OLD $7,000 price failing, in the
  market's own numbers, so the student sees WHY the price had to move.)

  Course-adapted interactive of E&P ch. 4:
    Fig 4-1  market demand = horizontal sum of individual demands; a fixed
             stock is a vertical supply line; T crosses S at the clearing price.
    Fig 4-2  supply changes, demand does not: S shifts left (a car burns) or
             right (two cars arrive) along the UNCHANGED staircase; the price
             is bid up to $8,000 or falls to $4,000.
    Fig 4-3  demand changes, supply does not: a new buyer E joins, the whole
             staircase shifts right (T-new = A+B+C+D+E), and the same seven
             cars re-clear at a higher price, $8,000.
  Numbers are course-adapted (the post's own table, UE Table 10.1 scale), NOT
  the book's $100–$1,000 scale: fidelity target is the E&P construction.

  ECONOMICS (the horizontal-sum identity is the whole point — never hard-code T):
    Marginal worths (the $1,000s a buyer would pay for the qth car):
      A: 10, 8, 3, 1    B: 9, 6, 2, 1    C: 10, 7    D: 10, 9, 4, 1
      E: 9, 4, 1        (the Fig 4-3 newcomer, course-adapted)
    Quantity demanded at price P = units worth at least P; T(P) = the sum over
    the scenario's buyers. Invariants (each clearing is unique):
      base    stock 7 → clears (7, $7,000):  T(7)=7;  T(8)=6, T(6)=8
      burn    stock 6 → clears (6, $8,000):  T(8)=6   (T unchanged — Fig 4-2)
      arrive  stock 9 → clears (9, $4,000):  T(4)=9   (T unchanged — Fig 4-2)
      newb    stock 7 → clears (7, $8,000):  T+E at $8,000 = 6+1 = 7 (Fig 4-3;
              one step up, mirroring the book's $500→$600; the car E gains is
              the second car C stops demanding above $7,000)
    OLD-PRICE FAILURE (the annotation on the three change scenarios; E&P's own
    bidding mechanism, "no one is willing to sell at the old equilibrium price"):
      burn    at $7,000: 7 wanted, 6 exist  → shortage, price bid up to $8,000
      arrive  at $7,000: 7 wanted, 9 exist  → surplus,  price bid down to $4,000
      newb    at $7,000: 8 wanted, 7 exist  → shortage, price bid up to $8,000
    Who releases a car at $8,000 is C, not B: on the COURSE schedules B's only
    car is worth $9,000 (he holds it), while C's second car is worth exactly
    $7,000, so C is the marginal seller wherever the price steps 7 -> 8. (The
    book's own $500/$600 numbers make B the seller; do not carry that name
    over.) Only the NEWB readout names C. The BURN readout stays owner-neutral
    on purpose: the button says only "A car burns", so naming a seller would
    presuppose whose car burned — if it were C's own second car, nobody sells.
    (E&P fixes this by naming A as the owner; our scenario framing does not.)
    NO welfare shading, no surplus areas (summation / allocation figure).

  GEOMETRY: everything — buttons, plot, readout, hint — lives INSIDE one
  640×600 SVG; the iframe embeds at aspect-ratio:640/600 so the widget fits
  its frame exactly. No CSS media query and no width gate anywhere in the file.
    X(q) = 48 + 33q  (q cars, 0..17)     Y(p) = 420 - 33p  (p $1,000s, 0..10)
    S base x=279 (q7) · burn x=246 (q6) · arrive x=345 (q9)
    clearing dots: base (279,189) · burn (246,156) · arrive (345,288) ·
    newb (279,156)
    old-price reference line at y = Y(7) = 189; the mismatch is drawn as a
    DIMENSION LINE 14px below it (y=203), because in the burn and new-buyer
    scenarios the mismatch spans exactly a staircase run at y=189 and a segment
    drawn on the line would be unreadable there. Its ends are INWARD-POINTING
    ARROWHEADS, not extension ticks: every gap endpoint lands on a vertical
    (a stock line spanning y 76..420, or a staircase drop spanning 189..222),
    so any tick of any length would repaint a stretch of that curve in bronze.
    An arrowhead touches the vertical at its apex only — a single point.

    Individual staircases A-D carry small x-nudges (-4.5, -1.5, +1.5, +4.5 px,
    E&P's own convention) applied to every point EXCEPT the first, which stays
    pinned on the y-axis at x=48; without the pin, A's nudge would poke past
    the axis. The nudges split the q=2 gutter, where all four verticals used to
    superimpose into one apparent rule, into four traceable lines 3px apart.
    Each letter label sits over its own UNIQUE horizontal run in the q=1->2
    band (D y=123, A y=156, C y=189, B y=222); labels are NOT doubled at the
    curve ends the way E&P Fig 4-1 doubles them, because on the course numbers
    A, C and D share the top run (all worth 10) and A, B and D share the tail
    (all worth 1), so a second label set would rebuild the very stack the
    nudges just broke up.

  Static-base architecture: the no-JS state is the base scenario at its $7,000
  clearing, all real markup; scenario-only groups start hidden. The script
  attaches the scenario buttons (in-SVG per the ep2-11 precedent; hit rects
  painted LAST so they sit on top) and redraws the stack bar, clearing marker,
  tick emphasis, old-price annotation, and readout. The static
  t04a-ep4-1-market-demand-sum.svg (slide asset) stays the <noscript> fallback.
-->
<style>
  :root {
    --surface: #f7f4ef;
    --ink:     #1a1c1e;
    --text:    #16181a;
    --muted:   #5c6066;
    --hairline:#e3ddd3;
    --accent:  #b07a2c;
    --accent-tint: #efe4d2;
    --font-body: 'Inter Variable', Inter, -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;            /* grid, not flex — see t03b-ue8-1 mobile note */
    place-items: center;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .fig { width: 100%; max-width: 600px; min-width: 0; }
  svg { width: 100%; height: auto; display: block; }

  .axis   { stroke: var(--muted); stroke-width: 1.4; fill: none; }
  .stair  { stroke: var(--muted); stroke-width: 1.5; fill: none; opacity: .62;
            stroke-linecap: round; stroke-linejoin: round; }
  .stairlbl { fill: var(--muted); font-size: 11.5px; font-weight: 600;
              font-style: italic; }
  .tcurve { stroke: var(--ink); stroke-width: 2.7; fill: none;
            stroke-linecap: round; stroke-linejoin: round; }
  .tghost { stroke: var(--muted); stroke-width: 1.8; fill: none; opacity: .75;
            stroke-dasharray: 6 5; stroke-linecap: round;
            stroke-linejoin: round; }
  .tlbl   { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
  .ghostlbl { fill: var(--muted); font-size: 11px; font-weight: 600; }
  .tdot   { fill: var(--ink); }
  .supply { stroke: var(--ink); stroke-width: 2.2; }
  .sghost { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 6 5;
            opacity: .8; }
  .supplylbl { fill: var(--ink); font-size: 12.5px; font-weight: 700;
               font-style: italic; }
  .shift  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .shifthead { fill: var(--accent); }
  .shiftlbl  { fill: var(--accent); font-size: 11.5px; font-weight: 700; }
  .drop   { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4;
            opacity: .8; }
  .cdot   { fill: var(--ink); }
  .clearlbl  { fill: var(--muted); font-size: 11px; }
  .clearlbl2 { fill: var(--ink); font-size: 11px; font-weight: 700; }
  .stackbar  { fill: var(--accent-tint); stroke: var(--accent);
               stroke-width: .8; }
  .stacksep  { stroke: var(--accent); stroke-width: 1; }

  /* the old $7,000 price and why it no longer holds */
  .oldline { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 6 5;
             opacity: .85; }
  .oldlbl  { fill: var(--muted); font-size: 11px; font-weight: 600; }
  .dim     { stroke: var(--accent); stroke-width: 2.4; fill: none;
             stroke-linecap: butt; }
  .dimhead { fill: var(--accent); }
  .gaplbl  { fill: var(--accent); font-size: 11px; font-weight: 700; }

  .tick   { fill: var(--muted); font-size: 11px; }
  .tick.on { fill: var(--ink); font-weight: 700; }
  .axlabel { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .sep    { stroke: var(--hairline); stroke-width: 1; }
  .r-state { fill: var(--muted); font-size: 12.5px; }
  .r-take  { fill: var(--accent); font-size: 13px; font-weight: 600; }
  .hintln  { fill: var(--muted); font-size: 12px; }

  /* in-SVG scenario buttons (ep2-11 pattern): visible rect + label are inert;
     the transparent focusable hit rect painted LAST does the work */
  .btn      { fill: var(--surface); stroke: var(--hairline);
              stroke-width: 1.5; }
  .btn.on   { fill: var(--accent); stroke: var(--accent); }
  .btnlabel { fill: var(--ink); font-size: 12px; font-weight: 600;
              pointer-events: none; }
  .btnlabel.on { fill: var(--surface); }
  .btnfocus { cursor: pointer; }
  .btnfocus:focus-visible { outline: 2px solid var(--accent);
                            outline-offset: 2px; }

  .fallback { margin: 8px 0 0; color: var(--muted); font-size: 13px;
              line-height: 1.35; text-align: center; }
  .fallback a { color: var(--ink); }
</style>
</head>
<body>
<div class="fig">
  <svg id="fig" viewBox="0 0 640 600" role="group"
       aria-label="Market demand as a horizontal sum, with three experiments. Four buyers A, B, C and D each hold a whole-number demand for cars; their demands add sideways at every price into the market staircase T. A fixed stock of seven cars is a vertical supply line, and the market clears where the staircase meets it, at seven cars and 7,000 dollars. Four buttons rerun the market and show each new clearing price. With the demands summed, seven cars clear at 7,000 dollars. If a car burns, seven cars are still wanted at the old 7,000 dollars but only six exist, so the price is bid up and the same staircase meets the six-car stock at 8,000 dollars. If two more cars arrive, nine exist where seven are wanted at the old price, so the price falls and nine cars clear at 4,000 dollars. If a new buyer E joins, eight cars are wanted against seven at the old price, so the price is bid up and the same seven cars re-clear at 8,000 dollars.">
    <title>One staircase, three experiments: sum the demands, then burn a car, add two, or add a buyer</title>

    <!-- ============ static base (scenario: sum the demands, $7,000) ========
         X(q) = 48 + 33q ; Y(p) = 420 - 33p. At $7,000: qA=2, qB=1, qC=2,
         qD=2, T=7; stack bar runs x48..X(7)=279, separators at cumulative
         2,3,5 -> x114,147,213.                                            -->

    <!-- scenario buttons -->
    <rect id="btn-base"   class="btn on" x="14"  y="14" width="147" height="30" rx="6"/>
    <text id="btnl-base"  class="btnlabel on" x="87.5" y="33.5" text-anchor="middle">Sum the demands</text>
    <rect id="btn-burn"   class="btn" x="169" y="14" width="147" height="30" rx="6"/>
    <text id="btnl-burn"  class="btnlabel" x="242.5" y="33.5" text-anchor="middle">A car burns</text>
    <rect id="btn-arrive" class="btn" x="324" y="14" width="147" height="30" rx="6"/>
    <text id="btnl-arrive" class="btnlabel" x="397.5" y="33.5" text-anchor="middle">Two cars arrive</text>
    <rect id="btn-newb"   class="btn" x="479" y="14" width="147" height="30" rx="6"/>
    <text id="btnl-newb"  class="btnlabel" x="552.5" y="33.5" text-anchor="middle">A new buyer joins</text>

    <!-- axes -->
    <line class="axis" x1="48" y1="68"  x2="48"  y2="420"/>
    <line class="axis" x1="48" y1="420" x2="620" y2="420"/>

    <!-- x ticks (0..17; the scenario's stock emphasized). INTENTIONAL
         divergence from the static spec's "ticks only at labeled values": a
         whole-number staircase needs the full integer tick sets to be readable
         (endorsed at the 2026-07-20 fidelity review; carried forward). -->
    <g text-anchor="middle">
      <text id="tx0"  class="tick"    x="48"  y="436">0</text>
      <text id="tx1"  class="tick"    x="81"  y="436">1</text>
      <text id="tx2"  class="tick"    x="114" y="436">2</text>
      <text id="tx3"  class="tick"    x="147" y="436">3</text>
      <text id="tx4"  class="tick"    x="180" y="436">4</text>
      <text id="tx5"  class="tick"    x="213" y="436">5</text>
      <text id="tx6"  class="tick"    x="246" y="436">6</text>
      <text id="tx7"  class="tick on" x="279" y="436">7</text>
      <text id="tx8"  class="tick"    x="312" y="436">8</text>
      <text id="tx9"  class="tick"    x="345" y="436">9</text>
      <text id="tx10" class="tick"    x="378" y="436">10</text>
      <text id="tx11" class="tick"    x="411" y="436">11</text>
      <text id="tx12" class="tick"    x="444" y="436">12</text>
      <text id="tx13" class="tick"    x="477" y="436">13</text>
      <text id="tx14" class="tick"    x="510" y="436">14</text>
      <text id="tx15" class="tick"    x="543" y="436">15</text>
      <text id="tx16" class="tick"    x="576" y="436">16</text>
      <text id="tx17" class="tick"    x="609" y="436">17</text>
    </g>
    <!-- y ticks (1..10; the scenario's clearing price emphasized) -->
    <g text-anchor="end">
      <text id="ty1"  class="tick"    x="42" y="391">1</text>
      <text id="ty2"  class="tick"    x="42" y="358">2</text>
      <text id="ty3"  class="tick"    x="42" y="325">3</text>
      <text id="ty4"  class="tick"    x="42" y="292">4</text>
      <text id="ty5"  class="tick"    x="42" y="259">5</text>
      <text id="ty6"  class="tick"    x="42" y="226">6</text>
      <text id="ty7"  class="tick on" x="42" y="193">7</text>
      <text id="ty8"  class="tick"    x="42" y="160">8</text>
      <text id="ty9"  class="tick"    x="42" y="127">9</text>
      <text id="ty10" class="tick"    x="42" y="94">10</text>
    </g>
    <text class="axlabel" x="334" y="454" text-anchor="middle">Quantity of cars</text>
    <text class="axlabel" transform="rotate(-90 15 244)" x="15" y="244"
          text-anchor="middle">Price ($ thousands)</text>

    <!-- the old $7,000 price, as a reference line UNDER the curves (a dashed
         muted line painted over an ink staircase run would speckle it) -->
    <g id="gOldLine" visibility="hidden" pointer-events="none">
      <line class="oldline" x1="48" y1="189" x2="612" y2="189"/>
      <text class="oldlbl" x="612" y="183" text-anchor="end">old price, $7,000</text>
    </g>

    <!-- individual step-demands A, B, C, D (base scenario only) -->
    <g id="gIndiv">
      <polyline class="stair" points="48,90 76.5,90 76.5,156 109.5,156 109.5,321 142.5,321 142.5,387 175.5,387"/>
      <polyline class="stair" points="48,123 79.5,123 79.5,222 112.5,222 112.5,354 145.5,354 145.5,387 178.5,387"
                stroke-dasharray="5 3"/>
      <polyline class="stair" points="48,90 82.5,90 82.5,189 115.5,189 115.5,387" stroke-dasharray="1.5 3"/>
      <polyline class="stair" points="48,90 85.5,90 85.5,123 118.5,123 118.5,288 151.5,288 151.5,387 184.5,387"
                stroke-dasharray="1.5 2.5 5 2.5"/>
      <!-- each letter sits over the one horizontal run that is that buyer's
           alone in the q=1->2 band: D $9,000 · A $8,000 · C $7,000 · B $6,000.
           C rides 8px above its run because the base stack bar covers y=189. -->
      <g text-anchor="middle">
        <text class="stairlbl" x="97" y="119">D</text>
        <text class="stairlbl" x="97" y="152">A</text>
        <text class="stairlbl" x="97" y="181">C</text>
        <text class="stairlbl" x="97" y="218">B</text>
      </g>
    </g>

    <!-- market staircase T = A+B+C+D (heavy) + demand-schedule points.
         In the new-buyer scenario this heavy T hides and #gTghost/#gTnew
         show instead. -->
    <g id="gTbase">
      <polyline class="tcurve" points="48,90 147,90 147,123 213,123 213,156 246,156 246,189 279,189 279,222 312,222 312,288 345,288 345,321 378,321 378,354 411,354 411,387 510,387"/>
      <g class="tdot">
        <circle cx="147" cy="90"  r="2.6"/>
        <circle cx="213" cy="123" r="2.6"/>
        <circle cx="246" cy="156" r="2.6"/>
        <circle cx="279" cy="189" r="2.6"/>
        <circle cx="312" cy="222" r="2.6"/>
        <circle cx="345" cy="288" r="2.6"/>
        <circle cx="378" cy="321" r="2.6"/>
        <circle cx="411" cy="354" r="2.6"/>
        <circle cx="510" cy="387" r="2.6"/>
      </g>
      <text id="tbaseLbl" class="tlbl" x="424" y="310">T = A + B + C + D</text>
    </g>

    <!-- new-buyer scenario: old T as ghost, T-new = A+B+C+D+E heavy -->
    <g id="gTghost" visibility="hidden">
      <polyline class="tghost" points="48,90 147,90 147,123 213,123 213,156 246,156 246,189 279,189 279,222 312,222 312,288 345,288 345,321 378,321 378,354 411,354 411,387 510,387"/>
      <text class="ghostlbl" x="392" y="375" text-anchor="end">T (before E)</text>
    </g>
    <g id="gTnew" visibility="hidden">
      <polyline class="tcurve" points="48,90 147,90 147,123 246,123 246,156 279,156 279,189 312,189 312,222 345,222 345,288 411,288 411,321 444,321 444,354 477,354 477,387 609,387"/>
      <g class="tdot">
        <circle cx="147" cy="90"  r="2.6"/>
        <circle cx="246" cy="123" r="2.6"/>
        <circle cx="279" cy="156" r="2.6"/>
        <circle cx="312" cy="189" r="2.6"/>
        <circle cx="345" cy="222" r="2.6"/>
        <circle cx="411" cy="288" r="2.6"/>
        <circle cx="444" cy="321" r="2.6"/>
        <circle cx="477" cy="354" r="2.6"/>
        <circle cx="609" cy="387" r="2.6"/>
      </g>
      <text class="tlbl" x="455" y="310">T = A + B + C + D + E</text>
    </g>

    <!-- supply: the fixed stock. Base S at q=7; burn/arrive swap in a ghost
         S0 plus the shifted line. -->
    <g id="gS">
      <line class="supply" x1="279" y1="420" x2="279" y2="76"/>
      <text class="supplylbl" x="285" y="88">S</text>
    </g>
    <g id="gSburn" visibility="hidden">
      <line class="sghost" x1="279" y1="420" x2="279" y2="76"/>
      <text class="ghostlbl" x="285" y="88">S before</text>
      <line class="supply" x1="246" y1="420" x2="246" y2="76"/>
      <text class="supplylbl" x="222" y="88" text-anchor="end">S after</text>
      <g class="shift">
        <line x1="276" y1="106" x2="256" y2="106"/>
        <polygon class="shifthead" points="256,102 248,106 256,110"/>
      </g>
      <text class="shiftlbl" x="330" y="110">supply falls</text>
    </g>
    <g id="gSarrive" visibility="hidden">
      <line class="sghost" x1="279" y1="420" x2="279" y2="76"/>
      <text class="ghostlbl" x="253" y="88" text-anchor="end">S before</text>
      <line class="supply" x1="345" y1="420" x2="345" y2="76"/>
      <text class="supplylbl" x="351" y="88">S after</text>
      <g class="shift">
        <line x1="282" y1="106" x2="335" y2="106"/>
        <polygon class="shifthead" points="335,102 343,106 335,110"/>
      </g>
      <text class="shiftlbl" x="351" y="110">supply rises</text>
    </g>

    <!-- horizontal-sum stack at the clearing price: the buyers' quantities laid
         end to end, ending exactly on the stock line. In the new-buyer scenario
         a fifth E segment appears — the visible source of the demand shift. -->
    <rect id="stackbar" class="stackbar" x="48" y="184.5" width="231" height="9"/>
    <g id="stackseps">
      <line class="stacksep" id="sep1" x1="114" y1="184.5" x2="114" y2="193.5"/>
      <line class="stacksep" id="sep2" x1="147" y1="184.5" x2="147" y2="193.5"/>
      <line class="stacksep" id="sep3" x1="213" y1="184.5" x2="213" y2="193.5"/>
      <line class="stacksep" id="sep4" x1="279" y1="184.5" x2="279" y2="193.5" opacity="0"/>
    </g>

    <!-- clearing point: dot + droplines + two-line label (JS repositions per
         scenario; base = (7, $7,000)). Painted AFTER the stack bar so it is
         never overpainted; pointer-events:none keeps it clear of the buttons. -->
    <g id="gClear" pointer-events="none">
      <line id="clearDropV" class="drop" x1="279" y1="189" x2="279" y2="420"/>
      <line id="clearDropH" class="drop" x1="48"  y1="189" x2="279" y2="189"/>
      <circle id="clearDot" class="cdot" cx="279" cy="189" r="3.4"/>
      <text id="clearL1" class="clearlbl"  x="296" y="166">market clears at</text>
      <text id="clearL2" class="clearlbl2" x="296" y="180">7 cars, $7,000</text>
    </g>

    <!-- why the old price fails: a dimension line under y=Y(7) spanning the
         mismatch between the stock and the amount wanted, plus a short label.
         Late-painted so the staircase cannot cover it. -->
    <g id="gGap" visibility="hidden" pointer-events="none">
      <line    id="dimLine"  class="dim"     x1="246" y1="203" x2="279" y2="203"/>
      <polygon id="dimHeadA" class="dimhead" points="246,203 253,199 253,207"/>
      <polygon id="dimHeadB" class="dimhead" points="279,203 272,199 272,207"/>
      <text id="gapLbl"   class="gaplbl"  x="287" y="207">7 wanted, 6 exist &#8212; shortage</text>
    </g>

    <!-- newb demand-shift annotation: late-painted for the same reason -->
    <g id="gShiftNewb" pointer-events="none" visibility="hidden">
      <g class="shift">
        <line x1="317" y1="252" x2="337" y2="252"/>
        <polygon class="shifthead" points="337,248 345,252 337,256"/>
      </g>
      <text class="shiftlbl" x="352" y="244">demand rises</text>
    </g>

    <!-- button hit rects: painted LAST so they sit on top (ep2-11 lesson) -->
    <rect id="btnh-base"   class="btnfocus" x="14"  y="14" width="147" height="30" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="true"
          aria-label="Scenario: sum the demands. Four buyers, a fixed stock of seven cars; the market clears at 7,000 dollars."/>
    <rect id="btnh-burn"   class="btnfocus" x="169" y="14" width="147" height="30" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Scenario: a car burns. The stock falls to six, so at the old 7,000 dollars seven cars are wanted and six exist; the same demand staircase clears at 8,000 dollars."/>
    <rect id="btnh-arrive" class="btnfocus" x="324" y="14" width="147" height="30" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Scenario: two cars arrive. The stock rises to nine, so at the old 7,000 dollars nine cars exist and seven are wanted; the same demand staircase clears at 4,000 dollars."/>
    <rect id="btnh-newb"   class="btnfocus" x="479" y="14" width="147" height="30" rx="6"
          fill="transparent" tabindex="0" role="button" aria-pressed="false"
          aria-label="Scenario: a new buyer joins. Buyer E's demand shifts the staircase right, so at the old 7,000 dollars eight cars are wanted and seven exist; the same seven cars re-clear at 8,000 dollars."/>

    <!-- readout band: muted state + accent takeaway (each wraps to 2 rows;
         the base rows are the no-JS $7,000 fallback text) -->
    <line class="sep" x1="16" y1="468" x2="624" y2="468"/>
    <g id="readout" role="status" aria-live="polite">
      <text class="r-state" text-anchor="middle">
        <tspan id="state1" x="320" y="486">At $7,000: A wants 2, B wants 1, C wants 2, D wants 2 &#8212; market demand 7.</tspan>
        <tspan id="state2" x="320" y="502"></tspan>
      </text>
      <text class="r-take" text-anchor="middle">
        <tspan id="take1" x="320" y="520">The four demands sum sideways to 7 &#8212; exactly the seven cars, so the market clears.</tspan>
        <tspan id="take2" x="320" y="536"></tspan>
      </text>
    </g>

    <text class="hintln" x="320" y="562" text-anchor="middle">Press a button to rerun the market: burn a car, let two more arrive, or add a new buyer.</text>
    <text class="hintln" x="320" y="580" text-anchor="middle">In each rerun the dashed line is the old $7,000 price, and the gap shows why it cannot hold.</text>
  </svg>

  <noscript>
    <p class="fallback">JavaScript is off, so this frame shows only the
      summation scenario at its $7,000 clearing; the buttons that burn a car,
      add two, or bring in a new buyer need the interactive view. See the
      <a href="t04a-ep4-1-market-demand-sum.svg">static version of this figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';
  // ---- geometry (must mirror the base markup) ----
  var X0 = 48, SX = 33;                 // x px origin; px per car
  var YAX = 420, SY = 33;               // x-axis foot; px per $1,000
  function X (q) { return X0 + q * SX; }
  function Y (p) { return YAX - p * SY; }

  var OLDP = 7;                         // the base clearing price, $7,000
  var YOLD = Y(OLDP);                   // 189

  // ---- economics (spec invariants; the horizontal-sum identity) ----
  // Marginal worths of each buyer's units. Quantity demanded at a price =
  // how many of that buyer's units are worth at least the price.
  var WORTHS = { A: [10, 8, 3, 1], B: [9, 6, 2, 1], C: [10, 7],
                 D: [10, 9, 4, 1], E: [9, 4, 1] };
  function qOf (arr, p) {
    var n = 0;
    for (var i = 0; i < arr.length; i++) if (arr[i] >= p - 1e-9) n++;
    return n;
  }
  function demands (buyers, p) {
    var out = { T: 0 };                  // T recomputed, never stored
    for (var i = 0; i < buyers.length; i++) {
      var k = buyers[i];
      out[k] = qOf(WORTHS[k], p);
      out.T += out[k];
    }
    return out;
  }

  // ---- scenarios (E&P Figs 4-1 / 4-2 / 4-3, course-adapted) ----
  // `tail` closes the state sentence; `take` is the bidding story. Neither
  // states a quantity the code has not recomputed from WORTHS.
  var SCEN = {
    base: {
      buyers: 'ABCD', stock: 7, pclear: 7, oldprice: false,
      clearLbl: '7 cars, $7,000', clearAt: [296, 166],
      tail: '.',
      take: 'The four demands sum sideways to 7 — exactly the seven cars, ' +
            'so the market clears.',
      show: ['gIndiv', 'gTbase', 'gS']
    },
    burn: {
      buyers: 'ABCD', stock: 6, pclear: 8, oldprice: true,
      clearLbl: '6 cars, $8,000', clearAt: [290, 134],
      tail: ', exactly the six cars left.',
      take: 'At $7,000 seven cars are wanted and only six exist; bidding ' +
            'lifts the price to $8,000, where six are wanted.',
      show: ['gTbase', 'gSburn']
    },
    arrive: {
      buyers: 'ABCD', stock: 9, pclear: 4, oldprice: true,
      clearLbl: '9 cars, $4,000', clearAt: [357, 262],
      tail: ', exactly the nine cars now here.',
      take: 'At $7,000 nine cars sit where seven are wanted; sellers undercut ' +
            'one another until $4,000 clears the lot.',
      show: ['gTbase', 'gSarrive']
    },
    newb: {
      buyers: 'ABCDE', stock: 7, pclear: 8, oldprice: true,
      clearLbl: '7 cars, $8,000', clearAt: [291, 124],
      tail: ', still exactly seven cars.',
      take: 'At $7,000 E makes eight cars wanted against seven; his bidding ' +
            'takes C’s second car at $8,000.',
      show: ['gTghost', 'gTnew', 'gShiftNewb', 'gS']
    }
  };
  var ALLGROUPS = ['gIndiv', 'gTbase', 'gTghost', 'gTnew', 'gShiftNewb', 'gS',
                   'gSburn', 'gSarrive'];

  var $ = function (id) { return document.getElementById(id); };
  var scen = 'base';

  function dollars (p) { return '$' + p + ',000'; }

  function wrap2 (s, max) {              // split into <= 2 rows at a word break
    if (s.length <= max) return [s, ''];
    var cut = s.lastIndexOf(' ', max);
    if (cut < 1) cut = max;
    return [s.slice(0, cut), s.slice(cut + 1)];
  }
  function setRows (id1, id2, s, max) {
    var r = wrap2(s, max);
    $(id1).textContent = r[0];
    $(id2).textContent = r[1];
  }

  function stateString (S, dm) {
    var parts = [];
    for (var i = 0; i < S.buyers.length; i++) {
      var k = S.buyers[i];
      parts.push(k + ' wants ' + dm[k]);
    }
    return 'At ' + dollars(S.pclear) + ': ' + parts.join(', ') +
           ' — market demand ' + dm.T + S.tail;
  }

  // The old $7,000 price and the mismatch it leaves, recomputed each time.
  function oldState (S) {
    var t = demands(S.buyers, OLDP).T;
    return { wanted: t, stock: S.stock,
             regime: t > S.stock ? 'shortage'
                   : (t < S.stock ? 'surplus' : 'clears') };
  }

  function setTicks (S) {
    var i;
    for (i = 0; i <= 17; i++) $('tx' + i).classList.toggle('on', i === S.stock);
    for (i = 1; i <= 10; i++) $('ty' + i).classList.toggle('on', i === S.pclear);
  }

  function render () {
    var S = SCEN[scen];
    var p = S.pclear, y = Y(p), dm = demands(S.buyers, p), xT = X(dm.T);

    // horizontal-sum stack along the clearing price, x0 .. X(T); separators at
    // the cumulative sums (A|B|C|D and, with E, a fourth separator). At the
    // clearing price X(T) is the stock line, which is the point of the bar.
    $('stackbar').setAttribute('y', y - 4.5);
    $('stackbar').setAttribute('width', Math.max(0, xT - X0));
    var cum = [], run = 0, i;
    for (i = 0; i < S.buyers.length - 1; i++) {
      run += dm[S.buyers[i]];
      cum.push(run);
    }
    ['sep1', 'sep2', 'sep3', 'sep4'].forEach(function (id, j) {
      var el = $(id);
      if (j >= cum.length) { el.setAttribute('opacity', 0); return; }
      var xc = X(cum[j]);
      var show = cum[j] > 0 && cum[j] < dm.T;
      el.setAttribute('opacity', show ? 1 : 0);
      el.setAttribute('x1', xc); el.setAttribute('x2', xc);
      el.setAttribute('y1', y - 4.5); el.setAttribute('y2', y + 4.5);
    });

    // clearing marker
    var xc2 = X(S.stock);
    $('clearDropV').setAttribute('x1', xc2); $('clearDropV').setAttribute('x2', xc2);
    $('clearDropV').setAttribute('y1', y);
    $('clearDropH').setAttribute('y1', y); $('clearDropH').setAttribute('y2', y);
    $('clearDropH').setAttribute('x2', xc2);
    $('clearDot').setAttribute('cx', xc2); $('clearDot').setAttribute('cy', y);
    $('clearL1').setAttribute('x', S.clearAt[0]);
    $('clearL1').setAttribute('y', S.clearAt[1]);
    $('clearL2').setAttribute('x', S.clearAt[0]);
    $('clearL2').setAttribute('y', S.clearAt[1] + 14);
    $('clearL2').textContent = S.clearLbl;

    // the old price and why it fails
    var os = oldState(S);
    $('gOldLine').setAttribute('visibility', S.oldprice ? 'visible' : 'hidden');
    $('gGap').setAttribute('visibility', S.oldprice ? 'visible' : 'hidden');
    if (S.oldprice) {
      var xa = Math.min(X(os.wanted), X(os.stock));
      var xb = Math.max(X(os.wanted), X(os.stock));
      $('dimLine').setAttribute('x1', xa);  $('dimLine').setAttribute('x2', xb);
      // inward arrowheads: apex ON the endpoint, body pointing back into the
      // gap, so the vertical each end lands on is touched at one point only
      $('dimHeadA').setAttribute('points',
        xa + ',203 ' + (xa + 7) + ',199 ' + (xa + 7) + ',207');
      $('dimHeadB').setAttribute('points',
        xb + ',203 ' + (xb - 7) + ',199 ' + (xb - 7) + ',207');
      $('gapLbl').setAttribute('x', xb + 8);
      $('gapLbl').textContent = os.regime === 'shortage'
        ? (os.wanted + ' wanted, ' + os.stock + ' exist — shortage')
        : (os.stock + ' exist, ' + os.wanted + ' wanted — surplus');
    }

    setTicks(S);
    setRows('state1', 'state2', stateString(S, dm), 88);
    setRows('take1', 'take2', S.take, 82);
  }

  function setScenario (name) {
    if (!SCEN[name]) return;
    scen = name;
    ALLGROUPS.forEach(function (g) {
      $(g).setAttribute('visibility',
        SCEN[name].show.indexOf(g) >= 0 ? 'visible' : 'hidden');
    });
    Object.keys(SCEN).forEach(function (n) {
      var on = (n === name);
      $('btn-' + n).classList.toggle('on', on);
      $('btnl-' + n).classList.toggle('on', on);
      $('btnh-' + n).setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    render();
  }

  // ---- scenario buttons: click + Enter/Space ----
  Object.keys(SCEN).forEach(function (name) {
    var hit = $('btnh-' + name);
    hit.addEventListener('click', function () { setScenario(name); });
    hit.addEventListener('keydown', function (evt) {
      if (evt.key === 'Enter' || evt.key === ' ' || evt.key === 'Spacebar') {
        evt.preventDefault();
        setScenario(name);
      }
    });
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (name) { setScenario(name); return window.__fig.get(); },
    get: function () {
      var S = SCEN[scen], dm = demands(S.buyers, S.pclear), os = oldState(S);
      var out = { scenario: scen, stock: S.stock, pclear: S.pclear,
                  marketDemand: dm.T,
                  regime: dm.T > S.stock ? 'excess-demand'
                        : (dm.T < S.stock ? 'excess-supply' : 'clears'),
                  oldPrice: OLDP, oldPriceShown: !!S.oldprice,
                  oldWanted: os.wanted, oldRegime: os.regime };
      for (var i = 0; i < S.buyers.length; i++) {
        out[S.buyers[i]] = dm[S.buyers[i]];
      }
      return out;
    }
  };

  render();
})();
</script>
</body>
</html>
