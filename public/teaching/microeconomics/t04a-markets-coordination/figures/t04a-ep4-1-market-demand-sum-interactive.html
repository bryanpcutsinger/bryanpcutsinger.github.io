<title>One staircase, three experiments: sum the demands, then change the stock or the buyers</title>
<!--
  t04a-ep4-1-market-demand-sum-interactive.html — ROUND 2, 2026-08-07
  (instructor: the round-1 widget captured only E&P Fig 4-1; rebuild it as an
  effective teaching tool for the WHOLE E&P Figs 4-1 / 4-2 / 4-3 sequence, fix
  the frame overflow, and match the t01/t02/t03 warm widget theme.)

  Course-adapted interactive of E&P ch. 4:
    Fig 4-1  market demand = horizontal sum of individual demands; a fixed
             stock is a vertical supply line; T crosses S at the clearing price.
    Fig 4-2  supply changes, demand does not: S shifts left (a car burns) or
             right (two cars arrive) along the UNCHANGED staircase; the price
             is bid up to $8,000 or falls to $4,000.
    Fig 4-3  demand changes, supply does not: a new buyer E joins, the whole
             staircase shifts right (T-new = A+B+C+D+E), and the same seven
             cars re-clear at a higher price, $8,000.
  Numbers are course-adapted (the post's own table, UE Table 10.1 scale), NOT
  the book's $100–$1,000 scale: fidelity target is the E&P construction.

  ECONOMICS (the horizontal-sum identity is the whole point — never hard-code T):
    Marginal worths (the $1,000s a buyer would pay for the qth car):
      A: 10, 8, 3, 1    B: 9, 6, 2, 1    C: 10, 7    D: 10, 9, 4, 1
      E: 9, 4, 1        (the Fig 4-3 newcomer, course-adapted)
    Quantity demanded at price P = units worth at least P; T(P) = the sum over
    the scenario's buyers. Invariants (each clearing is unique):
      base    stock 7 → clears (7, $7,000):  T(7)=7;  T(8)=6, T(6)=8
      burn    stock 6 → clears (6, $8,000):  T(8)=6   (T unchanged — Fig 4-2)
      arrive  stock 9 → clears (9, $4,000):  T(4)=9   (T unchanged — Fig 4-2)
      newb    stock 7 → clears (7, $8,000):  T+E at $8,000 = 6+1 = 7 (Fig 4-3;
              one step up, mirroring the book's $500→$600; the car E gains is
              the second car C stops demanding above $7,000)
    NO welfare shading, no surplus areas (summation / allocation figure).

  GEOMETRY: everything — buttons, plot, readout, hint — lives INSIDE one
  640×600 SVG; the iframe embeds at aspect-ratio:640/600 so the widget fits
  its frame exactly (the round-1 build overflowed: SVG 520/464 + an HTML hint
  below inside a 13/11 frame → internal scrolling).
    X(q) = 48 + 33q  (q cars, 0..17)     Y(p) = 420 - 33p  (p $1,000s, 0..10)
    S base x=279 (q7) · burn x=246 (q6) · arrive x=345 (q9)
    clearing dots: base (279,189) · burn (246,156) · arrive (345,288) ·
    newb (279,156)

  Static-base architecture: the no-JS state is the base scenario at the
  $7,000 clearing, all real markup; scenario-only groups start hidden. The
  script attaches drag/keyboard/readout behavior and the scenario buttons
  (in-SVG buttons per the ep2-11 precedent; hit rects painted LAST so they
  sit on top). The static t04a-ep4-1-market-demand-sum.svg (slide asset)
  stays the <noscript> fallback.
-->

<script>
(function () {
  'use strict';
  // ---- geometry (must mirror the base markup) ----
  var X0 = 48, SX = 33;                 // x px origin; px per car
  var YAX = 420, SY = 33;               // x-axis foot; px per $1,000
  function X (q) { return X0 + q * SX; }
  function Y (p) { return YAX - p * SY; }

  // ---- economics (spec invariants; the horizontal-sum identity) ----
  // Marginal worths of each buyer's units. Quantity demanded at a price =
  // how many of that buyer's units are worth at least the price.
  var WORTHS = { A: [10, 8, 3, 1], B: [9, 6, 2, 1], C: [10, 7],
                 D: [10, 9, 4, 1], E: [9, 4, 1] };
  function qOf (arr, p) {
    var n = 0;
    for (var i = 0; i < arr.length; i++) if (arr[i] >= p - 1e-9) n++;
    return n;
  }
  function demands (buyers, p) {
    var out = { T: 0 };                  // T recomputed, never stored
    for (var i = 0; i < buyers.length; i++) {
      var k = buyers[i];
      out[k] = qOf(WORTHS[k], p);
      out.T += out[k];
    }
    return out;
  }

  // ---- scenarios (E&P Figs 4-1 / 4-2 / 4-3, course-adapted) ----
  var SCEN = {
    base:   { buyers: 'ABCD',  stock: 7, pclear: 7,
              clearLbl: ['7 cars, $7,000'],  clearAt: [296, 166],
              show: ['gIndiv', 'gTbase', 'gS'] },
    burn:   { buyers: 'ABCD',  stock: 6, pclear: 8,
              clearLbl: ['6 cars, $8,000'],  clearAt: [110, 202],
              show: ['gTbase', 'gSburn'] },
    arrive: { buyers: 'ABCD',  stock: 9, pclear: 4,
              clearLbl: ['9 cars, $4,000'],  clearAt: [357, 262],
              show: ['gTbase', 'gSarrive'] },
    newb:   { buyers: 'ABCDE', stock: 7, pclear: 8,
              clearLbl: ['7 cars, $8,000'],  clearAt: [291, 124],
              show: ['gTghost', 'gTnew', 'gShiftNewb', 'gS'] }
  };
  var ALLGROUPS = ['gIndiv', 'gTbase', 'gTghost', 'gTnew', 'gShiftNewb', 'gS',
                   'gSburn', 'gSarrive'];
  var PMIN = 1, PMAX = 10, STEP = 1;

  var svg = document.getElementById('fig');
  var $ = function (id) { return document.getElementById(id); };
  var scen = 'base';
  var price = 7;

  function dollars (p) { return '$' + p + ',000'; }

  function wrap2 (s, max) {              // split into <= 2 rows at a word break
    if (s.length <= max) return [s, ''];
    var cut = s.lastIndexOf(' ', max);
    if (cut < 1) cut = max;
    return [s.slice(0, cut), s.slice(cut + 1)];
  }
  function setRows (id1, id2, s, max) {
    var r = wrap2(s, max);
    $(id1).textContent = r[0];
    $(id2).textContent = r[1];
  }

  function stateString (p, dm, S) {
    var parts = [], verbose = (p === S.pclear);
    for (var i = 0; i < S.buyers.length; i++) {
      var k = S.buyers[i];
      parts.push(verbose ? (k + ' wants ' + dm[k]) : (k + ' ' + dm[k]));
    }
    var s = 'At ' + dollars(p) + ': ' + parts.join(', ') +
            ' — market demand ' + dm.T + '.';
    // the old-price rows carry the changed fact in the state line
    if (scen === 'burn'   && p === 7) {
      s = s.slice(0, -1) + ', but the fire left only 6.';
    }
    if (scen === 'arrive' && p === 7) {
      s = s.slice(0, -1) + ', but 9 cars now exist.';
    }
    if (scen === 'newb'   && p === 7) {
      s = s.slice(0, -1) + ', but only 7 cars exist.';
    }
    return s;
  }

  function takeString (p, dm, S) {
    var stock = S.stock;
    if (p === S.pclear) {
      switch (scen) {
        case 'base':   return 'The four demands sum sideways to ' + dm.T +
          ', exactly the seven cars available: the market clears.';
        case 'burn':   return 'Demand did not move — the same staircase meets ' +
          'a six-car stock at a higher price, $8,000.';
        case 'arrive': return 'Same demand staircase, bigger stock: nine cars ' +
          'clear only at the lower price of $4,000.';
        case 'newb':   return 'The higher price moves one car from C, who ' +
          'values a second at less than $8,000, to E: the market re-clears.';
      }
    }
    if (scen === 'burn'   && p === 7) {
      return 'At the old price seven are demanded and six exist; the man who ' +
        'lost his car bids the price up.';
    }
    if (scen === 'arrive' && p === 7) {
      return 'Two cars go begging at the old price; sellers undercut one ' +
        'another and the price falls.';
    }
    if (scen === 'newb'   && p === 7) {
      return 'E’s added demand outruns the stock at the old price; his ' +
        'bidding pushes the price up.';
    }
    if (dm.T > stock) {
      return 'Buyers want ' + dm.T + ' but only ' + stock + ' cars exist; at ' +
        'this low price the stock cannot go around, so bidding pushes the ' +
        'price up.';
    }
    if (dm.T < stock) {
      return 'Buyers want only ' + dm.T + ' of the ' + stock + ' cars; the ' +
        'price is above the level that clears the stock.';
    }
    return 'Amount demanded equals the stock: the market clears.';
  }

  function render () {
    var S = SCEN[scen];
    var p = price, y = Y(p), dm = demands(S.buyers, p), xT = X(dm.T);

    // price line + hit zone + glyph + focus targets
    ['price', 'priceHit'].forEach(function (id) {
      $(id).setAttribute('y1', y); $(id).setAttribute('y2', y);
    });
    $('glyph').setAttribute('y', y + 4);
    $('priceFocus').setAttribute('y', y - 8);
    $('focusRing').setAttribute('y', y - 12);

    // horizontal-sum stack bar along the line, x0 .. X(T); seps at the
    // cumulative sums (A|B|C|D and, with E, a fourth separator)
    $('stackbar').setAttribute('y', y - 4.5);
    $('stackbar').setAttribute('width', Math.max(0, xT - X0));
    var cum = [], run = 0, i, k;
    for (i = 0; i < S.buyers.length - 1; i++) {
      run += dm[S.buyers[i]];
      cum.push(run);
    }
    ['sep1', 'sep2', 'sep3', 'sep4'].forEach(function (id, j) {
      var el = $(id);
      if (j >= cum.length) { el.setAttribute('opacity', 0); return; }
      var xc = X(cum[j]);
      var show = cum[j] > 0 && cum[j] < dm.T;
      el.setAttribute('opacity', show ? 1 : 0);
      el.setAttribute('x1', xc); el.setAttribute('x2', xc);
      el.setAttribute('y1', y - 4.5); el.setAttribute('y2', y + 4.5);
    });

    // market-demand marker rides the line at X(T)
    $('tmark').setAttribute('cx', xT);
    $('tmark').setAttribute('cy', y);

    // clearing marker (scenario-fixed)
    var xc2 = X(S.stock), yc = Y(S.pclear);
    $('clearDropV').setAttribute('x1', xc2); $('clearDropV').setAttribute('x2', xc2);
    $('clearDropV').setAttribute('y1', yc);
    $('clearDropH').setAttribute('y1', yc); $('clearDropH').setAttribute('y2', yc);
    $('clearDropH').setAttribute('x2', xc2);
    $('clearDot').setAttribute('cx', xc2); $('clearDot').setAttribute('cy', yc);
    $('clearL1').setAttribute('x', S.clearAt[0]);
    $('clearL1').setAttribute('y', S.clearAt[1]);
    $('clearL2').setAttribute('x', S.clearAt[0]);
    $('clearL2').setAttribute('y', S.clearAt[1] + 14);
    $('clearL2').textContent = S.clearLbl[0];

    // readout + aria
    var st = stateString(p, dm, S), tk = takeString(p, dm, S);
    setRows('state1', 'state2', st, 88);
    setRows('take1', 'take2', tk, 82);
    var pf = $('priceFocus');
    pf.setAttribute('aria-valuenow', String(p));
    pf.setAttribute('aria-valuetext', st + ' ' + tk);
  }

  function setScenario (name) {
    if (!SCEN[name]) return;
    scen = name;
    ALLGROUPS.forEach(function (g) {
      $(g).setAttribute('visibility',
        SCEN[name].show.indexOf(g) >= 0 ? 'visible' : 'hidden');
    });
    Object.keys(SCEN).forEach(function (n) {
      var on = (n === name);
      $('btn-' + n).classList.toggle('on', on);
      $('btnl-' + n).classList.toggle('on', on);
      $('btnh-' + n).setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    render();
  }

  function clampSnap (p) {
    p = Math.max(PMIN, Math.min(PMAX, p));
    return Math.round(p / STEP) * STEP;   // integer $1,000s
  }

  // ---- pointer drag (pointer capture; fast drags stay attached) ----
  function svgPoint (evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = false;
  function onDown (evt) {
    dragging = true;
    if (evt.pointerId !== undefined && evt.target.setPointerCapture) {
      try { evt.target.setPointerCapture(evt.pointerId); } catch (e) {}
    }
    evt.preventDefault();
  }
  function onMove (evt) {
    if (!dragging) return;
    var p = (YAX - svgPoint(evt).y) / SY;
    var snapped = clampSnap(p);
    if (Math.abs(snapped - price) > 1e-9) { price = snapped; render(); }
  }
  function onUp (evt) {
    dragging = false;
    if (evt.pointerId !== undefined && evt.target.releasePointerCapture) {
      try { evt.target.releasePointerCapture(evt.pointerId); } catch (e) {}
    }
  }
  ['priceHit', 'priceFocus'].forEach(function (id) {
    $(id).addEventListener('pointerdown', onDown);
  });
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // ---- keyboard: price slider ----
  $('priceFocus').addEventListener('keydown', function (evt) {
    var delta = 0;
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') delta = STEP;
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') delta = -STEP;
    else if (evt.key === 'Home') { price = PMIN; render(); evt.preventDefault(); return; }
    else if (evt.key === 'End') { price = PMAX; render(); evt.preventDefault(); return; }
    else return;
    evt.preventDefault();
    price = clampSnap(price + delta);
    render();
  });

  // ---- scenario buttons: click + Enter/Space ----
  Object.keys(SCEN).forEach(function (name) {
    var hit = $('btnh-' + name);
    hit.addEventListener('click', function () { setScenario(name); });
    hit.addEventListener('keydown', function (evt) {
      if (evt.key === 'Enter' || evt.key === ' ' || evt.key === 'Spacebar') {
        evt.preventDefault();
        setScenario(name);
      }
    });
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (p, name) {
      if (name) setScenario(name);
      price = clampSnap(Number(p));
      render();
      return { scenario: scen, price: price };
    },
    get: function () {
      var S = SCEN[scen], dm = demands(S.buyers, price);
      var out = { scenario: scen, price: price, stock: S.stock,
                  pclear: S.pclear, marketDemand: dm.T,
                  regime: dm.T > S.stock ? 'excess-demand'
                        : (dm.T < S.stock ? 'excess-supply' : 'clears') };
      for (var i = 0; i < S.buyers.length; i++) {
        out[S.buyers[i]] = dm[S.buyers[i]];
      }
      return out;
    }
  };

  render();
})();
</script>
</body>
</html>
