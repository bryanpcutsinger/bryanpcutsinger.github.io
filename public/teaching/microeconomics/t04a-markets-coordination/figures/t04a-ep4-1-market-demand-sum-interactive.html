<!doctype html>
<!--
  t04a-ep4-1-market-demand-sum-interactive.html
  Interactive version of the t04a market-demand-sum figure (after E&P Fig 4-1,
  "market demand = horizontal sum of individual demands"; course-adapted so the
  numbers ARE UE Table 10.1, brief §C "E&P supplements" invariants, 2026-07-20).
  Family F8 (horizontal summation): drag one horizontal PRICE line up/down. At
  each price the four buyers' whole-number demands A, B, C, D are read off and
  summed SIDEWAYS into the market demand T = A + B + C + D; the vertical supply
  S = 7 (a fixed stock of seven cars) shows whether the market wants more, fewer,
  or exactly the seven cars available.

  ECONOMICS (the horizontal-sum identity is the whole point — never hard-code T):
    Quantity demanded by a buyer at price P = how many of that buyer's units are
    worth at least P. Marginal worths (the $1,000s a buyer would pay for the qth
    car), from Table 10.1:
      A: 10, 8, 3, 1      B: 9, 6, 2, 1      C: 10, 7      D: 10, 9, 4, 1
    so at every price  T(P) = qA(P) + qB(P) + qC(P) + qD(P).  Checks:
      P=$10k -> (1,0,1,1)=3 ; P=$8k -> (2,1,1,2)=6 ; P=$7k -> (2,1,2,2)=7 (clears)
      P=$6k -> (2,2,2,2)=8 ; P=$1k -> (4,4,2,4)=14.
    T crosses the fixed stock S=7 at exactly P=$7,000; above $7,000 T<7 (the
    stock cannot all sell), below $7,000 T>7 (buyers want more than exist).
    NO welfare shading, no surplus areas (F8 is a summation/allocation figure).

  Static-base architecture: the initial P=$7,000 (clearing) state is real markup
  below; the script only re-attaches drag/keyboard/readout behavior. The static
  SVG t04a-ep4-1-market-demand-sum.svg is the slide asset and <noscript> fallback.
  Drag range $1,000-$10,000 in $1,000 steps (every step is an integer $1,000s
  value, so the line snaps onto $7,000 like any other tick).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market demand as a horizontal sum - drag the price</title>
<style>
  :root{
    --font-body: Georgia, 'Times New Roman', serif;
    --paper:   #f7f4ef;   /* card background                 */
    --surface: #fdfcf9;   /* plot backing                    */
    --ink:     #1a1c1e;   /* market staircase T + headings   */
    --muted:   #6b6459;   /* axes, ticks, individual demands */
    --accent:  #b3402a;   /* price line, supply, stack, mark */
    --accent2: #b07a2c;   /* focus ring (house warm gold)    */
    --grid:    #e3ddd3;
  }
  html,body{margin:0;padding:0;background:var(--paper);font-family:var(--font-body);}
  .wrap{max-width:560px;margin:0 auto;padding:10px 8px 6px;}
  svg{display:block;width:100%;height:auto;background:var(--surface);
      border:1px solid var(--grid);border-radius:4px;}
  .hint{color:var(--muted);font-size:13px;margin:6px 2px 2px;text-align:center;}
  .fallback{color:var(--muted);font-size:14px;padding:8px;}
  .fallback a{color:var(--ink);}
  text{font-family:var(--font-body);}
  .axis{stroke:var(--muted);stroke-width:1.4;}
  .tick{fill:var(--muted);font-size:11px;}
  .tick7{fill:var(--ink);font-size:11px;font-weight:bold;}
  .axlbl{fill:var(--muted);font-size:12.5px;}
  .stair{stroke:var(--muted);stroke-width:1.5;fill:none;opacity:.6;
         stroke-linecap:round;stroke-linejoin:round;}
  .stairlbl{fill:var(--muted);font-size:12px;font-style:italic;}
  .tcurve{stroke:var(--ink);stroke-width:2.7;fill:none;
          stroke-linecap:round;stroke-linejoin:round;}
  .tlbl{fill:var(--ink);font-size:13px;font-weight:bold;}
  .tdot{fill:var(--ink);}
  .supply{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;}
  .supplylbl{fill:var(--accent);font-size:13px;font-weight:bold;font-style:italic;}
  .clearlbl{fill:var(--muted);font-size:11.5px;}
  .drop{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.8;}
  .cdot{fill:var(--ink);}
  .stackbar{fill:var(--accent);opacity:.16;}
  .stacksep{stroke:var(--surface);stroke-width:1.4;}
  .tmark{fill:var(--accent);}
  .price{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 5;}
  .pricehit{stroke:transparent;stroke-width:22;cursor:ns-resize;}
  .glyph{fill:var(--accent);font-size:13px;font-weight:bold;}
  .state{fill:var(--muted);font-size:12.5px;}
  .takeaway{fill:var(--accent);font-size:13px;font-weight:bold;}
  .sep{stroke:var(--grid);stroke-width:1;}
  #priceFocus:focus{outline:none;}
  #priceFocus:focus + .focusring{opacity:1;}
  .focusring{opacity:0;stroke:var(--accent2);stroke-width:1.5;fill:none;
             stroke-dasharray:3 3;}
</style>
</head>
<body>
<div class="wrap">
  <svg id="fig" viewBox="0 0 520 464" role="group"
       aria-label="Market demand as a horizontal sum. Four buyers A, B, C and D each hold a whole-number demand for cars that rises as the price falls. Their demands add across at every price into the market demand T, a descending staircase. A fixed stock of seven cars is a vertical supply line at a quantity of seven. The market clears where T meets the fixed stock, at a price of 7,000 dollars and seven cars. Drag the horizontal price line up or down to read each buyer's demand, watch the four sum sideways into the market demand, and see whether the market wants more, fewer, or exactly the seven cars available.">

    <!-- ================= static base ($7,000 clearing state) =================
         Geometry:  X(q) = 54 + 31q   (q cars, 0..14)
                    Y(p) = 360 - 32p   (p in thousands of dollars, 0..10)
         At $7,000: qA=2, qB=1, qC=2, qD=2, T=7; the stack bar runs x54..X(7)=271
         with separators at cumulative 2,3,5 -> x116,147,209.                 -->

    <!-- axes -->
    <line class="axis" x1="54" y1="32"  x2="54"  y2="360"/>
    <line class="axis" x1="54" y1="360" x2="500" y2="360"/>

    <!-- x ticks (0..14; 7 emphasized). INTENTIONAL divergence from the spec's
         "ticks only at labeled values": a drag-to-read staircase needs the full
         integer tick sets to be usable; the static .tex (slide track) obeys the
         7-only rule. Endorsed at fidelity review 2026-07-20. -->
    <g text-anchor="middle">
      <text class="tick"  x="54"  y="376">0</text>
      <text class="tick"  x="85"  y="376">1</text>
      <text class="tick"  x="116" y="376">2</text>
      <text class="tick"  x="147" y="376">3</text>
      <text class="tick"  x="178" y="376">4</text>
      <text class="tick"  x="209" y="376">5</text>
      <text class="tick"  x="240" y="376">6</text>
      <text class="tick7" x="271" y="376">7</text>
      <text class="tick"  x="302" y="376">8</text>
      <text class="tick"  x="333" y="376">9</text>
      <text class="tick"  x="364" y="376">10</text>
      <text class="tick"  x="395" y="376">11</text>
      <text class="tick"  x="426" y="376">12</text>
      <text class="tick"  x="457" y="376">13</text>
      <text class="tick"  x="488" y="376">14</text>
    </g>
    <!-- y ticks (1..10; 7 emphasized) -->
    <g text-anchor="end">
      <text class="tick"  x="48" y="332">1</text>
      <text class="tick"  x="48" y="300">2</text>
      <text class="tick"  x="48" y="268">3</text>
      <text class="tick"  x="48" y="236">4</text>
      <text class="tick"  x="48" y="204">5</text>
      <text class="tick"  x="48" y="172">6</text>
      <text class="tick7" x="48" y="140">7</text>
      <text class="tick"  x="48" y="108">8</text>
      <text class="tick"  x="48" y="76">9</text>
      <text class="tick"  x="48" y="44">10</text>
    </g>
    <text class="axlbl" x="277" y="394" text-anchor="middle">Number of cars</text>
    <text class="axlbl" transform="rotate(-90 16 200)" x="16" y="200"
          text-anchor="middle">Price (thousands of dollars)</text>

    <!-- individual step-demands A, B, C, D (muted, one dash pattern each) -->
    <polyline class="stair" points="54,40 85,40 85,104 116,104 116,264 147,264 147,328 178,328"/>
    <polyline class="stair" points="54,72 85,72 85,168 116,168 116,296 147,296 147,328 178,328"
              stroke-dasharray="5 3"/>
    <polyline class="stair" points="54,40 85,40 85,136 116,136" stroke-dasharray="1.5 3"/>
    <polyline class="stair" points="54,40 85,40 85,72 116,72 116,232 147,232 147,328 178,328"
              stroke-dasharray="1.5 2.5 5 2.5"/>
    <text class="stairlbl" x="128" y="101">A</text>
    <text class="stairlbl" x="128" y="165">B</text>
    <text class="stairlbl" x="128" y="133">C</text>
    <text class="stairlbl" x="129" y="218">D</text>

    <!-- market staircase T = A+B+C+D (heavy) + demand-schedule points -->
    <polyline class="tcurve" points="54,40 147,40 147,72 209,72 209,104 240,104 240,136 271,136 271,168 302,168 302,232 333,232 333,264 364,264 364,296 395,296 395,328 488,328"/>
    <g class="tdot">
      <circle cx="147" cy="40"  r="2.6"/>
      <circle cx="209" cy="72"  r="2.6"/>
      <circle cx="240" cy="104" r="2.6"/>
      <circle cx="302" cy="168" r="2.6"/>
      <circle cx="333" cy="232" r="2.6"/>
      <circle cx="364" cy="264" r="2.6"/>
      <circle cx="395" cy="296" r="2.6"/>
      <circle cx="488" cy="328" r="2.6"/>
    </g>
    <text class="tlbl" x="342" y="114">T = A + B + C + D</text>

    <!-- fixed-stock supply S (vertical at Q = 7) -->
    <line class="supply" x1="271" y1="360" x2="271" y2="32"/>
    <text class="supplylbl" x="276" y="52">S</text>

    <!-- clearing point (7, $7,000): always drawn -->
    <line class="drop" x1="271" y1="136" x2="271" y2="360"/>
    <line class="drop" x1="54"  y1="136" x2="271" y2="136"/>
    <circle class="cdot" cx="271" cy="136" r="3.4"/>
    <text class="clearlbl" x="288" y="180">market clears at</text>
    <text class="clearlbl" x="288" y="194" style="font-weight:bold;fill:var(--ink);">7 cars, $7,000</text>

    <!-- horizontal-sum stack along the price line (JS redraws; base = $7,000) -->
    <rect id="stackbar" class="stackbar" x="54" y="131.5" width="217" height="9"/>
    <g id="stackseps">
      <line class="stacksep" id="sep1" x1="116" y1="131.5" x2="116" y2="140.5"/>
      <line class="stacksep" id="sep2" x1="147" y1="131.5" x2="147" y2="140.5"/>
      <line class="stacksep" id="sep3" x1="209" y1="131.5" x2="209" y2="140.5"/>
    </g>
    <!-- market-demand marker: rides the price line at x = X(T(P)) -->
    <circle id="tmark" class="tmark" cx="271" cy="136" r="3.6"/>

    <!-- draggable price line + wide hit zone + drag glyph -->
    <g id="priceG">
      <line id="price"    class="price"    x1="54" y1="136" x2="493" y2="136"/>
      <text id="glyph"    class="glyph"    x="497" y="140">&#8597;</text>
      <line id="priceHit" class="pricehit" x1="54" y1="136" x2="493" y2="136"/>
    </g>

    <!-- keyboard proxy for the price line -->
    <rect id="priceFocus" x="54" y="128" width="439" height="16" fill="transparent"
          tabindex="0" role="slider"
          aria-label="Market price of a car, in thousands of dollars"
          aria-valuemin="1" aria-valuemax="10" aria-valuenow="7"
          aria-valuetext="At $7,000: A wants 2, B wants 1, C wants 2, D wants 2 - market demand 7."/>
    <rect class="focusring" x="50" y="124" width="447" height="24" rx="4"/>

    <!-- readout band: muted state + accent takeaway (each wraps to 2 rows;
         each row a fixed-y tspan, the base = the no-JS $7,000 fallback text) -->
    <line class="sep" x1="18" y1="400" x2="502" y2="400"/>
    <text class="state" text-anchor="middle">
      <tspan id="state1" x="260" y="416">At $7,000: A wants 2, B wants 1, C wants 2, D wants</tspan>
      <tspan id="state2" x="260" y="430">2 &#8212; market demand 7.</tspan>
    </text>
    <text class="takeaway" text-anchor="middle">
      <tspan id="take1" x="260" y="446">The four demands sum sideways to 7, exactly the seven</tspan>
      <tspan id="take2" x="260" y="460">cars available: the market clears.</tspan>
    </text>
  </svg>

  <p class="hint">Drag the dashed price line up or down (or focus it and use the
    arrow keys). Watch the four buyers&#8217; demands add sideways into the market
    demand, and compare it to the seven cars available.</p>

  <noscript>
    <p class="fallback">Interactive view needs JavaScript. See the
      <a href="t04a-ep4-1-market-demand-sum.svg">static version of this figure</a>.</p>
  </noscript>
</div>

<script>
(function () {
  'use strict';
  // ---- geometry (must mirror the base markup) ----
  var X0 = 54, SX = 31;                 // x px origin; px per car
  var YAX = 360, SY = 32;               // x-axis foot; px per $1,000
  function X (q) { return X0 + q * SX; }
  function Y (p) { return YAX - p * SY; }

  // ---- economics (brief §C invariants; the horizontal-sum identity) ----
  // Marginal worths of each buyer's units (Table 10.1). Quantity demanded at a
  // price = how many of that buyer's units are worth at least the price.
  var WORTHS = { A: [10, 8, 3, 1], B: [9, 6, 2, 1], C: [10, 7], D: [10, 9, 4, 1] };
  function q (arr, p) {
    var n = 0;
    for (var i = 0; i < arr.length; i++) if (arr[i] >= p - 1e-9) n++;
    return n;
  }
  function demands (p) {
    var a = q(WORTHS.A, p), b = q(WORTHS.B, p),
        c = q(WORTHS.C, p), d = q(WORTHS.D, p);
    return { a: a, b: b, c: c, d: d, T: a + b + c + d }; // T recomputed, never stored
  }
  var STOCK = 7, PCLEAR = 7;             // fixed stock; clearing price ($1,000s)
  var PMIN = 1, PMAX = 10, STEP = 1;

  var svg = document.getElementById('fig');
  var $ = function (id) { return document.getElementById(id); };
  var price = 7;

  function dollars (p) { return '$' + p + ',000'; }

  function wrap2 (s, max) {              // split into <= 2 rows at a word break
    if (s.length <= max) return [s, ''];
    var cut = s.lastIndexOf(' ', max);
    if (cut < 1) cut = max;
    return [s.slice(0, cut), s.slice(cut + 1)];
  }
  function setRows (id1, id2, s, max) {
    var r = wrap2(s, max);
    $(id1).textContent = r[0];
    $(id2).textContent = r[1];
  }

  function strings (p, dm) {
    var out = {};
    if (p === PCLEAR) {                  // clears: the verbose "wants" form
      out.state = 'At ' + dollars(p) + ': A wants ' + dm.a + ', B wants ' + dm.b +
        ', C wants ' + dm.c + ', D wants ' + dm.d + ' — market demand ' + dm.T + '.';
      out.take = 'The four demands sum sideways to ' + dm.T +
        ', exactly the seven cars available: the market clears.';
    } else {                            // off-clearing: the compact form
      out.state = 'At ' + dollars(p) + ': A ' + dm.a + ', B ' + dm.b + ', C ' + dm.c +
        ', D ' + dm.d + ' — market demand ' + dm.T + '.';
      if (p < PCLEAR) {                 // below clearing: T > 7, excess demand
        out.take = 'Buyers want ' + dm.T + ' but only ' + STOCK +
          ' cars exist; at this lower price the fixed stock cannot go around.';
      } else {                          // above clearing: T < 7, excess supply
        out.take = 'Buyers want only ' + dm.T + ' of the ' + STOCK +
          ' cars; the price is above the level that clears the stock.';
      }
    }
    return out;
  }

  function render () {
    var p = price, y = Y(p), dm = demands(p), xT = X(dm.T);

    // price line + hit zone + glyph + focus targets
    ['price', 'priceHit'].forEach(function (id) {
      $(id).setAttribute('y1', y); $(id).setAttribute('y2', y);
    });
    $('glyph').setAttribute('y', y + 4);
    $('priceFocus').setAttribute('y', y - 8);
    document.querySelector('.focusring').setAttribute('y', y - 12);

    // horizontal-sum stack bar along the line, x0 .. X(T); seps at cumulatives
    $('stackbar').setAttribute('y', y - 4.5);
    $('stackbar').setAttribute('width', xT - X0);
    var cum = [dm.a, dm.a + dm.b, dm.a + dm.b + dm.c];
    ['sep1', 'sep2', 'sep3'].forEach(function (id, i) {
      var el = $(id), xc = X(cum[i]);
      // hide a separator that would sit at the bar's own left/right edge
      var show = cum[i] > 0 && cum[i] < dm.T;
      el.setAttribute('opacity', show ? 1 : 0);
      el.setAttribute('x1', xc); el.setAttribute('x2', xc);
      el.setAttribute('y1', y - 4.5); el.setAttribute('y2', y + 4.5);
    });

    // market-demand marker rides the line at X(T)
    $('tmark').setAttribute('cx', xT);
    $('tmark').setAttribute('cy', y);

    // readout + aria
    var str = strings(p, dm);
    setRows('state1', 'state2', str.state, 52);
    setRows('take1', 'take2', str.take, 52);
    var pf = $('priceFocus');
    pf.setAttribute('aria-valuenow', String(p));
    pf.setAttribute('aria-valuetext', str.state);
  }

  function clampSnap (p) {
    p = Math.max(PMIN, Math.min(PMAX, p));
    return Math.round(p / STEP) * STEP;   // integer $1,000s: snaps onto $7,000 too
  }

  // ---- pointer drag (pointer capture; fast drags stay attached) ----
  function svgPoint (evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  var dragging = false;
  function onDown (evt) {
    dragging = true;
    if (evt.pointerId !== undefined && evt.target.setPointerCapture) {
      try { evt.target.setPointerCapture(evt.pointerId); } catch (e) {}
    }
    evt.preventDefault();
  }
  function onMove (evt) {
    if (!dragging) return;
    var p = (YAX - svgPoint(evt).y) / SY;
    var snapped = clampSnap(p);
    if (Math.abs(snapped - price) > 1e-9) { price = snapped; render(); }
  }
  function onUp (evt) {
    dragging = false;
    if (evt.pointerId !== undefined && evt.target.releasePointerCapture) {
      try { evt.target.releasePointerCapture(evt.pointerId); } catch (e) {}
    }
  }
  ['priceHit', 'priceFocus'].forEach(function (id) {
    $(id).addEventListener('pointerdown', onDown);
  });
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', onUp);

  // ---- keyboard ----
  $('priceFocus').addEventListener('keydown', function (evt) {
    var delta = 0;
    if (evt.key === 'ArrowUp' || evt.key === 'ArrowRight') delta = STEP;
    else if (evt.key === 'ArrowDown' || evt.key === 'ArrowLeft') delta = -STEP;
    else if (evt.key === 'Home') { price = PMIN; render(); evt.preventDefault(); return; }
    else if (evt.key === 'End') { price = PMAX; render(); evt.preventDefault(); return; }
    else return;
    evt.preventDefault();
    price = clampSnap(price + delta);
    render();
  });

  // ---- debug hook (widget standard) ----
  window.__fig = {
    set: function (p) { price = clampSnap(Number(p)); render(); return price; },
    get: function () {
      var dm = demands(price);
      return {
        price: price, a: dm.a, b: dm.b, c: dm.c, d: dm.d,
        marketDemand: dm.T, stock: STOCK,
        regime: price > PCLEAR ? 'excess-supply'
              : (price < PCLEAR ? 'excess-demand' : 'clears')
      };
    }
  };

  render();
})();
</script>
</body>
</html>
